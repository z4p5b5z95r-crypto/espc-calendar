<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F36F21">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>採樣津貼</title>
<style>
:root{--bg:#f2f1ef;--tx:#1c1c1e;--tx2:#5c5d61;--tx3:#8e8e93;--line:rgba(60,60,67,.12);--acc:#F36F21;--accT:#c4500d;--accS:rgba(243,111,33,.12);
 --gl:rgba(255,255,255,.55);--glS:rgba(255,255,255,.8);--glL:rgba(255,255,255,.75);--ok:#1f8a4c;--bad:#d33b2f;--blur:blur(18px) saturate(170%);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--tx:#f2f2f7;--tx2:#aeaeb2;--tx3:#8e8e93;--line:rgba(255,255,255,.1);--accT:#ff9a5c;--accS:rgba(243,111,33,.2);
 --gl:rgba(255,255,255,.07);--glS:rgba(44,44,48,.78);--glL:rgba(255,255,255,.1);--ok:#5fd08a;--bad:#ff6b6b;}}
:root[data-theme="dark"]{--bg:#141416;--tx:#f2f2f7;--tx2:#aeaeb2;--tx3:#8e8e93;--line:rgba(255,255,255,.1);--accT:#ff9a5c;--accS:rgba(243,111,33,.2);
 --gl:rgba(255,255,255,.07);--glS:rgba(44,44,48,.78);--glL:rgba(255,255,255,.1);--ok:#5fd08a;--bad:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
 background-image:radial-gradient(45% 30% at 10% 5%,rgba(243,111,33,.16),transparent 70%),radial-gradient(40% 30% at 95% 25%,rgba(120,110,230,.12),transparent 70%);background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top h1{font-size:26px;font-weight:700;flex:1}
.who{font-size:13px;color:var(--tx2)}
.ib{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--glS);border:1px solid var(--glL);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-size:17px;color:var(--tx2)}
.card{background:var(--glS);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glL);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.sec{font-size:12.5px;color:var(--tx3);margin:18px 6px 8px}
.hint{font-size:12.5px;color:var(--tx3);line-height:1.6}
.btn{height:42px;padding:0 18px;border-radius:999px;background:var(--glS);border:1px solid var(--glL);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(243,111,33,.28)}
.btn-full{width:100%}
.btn:disabled{opacity:.5}
.fld{width:100%;height:44px;border-radius:14px;border:1px solid var(--glL);background:var(--gl);padding:0 14px;font-size:16px;outline:none}
textarea.fld{height:auto;padding:10px 14px;line-height:1.5;resize:vertical}
.fld:focus{border-color:var(--acc)}
.seg{display:flex;background:rgba(120,120,128,.14);border-radius:12px;padding:3px;margin:10px 0 4px;overflow-x:auto}
.seg button{flex:1;min-width:64px;height:34px;border-radius:9px;font-size:14px;color:var(--tx2);white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--glS);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mon{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 2px}
.mon b{font-size:17px;min-width:120px;text-align:center}
.tot{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tot .big{font-size:36px;font-weight:700;letter-spacing:-.5px}
.tot .big small{font-size:16px;color:var(--tx3);font-weight:500;margin-right:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--gl);border:1px solid var(--glL);color:var(--tx2)}
.chip.ok{color:var(--ok);background:rgba(31,138,76,.1);border-color:rgba(31,138,76,.25)}
.chip.q{color:var(--bad);background:rgba(211,59,47,.1);border-color:rgba(211,59,47,.25)}
.chip.acc{color:var(--accT);background:var(--accS);border-color:rgba(243,111,33,.3)}
.chip.warn{color:#b7791f;background:rgba(245,166,35,.12);border-color:rgba(245,166,35,.3)}
.row{display:flex;align-items:center;gap:8px}
.rh{display:flex;align-items:flex-start;gap:8px}
.rh .pn{flex:1;min-width:0;font-weight:700;font-size:15.5px;line-height:1.35;word-break:break-word}
.rs{font-size:12.5px;color:var(--tx3);margin-top:3px}
.it{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.it:first-of-type{border-top:none}
.it .l{flex:1;min-width:0}
.it .l b{font-weight:600}
.it .l .f{color:var(--tx3);font-size:12.5px;margin-top:2px}
.it .r{text-align:right;white-space:nowrap;font-weight:600}
.it .r small{display:block;font-weight:400;color:var(--tx3);font-size:12px}
.it.nq .l b,.it.nq .r{color:var(--tx3);text-decoration:line-through}

.rf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:9px;border-top:1px dashed var(--line)}
.rf .fm{font-size:12px;color:var(--tx3);flex:1;min-width:0;margin-right:10px}
.rf .am{font-size:17px;font-weight:700}
.ed{width:32px;height:32px;border-radius:50%;background:var(--gl);border:1px solid var(--glL);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);flex:0 0 32px}
.dh{font-size:13px;color:var(--tx2);margin:16px 6px 7px;font-weight:600}
.empty{text-align:center;color:var(--tx3);padding:28px 10px;font-size:14px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.shh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}.shh h3{flex:1;font-size:18px}
.lb{font-size:12.5px;color:var(--tx3);margin:14px 4px 6px;display:flex;align-items:center}
.lb a{margin-left:auto;color:var(--accT);font-weight:600;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cp{font-size:13.5px;padding:6px 11px;border-radius:999px;background:var(--gl);border:1px solid var(--glL)}
.cp.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cp.off{opacity:.55}
.cp i{font-style:normal;margin-left:5px;opacity:.7}
.ei{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ei select{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--glL);background:var(--gl);padding:0 8px;font-size:14px}
.ei input{width:74px;height:42px;border-radius:12px;border:1px solid var(--glL);background:var(--gl);text-align:center;font-size:16px}
.x{width:34px;height:34px;border-radius:50%;color:var(--bad);background:var(--gl);border:1px solid var(--glL);flex:0 0 34px}
.tr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.tr:first-child{border-top:none}
.tr .n{flex:1;min-width:0}
.tr .n b{font-size:15px}
.tr .v{text-align:right;font-weight:700;font-size:15.5px}
.list{background:var(--glS);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glL);border-radius:20px;overflow:hidden}
.qr{padding:11px 14px;border-top:1px solid var(--line)}.qr:first-child{border-top:none}
.qg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qg .cp{font-size:12.5px;padding:5px 10px}
.qsep{width:1px;background:var(--line);margin:2px 2px}
.rt{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}
.rt:first-child{border-top:none}
.rt .l{flex:1;min-width:0}
.rt input{width:76px;height:36px;border-radius:10px;border:1px solid var(--glL);background:var(--gl);text-align:right;padding:0 8px;font-size:15px}
.rt select{width:96px;height:36px;border-radius:10px;border:1px solid var(--glL);background:var(--gl);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:rgba(30,30,32,.92);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}.toast.ok{background:var(--ok)}.toast.no{background:var(--bad)}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.wb{margin:4px 0 6px;padding:12px;border-radius:16px;background:var(--gl);border:1px solid var(--glL)}
.wh{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap}
.wh .stp{margin-left:auto}
.stp{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2)}
.stp b{font-size:15px;color:var(--tx);min-width:16px;text-align:center}
.stp button{width:28px;height:28px;border-radius:50%;background:var(--glS);border:1px solid var(--glL);font-size:16px;color:var(--tx2)}
.wc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wk{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px 6px 7px;border-radius:999px;background:var(--glS);border:1px solid var(--glL);color:var(--tx)}
.wk i{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--tx3);font-style:normal;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.wk small{color:var(--tx3);font-size:11.5px}
.wk.on{border-color:rgba(243,111,33,.45);background:var(--accS)}
.wk.on i{background:var(--acc);border-color:var(--acc)}
.wk:disabled{opacity:1;cursor:default}
.wsub{margin:8px 0 0 12px;padding-left:10px;border-left:2px solid var(--line)}
.wbk+.wbk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wrow{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.wrow>span{flex:0 0 46px;font-size:12.5px;color:var(--tx2);padding-top:8px}
.wrow .wc{margin-top:0;flex:1}
.wrow.all>span{color:var(--accT);font-weight:600}
.wrow.all{padding-bottom:8px;border-bottom:1px dashed var(--line)}
.wk.rd i{border-radius:50%}
.wrow .gseg{flex:1}
.wrow>span:empty{display:none}
.wfold{font-size:12.5px;color:var(--accT);margin:6px 0 0 54px}
.wfold:disabled{color:var(--tx3);cursor:default}
.wk{font-size:12.5px;padding:5px 9px 5px 6px}
.gwr{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px}
.gwr>span{width:44px;color:var(--tx2);flex:0 0 44px}
.gseg{flex:1;display:flex;background:rgba(120,120,128,.14);border-radius:10px;padding:2px}
.gseg button{flex:1;padding:5px 2px;border-radius:8px;font-size:12.5px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.gseg button small{font-size:10.5px;color:var(--tx3)}
.gseg button.on{background:var(--glS);color:var(--accT);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gseg button:disabled{cursor:default}
.wadd{margin-top:10px;font-size:13px;color:var(--accT);font-weight:600}
.wtot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--tx3)}
.wtot b{font-size:14.5px;color:var(--tx)}
.chip.up{color:#c0392b;background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.35)}
button.chip{cursor:pointer}
.updiff{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.updiff span{font-size:12px;padding:2px 8px;border-radius:7px;background:var(--gl);border:1px solid var(--glL)}
.updiff .u{color:#c0392b;border-color:rgba(231,76,60,.35);background:rgba(231,76,60,.08)}
.updiff .dn{color:var(--tx3)}
.wk.on.up{border-color:#e74c3c;background:rgba(231,76,60,.1)}
.wk.on.up i{background:#e74c3c;border-color:#e74c3c}
.gseg button.on.up{color:#c0392b;box-shadow:0 0 0 1.5px #e74c3c inset}
.it.upl .l b::after{content:" ▲";color:#e74c3c;font-size:11px}
.clist{margin-top:8px;background:var(--gl);border:1px solid var(--glL);border-radius:14px;overflow:hidden}
.ci{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px}
.clist>.ci:first-child{border-top:none}
.ci.op{background:var(--accS)}
.ci.nq .cia{color:var(--tx3);text-decoration:line-through}
.ci.un{background:rgba(245,166,35,.08)}
.cin{flex:1;min-width:0}.cin b{font-weight:600}.cin small{display:block;color:var(--tx3);font-size:11.5px;margin-top:2px;line-height:1.45}
.nqt{display:block;font-size:11.5px;color:#b7791f;margin-top:2px}
.nqn{color:var(--tx2)}
.nqn i{font-style:normal;text-decoration:none;display:inline-block;margin-left:3px;font-size:10.5px;color:#b7791f;background:rgba(245,166,35,.14);border-radius:5px;padding:0 4px}
.upm{font-style:normal;color:#e74c3c;font-size:11px}
.upt{color:#d9432f;font-weight:600}
.ciq{color:var(--tx3);font-size:12.5px;white-space:nowrap}.cia{min-width:46px;text-align:right;font-weight:700}
.cie{width:16px;color:var(--accT);font-size:13px;text-align:center}
.cl{border-top:1px solid var(--line);background:rgba(243,111,33,.04)}
.cr{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-top:1px solid var(--line)}
.cl .cr:first-child{border-top:none}
.cr.allr{background:var(--accS)}
.pname{flex:1;min-width:0;font-size:13.5px;line-height:1.3;cursor:pointer}
.pname small{display:block;color:var(--tx3);font-size:11px}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;background:var(--glS);border:1px solid var(--glL);border-radius:10px;padding:7px 26px 7px 10px;font-size:13.5px;font-weight:600;color:var(--tx);max-width:180px;font-family:inherit}
.sel::after{content:"▾";position:absolute;right:9px;font-size:11px;color:var(--tx3);pointer-events:none}
.sel.up select{color:#d9432f;border-color:rgba(217,67,47,.45)}
.mc{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:240px}
.mc button{font-size:12px;padding:5px 8px;border-radius:8px;background:var(--glS);border:1px solid var(--glL);color:var(--tx2);display:inline-flex;gap:3px;align-items:baseline}
.mc button small{font-size:10.5px;opacity:.75}
.mc button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mc button.on.up{background:#e74c3c;border-color:#e74c3c}
.cr.mrow{flex-wrap:wrap}
.cr.mrow .mc{order:3;flex:0 0 100%;max-width:none;justify-content:flex-start;margin-top:2px}
.cr.mrow .pname{display:flex;align-items:baseline;gap:8px}
.cr.mrow .pname small{display:inline}
.rmx{width:26px;height:26px;border-radius:50%;color:var(--tx3);font-size:12px;flex:0 0 26px}
.cft{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px 10px;border-top:1px solid var(--line)}
.cft .addp{margin:0}
.addp{font-size:13px;color:var(--accT);font-weight:600}
.edit{font-size:13px;color:var(--accT);font-weight:700}
.qd .x{width:30px;height:30px;flex:0 0 30px}
.qpk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.qpk input{width:20px;height:20px;accent-color:#F36F21}
.qpk.tk{opacity:.5}
.qpk small{display:block;color:var(--tx3);font-size:11.5px}
details.fx{margin-top:10px}details.fx summary{font-size:13px;color:var(--accT);cursor:pointer;list-style:none}
details.fx p{font-size:12.5px;color:var(--tx2);line-height:1.7;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ══ ESPC 採樣津貼（獨立頁面，與行事曆共用帳號與後端）══ */
var GAS_URL='https://script.google.com/macros/s/AKfycbxq0Lj59wXYKQkVnbaG607FOBmEmH64VkbxqfIOBbNnbufWlqQ82x5RAKmlbFhpOssHng/exec';
var APP_VER='2026-09-30';
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsS(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsD(k){try{localStorage.removeItem(k);}catch(e){}}
function $(id){return document.getElementById(id);}
function he(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function esc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function money(n){return Math.round(n).toLocaleString('en-US');}
function p2(n){return (n<10?'0':'')+n;}
(function(){var t=ls('espc_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
function toast(m,k,ms){var t=$('toast');t.textContent=m;t.className='toast on'+(k?' '+k:'');clearTimeout(t._t);t._t=setTimeout(function(){t.className='toast';},ms||2200);}
function gas(fn){
  var args=Array.prototype.slice.call(arguments,1),payload=JSON.stringify({fn:fn,args:args});
  var req=payload.length<1800?fetch(GAS_URL+'?payload='+encodeURIComponent(payload)):fetch(GAS_URL,{method:'POST',body:payload});
  return req.then(function(r){return r.json();}).then(function(j){
    if(j&&!j.ok&&/未登入|過期/.test(j.error||'')){logout(true);}
    return j;
  });
}
function openSheet(h){$('sheet').innerHTML=h;$('ov').classList.add('open');}
function closeSheet(){$('ov').classList.remove('open');}

/* 狀態 */
var TOKEN=ls('espc_token')||'', UNAME=ls('espc_user')||'', ROLE=ls('espc_role')||'';
var S={ym:'',tab:'me',who:'',data:null,busy:false,sum:null,qual:null,qq:'',edit:null};
(function(){var d=new Date(Date.now()+8*3600e3);S.ym=d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1);})();

/* ── 登入（與行事曆共用；在行事曆登入過就不用再登入） ── */
function loginView(){
  $('app').innerHTML='<div class="top"><button class="ib" title="回行事曆" onclick="location.href=\'./\'">‹</button><h1>採樣津貼</h1></div>'
    +'<div class="card" style="margin-top:20px"><p class="hint" style="margin-bottom:12px">請用 ESPC 行事曆的帳號登入</p>'
    +'<input class="fld" id="l-u" placeholder="工號" autocapitalize="characters" autocorrect="off" style="margin-bottom:10px">'
    +'<input class="fld" id="l-p" type="password" placeholder="密碼" style="margin-bottom:14px" onkeydown="if(event.key===\'Enter\')doLogin()">'
    +'<button class="btn btn-p btn-full" id="l-b" onclick="doLogin()">登入</button></div>';
}
function doLogin(){
  var u=$('l-u').value.trim(),p=$('l-p').value;
  if(!u||!p){toast('請輸入工號與密碼','no');return;}
  $('l-b').disabled=true;
  gas('login',u,p).then(function(r){
    if(!r||!r.ok){$('l-b').disabled=false;toast((r&&r.error)||'登入失敗','no');return;}
    TOKEN=r.token;UNAME=r.username;ROLE=r.role;
    lsS('espc_token',r.token);lsS('espc_user',r.username);lsS('espc_role',r.role);lsS('espc_eng',r.engineerName||'');
    load();
  }).catch(function(){$('l-b').disabled=false;toast('連線失敗','no');});
}
function logout(silent){
  if(!silent&&!confirm('登出？（行事曆也會一起登出）'))return;
  if(TOKEN&&!silent)gas('logout',TOKEN).catch(function(){});
  ['espc_token','espc_role','espc_user','espc_eng'].forEach(lsD);
  TOKEN='';S.data=null;loginView();
}

/* ── 載入 ── */
function load(){
  if(!TOKEN){loginView();return;}
  S.busy=true;render();
  gas('allowGet',TOKEN,S.ym,S.who).then(function(r){
    S.busy=false;
    if(!r||!r.ok){
      if(r&&r.needProfile){S.data={err:'請先打開 ESPC 行事曆完成資料確認，再回來這裡。'};}
      else S.data={err:(r&&r.error)||'讀取失敗'};
      render();return;
    }
    S.data=r;WS={};if(r.ym)S.ym=r.ym;render();
    if(S.tab==='all'&&r.canAll)loadSum();
  }).catch(function(){S.busy=false;S.data={err:'連線失敗，請稍後再試'};render();});
}
function loadSum(){
  S.sum=null;render();
  gas('allowSummary',TOKEN,S.ym).then(function(r){S.sum=r&&r.ok?r.list:[];render();}).catch(function(){S.sum=[];render();});
}
function loadQual(){
  S.qual=null;render();
  gas('allowQuals',TOKEN).then(function(r){S.qual=r&&r.ok?r:{list:[],quals:[]};render();}).catch(function(){S.qual={list:[],quals:[]};render();});
}
function moveM(d){
  var y=+S.ym.slice(0,4),m=+S.ym.slice(5)-1+d;
  if(m<0){m=11;y--;}if(m>11){m=0;y++;}
  S.ym=y+'-'+p2(m+1);load();
}
function go(t){S.tab=t;if(t==='qdef')QD=null;if(t==='all')loadSum();else if(t==='qual')loadQual();render();}

/* ── 計算（與後端相同） ── */
function colMap(){var m={};(S.data.cols||[]).forEach(function(c){m[c.c]=c;});return m;}
function hasQ(n,q){if(!q)return true;var l=(S.data.staffQuals||{})[n];return l==null?true:l.indexOf(q)>=0;}
function calc(rec,who){
  var cm=colMap(),share=0,pp=0,lines=[],parts=[];
  rec.items.forEach(function(it){
    var c=cm[it.c],n=+it.n||0;
    if(!c){lines.push({it:it,un:true});return;}
    var amt=c.r*n,ok=hasQ(who,c.q),k=0,mine=0;
    if(c.pp){mine=ok?amt:0;pp+=mine;}
    else{k=rec.staff.filter(function(s){return hasQ(s,c.q);}).length||1;mine=ok?amt/k:0;share+=mine;if(ok)parts.push(amt+'÷'+k);}
    lines.push({it:it,c:c,n:n,amt:amt,ok:ok,k:k,mine:mine});
  });
  var tot=Math.round(share)+pp;
  var fm=parts.length?'四捨五入('+parts.join('＋')+')'+(pp?'＋'+money(pp):''):(pp?money(pp):'0');
  return {tot:tot,lines:lines,fm:fm};
}

/* ── 手動調高：跟行程帶入的原始內容比 ── */
function upOf(r,who){
  if(r.auto)return null;
  var now=calc(r,who).tot;
  if(!r.inPlan)return {amt:now,added:true,diff:[]};
  var base=calc({staff:r.baseStaff||r.staff,items:r.base||[]},who).tot;
  var bc={},nc={},cm=colMap(),diff=[];
  (r.base||[]).forEach(function(x){bc[x.c]=(bc[x.c]||0)+(+x.n||0);});
  r.items.forEach(function(x){if(x.c)nc[x.c]=(nc[x.c]||0)+(+x.n||0);});
  Object.keys(nc).forEach(function(c){var d=nc[c]-(bc[c]||0);if(d>0&&cm[c])diff.push({c:c,d:d,up:1});});
  Object.keys(bc).forEach(function(c){var d=(nc[c]||0)-bc[c];if(d<0&&cm[c])diff.push({c:c,d:d});});
  var st=(r.baseStaff||[]).join()!==r.staff.join()?(r.baseStaff||[]).length+'→'+r.staff.length+' 人':'';
  return {amt:now-base,added:false,diff:diff,staff:st};
}
function upCodes(r){   // 比原本多出來的代號（畫面上特別標示）
  if(r.auto||!r.inPlan)return {};
  var bc={},nc={},o={};
  (r.base||[]).forEach(function(x){bc[x.c]=(bc[x.c]||0)+(+x.n||0);});
  r.items.forEach(function(x){nc[x.c]=(nc[x.c]||0)+(+x.n||0);});
  Object.keys(nc).forEach(function(c){if(nc[c]>(bc[c]||0))o[c]=1;});
  return o;
}

/* ── 分項明細（C 款：項目清單＋逐點下拉）。只有「水質・一般」可複選（金額累加），其餘都是單選 ── */
var BLK=[
  {id:'wg',g:'水質',name:'水質・一般',codes:['D','E','F','G','N','O','P'],multi:true,excl:['N','O','P'],unit:'點'},   // 水量三選一，其他可複選
  {id:'gw',g:'水質',name:'地下水',codes:['K','L','M'],multi:false,unit:'口'},
  {id:'car',g:'空氣',name:'空氣・監測車',codes:['V','W'],multi:false,unit:'台'},
  {id:'ws',g:'廢棄物',name:'廢棄物',codes:['Y','Z','AA','AB'],multi:false,unit:'點'},
  {id:'so',g:'土壤',name:'土壤',codes:['AC','AD','AE'],multi:false,unit:'點'},
  {id:'se',g:'底泥',name:'底泥',codes:['AF','AG','AH'],multi:false,unit:'點'}];
var BLK_CODES=[];BLK.forEach(function(b){BLK_CODES=BLK_CODES.concat(b.codes);});
var WATER=BLK_CODES;
var W_LBL={D:'不混樣',E:'混樣',F:'混樣(河川>40m)',G:'須出動橡皮艇',N:'水量100m以下',O:'水量100m以上',P:'水量(使用M9)',
  K:'不洗井',L:'洗井<50m',M:'洗井>50m',Y:'單一廢棄物',Z:'混樣廢棄物',AA:'防護設備(不混樣)',AB:'防護設備(混樣)',
  AC:'不混樣',AD:'混樣',AE:'九宮格混樣',AF:'岩心',AG:'抓取/拖拉式',AH:'採樣鏟',V:'無發電機',W:'含發電機'};
var WS={},WSAVE={},WOPEN={};
function blkOf(id){for(var i=0;i<BLK.length;i++)if(BLK[i].id===id)return BLK[i];}
/** 新點位的預設：最便宜那項 */
function wDef(b){var cm=colMap();return [b.codes.slice().sort(function(x,y){return (cm[x]?cm[x].r:0)-(cm[y]?cm[y].r:0);})[0]];}
/** 由項目（每個代號幾點＋點位名稱）還原成「每個點位選了哪些」 */
function wsOf(r){
  if(WS[r.key])return WS[r.key];
  var st={tt:{},b:{},nm:{}};
  BLK.forEach(function(b){
    var cnt={},p=0,has=false,names=null;
    r.items.forEach(function(it){
      if(b.codes.indexOf(it.c)<0)return;
      has=true;var n=Math.max(0,Math.round(+it.n||0));cnt[it.c]=(cnt[it.c]||0)+n;p=Math.max(p,+it.p||0);
      if(it.t&&!st.tt[b.id])st.tt[b.id]=it.t;
      if(it.pn&&it.pn.length&&!names)names=it.pn.slice();
    });
    if(!has)return;
    var pts=b.multi?Math.max(p,Math.max.apply(null,b.codes.map(function(c){return cnt[c]||0;})))
      :Math.max(p,b.codes.reduce(function(s,c){return s+(cnt[c]||0);},0)),rows=[];
    for(var i=0;i<pts;i++)rows.push([]);
    if(b.multi)b.codes.forEach(function(c){for(var i=0;i<(cnt[c]||0);i++)rows[i].push(c);});
    else{var i=0;b.codes.forEach(function(c){for(var j=0;j<(cnt[c]||0);j++)rows[i++]=[c];});}
    st.b[b.id]=rows;
    st.nm[b.id]=rows.map(function(x,i){return (names&&names[i])||'';});
  });
  return (WS[r.key]=st);
}
function wSumTxt(rows,upc){
  var c={},o=[];rows.forEach(function(s){s.forEach(function(x){c[x]=(c[x]||0)+1;});});
  Object.keys(c).forEach(function(x){o.push('<span'+(upc[x]?' class="upt"':'')+'>'+W_LBL[x]+' '+c[x]+'</span>');});
  return o.join('・')||'尚未選擇';
}
/** 整筆的「項目｜數量｜金額」清單 */
/** 這一類誰沒有資格（不分、不算人數） */
function noQ(r,q){return q?r.staff.filter(function(n){return !hasQ(n,q);}):[];}
function noQTxt(r,q,k){var x=noQ(r,q);return x.length?'<span class="nqt">÷'+(k||r.staff.length-x.length)+' 人・'+x.map(he).join('、')+' 無「'+he(q)+'」資格不分</span>':'';}

      +'<span class="ciq">'+rows.length+' '+b.unit+'</span><span class="cia">'+money(sub)+'</span><span class="cie">'+(op?'▴':(can?'✎':'›'))+'</span></button>';
    if(!op)return;
    h+='<div class="cl">';
    var ctl=function(i,sel){
      if(!b.multi){var v=sel[0]||'';
        return '<span class="sel'+(v&&upc[v]&&i>=0?' up':'')+'"><select'+dis+' onchange="wSet(\''+k+'\',\''+b.id+'\','+i+',this.value)">'
          +(i<0?'<option value="">選擇…</option>':'')+b.codes.map(function(x){return '<option value="'+x+'"'+(x===v?' selected':'')+'>'+W_LBL[x]+'　'+cm[x].r+'</option>';}).join('')+'</select></span>';}
      return '<span class="mc">'+b.codes.map(function(x){var on=sel.indexOf(x)>=0;
        return '<button class="'+(on?'on':'')+(on&&upc[x]&&i>=0?' up':'')+'"'+dis+' onclick="wSet(\''+k+'\',\''+b.id+'\','+i+',\''+x+'\')">'+W_LBL[x]+'<small>'+cm[x].r+'</small></button>';}).join('')+'</span>';
    };
    if(rows.length>2&&can){
      var all=b.codes.filter(function(x){return rows.every(function(s){return s.indexOf(x)>=0;});});
      h+='<div class="cr allr'+(b.multi?' mrow':'')+'"><span class="pname" style="color:var(--accT);font-weight:600">全部設為<small>一次套用 '+rows.length+' '+b.unit+'</small></span>'+ctl(-1,b.multi?all:[])+'</div>';
    }
    rows.forEach(function(sel,i){
      var nm=st.nm[b.id][i];
      h+='<div class="cr'+(b.multi?' mrow':'')+'"><span class="pname"'+(can?' onclick="wName(\''+k+'\',\''+b.id+'\','+i+')"':'')+'>'+(nm?he(nm):'第 '+(i+1)+' '+b.unit)+'<small>'+(nm?'第 '+(i+1)+' '+b.unit:(can?'點這裡填點位名稱':''))+'</small></span>'
        +ctl(i,sel)+(can&&rows.length>1?'<button class="rmx" title="刪除這'+b.unit+'" onclick="wDel(\''+k+'\',\''+b.id+'\','+i+')">✕</button>':'')+'</div>';
    });
    if(can){

function wItems(st){
  var out=[];
  BLK.forEach(function(b){
    var rows=st.b[b.id];if(!rows||!rows.length)return;
    var cnt={};rows.forEach(function(sel){sel.forEach(function(c){cnt[c]=(cnt[c]||0)+1;});});
    var pn=st.nm[b.id].slice(0,rows.length),any=false;
    b.codes.forEach(function(c){if(cnt[c]){any=true;out.push({c:c,n:cnt[c],t:st.tt[b.id]||'',p:rows.length,pn:pn});}});
    if(!any)out.push({c:b.codes[0],n:0,t:st.tt[b.id]||'',p:rows.length,pn:pn,keep:1});   // 點位都沒勾：只記點數
  });
  return out;
}
function wApply(key){
  var r=S.data.recs.filter(function(x){return x.key===key;})[0];if(!r)return;
  var st=WS[key],others=r.items.filter(function(x){return BLK_CODES.indexOf(x.c)<0;}),w=wItems(st);
  var real=w.filter(function(x){return x.n>0;});
  if(!real.length&&!others.length){toast('至少要勾一項；要刪整筆請點 ✎','no',2600);delete WS[key];render();return;}
  if(r.auto){r.base=r.items.filter(function(x){return +x.n>0;}).map(function(x){return {c:x.c,n:x.n};});r.baseStaff=r.staff.slice();r.inPlan=true;}   // 記住行程帶入的原樣
  r.items=others.concat(w);r.auto=false;r.by=S.data.me||r.by;
  render();
  clearTimeout(WSAVE[key]);
  WSAVE[key]=setTimeout(function(){
    gas('allowSave',TOKEN,{date:r.date,project:r.project,staff:r.staff,items:r.items.filter(function(x){return x.n>0;}),note:r.note||''}).then(function(x){
      if(x&&x.ok)toast('已儲存','ok',1200);else{toast((x&&x.error)||'儲存失敗','no',3000);delete WS[key];load();}
    }).catch(function(){toast('連線失敗，請重試','no');});
  },700);
}
function wSet(key,bid,i,code){
  if(!code)return;
  var b=blkOf(bid),rows=WS[key].b[bid];
  var tog=function(sel,on){var j=sel.indexOf(code);
    if(b.multi){
      if(on&&j<0){if(b.excl&&b.excl.indexOf(code)>=0)b.excl.forEach(function(x){var q=sel.indexOf(x);if(q>=0)sel.splice(q,1);});sel.push(code);}   // 水量只能選一種
      if(!on&&j>=0)sel.splice(j,1);
    }else{sel.length=0;sel.push(code);}};
  if(i<0){var all=rows.every(function(s){return s.indexOf(code)>=0;});rows.forEach(function(s){tog(s,b.multi?!all:true);});}
  else tog(rows[i],b.multi?rows[i].indexOf(code)<0:true);
  wApply(key);
}
function wPts(key,bid,d){var st=WS[key];st.b[bid].push(wDef(blkOf(bid)));st.nm[bid].push('');wApply(key);}
function wDel(key,bid,i){var st=WS[key];st.b[bid].splice(i,1);st.nm[bid].splice(i,1);wApply(key);}
function wAdd(key,bid){var st=WS[key];st.b[bid]=[wDef(blkOf(bid))];st.nm[bid]=[''];WOPEN[key+bid]=true;wApply(key);}
function wRm(key,bid){var st=WS[key];delete st.b[bid];delete st.nm[bid];wApply(key);}
function wName(key,bid,i){var st=WS[key],v=prompt('點位名稱',st.nm[bid][i]||'');if(v===null)return;st.nm[bid][i]=v.trim().slice(0,30);wApply(key);}

function qdInit(){QD={defs:(S.data.qdef||[]).map(function(g){return {name:g.name,old:g.name,codes:g.codes.slice()};}),dirty:false};}
function qdOwner(c){for(var i=0;i<QD.defs.length;i++)if(QD.defs[i].codes.indexOf(c)>=0)return i;return -1;}
function qdefView(){

      +(g.codes.length?g.codes.map(function(c){var x=cm[c];return x?'<button class="cp" onclick="qdOut('+gi+',\''+c+'\')">'+he(x.g+'・'+x.s)+'<i>✕</i></button>':'';}).join(''):'<span class="hint">還沒有細項</span>')
      +'</div><button class="wadd" style="margin-top:10px" onclick="qdPick('+gi+')">＋ 拉細項進來</button></div>';
  });
  var free=(S.data.cols||[]).filter(function(c){return qdOwner(c.c)<0;});
  h+='<button class="btn btn-full" style="margin:4px 0 12px" onclick="qdAdd()">＋ 新增資格</button>'
    +'<div class="sec">不需資格的細項（'+free.length+'）</div><div class="card"><div class="chips">'
    +(free.length?free.map(function(c){return '<span class="cp off">'+he(c.g+'・'+c.s)+'</span>';}).join(''):'<span class="hint">全部細項都已分類</span>')+'</div></div>'
    +'<button class="btn btn-p btn-full" style="margin-top:12px"'+(QD.dirty?'':' disabled')+' onclick="qdSave()">'+(QD.dirty?'儲存資格分類':'已儲存')+'</button>';
  return h;
}
function qdAdd(){var n=prompt('新資格名稱（例如：空氣・空品車）','');if(!n)return;n=n.trim().slice(0,20);if(!n)return;
  if(QD.defs.some(function(g){return g.name===n;})){toast('已經有這個名稱','no');return;}
  QD.defs.push({name:n,old:'',codes:[]});QD.dirty=true;render();qdPick(QD.defs.length-1);}
function qdRename(gi){var g=QD.defs[gi],n=prompt('資格名稱',g.name);if(!n)return;n=n.trim().slice(0,20);
  if(!n||n===g.name)return;if(QD.defs.some(function(x){return x.name===n;})){toast('已經有這個名稱','no');return;}g.name=n;QD.dirty=true;render();}
function qdDel(gi){var g=QD.defs[gi];if(!confirm('刪除「'+g.name+'」？組裡的細項會變成不需資格，已勾這個資格的人也不再有作用。'))return;QD.defs.splice(gi,1);QD.dirty=true;render();}
function qdOut(gi,c){var g=QD.defs[gi];g.codes.splice(g.codes.indexOf(c),1);QD.dirty=true;render();}
function qdPick(gi){
  var g=QD.defs[gi],cols=S.data.cols,last='',h='<div class="shh"><h3>拉細項進「'+he(g.name)+'」</h3><button class="ib" onclick="closeSheet();render()">✕</button></div>'

  cols.forEach(function(c){
    if(c.g!==last){last=c.g;h+='<div class="lb">'+he(c.g)+'</div>';}
    var o=qdOwner(c.c),on=o===gi;
    var taken=o>=0&&o!==gi;   // 已在別的資格：不能重複，要先從那一組移出
    h+='<label class="qpk'+(taken?' tk':'')+'"><input type="checkbox"'+(on?' checked':'')+(taken?' disabled':'')+' onchange="qdSet('+gi+',\''+c.c+'\',this.checked)"><span>'+he(c.s)+'<small>'+c.r+' 元'+(taken?'・已在「'+he(QD.defs[o].name)+'」，要先從那裡移出':'')+'</small></span></label>';

function qdSet(gi,c,on){var o=qdOwner(c);if(on&&o>=0&&o!==gi){toast('這個細項已在「'+QD.defs[o].name+'」','no');return;}
  if(o===gi&&!on)QD.defs[gi].codes.splice(QD.defs[gi].codes.indexOf(c),1);if(on&&o<0)QD.defs[gi].codes.push(c);QD.dirty=true;}
function qdSave(){
  var ren={};QD.defs.forEach(function(g){if(g.old&&g.old!==g.name)ren[g.old]=g.name;});
  gas('allowQDef',TOKEN,QD.defs.map(function(g){return {name:g.name,codes:g.codes};}),ren).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'儲存失敗','no');return;}
    S.data.qdef=r.qdef;S.data.cols=r.cols;S.data.quals=r.qdef.map(function(g){return g.name;});S.qual=null;qdInit();toast('已儲存資格分類','ok');render();
  }).catch(function(){toast('連線失敗','no');});
}

/* ── 單價設定（管理員） ── */
function rateView(){
  var cols=S.data.cols,last='',h='<p class="hint" style="margin:8px 6px">改單價，按最下面儲存。會影響所有月份的計算。需要的資格在「資格分類」設定。</p><div class="list">';
  cols.forEach(function(c){
    if(c.g!==last){last=c.g;h+='<div class="rt" style="background:var(--gl);font-weight:700;font-size:12.5px;color:var(--tx2)">'+he(c.g)+'</div>';}
    h+='<div class="rt"><span class="l">'+he(c.s)+'<span class="hint">　'+c.c+'</span></span>'
      +(c.q?'<span class="chip">'+he(c.q)+'</span>':'')
      +'<input id="rr-'+c.c+'" type="number" inputmode="numeric" value="'+c.r+'"></div>';
  });
  return h+'</div><button class="btn btn-p btn-full" style="margin-top:14px" onclick="saveRates()">儲存單價</button>';
}
function saveRates(){
  var ov={};S.data.cols.forEach(function(c){ov[c.c]={r:+$('rr-'+c.c).value||0};});
  gas('allowCols',TOKEN,ov).then(function(r){if(r&&r.ok){S.data.cols=r.cols;toast('已儲存','ok');render();}else toast((r&&r.error)||'失敗','no');});
}

load();
</script>
