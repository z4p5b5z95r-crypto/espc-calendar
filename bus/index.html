<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>娃娃車預約</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F36F21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="娃娃車預約">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4f2;--card:#fff;--card2:#f1ede9;--tx:#2b2522;--tx2:#6f6660;--tx3:#a1978f;--acc:#C44E06;--accT:#B54705;--tint:#fbe6d8;--ok:#1e7a44;--okBg:#e3f3e9;--err:#c62f22;--errBg:#fde4e1;--warn:#8a5a00;--warnBg:#fff1d6;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;overflow-x:clip;overscroll-behavior:none;max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.hd{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;background:linear-gradient(90deg,#fafafa 55%,#fdeee4)}
.hd .h1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mep{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;font-size:12.5px;color:var(--tx2);cursor:pointer;max-width:55%;white-space:nowrap;overflow:hidden}
.mep i{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f08a3e,#d5560e);color:#fff;font-style:normal;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.mep small{font-size:10.5px;background:var(--tint);color:var(--accT);border-radius:999px;padding:0 6px;font-weight:700}
.hd .u{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:6px;white-space:nowrap}.hd .u i{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.hd .u a{margin-left:auto;color:var(--tx3);text-decoration:none}
.hd b{display:block;font-size:25px;font-weight:900;line-height:1.25}
.bd{padding:4px 14px calc(40px + env(safe-area-inset-bottom))}
.sec{font-size:12px;color:var(--tx3);margin:14px 4px 6px}
.fld{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font-size:16px;font-family:inherit;color:var(--tx);outline:none}
.fld:focus{border-color:#f0b48d}
textarea.fld{border-radius:14px;height:84px;resize:none}
.seg{display:flex;background:#e9e6e3;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-size:14px;color:var(--tx2);font-family:inherit;cursor:pointer;line-height:1.3}
.seg button.on{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button:disabled{color:var(--tx3);opacity:.6}
.seg small{display:block;font-size:10.5px;font-weight:400;color:var(--tx3)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx)}
.chip.on{background:var(--tint);border-color:#f0b48d;color:var(--accT);font-weight:700}
.chip.s{padding:6px 12px;font-size:13px}
.me{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 14px;border:1px solid var(--line);font-size:14px}
.me i{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--tx2);flex-shrink:0}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:999px;padding:13px;font-weight:700;font-size:15px;margin-top:18px;background:var(--acc);color:#fff;font-family:inherit;cursor:pointer}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:var(--err)}.btn:disabled{opacity:.45}
.hint{font-size:12px;color:var(--tx3);line-height:1.55;margin:6px 4px 0}
.card{background:#fff;border-radius:18px;border:1px solid var(--line);padding:13px 14px;margin-bottom:9px}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.st.w{background:var(--warnBg);color:var(--warn)}.st.ok{background:var(--okBg);color:var(--ok)}.st.no{background:var(--errBg);color:var(--err)}.st.x{background:var(--card2);color:var(--tx3)}
.kv{font-size:13.5px;color:var(--tx2);margin-top:6px;line-height:1.7}.kv b{color:var(--tx);font-weight:600}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border:0;border-radius:999px;padding:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.acts .y{background:var(--acc);color:#fff}.acts .n{background:var(--card2);color:var(--err)}.acts .c{background:var(--card2);color:var(--tx2)}
.grp{font-size:13px;font-weight:700;margin:16px 4px 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:6px;white-space:nowrap}.grp em{font-style:normal;font-size:11px;background:var(--tint);color:var(--accT);border-radius:999px;padding:1px 8px}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:30px 0}
.nav{display:flex;margin:8px -18px 0;padding:0 18px;border-bottom:1px solid var(--line)}
.nav>span{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 2px 10px;font-weight:700;font-size:15px;color:var(--tx3);cursor:pointer;white-space:nowrap;position:relative}
.nav>span.on{color:var(--tx)}
.nav>span.on:after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px;background:var(--acc)}
.nav .ic{display:inline-flex}.nav>span.on .ic{color:var(--acc)}
.nav .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav sup{display:inline-flex;align-items:center;justify-content:center;background:#e1261a;color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;padding:0 4px;line-height:1}
.nav.many>span{flex-direction:column;gap:1px;font-size:11.5px;padding:7px 1px 8px}
.nav.many sup{position:absolute;top:3px;right:calc(50% - 22px)}

.lvb{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--accT);white-space:nowrap}.lvb.on{background:#e3f3e8;color:#1d8148}.lvb.off{background:var(--card2);color:var(--tx3)}
.card.hasx{position:relative}.card.hasx>.st:first-of-type{margin-right:0}
.card.hasx>.kv{padding-right:30px}
.dcxx{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--card2);color:var(--tx3);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dcxx svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.dcxx:hover,.dcxx:active{background:var(--errBg);color:var(--err)}
.dcxx:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lvr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.note.warn{background:#fff3dc;color:#7a4b00}
.tkbar{display:flex;justify-content:flex-end;margin:4px 0 -6px}
.rfb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--tx2);border-radius:999px;padding:5px 12px 5px 9px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.rfb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rfb.on svg{animation:rfs .8s linear infinite}@keyframes rfs{to{transform:rotate(360deg)}}
.hrow .rfb{margin-left:auto}
.why{text-align:center;color:var(--err);font-size:12.5px;min-height:18px;margin:6px 0 0}.why:empty{min-height:0;margin:0}
#ptr{position:fixed;left:50%;z-index:20;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;color:var(--tx3);opacity:0;pointer-events:none;transform:translate(-50%,-44px)}
#ptr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ptr.rd{color:var(--acc)}
#ptr.spin{color:var(--acc)}#ptr.spin svg{animation:rfs .8s linear infinite}
.tke{opacity:1;margin-top:18px}.tke summary span{font-weight:500;margin-left:8px;color:var(--tx3);font-size:12px}
.tkm{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px;color:var(--tx2);cursor:pointer}
.tkm .d{font-weight:700;color:var(--tx);white-space:nowrap}.tkm .r{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkm .tg{flex:none;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;border:1.5px solid}
.tkm .tg.te{color:#8a8079;border-color:#cfc6bf}.tkm .tg.tn{color:#c0442b;border-color:#e9b3a8}.tkm .tg.tx{color:#8a8079;border-color:#cfc6bf;text-decoration:line-through}
.tkend{grid-column:1/-1;text-align:center;font-size:12px;color:var(--tx3);margin:20px 0 -8px;border-top:1px dashed var(--line);padding-top:10px}
.tkno{text-align:center;color:var(--tx2);font-size:13.5px;padding:44px 0 6px}.tkno i{display:block;font-style:normal;font-size:40px;opacity:.75}.tkno b{display:block;color:var(--tx);font-size:16px;margin:4px 0 2px}
.tkno .btn{max-width:180px;margin:14px auto 0}

.ov{position:fixed;inset:0;z-index:15;display:none}.ov.on{display:block}
.dim{position:absolute;inset:0;background:rgba(20,16,12,.32)}
.sheet{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.15);max-height:90%;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,26,24,.9);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:25;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--tx2);background:var(--card2);border-radius:12px;padding:8px 11px;margin-top:8px;line-height:1.55}
.note.red{background:#fde4e1;color:#a5281d}
.pz{background:#7b3fb8;color:#fff;border-radius:6px;padding:0 5px;font-weight:700}
.pz.pr{background:#d32f2f}
.qrbox{background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px;text-align:center;margin-top:8px}
#qr{display:inline-block;padding:10px;background:#fff}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:#ddd;border:0;flex-shrink:0;cursor:pointer;transition:background .2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--acc)}.sw.on:after{left:21px}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}.li:first-child{border-top:0}
.embed .hd .h1{display:none}.embed .hd{padding:0 14px;background:var(--bg)}.embed .nav{margin:0 -14px;padding:0 14px}.embed .hd:not(.hasnav){display:none}.embed .nav{margin-top:0}
.hrow{display:flex;align-items:center;gap:8px;margin:14px 4px 0}
.hrow .h2{flex:1;font-size:17px;font-weight:800;user-select:none;-webkit-user-select:none}
.mybtn{border:1.5px solid #f0b48d;background:#fff;color:var(--accT);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;font-family:inherit;cursor:pointer;white-space:nowrap}
.mybtn i{font-style:normal;min-width:17px;height:17px;border-radius:9px;background:#e1261a;color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.back{border:0;background:none;color:var(--accT);font-size:14px;font-weight:700;font-family:inherit;padding:4px 0;cursor:pointer}
.embed .bd{padding-top:6px}

/* ── 我的預約：車票（T5 橘色日期條）＋確認章／作廢章 ── */
.tk5{background:#fff;border-radius:18px;border:1px solid var(--line);margin:22px 4px 14px 0;position:relative}
.tk5 .bar{border-radius:18px 18px 0 0;background:linear-gradient(90deg,#F36F21,#C44E06);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:800}
.tk5 .bar small{font-weight:600;opacity:.92;margin-right:44px}
.tk5 .in{padding:12px 14px 12px}
.tk5 .tm{font-size:32px;font-weight:800;line-height:1;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk5 .tm s.old{font-size:20px;color:var(--tx3);font-weight:700;text-decoration:line-through;text-decoration-color:#d2402c;text-decoration-thickness:2.5px}
.tk5 .tm .nw{color:#c0442b}
.tk5 .tm .chg{font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:#d2402c;border-radius:6px;padding:2px 6px;letter-spacing:0;align-self:center}
.tk5 .lab{font-size:10.5px;color:var(--tx3);font-weight:600;letter-spacing:.5px}
.tk5 .sp{display:flex;justify-content:space-between;align-items:center}
.tk5 .rw{display:flex;align-items:center;gap:8px;margin-top:1px}
.tk5 .pl{font-size:20px;font-weight:800;white-space:nowrap}
.tk5 .road{flex:1;position:relative;height:24px;display:flex;align-items:center;justify-content:center;gap:6px}

.sfx{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(18,14,10,0);transition:background .3s;pointer-events:all;overflow:hidden}
.sfx.on{background:rgba(18,14,10,.62)}
.sfx .stage{position:relative;width:100%;height:150px}
.sfx .car{position:absolute;left:50%;bottom:26px;width:150px;margin-left:-75px;transform:translateX(0);opacity:0;transition:opacity .25s}
.sfx.on .car{opacity:1}
.sfx .car .vanbig{width:150px;height:108px;margin:0;animation:idle .14s linear infinite alternate}
.sfx .road{position:absolute;left:0;right:0;bottom:24px;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 18px,transparent 18px 34px);opacity:0;transition:opacity .3s}
.sfx.on .road{opacity:1}
.sfx .puff{position:absolute;right:-6px;bottom:10px;width:14px;height:14px;border-radius:50%;background:rgba(235,230,224,.85);opacity:0;animation:puff .9s ease-out infinite}
.sfx .puff:nth-child(2){animation-delay:.3s}.sfx .puff:nth-child(3){animation-delay:.6s}
.sfx .msg{color:#fff;font-weight:700;font-size:16px;letter-spacing:.5px;margin-top:6px;transition:opacity .2s}
.sfx .msg .dots::after{content:'';animation:dots 1.2s steps(4) infinite}
.sfx .done{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;color:#fff;transition:all .35s cubic-bezier(.2,1.4,.4,1)}
.sfx .done i{display:flex;align-items:center;justify-content:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:#2e9d5b;font-style:normal;font-size:34px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sfx .done b{display:block;font-size:20px}.sfx .done span{display:block;font-size:13.5px;opacity:.85;margin-top:4px}
.sfx.go .car{transition:transform .85s cubic-bezier(.55,0,.9,.5);transform:translateX(-75vw)}
.sfx.go .car .vanbig{animation:none}
.sfx.go .road{animation:road .3s linear infinite}
.sfx.go .puff{animation-duration:.45s}
.sfx.go .msg{opacity:0}
.sfx.ok .done{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sfx.ok .road,.sfx.ok .car{opacity:0}
.sfx.out{background:rgba(18,14,10,0)}.sfx.out .done{opacity:0}
@keyframes idle{from{transform:translateY(0) rotate(0)}to{transform:translateY(-1.5px) rotate(-.6deg)}}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(34px,-10px) scale(1.6)}}
@keyframes road{to{background-position:34px 0}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.rs{background:#fff;border:1.5px solid #ead9cc;border-radius:18px;padding:10px 14px 8px;margin:0 0 10px}
.rs .tt{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--tx2);margin-bottom:4px}
.rs .tt b{font-size:22px;color:var(--tx);font-weight:800}
.rs ol{list-style:none;margin:0;padding:0;position:relative}
.rs ol::before{content:'';position:absolute;left:11px;top:14px;bottom:14px;border-left:2px dashed #d8c7b8}
.rs li{position:relative;display:flex;align-items:center;gap:10px;padding:5px 0;min-height:30px}
.rs .no{flex:0 0 24px;height:24px;border-radius:50%;background:#fff;border:2px solid #c9b6a6;color:var(--tx2);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:1}
.rs li.hm .no{background:var(--acc);border-color:var(--acc);color:#fff}
.rs .nm{font-weight:800;font-size:15.5px;min-width:0;flex:1}
.rs .nm .pl{font-size:15px}
.rs .io{display:flex;gap:6px;flex:none}
.rs .io span{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.rs .dn{background:#fde9e4;color:#c0442b}.rs .up{background:#e3f3e8;color:#23824a}
.rs .ft{font-size:12px;color:var(--tx3);margin-top:4px;border-top:1px dashed var(--line);padding-top:6px}
.gx{background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:0 12px}

  e.preventDefault();var li=hd.closest('li'),ol=li.parentNode;DRAG=true;li.classList.add('drg');
  try{hd.setPointerCapture(e.pointerId);}catch(_){}
  var mv=function(ev){var y=ev.clientY,items=[].slice.call(ol.querySelectorAll('li[data-d]'));
    for(var i=0;i<items.length;i++){var it=items[i];if(it===li)continue;var r=it.getBoundingClientRect();
      if(y>r.top&&y<r.bottom){if(y<r.top+r.height/2)ol.insertBefore(li,it);else ol.insertBefore(li,it.nextSibling);break;}}
    [].slice.call(ol.querySelectorAll('li[data-d]')).forEach(function(x,i){x.querySelector('.no').textContent=i+1;});};
  var up=function(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    li.classList.remove('drg');DRAG=false;
    var mine=[].slice.call(ol.querySelectorAll('li[data-d]')).map(function(x){return x.getAttribute('data-d');});
    var old=stopOrd().filter(function(d){return mine.indexOf(d)<0;}),nw=[];
    // 這班的順序蓋過去，其他站維持原本相對位置
    var all=stopOrd().concat(mine.filter(function(d){return stopOrd().indexOf(d)<0;})),q=mine.slice();
    all.forEach(function(d){nw.push(mine.indexOf(d)>=0?q.shift():d);});
    lsS('bus_stop_ord',JSON.stringify(nw));render();};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function routeSum(g){
  var a=g.filter(function(b){return b.st==='w'||b.st==='ok';});if(!a.length)return '';
  var go=0,bk=0,st={},ord=[],tot=0,trunk=0,wait=0;
  a.forEach(function(b){var n=+b.n||1;tot+=n;if(b.trunk)trunk+=n;if(b.st==='w')wait++;
    if(!st[b.dest]){st[b.dest]={dn:0,up:0};ord.push(b.dest);}
    if(b.trip!=='back'){go+=n;st[b.dest].dn+=n;}
    if(b.trip!=='go'){bk+=n;st[b.dest].up+=n;}});
  var so=stopOrd();ord.sort(function(x,y){var i=so.indexOf(x),j=so.indexOf(y);return (i<0?99:i)-(j<0?99:j);});
  var io=function(dn,up,last){return '<span class="io">'+(dn?'<span class="dn">↓ 下 '+dn+'</span>':'')+(up?'<span class="up">↑ 上 '+up+'</span>':'')+(!dn&&!up?'<span style="color:var(--tx3);font-weight:600">'+(last?'空車回':'空車出發')+'</span>':'')+'</span>';};
  var h='<div class="rs"><div class="tt"><b>'+tot+' 人</b>停 '+ord.length+' 站'+(trunk?'・後車廂 '+trunk+' 人':'')+'</div><ol>';
  h+='<li class="hm"><span class="no">起</span><span class="nm">'+HOME+'</span>'+io(0,go)+'</li>';
  ord.forEach(function(d,i){h+='<li data-d="'+he(d)+'"><span class="no">'+(i+1)+'</span><span class="nm">'+pl(d)+'</span>'+io(st[d].dn,st[d].up)+(ord.length>1?'<span class="hdl" onpointerdown="stopDrag(event,this)">☰</span>':'')+'</li>';});
  h+='<li class="hm"><span class="no">回</span><span class="nm">'+HOME+'</span>'+io(bk,0,1)+'</li>';
  return h+'</ol>'+(wait?'<div class="ft">含 '+wait+' 筆待確認</div>':'')+'</div>';
}

    +'<div style="display:flex;gap:8px"><input class="fld" type="date" id="ofd" style="flex:1.2;min-width:0"><input class="fld" id="ofn" placeholder="名稱" style="flex:1;min-width:0"></div>'
    +'<button class="btn" style="margin-top:8px" onclick="offAdd()">加入停駛日</button>'
    +'<div style="margin-top:8px">'+(a.off.length?a.off.map(function(o){return '<div class="li"><b style="font-weight:600;width:130px">'+md(o.d)+'（'+WK[dow(o.d)]+'）</b><span style="flex:1;color:var(--tx2)">'+(o.s?halfLab(o.s)+'・':'')+he(o.n)+'</span><a href="#" style="color:var(--err);font-size:13px" onclick="offDel(\''+o.d+'\',\''+(o.s||'')+'\');return false">刪除</a></div>';}).join(''):'<div class="hint">沒有設定</div>')+'</div></div>';
  return h;
}
function admList(l){return '<div class="li" style="font-size:12px;color:var(--tx3);border:0;padding-bottom:0"><span style="flex:1"></span><span style="width:56px;text-align:center">🚐 司機</span><span style="width:56px;text-align:center">🚨 叫車</span></div>'
  +(l.slice(0,60).map(function(x){return '<div class="li"><span style="flex:1;min-width:0">'+he(x.n)+' <span class="hint">'+he(x.u)+'</span></span>'
    +'<span style="width:56px;text-align:center"><button class="sw'+(x.drv?' on':'')+'" onclick="drvSet(\''+he(x.u)+'\','+(!x.drv)+')"></button></span>'
    +'<span style="width:56px;text-align:center"><button class="sw'+(x.call?' on':'')+'" onclick="callSet(\''+he(x.u)+'\','+(!x.call)+')"></button></span></div>';}).join('')||'<div class="hint">找不到</div>');}
/* 開關：畫面馬上切換，背景送出；失敗才切回去並提示 */
function admFlip(u,key,on,fn,okMsg){var a=DATA.adm,x=a&&a.accts.filter(function(y){return y.u===u;})[0];if(!x)return;
  var was=x[key];x[key]=on;admPaint();
  gas(fn,TOKEN,u,on).then(function(j){if(!j||!j.ok){x[key]=was;admPaint();toast((j&&j.error)||'沒有存到，請再試一次',3000);return;}
    var n=j.accts.filter(function(y){return y.u===u;})[0];if(n&&n[key]!==x[key]){x[key]=n[key];admPaint();}
  }).catch(function(){x[key]=was;admPaint();toast('連線失敗，沒有存到',3000);});}
function callSet(u,on){admFlip(u,'call',on,'admCall');}
function admPaint(){var a=DATA.adm,q=ADQ.trim();$('adl').innerHTML=admList(a.accts.filter(function(x){return x.drv||x.call||!q||x.n.indexOf(q)>=0||x.u.indexOf(q)>=0;}));}
function admDone(p,msg){p.then(function(j){if(!j.ok){toast(j.error,3000);return;}DATA.adm=j;toast(msg);render();}).catch(function(e){toast(e.message);});}
function drvSet(u,on){admFlip(u,'drv',on,'admDriver');}
function offAdd(){var d=$('ofd').value,n=$('ofn').value.trim();if(!d){toast('請選日期');return;}admDone(gas('admOff',TOKEN,d,n||'停駛',true),'已加入停駛日');}
function offDel(d,s){admDone(gas('admOff',TOKEN,d,'',false,s||''),'已刪除');}

/* ── 通知（推播） ── */
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
/* 三星內建瀏覽器（Samsung Internet）：加入主畫面會被 Android 14 以後的手機擋（「為舊版 Android 打造」），請改用 Chrome */
function isSam(){return /SamsungBrowser/i.test(navigator.userAgent)&&!standalone();}
function chromeUrl(){var u=location.href.split('#')[0];return 'intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';}
function copyUrl(){var u=location.href.split('#')[0];
  var ok=function(){toast('已複製網址，打開 Chrome 貼上就好',3000);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,function(){prompt('複製這個網址，貼到 Chrome',u);});else prompt('複製這個網址，貼到 Chrome',u);}
function samSheet(ob){
  sheet('<div style="text-align:center"><div style="font-size:34px">📱</div><b style="font-size:18px">請改用 Chrome 加入主畫面</b>'
    +'<p class="hint" style="text-align:center;margin-top:6px">'+(ob?'預約已送出。':'')+'三星手機內建的瀏覽器加入主畫面時，會跳出「為舊版 Android 打造」被擋下來，這是三星瀏覽器的問題，不是你的手機。改用 Chrome 就可以正常加入、收到司機通知。</p></div>'
    +'<a class="btn" style="display:block;text-align:center;text-decoration:none" href="'+chromeUrl()+'">用 Chrome 開啟娃娃車</a>'
    +'<button class="btn g" style="margin-top:8px" onclick="copyUrl()">複製網址（自己貼到 Chrome）</button>'
    +'<div class="hint" style="margin-top:12px;line-height:1.7">在 Chrome 裡：登入 → 右上角「⋮」→「加到主畫面」或「安裝應用程式」→ 從主畫面打開，按「開啟通知」</div>'
    +(ob?'<button class="btn g" style="margin-top:10px" onclick="obLater()">之後再說</button>':'<button class="btn g" style="margin-top:10px" onclick="closeSheet()">關閉</button>'));}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}
function pushReady(){return !!FB_CFG.appId;}
/* 通知還差哪一步：''＝不用提醒；home＝要先加入主畫面；ask＝可以直接開啟；denied＝被封鎖 */
function pushNeed(){
  if(!M||!M.me)return '';
  if(M.me.kind==='u'&&(EMBED||M.me.calPush||ls('espc_push')))return '';   // 有行事曆帳號、行事曆已開通知：從行事曆跳
  if(!pushReady())return '';
  if(pushSupported()&&Notification.permission==='granted'&&ls('bus_push'))return '';
  if(isSam())return 'home';
  if(isIOS()&&!standalone())return 'home';
  if(!pushSupported())return 'home';
  return Notification.permission==='denied'?'denied':'ask';
}
/* 第一次送出預約後：車子開走、送出完成 → 跳出「加入主畫面／開啟通知」；按「之後再說」3 天內不再跳（預約頁上方的提示條還在） */
function obAfter(){var k=pushNeed();if(k!=='home'&&k!=='ask')return;if(+(ls('bus_ob_snz')||0)>Date.now())return;
  setTimeout(function(){if(!$('ov').classList.contains('on')&&!SFX)obOpen(k);},1800);}
function obLater(){lsS('bus_ob_snz',String(Date.now()+3*86400000));closeSheet();}
function obOpen(k){
  if(k==='home'){if(isSam())samSheet(true);else a2hsOpen('',true);return;}
  sheet('<div style="text-align:center"><div style="font-size:34px">🔔</div><b style="font-size:18px">開啟通知，才收得到司機的通知喔！</b>'
    +'<p class="hint" style="text-align:center;margin-top:6px">司機接單或不接單、出發前 3 分鐘提醒、發車廣播、同事請你順便幫忙，都會直接跳通知給你</p></div>'
    +'<button class="btn" onclick="closeSheet();pushOn()">開啟通知</button><button class="btn g" style="margin-top:8px" onclick="obLater()">之後再說</button>');
}
function pushCard(){
  var k=pushNeed();
  if(!k)return '';
  if(isSam())return '<div class="note" style="margin:10px 0;display:flex;align-items:center;gap:10px"><span style="flex:1">🔔 三星瀏覽器沒辦法加入主畫面，請改用 <b>Chrome</b> 開啟，才收得到司機的通知</span><button class="chip s" style="background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;white-space:nowrap" onclick="samSheet()">怎麼做</button></div>';
  if(isIOS()&&!standalone())return '<div class="note" style="margin:10px 0;display:flex;align-items:center;gap:10px"><span style="flex:1">🔔 <b>加入主畫面</b>，才收得到司機的通知喔</span><button class="chip s" style="background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700" onclick="a2hsOpen()">看怎麼加</button></div>';
  if(!pushSupported())return '<div class="note" style="margin:10px 0">這個瀏覽器不支援通知。<a href="#" style="color:var(--accT);font-weight:700" onclick="a2hsOpen();return false">加入主畫面</a>後再打開試試</div>';
  if(Notification.permission==='denied')return '<div class="note red" style="margin:10px 0">通知被封鎖了，請到手機「設定」裡允許娃娃車通知</div>';
  return '<div class="note" style="margin:10px 0;display:flex;align-items:center;gap:10px"><span style="flex:1">🔔 開啟通知，司機回覆、出發前 3 分鐘、發車廣播會跳出來'+(M&&M.me.kind==='u'?'<br><span style="color:var(--tx3)">沒開的話，會改從行事曆 App 通知</span>':'')+'</span><button class="chip s" style="background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700" id="pbtn" onclick="pushOn()">開啟</button></div>';
}
var FB_READY=null;
function fbMessaging(){
  if(!FB_READY){var base='https://www.gstatic.com/firebasejs/10.14.1/';
    FB_READY=loadJS(base+'firebase-app-compat.js').then(function(){return loadJS(base+'firebase-messaging-compat.js');})
      .then(function(){if(!firebase.apps.length)firebase.initializeApp(FB_CFG);return firebase.messaging();});
    FB_READY.catch(function(){FB_READY=null;});}
  return FB_READY;
}
function swReg(){return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});}
function pushOn(){
  var b=$('pbtn');if(b){b.disabled=true;b.textContent='…';}
  (Notification.permission==='granted'?Promise.resolve('granted'):Notification.requestPermission()).then(function(p){
    if(p!=='granted')throw new Error('沒有取得通知權限');return swReg();
  }).then(function(reg){return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});});
  }).then(function(tok){if(!tok)throw new Error('取不到推播代碼');
    return gas('savePush',TOKEN,tok,true).then(function(r){if(!r.ok)throw new Error(r.error);lsS('bus_push',tok);lsS('bus_push_day',tw().day);});
  }).then(function(){toast('已開啟通知');render();}).catch(function(e){toast(e.message||'開啟失敗',3000);render();});
}
/* 每次打開（最多每小時一次）：推播代碼換了就更新後台 */
var PUSH_AT=0;
function pushRefresh(){
  if(!TOKEN||!pushReady()||!pushSupported()||Notification.permission!=='granted'||!ls('bus_push'))return;
  if(Date.now()-PUSH_AT<3600000)return;PUSH_AT=Date.now();
  swReg().then(function(reg){return reg.pushManager.getSubscription().then(function(sub){
    if(!sub){lsD('bus_push');render();return;}
    return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});}).then(function(tok){
      var old=ls('bus_push');
      if(tok&&(tok!==old||ls('bus_push_day')!==tw().day))gas('savePush',TOKEN,tok,true).then(function(r){if(r.ok){lsS('bus_push',tok);lsS('bus_push_day',tw().day);}});
      if(tok&&old&&old!==tok)gas('savePush',TOKEN,old,false).catch(function(){});
    });
  });}).catch(function(){});
}
/* 加入主畫面教學（第一次用工號登入會自動跳出） */
var A2={os:'',ob:false};
function a2hsOpen(os,ob){if(isSam()&&os!=='ios'){samSheet(ob);return;}A2.os=os||A2.os||(/Android/i.test(navigator.userAgent)?'and':'ios');if(ob!==undefined)A2.ob=!!ob;
  var step=function(n,t,ic){return '<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)"><span style="width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--accT);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+n+'</span><span style="flex:1;font-size:14px;line-height:1.5">'+t+'</span>'+(ic?'<span style="font-size:20px">'+ic+'</span>':'')+'</div>';};
  var ios=step(1,'按 Safari 下方的<b>「分享」</b>按鈕','⬆️')+step(2,'往下滑，點<b>「加入主畫面」</b>','➕')+step(3,'右上角按<b>「新增」</b>','✅')+step(4,'從主畫面打開<b>娃娃車預約</b>，按<b>「開啟通知」</b>','🔔');
  var and=step(1,'按 Chrome 右上角的<b>「⋮」</b>','⋮')+step(2,'點<b>「加到主畫面」</b>或<b>「安裝應用程式」</b>','➕')+step(3,'按<b>「新增／安裝」</b>','✅')+step(4,'打開後按<b>「開啟通知」</b>','🔔');
  sheet('<div style="text-align:center"><div style="font-size:34px">🔔</div><b style="font-size:18px">加入主畫面，才收得到司機的通知喔！</b>'
    +'<p class="hint" style="text-align:center;margin-top:6px">'+(A2.ob?'預約已送出。':'')+'司機接單或不接單、出發前 3 分鐘提醒、發車廣播，都要加入主畫面才會跳出來</p></div>'
    +'<div class="seg" style="margin:12px 0 4px"><button class="'+(A2.os==='ios'?'on':'')+'" onclick="a2hsOpen(\'ios\')">iPhone</button><button class="'+(A2.os==='and'?'on':'')+'" onclick="a2hsOpen(\'and\')">Android</button></div>'
    +(A2.os==='ios'?ios:and)+(A2.ob?'<button class="btn" onclick="closeSheet()">好，我去加</button><button class="btn g" style="margin-top:8px" onclick="obLater()">之後再說</button>':'<button class="btn" onclick="closeSheet()">我知道了</button>'));
}
/* 點通知打開：service worker 叫畫面重新整理 */
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){var d=e.data||{};if(d.type==='open'){var hs=String(d.url||'').split('#')[1];if(tkParse(hs)){if(window.caches)caches.open('bus-open').then(function(c){c.delete('./__open');});tkGo(tkParse(hs),tkData(hs));return;}var o=ordParse(hs);if(o){if(window.caches)caches.open('bus-open').then(function(c){c.delete('./__open');});ordGo(o);return;}}if(d.type==='push'||d.type==='open'){if(d.type==='open'&&d.url&&d.url.indexOf('#mine')>=0&&M)PAGE='mine';load();}});

/* 三星瀏覽器打開（例如掃 QR code）：自動改用 Chrome 開啟。
   ・手機沒有 Chrome → Android 會帶回這一頁（網址加 ?stay=1），就留在三星瀏覽器，不再跳
   ・通知連結（網址有 #）不跳，免得打不開那張車票
   ・同一個分頁只試一次 */
function samGo(){
  try{
    if(!isSam()||location.hash||/[?&]stay=1/.test(location.search)||sessionStorage.getItem('sam_tried'))return false;
    sessionStorage.setItem('sam_tried','1');
  }catch(e){return false;}
  var u=location.href.split('#')[0],back=u+(u.indexOf('?')<0?'?':'&')+'stay=1';
  location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(back)+';end';
  return true;
}
samGo();
init();
