<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>娃娃車預約</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F36F21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="娃娃車預約">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4f2;--card:#fff;--card2:#f1ede9;--tx:#2b2522;--tx2:#6f6660;--tx3:#a1978f;--acc:#C44E06;--accT:#B54705;--tint:#fbe6d8;--ok:#1e7a44;--okBg:#e3f3e9;--err:#c62f22;--errBg:#fde4e1;--warn:#8a5a00;--warnBg:#fff1d6;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.hd{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;background:linear-gradient(90deg,#fafafa 55%,#fdeee4)}
.hd .u{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px}.hd .u i{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.hd .u a{margin-left:auto;color:var(--tx3);text-decoration:none}
.hd b{display:block;font-size:21px;margin-top:6px}
.bd{padding:4px 14px calc(40px + env(safe-area-inset-bottom))}
.sec{font-size:12px;color:var(--tx3);margin:14px 4px 6px}
.fld{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font-size:16px;font-family:inherit;color:var(--tx);outline:none}
.fld:focus{border-color:#f0b48d}
textarea.fld{border-radius:14px;height:84px;resize:none}
.seg{display:flex;background:#e9e6e3;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-size:14px;color:var(--tx2);font-family:inherit;cursor:pointer;line-height:1.3}
.seg button.on{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button:disabled{color:var(--tx3);opacity:.6}
.seg small{display:block;font-size:10.5px;font-weight:400;color:var(--tx3)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx)}
.chip.on{background:var(--tint);border-color:#f0b48d;color:var(--accT);font-weight:700}
.chip.s{padding:6px 12px;font-size:13px}
.me{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 14px;border:1px solid var(--line);font-size:14px}
.me i{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--tx2);flex-shrink:0}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:999px;padding:13px;font-weight:700;font-size:15px;margin-top:18px;background:var(--acc);color:#fff;font-family:inherit;cursor:pointer}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:var(--err)}.btn:disabled{opacity:.45}
.hint{font-size:12px;color:var(--tx3);line-height:1.55;margin:6px 4px 0}
.card{background:#fff;border-radius:18px;border:1px solid var(--line);padding:13px 14px;margin-bottom:9px}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.st.w{background:var(--warnBg);color:var(--warn)}.st.ok{background:var(--okBg);color:var(--ok)}.st.no{background:var(--errBg);color:var(--err)}.st.x{background:var(--card2);color:var(--tx3)}
.kv{font-size:13.5px;color:var(--tx2);margin-top:6px;line-height:1.7}.kv b{color:var(--tx);font-weight:600}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border:0;border-radius:999px;padding:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.acts .y{background:var(--acc);color:#fff}.acts .n{background:var(--card2);color:var(--err)}.acts .c{background:var(--card2);color:var(--tx2)}
.grp{font-size:13px;font-weight:700;margin:16px 4px 6px;display:flex;align-items:center;gap:6px}.grp em{font-style:normal;font-size:11px;background:var(--tint);color:var(--accT);border-radius:999px;padding:1px 8px}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:30px 0}
.nav{display:flex;gap:18px;margin-top:8px;font-size:14.5px;color:var(--tx3);overflow-x:auto}
.nav>span{position:relative;cursor:pointer;padding:6px 0 7px;white-space:nowrap}
.nav>span.on{color:var(--tx);font-weight:800}
.nav>span.on:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--acc)}
.nav sup{position:absolute;top:-2px;right:-14px;background:#e1261a;color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nav .ic{display:none}
@media(max-width:420px){.nav.many{font-size:12.5px}}
.ov{position:fixed;inset:0;z-index:15;display:none}.ov.on{display:block}
.dim{position:absolute;inset:0;background:rgba(20,16,12,.32)}
.sheet{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.15);max-height:90%;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,26,24,.9);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:25;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--tx2);background:var(--card2);border-radius:12px;padding:8px 11px;margin-top:8px;line-height:1.55}
.note.red{background:#fde4e1;color:#a5281d}
.pz{background:#7b3fb8;color:#fff;border-radius:6px;padding:0 5px;font-weight:700}
.pz.pr{background:#d32f2f}
.qrbox{background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px;text-align:center;margin-top:8px}
#qr{display:inline-block;padding:10px;background:#fff}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:#ddd;border:0;flex-shrink:0;cursor:pointer;transition:background .2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--acc)}.sw.on:after{left:21px}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}.li:first-child{border-top:0}
.embed .hd .u,.embed .hd b{display:none}.embed .hd{padding:4px 16px 0}.embed .hd:not(.hasnav){display:none}.embed .nav{margin-top:0}
.hrow{display:flex;align-items:center;gap:8px;margin:14px 4px 0}
.hrow .h2{flex:1;font-size:17px;font-weight:800;user-select:none;-webkit-user-select:none}
.mybtn{border:1.5px solid #f0b48d;background:#fff;color:var(--accT);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;font-family:inherit;cursor:pointer;white-space:nowrap}
.mybtn i{font-style:normal;min-width:17px;height:17px;border-radius:9px;background:#e1261a;color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.back{border:0;background:none;color:var(--accT);font-size:14px;font-weight:700;font-family:inherit;padding:4px 0;cursor:pointer}
.embed .bd{padding-top:6px}

/* ── 我的預約：車票（T5 橘色日期條）＋確認章／作廢章 ── */
.tk5{background:#fff;border-radius:18px;border:1px solid var(--line);margin:22px 4px 14px 0;position:relative}
.tk5 .bar{border-radius:18px 18px 0 0;background:linear-gradient(90deg,#F36F21,#C44E06);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:800}
.tk5 .bar small{font-weight:600;opacity:.92;margin-right:44px}
.tk5 .in{padding:12px 14px 12px}
.tk5 .tm{font-size:32px;font-weight:800;line-height:1;letter-spacing:.5px}
.tk5 .lab{font-size:10.5px;color:var(--tx3);font-weight:600;letter-spacing:.5px}
.tk5 .sp{display:flex;justify-content:space-between;align-items:center}
.tk5 .rw{display:flex;align-items:center;gap:8px;margin-top:1px}
.tk5 .pl{font-size:20px;font-weight:800;white-space:nowrap}
.tk5 .road{flex:1;position:relative;height:24px;display:flex;align-items:center;justify-content:center;gap:6px}
.tk5 .road:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #ddd3ca}

function departed(day,slot){var n=tw();return day<n.day||(day===n.day&&n.min>=hm(slot));}
function pl(n){return n==='紫軒'?'<span class="pz">紫軒</span>':n==='紅樓'?'<span class="pz pr">紅樓</span>':he(n);}
function route(b){if(b.kind==='call')return pl(b.frm)+' → '+pl(b.dest);return b.trip==='back'?pl(b.dest)+' → '+HOME:(b.trip==='rt'?HOME+' ⇄ '+pl(b.dest):HOME+' → '+pl(b.dest));}
function tripLab(b){if(b.kind==='call')return '🚨 臨時叫車・'+(b.at==='asap'?'盡快':b.at);return b.trip==='rt'?'來回・'+slotLab(b.slot)+'（同趟去回）':(b.trip==='back'?'回程':'去程')+'・'+slotLab(b.slot);}

/* ── 狀態 ── */
/* 行事曆裡的「娃娃車」頁會用 iframe 打開這頁（?embed=1）：沿用行事曆的登入、通知也從行事曆跳出 */
var EMBED=/[?&]embed=1/.test(location.search);
try{if(window.self!==window.top)EMBED=true;}catch(e){EMBED=true;}
if(EMBED)document.documentElement.classList.add('embed');
var TOKEN=ls('bus_token'),M=null,PAGE='',DATA={},BUSY=false;
var F={day:'',trip:'rt',slot:'',dest:'紅樓',other:'',n:1,memo:''};
var C={frm:'赤城',frmO:'',dest:'紅樓',destO:'',when:'asap',time:'',n:1,memo:''};
var CALLON=false,TAPS=[];
var LG={step:1,gid:'',name:'',ext:'',u:'',p:'',err:'',busy:false};

function setMe(j){M=j;try{lsS('bus_m',JSON.stringify(j.me?{ok:true,me:j.me,days:j.days,today:j.today,runToday:j.runToday,offToday:j.offToday,off:j.off}:j));}catch(e){}lsS('bus_me',JSON.stringify({name:j.me.name,kind:j.me.kind}));lsS('bus_u',j.me.kind==='u'?j.me.username:'');}
function logoutLocal(){TOKEN='';M=null;lsD('bus_token');lsD('bus_me');lsD('bus_m');DATA={};PAGE='';}
function logout(){if(TOKEN)gas('logout',TOKEN).catch(function(){});logoutLocal();LG={step:1,gid:'',name:'',ext:'',u:'',p:'',err:'',busy:false};render();}

function init(){
  // 行事曆換了人登入（或登出）：娃娃車跟著換
  if(EMBED&&TOKEN&&ls('espc_token')&&ls('bus_u')!==ls('espc_user'))logoutLocal();
  // 開啟加速：上次的資料先畫出來，後台的最新狀態回來再更新
  var cm=null;try{cm=JSON.parse(ls('bus_m')||'null');}catch(e){}
  if(TOKEN&&cm&&cm.me&&cm.today===tw().day){M=cm;afterLogin(false);return;}
  if(TOKEN){
    gas('me',TOKEN).then(function(j){if(!j.ok)throw new Error(j.error);setMe(j);afterLogin(false,true);}).catch(function(e){if(!TOKEN)render();else $('bd').innerHTML='<div class="ld">'+he(e.message)+'<br><button class="btn g" style="max-width:200px;margin:14px auto 0" onclick="init()">再試一次</button></div>';});
    return;
  }
  // 同一個瀏覽器已經登入行事曆：直接沿用（不用再打密碼）
  var ct=ls('espc_token');
  if(ct&&ct.indexOf('VIEW-')!==0){
    gas('loginCal',ct).then(function(j){if(j&&j.ok){TOKEN=j.token;lsS('bus_token',TOKEN);setMe(j);afterLogin(false,true);}else render();}).catch(function(){render();});
    return;
  }
  render();
}
function uid(){return M&&M.me?(M.me.username||M.me.gid||''):'';}
/* 上次的清單先顯示（今天存的才用），後台回來再更新 */
function cacheLists(){['mine','drvList'].forEach(function(fn){var c=null;try{c=JSON.parse(ls('bus_d_'+fn+'_'+uid())||'null');}catch(e){}
  if(c&&c.d===tw().day){if(fn==='mine'&&!DATA.mine)DATA.mine=c.l;if(fn==='drvList'&&!DATA.drv){DATA.drv=c.l;DATA.sent=c.s||{};}}});}
function afterLogin(first,fresh){
  cacheLists();
  if(!PAGE)PAGE=M.me.isDriver?'drv':'book';
  if(location.hash==='#mine')PAGE='mine';
  render();load();pushRefresh();
  if(!fresh&&PAGE!=='book')gas('me',TOKEN).then(function(j){if(j&&j.ok){var was=M&&M.me;setMe(j);if(!was||was.isDriver!==j.me.isDriver||was.isAdmin!==j.me.isAdmin||was.needPw!==j.me.needPw)render();}}).catch(function(){});
  if(first&&M.me.kind==='g'&&!standalone())setTimeout(function(){a2hsOpen();},400);
}

/* ── 畫面 ── */
function render(){
  var hd=document.querySelector('.hd');
  if(!TOKEN||!M){hd.style.display='none';$('nav').style.display='none';$('bd').innerHTML=loginHTML();return;}
  hd.style.display='';
  var me=M.me;
  $('hu').innerHTML='<i>'+he(me.name.slice(0,1))+'</i>'+he(me.name)+(me.ext?' #'+he(me.ext):'')+(me.kind==='g'?'　'+he(me.gid):'')+(me.isDriver?'　（司機）':'')+(EMBED&&me.kind==='u'?'':'<a href="#" onclick="logoutAsk();return false">登出</a>');
  if(!me.ext&&me.kind==='g'){$('ht').textContent='娃娃車預約';$('nav').style.display='none';$('bd').innerHTML=extHTML();return;}
  var act=(DATA.mine||[]).filter(function(b){return (b.st==='w'||b.st==='ok')&&(b.kind==='call'||!departed(b.day,b.slot));}).length;
  ACT=act;
  var navs=[];   // 一般人只有預約頁（我的預約在右上角按鈕）；司機／管理員才有上方分頁
  if(me.isDriver||me.isAdmin)navs=[['drv','🚐','娃娃車',(DATA.drv||[]).filter(function(b){return b.st==='w';}).length],['book','➕','預約',0],['qr','▦','QR code',0]];
  if(me.isAdmin)navs.push(['adm','⚙️','管理',0]);

  $('nav').innerHTML=navs.map(function(x){return '<span class="'+(PAGE===x[0]||(PAGE==='mine'&&x[0]==='book')?'on':'')+'" onclick="go(\''+x[0]+'\')"><span class="ic">'+x[1]+'</span>'+x[2]+(x[3]?'<sup>'+x[3]+'</sup>':'')+'</span>';}).join('');
  $('ht').textContent='娃娃車預約';
  var y=window.scrollY;
  $('bd').innerHTML=PAGE==='book'?bookHTML():PAGE==='mine'?mineHTML():PAGE==='drv'?drvHTML():PAGE==='qr'?qrHTML():PAGE==='adm'?admHTML():'';

}
function go(p){PAGE=p;window.scrollTo(0,0);render();load();}
function logoutAsk(){sheet('<b style="font-size:17px">登出娃娃車？</b><p class="hint">'+(M&&M.me.kind==='g'?'下次輸入工號就能再進來。':'下次輸入工號就能再進來。')+'</p><button class="btn r" onclick="closeSheet();logout()">登出</button><button class="btn g" style="margin-top:8px" onclick="closeSheet()">取消</button>');}
/* 取資料 */
function load(){
  if(!TOKEN||!M||(!M.me.ext&&M.me.kind==='g'))return;
  var fn=PAGE==='drv'?'drvList':PAGE==='adm'?'admLoad':(PAGE==='mine'||PAGE==='book')?'mine':'';
  if(!fn)return;
  var p=PAGE;
  gas(fn,TOKEN).then(function(j){
    if(!j.ok){toast(j.error||'讀取失敗');return;}
    if(j.me)setMe(j);
    if(fn==='drvList'){DATA.drv=j.list;DATA.sent=j.sent;DATA.push=j.push;}
    try{if(fn==='drvList'||fn==='mine')lsS('bus_d_'+fn+'_'+uid(),JSON.stringify({d:tw().day,l:j.list,s:j.sent||null}));}catch(e){}
    if(fn==='mine'){DATA.mine=j.list;DATA.push=j.push;}
    if(fn==='admLoad')DATA.adm=j;
    if(PAGE===p&&!$('ov').classList.contains('on')&&!typing())render();
  }).catch(function(e){toast(e.message);});
}
function typing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
setInterval(function(){if(document.visibilityState==='visible')load();},30000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){load();pushRefresh();}});

/* ── 登入 ── */

  var h='<div style="text-align:center;margin:26px 0 6px"><img src="icon-192.png" style="width:76px;height:76px;border-radius:20px;box-shadow:0 6px 16px rgba(212,71,14,.3)" alt="">'
    +'<div style="font-size:21px;font-weight:800;margin-top:12px">娃娃車預約</div><div class="hint" style="text-align:center">從'+HOME+'出發・每天上午 10:00、下午 2:00<br>週六日、國定假日停駛</div></div>';

  }else{
    h+='<div class="card" style="margin-top:12px"><div style="font-weight:700">第一次使用</div><div class="hint" style="margin:2px 0 0">工號 '+he(LG.gid)+'，請輸入姓名和分機</div>'

function lgChk(){var b=$('lgb');if(b)b.disabled=LG.busy||!(LG.name.trim()&&LG.ext.trim());}
function loginOk(j,first){TOKEN=j.token;lsS('bus_token',TOKEN);setMe(j);LG={step:1,gid:'',name:'',ext:'',u:'',p:'',err:'',busy:false};PAGE='';toast('歡迎，'+j.me.name);afterLogin(first,true);}
function gidGo(){
  if(LG.busy)return;LG.busy=true;LG.err='';render();
  gas('loginGid',LG.gid).then(function(j){LG.busy=false;
    if(!j.ok){LG.err=j.error;render();return;}
    if(j.need){LG.step=2;render();setTimeout(function(){var f=$('lgn');if(f)f.focus();},50);return;}
    loginOk(j,false);
  }).catch(function(e){LG.busy=false;LG.err=e.message;render();});
}
function regGo(){
  if(LG.busy)return;LG.busy=true;render();
  gas('regGid',LG.gid,LG.name.trim(),LG.ext.trim()).then(function(j){LG.busy=false;
    if(!j.ok){LG.err=j.error;render();return;}
    loginOk(j,true);
  }).catch(function(e){LG.busy=false;LG.err=e.message;render();});
}
/* 行事曆帳號沒有分機（通訊錄沒填）：問一次 */

/* 用工號登入的司機／管理員：輸入行事曆密碼才開司機、管理功能（只有工號的話任何人都打得出來） */

function chk(){var b=$('go');if(b)b.disabled=BUSY||!F.slot||(F.dest==='其他'&&!F.other.trim());}
function tap3(){var t=Date.now();TAPS=TAPS.filter(function(x){return t-x<800;});TAPS.push(t);if(TAPS.length>=3){TAPS=[];CALLON=true;toast('🚨 已開啟臨時叫車');render();}}
function bookGo(trunk){
  if(BUSY)return;closeSheet();

  h+=pick('目的地','dest','destO',['紅樓','紫軒','赤城','其他'],'例如：捷運新北產業園區站');

    +(C.when==='at'?'<input class="fld" type="time" style="margin-top:8px" value="'+he(C.time)+'" oninput="C.time=this.value;cchk()">':'');

/* 印章：郵戳式（上弧 SGS、中間橫框「確認／作廢」、上方日期、下弧司機名字或「已取消」） */
function stampSVG(ok,date,who,rot){
  var c=ok?'#1d8148':'#cf2323';
  return '<svg class="stamp" viewBox="0 0 120 120" style="transform:rotate('+rot+'deg);color:'+c+'"><g filter="url(#ink)" fill="currentColor" stroke="currentColor">'
   +'<circle cx="60" cy="60" r="55" fill="none" stroke-width="4.5"/><circle cx="60" cy="60" r="49" fill="none" stroke-width="1.5"/>'
   +'<text font-size="14" font-weight="900" stroke="none" letter-spacing="5" text-anchor="middle"><textPath href="#arcT" startOffset="50%">SGS</textPath></text>'
   +'<text font-size="11" font-weight="800" stroke="none" letter-spacing="2" text-anchor="middle" dominant-baseline="hanging"><textPath href="#arcB" startOffset="50%">'+he(who||'')+'</textPath></text>'
   +'<rect x="8" y="45" width="104" height="30" fill="none" stroke-width="3"/>'
   +'<text x="60" y="68" font-size="22" font-weight="900" stroke="none" text-anchor="middle" letter-spacing="6">'+(ok?'確認':'作廢')+'</text>'
   +'<text x="60" y="40" font-size="8.5" font-weight="800" stroke="none" text-anchor="middle" letter-spacing="1">'+he(date||'')+'</text></g></svg>';
}
function stDate(s){var d=String(s||'').slice(0,10);return d?d.replace(/-/g,'.'):'';}
function mineHTML(){
  var h='<div class="hrow"><button class="back" onclick="go(\'book\')">‹ 返回預約</button></div><div class="hrow" style="margin-top:4px"><div class="h2">我的預約</div></div>'+unlockCard()+pushCard();
  var l=DATA.mine;
  if(!l)return h+LD();
  if(!l.length)return h+'<div class="empty">還沒有預約</div>';
  // 排序：還沒搭的照日期時間（最近的在上）→ 已取消／不接單／已過的放後面
  var key=function(b){var act=(b.st==='w'||b.st==='ok')&&(b.kind==='call'||!departed(b.day,b.slot));return (act?'0':'1')+b.day+(b.kind==='call'?(b.at==='asap'?'00:00':b.at):b.slot);};
  l=l.slice().sort(function(a,b){var x=key(a),y=key(b);return x<y?-1:x>y?1:0;});
  return h+l.map(function(b){
    var call=b.kind==='call',live=(b.st==='w'||b.st==='ok')&&(call||!departed(b.day,b.slot)),x=b.st==='x';
    var frm=call?b.frm:(b.trip==='back'?b.dest:HOME),to=call?b.dest:(b.trip==='back'?HOME:b.dest),rt=!call&&b.trip==='rt';
    var trip=call?'🚨 臨時叫車':(b.trip==='rt'?'來回':b.trip==='back'?'回程':'去程');
    var tm=call?(b.at==='asap'?'盡快':b.at):b.slot;
    var part=b.cx&&!x?String(b.cx).split('：')[0]:'';   // 來回只取消一趟：只寫「已取消回程」，不寫原因
    var foot=x?'<span>已取消</span>'
      :b.st==='ok'?'<span>司機 <b>'+he(b.drv)+'</b>'+(b.drvExt?' #'+he(b.drvExt):'')+(call&&b.eta?'・<b style="color:var(--ok)">約 '+he(b.eta)+' 分鐘到</b>':'')+'</span>'
      :b.st==='no'?'<span style="color:var(--err)">司機不接單・'+he(b.why)+'</span>':'<span></span>';
    return '<div class="tk5'+(x?' void':'')+'"><div class="bar"><span>'+dlab(b.day)+'</span><small>'+trip+'・'+b.n+' 人'+(b.trunk?'・後車廂':'')+'</small></div><div class="in">'
      +(b.last&&!x?'<div class="bc">📣 '+he(b.last)+' <span style="font-weight:400;opacity:.85">'+he(b.lastAt||'')+'</span></div>':'')
      +'<div class="sp"><span class="tm">'+he(tm)+'</span>'+(b.st==='w'?'<span class="st w">等待司機確認</span>':'')+'</div>'
      +'<div class="sp" style="margin-top:6px"><span class="lab">出發</span><span class="lab">目的地</span></div>'
      +'<div class="rw"><span class="pl">'+pl(frm)+'</span><div class="road">'+(rt?'<i class="van"></i><i class="van R"></i>':'<i class="van R"></i>')+'</div><span class="pl">'+pl(to)+'</span></div>'
      +(b.memo?'<div class="lab" style="margin-top:6px">備註：'+he(b.memo)+'</div>':'')+(part?'<div class="lab" style="margin-top:4px">'+he(part)+'</div>':'')
      +'<div class="ft">'+foot+(live?'<button class="cxb" onclick="cancelOpen(\''+b.id+'\')">取消預約</button>':'')+'</div></div>'
      +(b.st==='ok'?stampSVG(true,stDate(b.upd),b.drv,-14):x?stampSVG(false,stDate(b.upd),'已取消',10):'')+'</div>';
  }).join('');
}

function admList(l){return l.slice(0,60).map(function(x){return '<div class="li"><span style="flex:1">'+he(x.n)+' <span class="hint">'+he(x.u)+'</span></span><button class="sw'+(x.drv?' on':'')+'" onclick="drvSet(\''+he(x.u)+'\','+(!x.drv)+')"></button></div>';}).join('')||'<div class="hint">找不到</div>';}
function admPaint(){var a=DATA.adm,q=ADQ.trim();$('adl').innerHTML=admList(a.accts.filter(function(x){return x.drv||!q||x.n.indexOf(q)>=0||x.u.indexOf(q)>=0;}));}
function admDone(p,msg){p.then(function(j){if(!j.ok){toast(j.error,3000);return;}DATA.adm=j;toast(msg);render();}).catch(function(e){toast(e.message);});}
function drvSet(u,on){admDone(gas('admDriver',TOKEN,u,on),on?'已設為司機':'已取消司機');}
function offAdd(){var d=$('ofd').value,n=$('ofn').value.trim();if(!d){toast('請選日期');return;}admDone(gas('admOff',TOKEN,d,n||'停駛',true),'已加入停駛日');}
function offDel(d){admDone(gas('admOff',TOKEN,d,'',false),'已刪除');}

/* ── 通知（推播） ── */
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}
function pushReady(){return !!FB_CFG.appId;}
function pushCard(){
  // 有行事曆帳號、行事曆已經開了通知（或在行事曆裡打開）：通知會從行事曆跳出，不用再提醒
  if(M&&M.me.kind==='u'&&(EMBED||M.me.calPush||ls('espc_push')))return '';
  if(!pushReady())return '';
  var on=pushSupported()&&Notification.permission==='granted'&&ls('bus_push');
  if(on)return '';
  if(isIOS()&&!standalone())return '<div class="note" style="margin:10px 0">🔔 iPhone 要先把這頁<b>加入主畫面</b>，才收得到司機回覆和出發提醒。<a href="#" style="color:var(--accT);font-weight:700" onclick="a2hsOpen();return false">看怎麼加</a></div>';
  if(!pushSupported())return '<div class="note" style="margin:10px 0">這個瀏覽器不支援通知。<a href="#" style="color:var(--accT);font-weight:700" onclick="a2hsOpen();return false">加入主畫面</a>後再打開試試</div>';
  if(Notification.permission==='denied')return '<div class="note red" style="margin:10px 0">通知被封鎖了，請到手機「設定」裡允許娃娃車通知</div>';
  return '<div class="note" style="margin:10px 0;display:flex;align-items:center;gap:10px"><span style="flex:1">🔔 開啟通知，司機回覆、出發前 3 分鐘、發車廣播會跳出來'+(M&&M.me.kind==='u'?'<br><span style="color:var(--tx3)">沒開的話，會改從行事曆 App 通知</span>':'')+'</span><button class="chip s" style="background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700" id="pbtn" onclick="pushOn()">開啟</button></div>';
}
var FB_READY=null;
function fbMessaging(){
  if(!FB_READY){var base='https://www.gstatic.com/firebasejs/10.14.1/';
    FB_READY=loadJS(base+'firebase-app-compat.js').then(function(){return loadJS(base+'firebase-messaging-compat.js');})
      .then(function(){if(!firebase.apps.length)firebase.initializeApp(FB_CFG);return firebase.messaging();});
    FB_READY.catch(function(){FB_READY=null;});}
  return FB_READY;
}
function swReg(){return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});}
function pushOn(){
  var b=$('pbtn');if(b){b.disabled=true;b.textContent='…';}
  (Notification.permission==='granted'?Promise.resolve('granted'):Notification.requestPermission()).then(function(p){
    if(p!=='granted')throw new Error('沒有取得通知權限');return swReg();
  }).then(function(reg){return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});});
  }).then(function(tok){if(!tok)throw new Error('取不到推播代碼');
    return gas('savePush',TOKEN,tok,true).then(function(r){if(!r.ok)throw new Error(r.error);lsS('bus_push',tok);lsS('bus_push_day',tw().day);});
  }).then(function(){toast('已開啟通知');render();}).catch(function(e){toast(e.message||'開啟失敗',3000);render();});
}
/* 每次打開（最多每小時一次）：推播代碼換了就更新後台 */
var PUSH_AT=0;
function pushRefresh(){
  if(!TOKEN||!pushReady()||!pushSupported()||Notification.permission!=='granted'||!ls('bus_push'))return;
  if(Date.now()-PUSH_AT<3600000)return;PUSH_AT=Date.now();
  swReg().then(function(reg){return reg.pushManager.getSubscription().then(function(sub){
    if(!sub){lsD('bus_push');render();return;}
    return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});}).then(function(tok){
      var old=ls('bus_push');
      if(tok&&(tok!==old||ls('bus_push_day')!==tw().day))gas('savePush',TOKEN,tok,true).then(function(r){if(r.ok){lsS('bus_push',tok);lsS('bus_push_day',tw().day);}});
      if(tok&&old&&old!==tok)gas('savePush',TOKEN,old,false).catch(function(){});
    });
  });}).catch(function(){});
}
/* 加入主畫面教學（第一次用工號登入會自動跳出） */
var A2={os:''};
function a2hsOpen(os){A2.os=os||A2.os||(/Android/i.test(navigator.userAgent)?'and':'ios');
  var step=function(n,t,ic){return '<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)"><span style="width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--accT);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+n+'</span><span style="flex:1;font-size:14px;line-height:1.5">'+t+'</span>'+(ic?'<span style="font-size:20px">'+ic+'</span>':'')+'</div>';};
  var ios=step(1,'按 Safari 下方的<b>「分享」</b>按鈕','⬆️')+step(2,'往下滑，點<b>「加入主畫面」</b>','➕')+step(3,'右上角按<b>「新增」</b>','✅')+step(4,'從主畫面打開<b>娃娃車預約</b>，在「我的預約」按<b>「開啟通知」</b>','🔔');
  var and=step(1,'按 Chrome 右上角的<b>「⋮」</b>','⋮')+step(2,'點<b>「加到主畫面」</b>或<b>「安裝應用程式」</b>','➕')+step(3,'按<b>「新增／安裝」</b>','✅')+step(4,'打開後在「我的預約」按<b>「開啟通知」</b>','🔔');
  sheet('<div style="text-align:center"><div style="font-size:34px">🔔</div><b style="font-size:18px">加入主畫面，才收得到通知</b>'
    +'<p class="hint" style="text-align:center;margin-top:6px">司機接單／不接單、出發前 3 分鐘提醒、發車廣播，都要把這頁加入主畫面才會跳出來</p></div>'
    +'<div class="seg" style="margin:12px 0 4px"><button class="'+(A2.os==='ios'?'on':'')+'" onclick="a2hsOpen(\'ios\')">iPhone</button><button class="'+(A2.os==='and'?'on':'')+'" onclick="a2hsOpen(\'and\')">Android</button></div>'
    +(A2.os==='ios'?ios:and)+'<button class="btn" onclick="closeSheet()">我知道了</button>');
}
/* 點通知打開：service worker 叫畫面重新整理 */
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){var d=e.data||{};if(d.type==='push'||d.type==='open'){if(d.url&&d.url.indexOf('#mine')>=0&&M)PAGE='mine';load();}});

init();
</script>
