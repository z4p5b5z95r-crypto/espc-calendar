<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ESPC 監測行程</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-v2.png">
<meta name="theme-color" content="#F36F21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESPC 行程">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* SGS 企業色：橘 #F36F21（主）／灰 #77787B（輔）／白 */
:root{
  --bg:#f4f4f5; --card:#ffffff; --card2:#ebebec; --line:#e2e2e4;
  --tx:#1c1c1e; --tx2:#5c5d61; --tx3:#98989c;
  --brand:#F36F21;          /* SGS 品牌橘：大面積識別用 */
  --acc:#C44E06;            /* 填色：按鈕、膠囊底（白字對比 4.7:1）*/
  --accTx:#ffffff;
  --accT:#B54705;           /* 文字／圖示用（淺底對比 4.9:1）*/
  --tint:rgba(243,111,33,.12);
  --err:#c62828; --errBg:rgba(198,40,40,.09);
  --warn:#a85600; --warnBg:rgba(243,111,33,.13);
  --ok:#1e7a44;             /* 效期內綠（淺底對比 4.8:1）*/
  --r:14px; --sh:0 8px 24px rgba(0,0,0,.12);
  --gl:rgba(255,255,255,.62);        /* 玻璃底 */
  --glStrong:rgba(255,255,255,.78);  /* 需要更實的玻璃 */
  --glLine:rgba(255,255,255,.7);     /* 玻璃邊緣高光 */
  --blur:saturate(180%) blur(20px);
}
html[data-theme="dark"]{
  --bg:#1a1a1c; --card:#242427; --card2:#2d2d31; --line:#343438;
  --tx:#fafafa; --tx2:#a8a8ad; --tx3:#77787B;   /* SGS 灰 */
  --brand:#F36F21;
  --acc:#C44E06;            /* 按鈕填色，白字對比 4.7:1 */
  --accTx:#ffffff;
  --accT:#FF8C4D;           /* 深底上提亮（對比 7.5:1）*/
  --tint:rgba(243,111,33,.2);
  --err:#ef5350; --errBg:rgba(239,83,80,.16);
  --warn:#ffb74d; --warnBg:rgba(255,183,77,.14);
  --ok:#5ed18f;             /* 深底上提亮 */
  --sh:0 8px 24px rgba(0,0,0,.4);
  --gl:rgba(38,38,42,.6);
  --glStrong:rgba(38,38,42,.78);
  --glLine:rgba(255,255,255,.1);
  --blur:saturate(180%) blur(20px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;}
/* 背景色團：讓毛玻璃有東西可折射 */
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:-2;
  pointer-events:none;filter:blur(70px);opacity:.5;}
body::before{width:60vw;height:60vw;max-width:420px;max-height:420px;
  background:rgba(243,111,33,.5);top:-14vh;right:-16vw;}
body::after{width:55vw;height:55vw;max-width:380px;max-height:380px;
  background:rgba(119,120,123,.42);bottom:-12vh;left:-18vw;}
html[data-theme="dark"] body::before{opacity:.32;}
html[data-theme="dark"] body::after{opacity:.3;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;color:inherit;}
a{color:var(--accT);text-decoration:none;}
input,select,textarea{font-size:16px;}
::-webkit-scrollbar{width:0;height:0;}

/* ── 通用元件 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:999px;padding:11px 20px;font-size:14px;font-weight:500;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);min-height:44px;transition:.15s;}
.btn:active{transform:scale(.97);}
.btn-p{background:var(--acc);color:var(--accTx);border-color:var(--acc);font-weight:600;backdrop-filter:none;}
.btn-d{color:var(--err);border-color:var(--err);}
.btn-sm{padding:8px 15px;font-size:13px;min-height:38px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.5;}
.fld{width:100%;background:var(--glStrong);backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:999px;
  padding:12px 16px;font-size:16px;outline:none;min-height:46px;}
.fld:focus{border-color:var(--acc);}
/* 面板開啟時鎖住背景，避免鍵盤彈出把整頁推走 */
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden;}
/* 證照卡片 */
.cbox{background:var(--glStrong);border:1px solid var(--line);
  border-radius:16px;padding:12px 13px;}
.cbh{display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:9px;}
.cbh span{font-size:12px;color:var(--tx3);}
.cbh button{font-size:12px;color:var(--err);padding:3px 8px;border-radius:8px;}
.addc{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px dashed var(--line);border-radius:14px;padding:11px;
  font-size:14px;color:var(--accT);background:transparent;}
.addc:active{background:var(--tint);}
/* iOS 的日期欄位預設會置右且高度不一致，這裡拉回跟其他欄位一樣 */
input[type="date"].fld{-webkit-appearance:none;appearance:none;
  text-align:left;display:block;line-height:22px;height:46px;}
input[type="date"].fld::-webkit-date-and-time-value{text-align:left;margin:0;}
input[type="date"].fld::-webkit-calendar-picker-indicator{margin-left:auto;opacity:.55;}
select.fld{appearance:none;padding-right:38px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
.lb{font-size:12px;color:var(--tx3);margin:0 0 7px 6px;}
.sec{font-size:12px;color:var(--tx3);margin:20px 6px 9px;}
.sec:first-child{margin-top:8px;}
.card{background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.muted{color:var(--tx2);font-size:13px;}
.hint{font-size:12px;color:var(--tx3);line-height:1.7;}
.note{background:var(--warnBg);color:var(--warn);border-radius:var(--r);padding:11px 14px;
  font-size:13px;line-height:1.7;margin-bottom:10px;}
.note.bad{background:var(--errBg);color:var(--err);}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.load{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--tx3);font-size:13px;}
.empty{text-align:center;color:var(--tx3);font-size:14px;padding:36px 20px;}
.sw{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.18s;}
.sw.on{background:var(--acc);}
.sw::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:.18s;}
.sw.on::after{transform:translateX(19px);}

/* ── 登入：淺灰底 + 白卡 + 橘色點綴 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:26px 22px;
  padding-top:calc(26px + env(safe-area-inset-top));
  padding-bottom:calc(26px + env(safe-area-inset-bottom));}
.lwrap{width:100%;max-width:366px;position:relative;}
.lth{position:absolute;top:-8px;right:-4px;width:38px;height:38px;border-radius:999px;
  color:var(--tx3);display:flex;align-items:center;justify-content:center;}
.lth:active{background:var(--card2);}
.lhead{text-align:center;margin-bottom:22px;}

/* 玻璃標記：灰白半透明玻璃，內含橘色日曆 */
.glass{position:relative;width:88px;height:88px;margin:0 auto 18px;
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;isolation:isolate;
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.34));
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 12px 30px rgba(28,28,30,.13),
             0 2px 6px rgba(28,28,30,.07),
             inset 0 1px 0 rgba(255,255,255,.95),
             inset 0 -10px 18px rgba(255,255,255,.35);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);}
/* 背後的色團，讓玻璃有東西可折射 */
.blob{position:absolute;border-radius:50%;filter:blur(16px);z-index:-1;}
.b1{width:64px;height:64px;background:rgba(243,111,33,.5);top:-14px;left:-10px;}
.b2{width:54px;height:54px;background:rgba(119,120,123,.42);bottom:-16px;right:-8px;}
/* 上緣高光 */
.glass::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 42%);}
.logo{position:relative;z-index:1;color:var(--brand);display:flex;
  filter:drop-shadow(0 2px 4px rgba(243,111,33,.3));}
.logo svg{width:48px;height:48px;}
html[data-theme="dark"] .glass{
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border-color:rgba(255,255,255,.18);
  box-shadow:0 12px 30px rgba(0,0,0,.45),
             inset 0 1px 0 rgba(255,255,255,.28),
             inset 0 -10px 18px rgba(255,255,255,.05);}
html[data-theme="dark"] .glass::after{
  background:linear-gradient(160deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 44%);}

.lhead h1{font-size:25px;font-weight:700;letter-spacing:-.01em;}
.lform{background:var(--card);border-radius:20px;padding:19px 17px;
  box-shadow:0 2px 12px rgba(28,28,30,.06);}
.lf{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:0 6px 0 15px;margin-bottom:10px;transition:border-color .15s;}
.lf:focus-within{border-color:var(--brand);}
.lfi{color:var(--tx3);display:flex;flex-shrink:0;}
.lf:focus-within .lfi{color:var(--accT);}
.lf input{flex:1;min-width:0;background:none;border:none;outline:none;
  padding:14px 0;font-size:16px;color:var(--tx);}
.lf input::placeholder{color:var(--tx3);}
.lfe{width:36px;height:36px;border-radius:999px;color:var(--tx3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lfe.on{color:var(--accT);}
.lerr{color:var(--err);font-size:13px;min-height:20px;padding:2px 0 4px 8px;line-height:1.5;}
.lfoot{text-align:center;font-size:12px;color:var(--tx3);margin-top:18px;line-height:1.8;}

/* ── 外框 ── */
#app{display:none;flex-direction:column;min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom));}
.bar{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);
  background:var(--gl);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glLine);}
.who{display:flex;align-items:center;gap:9px;padding:11px 16px 0;}
.avt{width:26px;height:26px;border-radius:999px;background:var(--brand);color:var(--accTx);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.who-n{font-size:12px;color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 13px 10px;}
.ttl{font-size:20px;font-weight:600;padding:3px 5px;border-radius:999px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.ttl.tap::after{content:" ▾";font-size:12px;color:var(--tx3);font-weight:400;}
/* 手機用滑的換月，箭頭只在桌機出現 */
.ib.navm{display:none;}          /* 比 .ib 多一層，才蓋得過它的 display */
.rb{display:flex;gap:5px;align-items:center;}
.ib{background:var(--card2);width:36px;height:36px;border-radius:999px;font-size:15px;
  color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ib:active{transform:scale(.94);}
.ib svg,.who svg{display:block;}
.ib.w{width:auto;padding:0 14px;font-size:13px;gap:5px;}
.ib.act{background:var(--tint);color:var(--accT);}
.bdg{background:var(--acc);color:var(--accTx);font-size:10px;min-width:17px;height:17px;
  border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600;}
.pwrap{flex:1;position:relative;overflow-x:hidden;}
#page{padding:0 12px;}
/* 換月時的舊畫面，疊在上面一起滑走 */
.pghost{position:absolute;left:0;right:0;top:0;padding:0 12px;pointer-events:none;
  will-change:transform;}

/* ── 篩選標籤 ── */
.fchips{display:flex;gap:6px;padding:0 13px 9px;flex-wrap:wrap;}
.fchips:empty{display:none;}
.fc{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:5px 6px 5px 12px;
  border-radius:999px;background:var(--tint);color:var(--accT);}
.fc button{font-size:12px;padding:2px 4px;color:inherit;line-height:1;}

/* ── 月曆 ── */
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--tx3);
  text-align:center;padding:2px 0 5px;}
.dow .sun{color:var(--err);}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cell{height:74px;padding:3px 2px;border-radius:10px;cursor:pointer;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scrollbar-width:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.cell::-webkit-scrollbar{display:none;}
.cell:active{background:var(--card);}
.cell.lp{background:var(--tint);}
/* 行程詳情的日期導覽 */
.lrow.mine{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
/* 行事曆底部：各地區檔案更新時間 */
.rupd{display:flex;flex-wrap:wrap;gap:6px 14px;padding:14px 4px 2px;
  border-top:1px solid var(--line);margin-top:16px;}
.rupd .ru{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx3);}
.rupd .ru b{font-weight:600;color:var(--tx2);}
.rupd .rud{width:6px;height:6px;border-radius:999px;background:var(--tx3);flex-shrink:0;}
.beta{font-size:9.5px;font-weight:700;letter-spacing:.06em;margin-left:7px;
  padding:2px 6px;border-radius:5px;background:var(--tint);color:var(--accT);
  vertical-align:2px;flex-shrink:0;}
.dnav{display:flex;align-items:center;gap:8px;margin:-2px 0 14px;}
.dnav .ib{width:34px;height:34px;font-size:17px;}
.dnt{flex:1;text-align:center;line-height:1.25;}
.dnt b{display:block;font-size:21px;font-weight:600;letter-spacing:-.01em;}
.dnt span{font-size:12px;color:var(--tx3);}
.plist{display:flex;flex-direction:column;gap:4px;}
.cell.tdy{outline:1.5px solid var(--acc);outline-offset:-1px;}
.dn{font-size:11px;text-align:center;line-height:1.35;font-weight:500;}
.dn.out{color:var(--tx3);font-weight:400;}
.dn.sun{color:var(--err);}
.evc{display:block;font-size:9.5px;line-height:1.5;padding:0 4px;margin-top:2px;
  border-radius:999px;color:#fff;overflow:hidden;white-space:nowrap;}
@media(min-width:420px){.cell{height:84px;}.evc{font-size:10.5px;}}
.lgwrap{min-height:76px;}      /* 圖例／載入中／空狀態共用，避免換月時高度跳動 */
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:14px 4px 4px;}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);}
.lgd{width:8px;height:8px;border-radius:999px;flex-shrink:0;}

/* ── 年月選擇 ── */
.pk{position:fixed;left:12px;right:12px;top:calc(96px + env(safe-area-inset-top));z-index:60;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:20px;padding:14px;
  display:none;box-shadow:var(--sh);max-width:400px;margin:0 auto;}
.pk.open{display:block;}
.pkh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.pkh span{font-size:16px;font-weight:600;}
.pkg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.pkb{padding:12px 0;border-radius:999px;background:var(--card2);font-size:14px;}
.pkb.cur{background:var(--acc);color:var(--accTx);font-weight:600;}
.pkb.now{outline:1.5px solid var(--acc);color:var(--accT);font-weight:500;}

/* ── 行程卡 ── */
.ev{background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;
  display:flex;gap:11px;cursor:pointer;}
.ev:active{opacity:.75;}
.evb{width:3.5px;border-radius:999px;flex-shrink:0;}
.evt{font-size:11.5px;font-weight:500;}
.evn{font-size:15px;font-weight:600;line-height:1.35;margin-top:2px;}
.evm{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.6;}
.dbox{min-width:30px;text-align:center;flex-shrink:0;}
.dbox b{font-size:18px;font-weight:600;line-height:1;display:block;}
.dbox span{font-size:10px;color:var(--tx3);}

/* ── 底部列 ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;
  justify-content:space-around;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:var(--gl);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glLine);}
.nb{display:flex;align-items:center;padding:9px;border-radius:999px;color:var(--tx3);font-size:12.5px;}
.nb svg{width:22px;height:22px;}
.nb em{display:none;font-style:normal;font-weight:600;}
.nb.on{background:var(--tint);color:var(--accT);padding:9px 17px 9px 14px;gap:7px;}
.nb.on em{display:inline;}

/* ── 底部面板 ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;align-items:flex-end;}
.ov.open{display:flex;}
.sheet{width:100%;max-width:520px;margin:0 auto;
  background:var(--gl);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glLine);
  border-radius:22px 22px 0 0;padding:16px 16px calc(26px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;animation:up .22s ease;}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.shh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
.shh h3{font-size:19px;font-weight:600;line-height:1.3;}
.kv{font-size:13.5px;color:var(--tx2);}
.kv b{color:var(--tx);font-weight:500;}
.kr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);}
.kr:last-child{border-bottom:none;}
.kr>svg{color:var(--tx3);margin-top:2px;flex-shrink:0;}
.kk{color:var(--tx3);flex-shrink:0;min-width:62px;}
.kvv{flex:1;min-width:0;color:var(--tx);line-height:1.7;word-break:break-word;}
.tsec{background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;}
.tsh{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;
  padding-bottom:7px;border-bottom:1px solid var(--line);}
.tq{background:var(--card2);color:var(--tx2);font-size:11px;font-weight:500;
  border-radius:999px;padding:1px 8px;}
/* ── 行程詳情（窄標籤明細表）── */
.dcard{background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);padding:4px 13px;margin-bottom:8px;}
.dr{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.dr:last-child{border-bottom:none;}
.dk{width:58px;flex-shrink:0;font-size:11.5px;color:var(--tx3);padding-top:2px;line-height:1.5;}
.dv{flex:1;min-width:0;font-size:13.5px;color:var(--tx);line-height:1.65;word-break:break-word;}
.dv a{color:var(--accT);}
.dph{font-size:11.5px;color:var(--tx3);margin-left:4px;}
.pil{display:inline-block;font-size:11px;padding:2px 8px;border-radius:7px;
  background:var(--card2);color:var(--tx2);margin:0 4px 4px 0;}
.qb{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;
  background:var(--tint);color:var(--accT);white-space:nowrap;flex-shrink:0;}
.dhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
.dsub{font-size:11.5px;color:var(--tx3);margin:7px 0 4px 2px;}
/* 當天行程頁籤 */
/* 換月／換日的滑動動畫 */
@keyframes slInR{from{transform:translateX(34%);opacity:.3}to{transform:none;opacity:1}}
@keyframes slInL{from{transform:translateX(-34%);opacity:.3}to{transform:none;opacity:1}}
.sl-in-r{animation:slInR .3s cubic-bezier(.28,.78,.32,1);}
.sl-in-l{animation:slInL .3s cubic-bezier(.28,.78,.32,1);}
.pcard{background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.pcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
.pchd{display:flex;gap:11px;align-items:center;width:100%;padding:12px 13px;text-align:left;background:none;}
.pchd:active{opacity:.75;}
.pbar{width:3.5px;border-radius:999px;align-self:stretch;flex-shrink:0;min-height:30px;}
.pnm{display:block;font-size:15px;font-weight:600;line-height:1.3;}
.pno{font-size:12px;font-weight:400;color:var(--tx3);margin-left:6px;}
.pty{display:block;font-size:12.5px;font-weight:500;margin-top:3px;}
.pchev{display:inline-flex;color:var(--tx3);flex-shrink:0;transition:transform .18s;}
.pchev.on{transform:rotate(90deg);color:var(--accT);}
.pbody{border-top:1px solid var(--line);padding:6px 13px 10px;}
.pbody .dcard{background:none;border:none;border-radius:0;padding:0;margin-bottom:0;
  backdrop-filter:none;-webkit-backdrop-filter:none;}
/* 每個測項獨立一張小卡 */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:9px;}
.tch{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 12px;font-size:12px;font-weight:600;background:var(--tint);}
.tcb{padding:2px 12px 7px;}
/* 共用資訊 */
.shbox{margin-top:11px;padding-top:9px;border-top:1.5px dashed var(--line);}
.shh2{font-size:11px;color:var(--tx3);margin:0 0 3px 2px;}
.fold{display:flex;align-items:center;gap:8px;width:100%;margin:18px 0 4px;
  padding:11px 14px;border-radius:var(--r);text-align:left;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);font-size:14px;font-weight:500;color:var(--tx);}
.fold:active{opacity:.75;}
.foldn{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:400;}
.foldc{display:inline-flex;color:var(--tx3);transition:transform .18s;}
.foldc.on{transform:rotate(90deg);color:var(--accT);}
.tyg{display:flex;align-items:center;justify-content:space-between;width:100%;
  margin:13px 0 7px;padding:0 6px;font-size:11.5px;color:var(--tx3);background:none;}
.tyg:active{opacity:.6;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.pcell{background:var(--glStrong);border:1px solid var(--line);border-radius:11px;
  padding:10px 4px;font-size:12.5px;text-align:center;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pcell.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);
  color:var(--accT);font-weight:600;}
.pcell small{display:block;font-size:10px;color:var(--tx3);font-weight:400;margin-top:1px;}
.etab{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.etab::-webkit-scrollbar{display:none;}
.et{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--card2);
  color:var(--tx2);white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;}
.et b{font-size:10px;font-weight:700;min-width:15px;height:15px;border-radius:999px;
  background:var(--line);color:var(--tx2);display:inline-flex;align-items:center;
  justify-content:center;padding:0 3px;}
.et.on b{background:rgba(255,255,255,.28);color:var(--accTx);}
.et.on{background:var(--acc);color:var(--accTx);font-weight:600;}
.opts{display:flex;flex-wrap:wrap;gap:7px;}
.ob svg{margin-right:-1px;}
.ob{font-size:13px;padding:9px 15px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;color:var(--tx2);}
.ob.on{background:var(--acc);color:var(--accTx);border-color:var(--acc);font-weight:500;}

/* ── 清單 ── */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 15px;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);margin-bottom:7px;}
.pavw{position:relative;flex-shrink:0;width:38px;padding-top:17px;}
/* 職安帽用 emoji；因無法改色，效期狀態以右上角小圓點表示 */
.hat{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:3px;
  font-size:1em;line-height:1;margin-left:5px;vertical-align:-2px;flex-shrink:0;padding:0;}
.hat .hdot{top:-2px;right:-5px;width:7px;height:7px;border-width:1.2px;}
/* 內文用的小圖案：跟著文字大小走 */
.mki{width:1.25em;height:1.25em;display:block;flex-shrink:0;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
.mke{font-size:1.15em;line-height:1;display:block;flex-shrink:0;}
.mkw{width:2em;height:1.3em;display:block;flex-shrink:0;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
.hat svg:not(.mki){width:1.05em;height:1.05em;color:var(--accT);}
.hat:active{transform:scale(.88);}
.hdot{position:absolute;top:0;right:-4px;width:9px;height:9px;border-radius:999px;
  border:1.5px solid var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.14);}
.hdot.good{background:#2eaa5e;}   /* 效期內 */
.hdot.warn{background:#f5a623;}   /* 不滿 3 個月 */
.hdot.bad{background:#e53935;}    /* 已逾期 */
.pav{width:38px;height:38px;border-radius:999px;background:var(--card2);color:var(--tx2);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.pavhat{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:2;
  font-size:38px;line-height:1;padding:0;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.32));}
.pavhat:active{transform:translateX(-50%) scale(.9);}
.pavhat .hdot{top:15px;right:2px;width:10px;height:10px;}
/* 有防毒面罩時帽子往上讓一點，露出面罩 */
.pavhat.up{top:-6px;}
.pavhat.up .hdot{top:7px;}
/* 防毒面罩：罩住整個圓圈 */
.pavmask{position:absolute;top:18px;left:-1px;width:40px;height:40px;z-index:2;
  pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
/* 沒戴帽子時的效期燈號 */
.pavdot{position:absolute;top:17px;right:-1px;width:10px;height:10px;border-radius:999px;
  border:1.5px solid var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.14);z-index:7;}
.pavdot.good{background:#2eaa5e;}
.pavdot.warn{background:#f5a623;}
.pavdot.bad{background:#e53935;}
/* 儲槽：圓圈左側 */
.pavtank{position:absolute;left:-9px;bottom:-1px;font-size:21px;line-height:1;padding:0;z-index:5;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
.pavtank:active{transform:scale(.9);}
/* 漁船：圓圈正下方 */
.pavship{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:56px;height:34px;z-index:5;pointer-events:none;
  filter:drop-shadow(0 1.5px 2.5px rgba(0,0,0,.28));}
/* 急救箱：右下角，壓在最上層 */
.pavkit{position:absolute;right:-5px;bottom:-3px;width:21px;height:21px;z-index:6;
  pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.32));}
.tag{font-size:11px;padding:4px 11px;border-radius:999px;background:var(--card2);color:var(--tx2);white-space:nowrap;}
.tag.g{background:var(--tint);color:var(--accT);}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);padding:14px 15px;margin-bottom:7px;
  width:100%;font-size:15px;text-align:left;}
.link svg{color:var(--tx3);flex-shrink:0;}
.link:active{opacity:.7;}

/* ── 上傳 ── */
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;cursor:pointer;}
.drop:active,.drop.over{border-color:var(--acc);background:var(--tint);}
.drop svg{color:var(--tx3);margin:0 auto;}
#fi{display:none;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{background:var(--card2);padding:9px 11px;text-align:left;font-weight:500;
  color:var(--tx2);white-space:nowrap;font-size:11.5px;}
.tbl td{padding:9px 11px;border-top:1px solid var(--line);white-space:nowrap;}
.scroll{overflow-x:auto;border-radius:var(--r);background:var(--card);}

/* ── 提示 ── */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.ts{background:var(--tx);color:var(--bg);padding:13px 18px;border-radius:14px;font-size:13.5px;
  box-shadow:var(--sh);animation:up .2s ease;line-height:1.6;text-align:center;}
.ts.ok{background:var(--acc);color:var(--accTx);}
.ts.no{background:var(--err);color:#fff;}


/* ══════════ 桌機版（≥ 900px）══════════
   導覽列移到最上方，內容置中限寬，行事曆格子加高 */
.glist{display:block;}
@media(min-width:900px){
  /* 左右留白：內容最寬 1180px，兩側自動撐開 */
  :root{--gut:max(24px,calc((100vw - 1180px) / 2));}
  #app{padding-bottom:36px;}

  /* 導覽列：靠 order 搬到最上方 */
  .nav{order:-1;position:sticky;top:0;bottom:auto;height:62px;
    justify-content:flex-start;gap:4px;padding:0 var(--gut);
    border-top:none;border-bottom:1px solid var(--glLine);}
  .nb{font-size:14.5px;padding:9px 15px;gap:8px;transition:background .15s;}
  .nb em{display:inline;font-weight:500;}
  .nb:hover{background:var(--card2);color:var(--tx2);}
  .nb.on{padding:9px 18px;font-weight:600;}
  .nb.on em{font-weight:600;}
  .nb.on:hover{background:var(--tint);color:var(--accT);}

  /* 標題列：單行排版，使用者資訊靠右 */
  .bar{top:62px;display:flex;flex-wrap:wrap;align-items:center;
    gap:16px;padding:0 var(--gut);}
  .hd{order:1;flex:1;min-width:0;justify-content:flex-start;gap:14px;padding:15px 0;}
  .who{order:2;flex:0 0 auto;padding:0;gap:10px;}
  .who-n{flex:0 0 auto;font-size:13px;}
  .fchips{order:3;flex-basis:100%;padding:0 0 11px;}
  .ttl{font-size:27px;}
  #page{padding:20px var(--gut) 0;}
  .pghost{padding:20px var(--gut) 0;}

  /* 桌機沒有滑動手勢，把換月箭頭放回來 */
  .ib.navm{display:inline-flex;}
  /* 按鈕加上滑鼠效果 */
  .ib{transition:background .15s,transform .1s;}
  .ib:hover{background:var(--line);}
  .ev,.lrow,.link,.cell{transition:background .15s,box-shadow .15s;}
  .ev:hover,.lrow:hover,.link:hover{box-shadow:0 2px 10px rgba(0,0,0,.07);}
  .cell:hover{background:var(--card);}
  .evc{cursor:pointer;}

  /* 月曆：格子加高，一格塞得下 6 筆 */
  .dow{font-size:13px;padding:4px 0 8px;}
  .cgrid{gap:4px;}
  .cell{height:138px;padding:6px 5px;border-radius:12px;}
  .dn{font-size:13px;text-align:left;padding-left:3px;}
  .evc{font-size:12px;line-height:1.75;padding:0 7px;margin-top:3px;}
  .legend{padding:18px 4px 4px;gap:12px;}

  /* 年月選擇器對齊標題 */
  .pk{top:132px;left:var(--gut);right:auto;margin:0;width:400px;}

  /* 今日與通訊錄分兩欄 */
  .glist{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:0 10px;align-items:start;}
  .lrow{margin-bottom:8px;}

  /* 上傳：拖放區加大 */
  .drop{padding:58px 24px;border-radius:22px;}
  .drop:hover{border-color:var(--acc);background:var(--tint);}
  .scroll{max-height:none;}

  /* 表單類頁面不要撐到 1180，太寬反而難讀 */
  .narrow{max-width:620px;}

  /* 底部面板改成置中對話框 */
  .ov{align-items:center;}
  .sheet{border-radius:22px;max-height:84vh;max-width:540px;
    padding:20px 20px 24px;border:1px solid var(--glLine);}
  #toast{bottom:28px;}
}
</style>

<script>
/* ══════════════════════════════════════════════════════════
   ESPC 監測行程 — 前端
   後端：Google Apps Script（下方 GAS_URL）
   ══════════════════════════════════════════════════════════ */
var APP_VER='2026-09-24b';      // 台灣日期＋流水字母，用來確認瀏覽器抓到的是不是新檔
var GAS_URL='https://script.google.com/macros/s/AKfycbxq0Lj59wXYKQkVnbaG607FOBmEmH64VkbxqfIOBbNnbufWlqQ82x5RAKmlbFhpOssHng/exec';

/* 寫入類的動作要跑很久（整月資料逐列寫試算表），給長一點的時限 */
var GAS_TIMEOUT={saveData:240000,clearAll:180000,archiveYear:240000,seedStaff:120000};
function gas(fn){
  var args=Array.prototype.slice.call(arguments,1);
  var payload=JSON.stringify({fn:fn,args:args});
  var ms=GAS_TIMEOUT[fn]||45000;
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort();},ms);
  var opt=ctl?{signal:ctl.signal}:{};
  var req;
  if(payload.length<1800){
    req=fetch(GAS_URL+'?payload='+encodeURIComponent(payload),opt);
  }else{
    opt.method='POST';opt.body=payload;
    req=fetch(GAS_URL,opt);
  }
  return req.then(function(r){return r.json();})
    .then(function(j){clearTimeout(timer);return j;})
    .catch(function(e){
      clearTimeout(timer);
      if(e&&e.name==='AbortError')

/** 專案編號如 108E-251 會被判成數字，這裡還原成原字串 */
function svNo(v){
  if(typeof v==='number'&&v!==0&&Math.abs(v)<1e-4){
    var m=v.toExponential().match(/^(-?)(\d)(?:\.(\d+))?e([+-]\d+)$/);
    if(m){
      var digits=m[2]+(m[3]||'');
      var exp=parseInt(m[4],10)-(m[3]?m[3].length:0);
      return m[1]+digits+'E'+exp;
    }
  }
  return sv(v);
}

function cPrune(hard){

/** 讀出證照效期年數：未填視為預設 2 年，0 為無期限 */
function ecYears(c){
  var y=(c&&c.years!==undefined&&c.years!==null&&c.years!=='')?parseInt(c.years,10):SAFETY_YEARS;
  if(isNaN(y)||y<0)y=SAFETY_YEARS;

function addYears(d,n){
  var a=String(d||'').split('-');
  if(a.length<3)return '';
  var y=parseInt(a[0],10)+n,m=parseInt(a[1],10),dd=parseInt(a[2],10);
  var last=new Date(y,m,0).getDate();     // 處理 2/29
  if(dd>last)dd=last;
  return y+'-'+p2(m)+'-'+p2(dd);

function daysBetween(a,b){
  var x=String(a||'').split('-'),y=String(b||'').split('-');
  if(x.length<3||y.length<3)return null;
  return Math.round((Date.UTC(+y[0],+y[1]-1,+y[2])-Date.UTC(+x[0],+x[1]-1,+x[2]))/86400000);
}
/** 單張證照 → {type,cert,train,expire,days,state}；state: ok / warn / expired / nodate */
function certOf(c){
  var y=ecYears(c);
  var o={type:c.type||'',cert:c.cert||'',train:c.train||'',years:y,
         remind:(c.remind!==false),          // 預設開啟提醒
         expire:'',days:null,state:'nodate'};
  if(!y){o.state='forever';return o;}          // 無期限，不會進提醒
  if(o.train){
    o.expire=addYears(o.train,y);
    o.days=daysBetween(twStr(),o.expire);
    o.state=o.days<0?'expired':(o.days<=SAFETY_WARN_DAYS?'warn':'ok');
  }
  return o;
}
/** 某人的全部證照（可能多張） */
function safetyList(name){
  var a=SAFETY[String(name||'').trim()];

/** 最需要注意的那張（逾期 > 快到期 > 未填日期 > 有效），給工地帽燈號用 */
var STATE_RANK={expired:0,warn:1,nodate:2,ok:3,forever:4};
function safetyOf(name){
  var l=safetyList(name);
  if(!l.length)return null;
  var best=l[0];
  l.forEach(function(o){
    var a=STATE_RANK[o.state],b=STATE_RANK[best.state];
    if(a<b||(a===b&&(o.days==null?9e9:o.days)<(best.days==null?9e9:best.days)))best=o;
  });
  return best;
}

}

  });

}

/** 依證照種類判斷要掛哪些標記
 *  safety：職安業務主管類 → 戴工地帽
 *  mask  ：缺氧／侷限空間 → 防毒面罩
 *  kit   ：急救人員       → 急救箱
 *  tank  ：貯存系統污染監測 → 儲槽
 *  ship  ：船員證           → 漁船 */
function certBadges(name){
  var b={safety:false,mask:false,kit:false,tank:false,ship:false};
  safetyList(name).forEach(function(o){
    var t=o.type||'';
    if(/職安|職業安全|安全衛生|營造業[甲乙丙]種/.test(t))b.safety=true;
    if(/缺氧|侷限空間|局限空間/.test(t))b.mask=true;
    if(/急救/.test(t))b.kit=true;
    if(/貯存系統|儲存系統|貯槽|儲槽/.test(t))b.tank=true;
    if(/船員|海員|船舶/.test(t))b.ship=true;
  });
  return b;
}
/** 讓標記可以點開職安詳情 */
function badgeClick(n){

/** 燈號：效期內綠、不滿 3 個月橘、逾期紅、未填日期橘 */
function dotClass(o){
  return (o.state==='expired')?'bad':((o.state==='ok'||o.state==='forever')?'good':'warn');
}
function hatDot(o){return '<span class="hdot '+dotClass(o)+'"></span>';}

/** 頭像＋工地帽：帽子壓在圓圈上緣，像戴在頭上 */
function avatarHat(name){
  var n=String(name||'').trim();
  var o=safetyOf(n);
  var b=certBadges(n);
  var h='<div class="pavw"><div class="pav">'+he(n.slice(0,1))+'</div>';
  if(b.mask)h+=MASK_SVG.replace('<svg','<svg'+badgeClick(n));     // 面罩罩住圓圈
  if(b.safety){
    // 只有職安類證照才戴帽子；燈號掛在帽沿，有面罩時帽子上移露出面罩
    h+='<button class="pavhat'+(b.mask?' up':'')+'" title="職安人員"'
      +' onclick="event.stopPropagation();showSafety(\''+esc(n)+'\')">⛑️'+hatDot(o)+'</button>';
  }
  if(b.tank)                                                      // 儲槽掛在圓圈左側

      +' onclick="event.stopPropagation();showSafety(\''+esc(n)+'\')">🛢️</button>';
  if(b.ship)h+=SHIP_SVG.replace('<svg','<svg'+badgeClick(n));     // 船停在圓圈下方
  if(b.kit)h+=KIT_SVG.replace('<svg','<svg'+badgeClick(n));       // 急救箱壓在最上層

/** 職安標記：點工地帽看種類與效期，顏色隨狀態變化 */

    +'showSafety(\''+esc(n)+'\')" title="職安證照">'+inner+hatDot(o)+'</button>';

      +kr('clock','訓練日期',he(o.train||'未填'))
      +kr('clip','有效期限',o.state==='forever'?'<span style="color:var(--tx3)">無期限</span>'
        :(o.expire?he(o.expire)+' <span style="color:var(--tx3)">（'+o.years+' 年）</span>'

/** 只輸入數字即可，自動補上 -（手機鍵盤打不出減號） */
function fmtPhone(v){
  var d=String(v||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.length===9&&d.charAt(0)==='9')d='0'+d;      // Excel 掉頭的 0 補回來
  if(d.charAt(0)!=='0')return d;                    // 分機或非市話手機，原樣保留
  if(d.slice(0,2)==='09'){                          // 手機 09xx-xxx-xxx
    if(d.length<=4)return d;
    if(d.length<=7)return d.slice(0,4)+'-'+d.slice(4);
    return d.slice(0,4)+'-'+d.slice(4,7)+'-'+d.slice(7,10);
  }
  if(d.slice(0,2)==='02'){                          // 台北市話 02-xxxx-xxxx
    if(d.length<=2)return d;
    if(d.length<=6)return d.slice(0,2)+'-'+d.slice(2);
    return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
  }
  if(d.length<=2)return d;                          // 其他區碼 0x-xxx-xxxx
  if(d.length<=5)return d.slice(0,2)+'-'+d.slice(2);
  return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5,9);
}

/** 讀出上次所在的頁籤，順便擋掉沒權限或已失效的目的地 */
function restoreTab(){
  var v;
  try{v=JSON.parse(ls(TAB_KEY)||'null');}catch(e){v=null;}
  if(!v||!v.t)return null;
  var okTab=['today','cal','book','upload','more'];
  if(okTab.indexOf(v.t)<0)return null;
  if(v.t==='upload'&&!canWrite(ROLE))return null;
  if(v.s==='upload'&&!canWrite(ROLE))v.s='';
  if(v.s==='admin'&&ROLE!=='admin')v.s='';
  if(v.t==='today')return null;                 // 今日是預設頁，照原流程走
  if(v.t==='cal'&&typeof v.y==='number'&&typeof v.m==='number'){
    curY=v.y;curM=v.m;                          // 連月份一起還原
  }
  return {t:v.t,s:v.s||''};
}

/** 同日期同專案合併成一筆，但保留每個「類別」各自的欄位 */
function groupBy(list){
  var m={},order=[];
  function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}
  list.forEach(function(r){
    var k=r.project||'（未分類）';
    if(!m[k]){m[k]={project:k,rows:[],types:[],locs:[],engs:[],cars:[],staff:[],
      notes:[],reps:[],eqs:[],nums:[],qtys:[],no:'',samp:'',tmap:{},tlist:[]};order.push(k);}
    var g=m[k];g.rows.push(r);

    add(g.types,r.type);add(g.locs,r.location);add(g.engs,normName(r.engineer));
    add(g.notes,r.notes);add(g.reps,normName(r.applicant));add(g.eqs,r.equipment);add(g.nums,r.reportNum);
    if(!g.no&&okNo(r.projectNo))g.no=okNo(r.projectNo);
    if(!g.samp&&r.sampTime)g.samp=r.sampTime;
    g.qtys.push(String(r.qty==null?'':r.qty).trim());
    if(r.car)String(r.car).split(/[、，,]/).forEach(function(c){add(g.cars,c.trim());});
    var ss=Array.isArray(r.staff)?r.staff:String(r.staff||'').split('、');
    ss.forEach(function(x){add(g.staff,normName(x.trim()));});

    // 依類別再分一層，數量／點位／儀器／報告編號各自歸屬
    var t=r.type||'（未分類）';
    if(!g.tmap[t]){g.tmap[t]={type:t,locs:[],eqs:[],nums:[],reps:[],qtys:[],samp:''};g.tlist.push(t);}
    var tg=g.tmap[t];
    add(tg.locs,r.location);add(tg.eqs,r.equipment);add(tg.nums,r.reportNum);
    add(tg.reps,normName(r.applicant));
    if(!tg.samp&&r.sampTime)tg.samp=r.sampTime;
    tg.qtys.push(String(r.qty==null?'':r.qty).trim());
  });
  return order.map(function(k){return m[k];});
}

/** 數量彙整：全是純數字就加總，含「-1+1」這類寫法則原樣列出 */
function qtyText(list){
  var vals=[];
  list.forEach(function(v){
    v=String(v==null?'':v).trim();
    if(v)vals.push(v);
  });
  if(!vals.length)return '';
  // 全是純數字 → 逐筆加總（不可去重，兩筆各 1 要等於 2）
  if(vals.every(function(v){return /^-?\d+(\.\d+)?$/.test(v);})){
    var sum=Math.round(vals.reduce(function(a,b){return a+parseFloat(b);},0)*1000)/1000;
    // 正數補上 +；0 和負數原樣（負號本身就帶符號）
    return (sum>0?'+':'')+sum;
  }
  // 含「-1+1」這類寫法 → 去重後原樣列出
  var uniq=[];
  vals.forEach(function(v){if(uniq.indexOf(v)<0)uniq.push(v);});
  return uniq.join('、');
}

/** 類別標籤：帶上各自的數量，例如「空品車（-1+1）、PM2.5（2）」 */
function typeLabel(g){
  return g.tlist.map(function(t){
    var q=qtyText(g.tmap[t].qtys);
    return t+(q?'（'+q+'）':'');
  }).join('、');
}

/** 摘要用點位：太多就只顯示第一個並註明還有幾處 */
function locBrief(g){

}

/** 證照條件：'' 不篩選，其餘為證照種類（任一張符合即可） */

function bookList(){
  if(!STAFF_READY)return '<div id="blist">'+loader('載入通訊錄…')+'</div>';
  var q=bookQ.toLowerCase();
  var list=STAFF.filter(function(s){

    if(bookTm==='_n'){if(tm)return false;}else if(bookTm&&tm!==bookTm)return false;
    if(!passSf(s.name,bookSf))return false;
    if(!q)return true;
    var bits=[s.name,s.phone,s.note,rg,tm];
    safetyList(s.name).forEach(function(o){bits.push(o.type,o.cert);});
    return bits.join(' ').toLowerCase().indexOf(q)>=0;
  });
  // 沒有任何篩選或搜尋時，把自己提到最前面
  var me=String(ENGNAME||'').trim();
  var pinned=false;
  if(me&&!bookQ&&!bookRg&&!bookTm&&!bookSf){
    for(var mi=0;mi<list.length;mi++){

      +'<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:500">'
      +he(s.name)
      +(pinned&&s.name===me?'<span class="beta" style="background:var(--card2);color:var(--tx2)">我</span>':'')
      +'</div>'

      +(ph?'<a href="tel:'+he(ph.replace(/-/g,''))+'">'+he(ph)+'</a>':'未登記電話')
      +'</div></div>'

/** 篩選證照時，在列上補一行種類與效期 */
function sfNote(name){
  var o=bookSf?certByType(name,bookSf):safetyOf(name);

  var col=o.state==='expired'?'var(--err)':(o.state==='ok'?'var(--ok)':'var(--warn)');

    :(o.state==='expired'?'逾期 '+Math.abs(o.days)+' 天':'剩 '+o.days+' 天');

    +'<div style="font-size:12px;color:'+col+';font-weight:500;white-space:nowrap">'+he(t)+'</div>'
    +(o.cert?'<div style="font-size:11px;color:var(--tx3);white-space:nowrap">'+he(o.cert)+'</div>':'')
    +'</div>';
}

/* ══ 資料載入 ══ */
function todayRange(t){
  var d=new Date(t+'T00:00:00');
  var me=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
  var d15=new Date(d);d15.setDate(d15.getDate()+15);
  var m15=d15.getFullYear()+'-'+p2(d15.getMonth()+1)+'-'+p2(d15.getDate());
  return me>m15?me:m15;
}

function loadToday(force){
  var t=twStr();
  var sk=scopeKey();
  if(!force&&todayFor===t&&todayScope===sk){render();return;}
  var onTab=(tab==='today'&&!sub);      // 在別的頁籤時只默默更新，不動版面
  var ck='today'+(sk?'_'+sk:'');
  todayScope=sk;
  var c=force?null:cGet(ck);
  if(c&&c.date===t&&c.rows){paintToday(t,c.rows);}
  else{
    if(onTab)$('page').innerHTML=loader('載入今日行程…');
    c=null;
  }
  var o=scopeOpts({dateFrom:t,dateTo:todayRange(t)});
  if(c&&c.version)o.version=c.version;
  gas('getData',TOKEN,o).then(function(r){
    if(!r||!r.ok){
      if(!c&&tab==='today'&&!sub)$('page').innerHTML='<div class="empty">'+he((r&&r.error)||'載入失敗')+'</div>';
      return;
    }
    cVer(r.version);
    if(sk)prefetch('today',{dateFrom:t,dateTo:todayRange(t),date:t});   // 背景補齊全部
    if(r.unchanged)return;
    cSet(ck,{date:t,version:r.version||'',rows:r.rows||[]});
    paintToday(t,r.rows||[]);
  }).catch(function(){
    if(!c&&tab==='today'&&!sub)$('page').innerHTML='<div class="empty">載入失敗，請重試</div>';
  });
}
function paintToday(t,all){
  normRows(all);
  todayRows=(all||[]).filter(passF);
  todayFor=t;
  jSet(NTC,{date:t,rows:(all||[]).filter(function(r){return r.date===t;})});
  if(tab==='today'&&!sub)render();
}

/* ══ 下載範圍 ══════════════════════════════════════
   有工程師或「只看我的」條件時，先只抓這個人的資料（快很多），
   再在背景把整月抓回來放快取，之後清掉篩選就不用再等。       */
var allScope='',todayScope='',calLoading=false;
function scopeKey(){return (F.en?'e:'+F.en:'')+(F.st?'s:'+F.st:'');}
function scopeOpts(o){
  if(F.en)o.engineer=F.en;
  if(F.st)o.person=F.st;
  return o;
}
/** 背景把完整資料抓回來存快取，不動畫面 */
function prefetch(key,o){
  var c=cGet(key);
  if(c&&c.version&&c.version===cVer())return;     // 快取已是最新
  var q={dateFrom:o.dateFrom,dateTo:o.dateTo};
  if(c&&c.version)q.version=c.version;
  gas('getData',TOKEN,q).then(function(r){
    if(!r||!r.ok||r.unchanged)return;
    var v={version:r.version||'',rows:r.rows||[]};
    if(o.date)v.date=o.date;
    cSet(key,v);
  }).catch(function(){});
}

function loadMonth(force){
  var ym=curY+'-'+p2(curM+1);
  var sk=scopeKey();
  var key='m_'+ym+(sk?'_'+sk:'');
  var first=ym+'-01';
  var last=ym+'-'+p2(new Date(curY,curM+1,0).getDate());
  var onTab=(tab==='cal'&&!sub);        // 在別的頁籤時只默默更新，不動版面
  allScope=sk;
  var c=force?null:cGet(key);
  if(c&&c.rows){calLoading=false;paintMonth(c.rows);}
  else{
    calLoading=true;
    if(onTab)render();          // 先把日期格子畫出來，行程位置放轉圈
    c=null;
  }
  var o=scopeOpts({dateFrom:first,dateTo:last});
  if(c&&c.version)o.version=c.version;
  gas('getData',TOKEN,o).then(function(r){
    calLoading=false;
    if(!r||!r.ok){if(!c)toast((r&&r.error)||'載入失敗','no');paintMonth(allRows);return;}
    cVer(r.version);
    if(sk)prefetch('m_'+ym,{dateFrom:first,dateTo:last});   // 背景補齊整月
    if(r.unchanged){paintMonth(allRows);return;}
    cSet(key,{version:r.version||'',rows:r.rows||[]});
    paintMonth(r.rows||[]);
  }).catch(function(){
    calLoading=false;
    if(!c&&tab==='cal'&&!sub)$('page').innerHTML='<div class="empty">載入失敗，請重試</div>';
    else paintMonth(allRows);
  });
}
function paintMonth(list){
  allRows=normRows(list||[]);
  rows=allRows.filter(passF);
  var t=twStr(),c=jGet(NTC,null);
  var _tc=cGet('today'+(scopeKey()?'_'+scopeKey():''))||cGet('today');
  if(c&&c.date===t)todayRows=normRows((_tc&&_tc.rows)||c.rows).filter(passF);
  if(tab==='cal'&&!sub)render();      // 只有停在行事曆時才重畫
}

function moveM(d){
  curM+=d;if(curM>11){curM=0;curY++;}if(curM<0){curM=11;curY--;}
  allRows=[];rows=[];saveTab();
  slidePage(d,function(){render();loadMonth();});
}
function goToday(){
  var n=twDate(),d=(n.getFullYear()*12+n.getMonth())>=(curY*12+curM)?1:-1;
  curY=n.getFullYear();curM=n.getMonth();
  allRows=[];rows=[];saveTab();
  slidePage(d,function(){render();loadMonth();});
}

function loadStaff(cb,force){
  var c=force?null:cGet('staff');
  if(c&&c.staff){applyStaff(c.staff);STAFF_VER=c.version||'';if(cb){cb();cb=null;}}
  gas('getStaff',TOKEN,c?c.version:'').then(function(r){
    if(r&&r.ok&&!r.unchanged){
      applyStaff(r.staff||[]);STAFF_VER=r.version||'';
      cSet('staff',{version:STAFF_VER,staff:STAFF});
      if(tab==='book'&&!sub)render();
    }
    if(cb)cb();
  }).catch(function(){if(cb)cb();});
}
/* 別名：Excel 上寫的暱稱／英文名 → 正式姓名
   例如排程表寫「Apple」，實際上是「張愷瓴」 */
var ALIAS={};
function normName(v){
  var k=String(v||'').trim();
  if(!k)return '';
  return ALIAS[k.toLowerCase()]||k;
}
/** 把整批行程的人名換成正式姓名（就地修改） */
function normRows(list){
  (list||[]).forEach(function(r){
    if(r.engineer)r.engineer=normName(r.engineer);
    if(r.applicant)r.applicant=normName(r.applicant);
    if(r.staff&&r.staff.length)r.staff=r.staff.map(normName);
  });
  return list||[];
}

function applyStaff(l){
  STAFF=l||[];PHONE={};SAFETY={};ALIAS={};TEAM={};STAFF_READY=true;
  STAFF.forEach(function(s){
    if(!s.name)return;
    PHONE[s.name]=s.phone||'';
    TEAM[s.name]=(s.team||'').trim();
    var cs=(s.certs||[]).map(function(o){
      return {type:String(o.t||'').trim(),cert:String(o.c||'').trim(),
              train:String(o.d||'').trim(),years:o.y,remind:(o.n!==false)};
    }).filter(function(o){return o.type||o.cert||o.train;});
    if(!cs.length&&(s.safety||s.trainDate||s.certNo))      // 相容舊資料
      cs=[{type:s.safety||'',cert:s.certNo||'',train:s.trainDate||''}];
    if(cs.length)SAFETY[s.name]=cs;
    String(s.alias||'').split(/[,、，;；\/\s]+/).forEach(function(a){
      a=a.trim();
      if(a&&a!==s.name)ALIAS[a.toLowerCase()]=s.name;
    });
  });
  // 別名可能在行程載入後才拿到，補正已在手上的資料
  ENGNAME=normName(ENGNAME);
  if(F.en)F.en=normName(F.en);
  normRows(allRows);normRows(todayRows);
}

/* ══ 篩選 ══ */
/** 這筆行程有沒有這個人出勤：只看監測人員與申報人員，工程師欄不算 */
function hasPerson(r,n){
  if(!n)return true;
  if(r.applicant===n)return true;
  if(r.staff&&r.staff.length&&r.staff.indexOf(n)>=0)return true;
  return false;
}
function passF(r){
  if(F.rg&&(r.region||'')!==F.rg)return false;
  if(F.en&&r.engineer!==F.en)return false;
  if(F.st&&!hasPerson(r,F.st))return false;
  if(F.ty.length&&F.ty.indexOf(r.type)<0)return false;
  if(F.q){
    var q=F.q.toLowerCase();
    var bits=[r.project,r.projectNo,r.location,r.reportNum,r.notes,
              r.type,r.engineer,r.car,r.equipment,r.applicant];
    if(r.staff&&r.staff.length)bits=bits.concat(r.staff);
    if(bits.join(' ').toLowerCase().indexOf(q)<0)return false;
  }
  return true;
}
var FT={rg:'',en:'',ty:[],q:'',st:''};   // 面板上的暫存條件，按「篩選」才套用

function openFilter(){
  FT={rg:F.rg,en:F.en,ty:F.ty.slice(),q:F.q||'',st:F.st||''};
  paintFilter();
  $('ov').classList.add('open');
}

function paintFilter(){
  var engs=[],tys=[],sts=[],s1={},s2={},s3={};
  allRows.concat(todayRows).forEach(function(r){
    if(r.engineer&&!s1[r.engineer]){s1[r.engineer]=1;engs.push(r.engineer);}
    if(r.type&&!s2[r.type]){s2[r.type]=1;tys.push(r.type);}
    (r.staff||[]).forEach(function(n){
      if(n&&!s3[n]){s3[n]=1;sts.push(n);}
    });
  });
  if(FT.en&&engs.indexOf(FT.en)<0)engs.push(FT.en);
  if(FT.st&&sts.indexOf(FT.st)<0)sts.push(FT.st);
  FT.ty.forEach(function(t){if(tys.indexOf(t)<0)tys.push(t);});
  engs.sort();
  sts.sort(function(a,b){return a.localeCompare(b,'zh-Hant');});
  tys.sort();
  // 空品車最常用，固定排第一
  var ai=tys.indexOf('空品車');
  if(ai>0)tys.unshift(tys.splice(ai,1)[0]);

  var h='<div class="shh" style="align-items:center">'
    +'<h3 style="flex-shrink:0">篩選</h3>'
    +'<div style="display:flex;gap:7px;flex:1;justify-content:flex-end">'
    +'<button class="btn btn-sm" onclick="clearFilter()">清除</button>'
    +'<button class="btn btn-p btn-sm" onclick="applyFilter()">篩選'
    +(nFT()?'（'+nFT()+'）':'')+'</button></div></div>'
    +'<p class="lb">關鍵字　<span style="color:var(--tx2)">專案、點位、報告編號、備註</span></p>'
    +'<input class="fld" id="f-q" value="'+he(FT.q||'')+'" placeholder="輸入任意關鍵字" style="margin-bottom:16px">'
    +'<p class="lb">地區</p><select class="fld" id="f-rg" style="margin-bottom:16px">'
    +['','台北','台中','高雄'].map(function(o){
      return '<option value="'+o+'"'+(FT.rg===o?' selected':'')+'>'+(o||'全部地區')+'</option>';}).join('')
    +'</select>'
    +'<p class="lb">工程師</p>'
    +pickBtn('en',FT.en,'全部工程師')
    +'<p class="lb">監測人員　<span style="color:var(--tx2)">含申報人員</span></p>'
    +pickBtn('st',FT.st,'全部監測人員')
    +'<p class="lb">類別　<span style="color:var(--tx2)">可複選</span></p>'
    +'<div class="opts" style="margin-bottom:4px">'
    +'<button class="ob'+(FT.ty.length?'':' on')+'" onclick="tyPick(\'\')">全部</button></div>'
    +tyGroupsHTML(tys)
    +'<div style="height:8px"></div>';
  $('sheet').innerHTML=h;
  $('f-rg').onchange=function(){FT.rg=this.value;paintFilter();};

  var q=$('f-q');
  if(q){
    q.oninput=function(){FT.q=this.value;};                 // 打字時不重畫，避免失焦
    q.onkeydown=function(e){if(e.key==='Enter'){FT.q=this.value;applyFilter();}};
  }
}
/* ══ 測項分類 ══════════════════════════════════
   用關鍵字判斷，之後 Excel 出現新測項也會自動歸類 */
var TY_GROUPS=['空氣','水質','噪音振動','交通','土壤廢棄物','其他'];
function typeGroup(t){
  t=String(t||'');
  if(/交通|行駛速率|車流|路況/.test(t))return '交通';
  if(/噪音|振動|低頻/.test(t))return '噪音振動';
  if(/水質|地下水|地面水|海域|放流|納管|飲用水|水位|逕流/.test(t))return '水質';
  if(/土壤|底泥|廢棄物|毒化物|事業廢/.test(t))return '土壤廢棄物';
  if(/空品|PM|TSP|落塵|惡臭|戴奧辛|粉塵|VOC|揮發|臭氧|風速|氣象|排放|燃燒/i.test(t))return '空氣';
  return '其他';
}

/* ══ 人員選擇器 ══════════════════════════════════
   先用組別頁籤縮小範圍，再從網格挑人；也可以直接搜尋 */
var PK={who:'',q:'',team:'',all:false};

function pickBtn(who,val,empty){
  return '<button class="fld" style="margin-bottom:16px;display:flex;align-items:center;'
    +'justify-content:space-between;text-align:left" onclick="openPick(\''+who+'\')">'
    +'<span'+(val?'':' style="color:var(--tx3)"')+'>'+he(val||empty)
    +(val&&TEAM[val]?' <span style="font-size:11px;color:var(--tx3)">'+he(TEAM[val])+'</span>':'')
    +'</span><span style="color:var(--tx3);font-size:12px">選擇 ›</span></button>';
}
function openPick(who){
  PK={who:who,q:'',team:'',all:false};
  paintPicker();
}
function closePick(){PK.who='';paintFilter();}

/** 目前可選的人：預設只列當月行程出現過的，可切換成通訊錄全部 */
function pickNames(){
  var out=[],seen={};
  if(PK.all){
    STAFF.forEach(function(s){if(s.name&&!seen[s.name]){seen[s.name]=1;out.push(s.name);}});
  }else{
    allRows.concat(todayRows).forEach(function(r){
      if(PK.who==='en'){
        if(r.engineer&&!seen[r.engineer]){seen[r.engineer]=1;out.push(r.engineer);}
      }else{
        (r.staff||[]).forEach(function(n){if(n&&!seen[n]){seen[n]=1;out.push(n);}});
      }
    });
  }
  var cur=(PK.who==='en'?FT.en:FT.st);
  if(cur&&!seen[cur])out.push(cur);
  out.sort(function(a,b){
    var ta=TEAM[a]||'zzz',tb=TEAM[b]||'zzz';
    if(ta!==tb)return ta.localeCompare(tb,'zh-Hant');
    return a.localeCompare(b,'zh-Hant');
  });
  return out;
}
function pickTeams(names){
  var out=[],seen={},blank=false;
  names.forEach(function(n){
    var t=TEAM[n]||'';
    if(!t){blank=true;return;}
    if(!seen[t]){seen[t]=1;out.push(t);}
  });
  out.sort(function(a,b){return a.localeCompare(b,'zh-Hant');});
  if(blank)out.push('_n');
  return out;
}
function paintPicker(){
  var names=pickNames(),teams=pickTeams(names);
  var cur=(PK.who==='en'?FT.en:FT.st);
  var ttl=(PK.who==='en'?'選擇工程師':'選擇監測人員');
  var h='<div class="shh" style="align-items:center">'
    +'<button class="ib" onclick="closePick()">‹</button>'
    +'<h3 style="flex:1;font-size:17px">'+ttl+'</h3>'
    +'<button class="btn btn-sm" onclick="pickSet(\'\')">全部</button></div>'
    +'<input class="fld" id="pk-q" value="'+he(PK.q)+'" placeholder="搜尋姓名或組別" style="margin-bottom:10px">'
    +'<div class="etab">'
    +'<button class="et'+(PK.team?'':' on')+'" onclick="pickTeam(\'\')">全部</button>'
    +teams.map(function(t){
      return '<button class="et'+(PK.team===t?' on':'')+'" onclick="pickTeam(\''+esc(t)+'\')">'
        +he(t==='_n'?'未分組':t)+'</button>';}).join('')
    +'</div><div id="pkgrid">'+pickGridHTML()+'</div>'
    +'<button class="btn btn-sm btn-full" style="margin-top:12px" onclick="pickAll()">'
    +(PK.all?'只看本月有班的人':'顯示通訊錄全部人員')+'</button>';
  $('sheet').innerHTML=h;
  var q=$('pk-q');
  if(q)q.oninput=function(){PK.q=this.value;paintPickGrid();};
}
function pickGridHTML(){
  var q=PK.q.trim().toLowerCase();
  var cur=(PK.who==='en'?FT.en:FT.st);
  var list=pickNames().filter(function(n){
    var t=TEAM[n]||'';
    if(PK.team==='_n'){if(t)return false;}
    else if(PK.team&&t!==PK.team)return false;
    if(!q)return true;
    return (n+' '+t).toLowerCase().indexOf(q)>=0;
  });
  if(!list.length)return '<div class="empty">查無符合的人員</div>';
  return '<div class="pgrid">'+list.map(function(n){
    return '<button class="pcell'+(n===cur?' on':'')+'" onclick="pickSet(\''+esc(n)+'\')">'
      +he(n)+(PK.team?'':'<small>'+he(TEAM[n]||'未分組')+'</small>')+'</button>';
  }).join('')+'</div>';
}
function paintPickGrid(){
  var el=$('pkgrid');
  if(el)el.innerHTML=pickGridHTML();
}
function pickTeam(t){PK.team=t;paintPicker();}
function pickAll(){PK.all=!PK.all;PK.team='';paintPicker();}
function pickSet(n){
  if(PK.who==='en')FT.en=n;else FT.st=n;

/** 清掉 Service Worker 與快取後重新載入，用來擺脫抓到舊檔的情況 */
function hardReload(){
  var jobs=[];
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){return r.unregister();}));
      }));
  }catch(e){}
  try{
    if(window.caches&&caches.keys)
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){return caches.delete(k);}));
      }));
  }catch(e){}
  Promise.all(jobs).catch(function(){}).then(function(){
    var u=location.href.split('#')[0].split('?')[0];
    location.replace(u+'?v='+Date.now());
  });
}

/* ══ 換頁動畫 ══════════════════════════════════════
   舊內容先滑出去，新內容再從另一側滑進來 */
var SLIDE_MS=300;
var SLIDE_EASE='transform .3s cubic-bezier(.28,.78,.32,1)';
function raf(fn){
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(fn);
  else setTimeout(fn,16);
}
/** 舊畫面與新畫面同時橫移，中間不會有空白 */
function slidePage(dir,fn){
  var el=$('page'),wrap=$('pwrap');
  if(!el||!wrap||!wrap.appendChild||typeof document.createElement!=='function'||!el.style){
    fn();return;
  }
  var g,h0=el.offsetHeight||0;
  try{
    g=document.createElement('div');
    g.className='pghost';
    g.innerHTML=el.innerHTML;
    wrap.appendChild(g);
  }catch(e){fn();return;}

  fn();                                   // 立刻換成新內容

  // 動畫期間鎖住高度，兩張畫面高度不同也不會上下抽動
  var h1=el.offsetHeight||0;
  if(wrap.style)wrap.style.minHeight=Math.max(h0,h1)+'px';

  var into=(dir>0?'100%':'-100%');        // 新畫面從哪一側進來
  var away=(dir>0?'-100%':'100%');        // 舊畫面往哪一側離開
  el.style.transition='none';
  el.style.transform='translateX('+into+')';
  raf(function(){
    el.style.transition=SLIDE_EASE;
    el.style.transform='translateX(0)';
    g.style.transition=SLIDE_EASE;
    g.style.transform='translateX('+away+')';
  });
  setTimeout(function(){
    if(g&&g.parentNode)g.parentNode.removeChild(g);
    el.style.transition='';el.style.transform='';
    if(wrap.style)wrap.style.minHeight='';
  },SLIDE_MS+40);
}
/** 面板換日：內容直接換掉，再從對應方向滑進來 */
function slideSheet(dir,fn){
  var el=$('sheet');
  var h0=(el&&el.offsetHeight)||0;
  fn();
  el=$('sheet');
  if(!el||typeof el.classList==='undefined')return;
  // 先撐住原本高度，等新內容滑進來再放開，避免面板抽動
  if(el.style&&h0)el.style.minHeight=h0+'px';
  el.classList.remove('sl-in-l','sl-in-r');
  el.classList.add(dir>0?'sl-in-r':'sl-in-l');
  setTimeout(function(){
    if(el.classList)el.classList.remove('sl-in-l','sl-in-r');
    if(el.style)el.style.minHeight='';
  },SLIDE_MS);
}

/* ══ 手勢 ══════════════════════════════════════════
   月曆：長按格子看當日全部、左右滑換月
   詳情面板：左右滑換日 */
var _lpT=null,_lpEl=null,_lpX=0,_lpY=0,_lpFired=false;
function cellDown(e,d){
  cellUp();
  _lpX=e.clientX;_lpY=e.clientY;_lpFired=false;
  _lpEl=e.currentTarget;
  if(_lpEl)_lpEl.classList.add('lp');
  _lpT=setTimeout(function(){
    _lpT=null;_lpFired=true;
    if(_lpEl)_lpEl.classList.remove('lp');
    openDay(d);
  },450);
}
function cellMove(e){
  // 在格子裡捲動或左右滑時取消長按
  if(_lpT===null)return;
  if(Math.abs(e.clientX-_lpX)>8||Math.abs(e.clientY-_lpY)>8)cellUp();
}
function cellUp(){
  if(_lpT!==null){clearTimeout(_lpT);_lpT=null;}
  if(_lpEl){_lpEl.classList.remove('lp');_lpEl=null;}
}
/** 點事件標籤開詳情；剛剛長按過就忽略這一下 */

}

var _sw=null;
function swipeStart(e){
  if(e.touches&&e.touches.length!==1){_sw=null;return;}
  var t=e.touches?e.touches[0]:e;
  _sw={x:t.clientX,y:t.clientY,t:Date.now()};
}
function swipeEnd(e){
  var st=_sw;_sw=null;
  if(!st)return;
  var t=e.changedTouches?e.changedTouches[0]:e;
  var dx=t.clientX-st.x,dy=t.clientY-st.y;
  if(Date.now()-st.t>700)return;                    // 太慢不算滑動
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.6)return;
  var open=$('ov')&&$('ov').classList.contains('open');
  if(open){
    if(EV_D)gotoDay(EV_D,dx<0?1:-1);                // 面板：換日
  }else if(tab==='cal'&&!sub){
    cellUp();
    moveM(dx<0?1:-1);                               // 月曆：換月
  }
}
function initSwipe(){
  document.addEventListener('touchstart',swipeStart,{passive:true});
  document.addEventListener('touchend',swipeEnd,{passive:true});
}

/** 點位編號分行 */
function locList(arr){
  if(!arr||!arr.length)return '';
  if(arr.length===1)return he(arr[0]);
  return arr.map(function(x,i){return (i+1)+'. '+he(x);}).join('<br>');
}
/** 儀器排成標籤 */
function pills(arr){
  if(!arr||!arr.length)return '';
  var out=[];
  arr.forEach(function(v){
    String(v).split(/[\s、,，]+/).forEach(function(x){
      x=x.trim();if(x&&out.indexOf(x)<0)out.push(x);
    });
  });
  if(!out.length)return '';
  return out.map(function(x){return '<span class="pil">'+he(x)+'</span>';}).join('');
}

      +'<button class="sw'+(c.remind===false?'':' on')+'" onclick="ecRemind('+i+')"></button></div>'
      +'</div>';
  });
  return h+'<button class="addc"'+(EC.length?' style="margin-top:9px"':'')
    +' onclick="ecAdd()">＋ 新增證照</button>';
}
function expText(v,y){
  if(!y)return '此證照設為無期限，不會提醒回訓';
  if(!v)return '填入訓練日期後會自動計算有效期限';
  var ex=addYears(v,y),d=daysBetween(twStr(),ex);
  return '有效期限至 '+ex+(d<0?'　已逾期 '+Math.abs(d)+' 天':'　剩 '+d+' 天');
}
function expCol(v,y){
  if(!y||!v)return '';
  var d=daysBetween(twStr(),addYears(v,y));
  return d<0?'var(--err)':(d<=SAFETY_WARN_DAYS?'var(--warn)':'var(--ok)');
}
function ecExp(i){
  var e=$('c-e'+i);

  var y=$('c-y'+i)?parseInt($('c-y'+i).value,10):SAFETY_YEARS;
  e.textContent=expText(v,y);e.style.color=expCol(v,y);
}

/* 上傳記錄顯示規則：
   · 只列出三個月內上傳的
   · 被取代的記錄，取代後滿三天就收起來
   其餘都放進「更早的記錄」裡，需要時才展開 */
var HIST_MONTHS=3, HIST_SUPERSEDE_DAYS=3, histMore=false;
function histAge(v){
  var d=daysBetween(String(v||'').slice(0,10),twStr());
  return (d==null||isNaN(d))?0:d;          // 認不出日期就當成很新，不隱藏
}
function histHidden(r){
  if(histAge(r.upload_time)>HIST_MONTHS*31)return true;
  if(r.status==='superseded'){
    var t=r.superseded_at||r.upload_time;
    if(histAge(t)>HIST_SUPERSEDE_DAYS)return true;
  }
  return false;
}
function histToggle(){histMore=!histMore;paintHistory();}

function paintHistory(){
  var el=$('hist');if(!el)return;
  if(!HIST.length){el.innerHTML='<div class="empty">尚無上傳記錄</div>';return;}
  var open=[],hid=[];
  HIST.forEach(function(r){(histHidden(r)?hid:open).push(r);});
  var list=histMore?open.concat(hid):open;
  var h='',old=0;
  if(!list.length)h+='<div class="empty">三個月內沒有上傳記錄</div>';
  list.forEach(function(r){
    var isOld=r.status==='superseded';if(isOld)old++;
    var rng=r.date_from===r.date_to?r.date_from:(r.date_from+' ~ '+r.date_to);
    h+='<div class="card" style="'+(isOld?'opacity:.55;':'')+'"><div class="row">'
      +'<div style="min-width:0;flex:1">'
      +'<div style="font-size:14px;font-weight:500;word-break:break-all;'+(isOld?'text-decoration:line-through;':'')+'">'
      +he(r.filename)+'</div>'
      +'<div style="display:flex;gap:6px;margin:5px 0">'
      +(r.region?'<span class="tag g">'+he(r.region)+'</span>':'')
      +(r.month?'<span class="tag">'+he(r.month)+'</span>':'')
      +'<span class="tag'+(isOld?'':' g')+'">'+(isOld?'已被取代':'最新')+'</span></div>'
      +'<div class="hint">'+he(rng)+(r.days?'　·　'+r.days+' 天':'')+'　·　'+he(r.uploaded_by)+'<br>'
      +'檔案更新：'+(r.source_mtime?he(stamp(r.source_mtime)):'未記錄')
      +'　上傳：'+he(stamp(r.upload_time))
      +'<br>解析版本：'+(r.app_ver
        ?(r.app_ver===APP_VER
          ?'<span style="color:var(--ok)">'+he(r.app_ver)+'（最新）</span>'
          :'<span style="color:var(--warn)">'+he(r.app_ver)+'　建議用目前版本 '+he(APP_VER)+' 重傳</span>')
        :'<span style="color:var(--warn)">舊版　建議重新上傳</span>')
      +'</div></div>'
      +(canWrite(ROLE)&&!isOld
        ?'<button class="ib" style="color:var(--err)" onclick="delUpload(\''+he(r.id)+'\',\''+esc(r.filename)+'\')">✕</button>':'')
      +'</div></div>';
  });
  if(hid.length)
    h+='<button class="btn btn-sm btn-full" style="margin-top:4px" onclick="histToggle()">'
      +(histMore?'收起較早的記錄':'顯示更早的記錄（'+hid.length+' 筆）')+'</button>';
  if(canWrite(ROLE)&&old>1)
    h+='<button class="btn btn-sm btn-full" style="margin-top:8px" onclick="purgeOld('+old+')">清除 '+old+' 筆已被取代的記錄</button>';
  el.innerHTML=h;
}

/* ══ Excel 解析 ══ */
function readXlsx(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',raw:true});
        var name=null;
        if(wb.SheetNames.indexOf('採樣行程')>=0)name='採樣行程';
        else if(wb.SheetNames.indexOf('工作表1')>=0)name='工作表1';
        else name=wb.SheetNames[0];
        if(!name){res([]);return;}
        var raw=XLSX.utils.sheet_to_json(wb.Sheets[name],
          {header:1,raw:true,defval:null,range:{s:{r:0,c:0},e:{r:9999,c:21}}});
        res(parseSheet(raw,name,file.name));
      }catch(ex){rej(ex);}
    };
    fr.onerror=function(){rej(new Error('檔案讀取失敗'));};
    fr.readAsArrayBuffer(file);
  });
}
function detectRegion(fn,sheet){
  var s=(fn||'')+' '+(sheet||'');
  if(/台中|臺中|中部|中區|taichung|\bTC\b/i.test(s))return '台中';
  if(/高雄|南部|南區|kaohsiung|\bKH\b/i.test(s))return '高雄';
  if(/台北|臺北|北部|北區|taipei|\bTP\b/i.test(s))return '台北';
  if(sheet==='採樣行程')return '高雄';
  return '';
}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){if(isNaN(v))return null;
    return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());}
  if(typeof v==='number'&&v>40000&&v<80000){
    try{var d=XLSX.SSF.parse_date_code(v);if(d&&d.y>2000)return d.y+'-'+p2(d.m)+'-'+p2(d.d);}catch(e){}
  }
  var s=String(v).trim();
  var m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m=s.match(/^(\d{2,3})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return (parseInt(m[1],10)+1911)+'-'+p2(m[2])+'-'+p2(m[3]);
  return null;
}
/* 欄位對照：C 執行日期 / D 工程師 / E 專案編號 / F 專案簡稱 / G 行程類型
   H 點位 / I 數量 / J 申報採樣時間 / K 採樣儀器 / L 申報人員 / M 報告編號 / N 備註 / O 公務車 */
function parseSheet(raw,sheet,fname){
  if(!raw||raw.length<2)return [];
  var region=detectRegion(fname||'',sheet);
  var out=[];
  if(sheet==='採樣行程'){
    var kd='',kst=[],kcar='';         // 人員與公務車欄空白＝沿用上一筆，換日期才重來
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      var ds=parseDate(row[2]);
      if(!ds||parseInt(ds.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      if(ds!==kd){kd=ds;kst=[];kcar='';}
      var kstaff=[16,17,18,19,20].map(function(c){return sv(row[c]);}).filter(Boolean);
      if(kstaff.length)kst=kstaff;else kstaff=kst;
      var kc=sv(row[15]);if(kc)kcar=kc;else kc=kcar;
      out.push({date:ds,engineer:eng,project:proj,projectNo:svNo(row[4]),type:type,
        location:sv(row[8]),qty:sv(row[9]),
        sampTime:sv(row[10]),equipment:sv(row[11]),applicant:sv(row[12]),
        reportNum:sv(row[7]),notes:[sv(row[13]),sv(row[14])].filter(Boolean).join('；'),
        car:kc,
        staff:kstaff.slice(),
        region:region});
    }
  }else{
    // 日期是合併儲存格，需往下延續；工程師空白＝休假／註記列，整列略過
    var last=null,lp='',lr='',lsm='',lc='',ln='',lst=[];
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      // 換日期時所有延續值歸零，人員不會跨日沿用
      if(row[2]!=null){var d2=parseDate(row[2]);if(d2&&d2!==last){last=d2;lp='';lr='';lsm='';lc='';ln='';lst=[];}}
      if(!last||parseInt(last.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      // 報告編號／採樣時間／專案編號屬於專案，換專案就重來；
      // 公務車和人員跟著「這一組人」走，換專案仍沿用
      if(proj&&proj!==lp){lp=proj;lr='';lsm='';ln='';}
      var no=svNo(row[4]);if(no)ln=no;else no=ln;
      var rpt=sv(row[12]);if(rpt)lr=rpt;else rpt=lr;
      var samp=sv(row[9]);if(samp)lsm=samp;else samp=lsm;
      var car=sv(row[14]);if(car)lc=car;else car=lc;   // 空白＝沿用同一台車
      // 人員欄空白＝跟上一筆同一組；專案換了也繼續沿用，只有換日期才重來
      var st=[15,16,17,18,19].map(function(c){return sv(row[c]);}).filter(Boolean);
      if(st.length)lst=st;else st=lst;
      out.push({date:last,engineer:eng,project:proj,projectNo:no,type:type,
        location:sv(row[7]),qty:sv(row[8]),
        sampTime:samp,equipment:sv(row[10]),applicant:sv(row[11]),
        reportNum:rpt,notes:sv(row[13]),car:car,
        staff:st.slice(),
        region:region});
    }
  }
  return out;
}

    +'<span class="beta">BETA</span></div>'
    +'<div class="hint" style="margin-top:2px">時間一到跳出系統通知，只顯示你自己的行程</div></div>'
    +'<button class="sw'+(c.on?' on':'')+'" onclick="ntToggle()"></button></div></div>'
    +'<div class="card"><div class="row"><div style="font-size:15px">提醒時間</div>'
    +'<input type="time" value="'+he(c.time)+'" onchange="ntSet(\'time\',this.value)"'

    +'<div class="card"><div class="row"><div style="font-size:15px">六日不提醒</div>'

    +'<div class="card"><div class="row"><div><div style="font-size:15px">沒有行程時仍提醒</div>'
    +'<div class="hint" style="margin-top:2px">關閉時，當天沒排程就不跳通知</div></div>'
    +'<button class="sw'+(c.notifyEmpty?' on':'')+'" onclick="ntSet(\'notifyEmpty\',!'+c.notifyEmpty+')"></button></div></div>';

  if(c.on)h+='<div class="note">手機系統會在 App 切到背景後數秒內凍結程式，因此只有在<b>該時刻 App 正開著</b>時才會即時跳通知。其餘情況會在下次開啟時補提醒。</div>';

function ntSet(k,v){var c=ntCfg();c[k]=v;jSet(NT,c);render();}
function ntToggle(){
  var c=ntCfg();
  if(c.on){c.on=false;jSet(NT,c);render();return;}
  if(!ntSup()){toast('此瀏覽器不支援通知','no');return;}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){c.on=true;c.last='';jSet(NT,c);regSW();toast('已開啟每日提醒','ok');}
    else toast('未取得通知權限','no');
    render();
  }).catch(function(){render();});
}
function showNotif(title,body){
  var o={body:body,tag:'espc-daily',icon:'icon.png',badge:'icon.png',renotify:true};
  if(SWREG&&SWREG.showNotification){try{SWREG.showNotification(title,o);return true;}catch(e){}}
  if(navigator.serviceWorker&&navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(function(r){SWREG=r;
      try{r.showNotification(title,o);}catch(e){try{new Notification(title,o);}catch(e2){}}
    }).catch(function(){try{new Notification(title,o);}catch(e){}});
    return true;
  }
  try{new Notification(title,o);return true;}catch(e){return false;}
}
function ntText(t,list){
  var dd=t.split('-'),head=parseInt(dd[1])+'/'+parseInt(dd[2])+'（'+DW[dowOf(t)]+'）';
  if(!list.length)return {title:head+' 今日無排程',body:'今天沒有安排監測行程。'};
  var lines=groupBy(list).map(function(g){
    return '• '+g.project+(g.types.length?'（'+g.types.join('、')+'）':'')
      +(g.locs[0]?'\n　'+g.locs[0]:'')+(g.samp?'　'+g.samp:'');
  });
  return {title:head+' 今日 '+lines.length+' 項行程',body:lines.join('\n')};

function ntFire(t,done){
  function go(list,fresh){
    var eng=ENGNAME.trim();
    var mine=eng?list.filter(function(r){return String(r.engineer||'').trim()===eng;}):list;
    var c=ntCfg();
    if(!mine.length&&!c.notifyEmpty){if(done)done(!!fresh);return;}
    var m=ntText(t,mine);
    if(done)done(showNotif(m.title,m.body));
  }
  if(TOKEN){
    gas('getData',TOKEN,{dateFrom:t,dateTo:t}).then(function(r){
      if(r&&r.ok&&!r.unchanged){jSet(NTC,{date:t,rows:r.rows||[]});go(r.rows||[],true);}
      else{var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,true);else if(done)done(false);}
    }).catch(function(){var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,false);else if(done)done(false);});
  }else{var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,false);else if(done)done(false);}
}
function ntTick(){
  if(ntBusy)return;
  var c=ntCfg();
  if(!c.on||!ntSup()||Notification.permission!=='granted')return;
  var now=twDate(),t=twStr();
  if(c.last===t)return;
  var dw=now.getDay();
  if(c.skipWeekend&&(dw===0||dw===6))return;
  var hm=(c.time||'08:30').split(':');
  var target=new Date(now);
  target.setHours(parseInt(hm[0],10)||0,parseInt(hm[1],10)||0,0,0);
  if(now<target)return;
  ntBusy=true;
  ntFire(t,function(ok){ntBusy=false;if(!ok)return;
    var cc=ntCfg();cc.last=t;jSet(NT,cc);});
}
function ntTest(){
  if(!ntSup()){toast('此瀏覽器不支援通知','no');return;}
  if(Notification.permission!=='granted'){
    Notification.requestPermission().then(function(p){
      if(p==='granted')ntTest();else toast('未取得通知權限','no');});
    return;
  }
  var t=twStr();
  var c=jGet(NTC,null);
  var list=(c&&c.date===t)?c.rows:todayRows.filter(function(r){return r.date===t;});
  var eng=ENGNAME.trim();
  if(eng)list=list.filter(function(r){return String(r.engineer||'').trim()===eng;});
  var m=ntText(t,list);
  if(showNotif(m.title,m.body))toast('已發送測試通知','ok');
  else toast('無法發送通知','no');
}
function ntDiag(){
  var el=$('diag');if(!el)return;
  if(el.innerHTML){el.innerHTML='';return;}
  var c=ntCfg();
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  var perm=ntSup()?Notification.permission:'不支援';
  var t=twStr();
  var cc=jGet(NTC,null);
  var n=(cc&&cc.date===t)?cc.rows.length:0;
  function r(l,v,ok){
    return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">'
      +'<span style="color:var(--tx3)">'+l+'</span><b style="color:'
      +(ok===true?'var(--accT)':ok===false?'var(--err)':'var(--tx)')+'">'+he(v)+'</b></div>';
  }
  var why=!c.on?'提醒開關沒開。'
    :perm!=='granted'?'沒有通知權限，請重新開啟開關授權。'
    :(isIOS&&!standalone)?'iPhone 必須從主畫面圖示開啟才會跳通知。'
    :(n===0&&!c.notifyEmpty)?'今天沒有你的行程，而「沒有行程時仍提醒」是關閉的，所以不會跳。'
    :(c.last===t)?'今天已經提醒過了（同一天只提醒一次）。'
    :'設定正常。若時間已過卻沒跳，多半是當時 App 已完全關閉。';
  el.innerHTML='<div class="card" style="margin-top:10px">'
    +r('提醒開關',c.on?'已開啟':'未開啟',!!c.on)
    +r('通知權限',perm==='granted'?'已允許':perm==='denied'?'已封鎖':'尚未詢問',perm==='granted')
    +(isIOS?r('加入主畫面',standalone?'是':'否（必須）',standalone):'')
    +r('Service Worker',SWREG?'已就緒':'載入中／不支援',!!SWREG)
    +r('提醒時間',c.time+(c.skipWeekend?'（六日不提醒）':''))
    +r('上次提醒',c.last||'尚未提醒過')
    +r('今天行程',n+' 筆',n>0||c.notifyEmpty)
    +r('目前時間',stamp(new Date()))
    +'<p class="hint" style="margin-top:10px">'+he(why)+'</p>'
    +'<button class="btn btn-sm btn-full" style="margin-top:10px" onclick="ntReset()">清除「今天已提醒」重測</button></div>';
}
function ntReset(){
  var c=ntCfg();c.last='';jSet(NT,c);
  toast('已清除，若已過提醒時間，30 秒內會跳通知','ok',4000);
  ntTick();ntDiag();ntDiag();
}
</script>
</body>
</html>
