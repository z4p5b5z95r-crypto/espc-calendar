/** CSS 角度漸層換算成 canvas 的起訖點（正方形） */
function icGrad(ctx,S,deg){
  var r=deg*Math.PI/180,vx=Math.sin(r),vy=-Math.cos(r);
  var L=S*(Math.abs(vx)+Math.abs(vy))/2;
  return ctx.createLinearGradient(S/2-vx*L,S/2-vy*L,S/2+vx*L,S/2+vy*L);
}
function icLogoImg(px){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="'+px+'" height="'+px+'">'
    +ICON.logo.replace(/currentColor/g,'#F36F21')+'</svg>';
  return new Promise(function(ok,no){
    var im=new Image();
    im.onload=function(){ok(im);};im.onerror=no;
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
/** 畫一張 S×S 圖示；比例對照登入頁 .glass（88px 方塊、48px 標記） */
function drawAppIcon(S){
  var cv=document.createElement('canvas');cv.width=cv.height=S;
  var ctx=cv.getContext('2d'),k=S/88;
  ctx.fillStyle='#f4f4f5';ctx.fillRect(0,0,S,S);
  // 玻璃本體（疊在淺灰底上）
  var g=icGrad(ctx,S,145);
  g.addColorStop(0,'rgba(255,255,255,.72)');g.addColorStop(1,'rgba(255,255,255,.34)');
  ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  // 色團：CSS 裡 z-index:-1 在玻璃底色之上、高光之下；CSS 用 blur，這裡用放射漸層
  function blob(x,y,r,c){
    var g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba('+c+',1)');g.addColorStop(.4,'rgba('+c+',.8)');g.addColorStop(.75,'rgba('+c+',.25)');g.addColorStop(1,'rgba('+c+',0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  }
  ctx.globalAlpha=.5; blob(22*k,18*k,48*k,'243,111,33');
  ctx.globalAlpha=.42;blob(71*k,79*k,44*k,'119,120,123');
  ctx.globalAlpha=1;
  // 底部內光
  g=ctx.createLinearGradient(0,S,0,S-18*k);
  g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  // 上緣高光
  g=icGrad(ctx,S,160);
  g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(.42,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  // 橘色日曆標記＋投影
  var px=Math.round(48*k);
  return icLogoImg(px).then(function(im){
    var s=px/48;
    ctx.save();
    ctx.shadowColor='rgba(243,111,33,.3)';ctx.shadowOffsetY=2*s;ctx.shadowBlur=4*s;
    ctx.drawImage(im,(S-px)/2,(S-px)/2,px,px);
    ctx.restore();
    return cv;
  });
}

/* ══ 資料載入 ══ */
function todayRange(t){
  var d=new Date(t+'T00:00:00');
  var me=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
  var d15=new Date(d);d15.setDate(d15.getDate()+15);
  var m15=d15.getFullYear()+'-'+p2(d15.getMonth()+1)+'-'+p2(d15.getDate());
  return me>m15?me:m15;
}

var TODAY_SEQ=0;
function loadToday(force,retry){
  var t=twStr();
  var sk=scopeKey();
  if(!force&&todayFor===t&&todayScope===sk){render();return;}
  var onTab=(tab==='today'&&!sub);      // 在別的頁籤時只默默更新，不動版面
  var ck='today'+(sk?'_'+sk:'');
  var seq=++TODAY_SEQ;
  function mine(){return seq===TODAY_SEQ&&sk===scopeKey();}
  todayScope=sk;
  var c=force?null:cGet(ck);
  if(c&&c.date===t&&c.rows){paintToday(t,c.rows);}
  else{
    if(onTab)$('page').innerHTML=loader('載入今日行程…');
    c=null;
  }
  var o=scopeOpts({dateFrom:t,dateTo:todayRange(t)});
  if(c&&c.version)o.version=c.version;
  gas('getData',TOKEN,o).then(function(r){
    if(!r||!r.ok){
      if(mine()&&!c&&tab==='today'&&!sub)
        $('page').innerHTML='<div class="empty">'+he((r&&r.error)||'載入失敗')+'</div>';
      return;
    }
    cVer(r.version);
    var list;
    if(r.unchanged){
      if(!c||!c.rows){
        if(!retry){loadToday(true,true);return;}   // 沒有快取卻說沒變 → 重抓
        list=[];
      }else list=c.rows;
    }else{
      list=r.rows||[];
      cSet(ck,{date:t,version:r.version||'',rows:list});
    }
    if(!mine())return;
    paintToday(t,list);
    if(sk)prefetch('today',{dateFrom:t,dateTo:todayRange(t),date:t});   // 背景補齊全部
  }).catch(function(){
    if(mine()&&!c&&tab==='today'&&!sub)
      $('page').innerHTML='<div class="empty">載入失敗，請重試</div>';
  });
}
function paintToday(t,all){
  normRows(all);
  todayRows=(all||[]).filter(passF);
  todayFor=t;
  jSet(NTC,{date:t,rows:(all||[]).filter(function(r){return r.date===t;})});
  if(tab==='today'&&!sub)render();
}

/* ══ 下載範圍 ══════════════════════════════════════
   有工程師或「只看我的」條件時，先只抓這個人的資料（快很多），
   再在背景把整月抓回來放快取，之後清掉篩選就不用再等。       */
var allScope='',todayScope='',calLoading=false,MONTH_DONE={};
function scopeKey(){return (F.en?'e:'+F.en:'')+(F.st?'s:'+F.st:'');}
function scopeOpts(o){
  if(F.en)o.engineer=F.en;
  if(F.st)o.person=F.st;
  return o;
}
/** 背景把完整資料抓回來存快取，不動畫面 */
/** 背景抓資料存進快取，不動畫面。useScope=true 表示只抓目前篩選到的人 */
function prefetch(key,o,useScope){
  var c=cGet(key);
  if(c&&c.version&&c.version===cVer())return;     // 快取已是最新
  var q={dateFrom:o.dateFrom,dateTo:o.dateTo};
  if(useScope)scopeOpts(q);
  if(c&&c.version)q.version=c.version;
  gas('getData',TOKEN,q).then(function(r){
    if(!r||!r.ok||r.unchanged)return;
    var v={version:r.version||'',rows:r.rows||[]};
    if(o.date)v.date=o.date;
    cSet(key,v);
  }).catch(function(){});
}

/** 月曆版面（固定 6 週）涵蓋的日期範圍：含前後月份露出的日子 */
function gridRange(y,m){
  var f=new Date(y,m,1);f.setDate(1-f.getDay());
  var t=new Date(f);t.setDate(f.getDate()+41);
  var ds=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
  return {from:ds(f),to:ds(t)};
}
/** 把某年某月抓進快取（含目前的篩選範圍），滑過去就不用等 */
function prefetchMonth(y,m){
  if(m<0){m=11;y--;}else if(m>11){m=0;y++;}
  var ym=y+'-'+p2(m+1);
  var sk=scopeKey();
  var gr=gridRange(y,m);
  prefetch('g_'+ym+(sk?'_'+sk:''),{dateFrom:gr.from,dateTo:gr.to},true);
}
/** 停在某個月時，順手把前後一個月備好 */
function prefetchNeighbors(){
  var y=curY,m=curM;
  setTimeout(function(){prefetchMonth(y,m+1);},700);
  setTimeout(function(){prefetchMonth(y,m-1);},1400);
}

/* 每次月份請求都編號。連續換月或改篩選時，晚回來的舊請求只寫快取、
   不准畫面，否則會出現「轉圈停了卻說沒排程，過幾秒才跳出來」 */
var MONTH_SEQ=0;
function loadMonth(force,retry){
  var y=curY,m=curM;
  var ym=y+'-'+p2(m+1);
  var sk=scopeKey();
  var key='g_'+ym+(sk?'_'+sk:'');           // 整個月曆版面（含前後月份露出的日子）
  var gr=gridRange(y,m),first=gr.from,last=gr.to;
  var onTab=(tab==='cal'&&!sub);        // 在別的頁籤時只默默更新，不動版面
  var seq=++MONTH_SEQ;
  /** 這次的結果還算不算「現在要看的」 */
  function mine(){return seq===MONTH_SEQ&&y===curY&&m===curM&&sk===scopeKey();}
  allScope=sk;
  var c=force?null:cGet(key);
  if(c&&c.rows){calLoading=false;paintMonth(c.rows,y,m,sk);prefetchNeighbors();}
  else{
    calLoading=true;
    if(onTab)render();          // 先把日期格子畫出來，行程位置放轉圈
    c=null;
  }
  var o=scopeOpts({dateFrom:first,dateTo:last});
  if(c&&c.version)o.version=c.version;
  gas('getData',TOKEN,o).then(function(r){
    if(!r||!r.ok){
      if(!mine())return;
      calLoading=false;
      if(!c){toast((r&&r.error)||'載入失敗','no');paintMonth([],y,m,sk);}
      else paintMonth(c.rows,y,m,sk);
      return;
    }
    cVer(r.version);
    var list;
    if(r.unchanged){
      // 資料沒變 → 用「這個月」的快取，不能拿畫面上現有的 allRows 充當
      if(!c||!c.rows){
        if(!retry){loadMonth(true,true);return;}   // 沒有快取卻說沒變 → 重抓完整資料
        list=[];
      }else list=c.rows;
    }else{
      list=r.rows||[];
      cSet(key,{version:r.version||'',rows:list});
    }
    if(!mine())return;            // 已經換月或改篩選了，只留快取不動畫面
    calLoading=false;
    paintMonth(list,y,m,sk);
    if(sk)prefetch('g_'+ym,{dateFrom:first,dateTo:last});   // 背景補齊整月（不分人）
    prefetchNeighbors();                                    // 背景備好前後一個月
  }).catch(function(){
    if(!mine())return;
    calLoading=false;
    if(!c&&tab==='cal'&&!sub)$('page').innerHTML='<div class="empty">載入失敗，請重試</div>';
    else if(c)paintMonth(c.rows,y,m,sk);
  });
}
/** y/m/sk 是這批資料真正屬於的月份與篩選範圍 */
function paintMonth(list,y,m,sk){
  if(typeof y!=='number')y=curY;
  if(typeof m!=='number')m=curM;
  if(typeof sk!=='string')sk=scopeKey();
  MONTH_DONE[y+'-'+p2(m+1)+(sk?'_'+sk:'')]=1;
  if(y!==curY||m!==curM||sk!==scopeKey())return;   // 不是現在要看的就不進畫面
  allRows=normRows(list||[]);
  rows=allRows.filter(passF);
  var t=twStr(),c=jGet(NTC,null);
  var _tc=cGet('today'+(sk?'_'+sk:''))||cGet('today');
  if(c&&c.date===t)todayRows=normRows((_tc&&_tc.rows)||c.rows).filter(passF);
  if(tab==='cal'&&!sub)render();      // 只有停在行事曆時才重畫
  openDeep(y,m);
}

function moveM(d){
  curM+=d;if(curM>11){curM=0;curY++;}if(curM<0){curM=11;curY--;}
  allRows=[];rows=[];calLoading=true;saveTab();   // 先進載入狀態，不會閃「沒有排程」
  slidePage(d,function(){render();loadMonth();});
}
function goToday(){
  var n=twDate(),d=(n.getFullYear()*12+n.getMonth())>=(curY*12+curM)?1:-1;
  curY=n.getFullYear();curM=n.getMonth();
  allRows=[];rows=[];calLoading=true;saveTab();   // 先進載入狀態，不會閃「沒有排程」
  slidePage(d,function(){render();loadMonth();});
}

/* 別名：Excel 上寫的暱稱／英文名 → 正式姓名
   例如排程表寫「Apple」，實際上是「張愷瓴」 */
var ALIAS={};
function normName(v){
  var k=String(v||'').trim();
  if(!k)return '';
  return ALIAS[k.toLowerCase()]||k;
}
/** 把整批行程的人名換成正式姓名（就地修改） */
/* 排程表有時把兩個人寫在同一格（「白奇正 郭偉信」）。
   只要拆開後有人對得上通訊錄，就拆成兩個人；都對不上才維持原樣。 */
function splitNames(v){
  var raw=String(v||'').trim();
  if(!raw)return [];
  var parts=raw.split(/[、，,;；\/／\s]+/).map(function(x){return normName(x.trim());})
    .filter(Boolean);
  if(parts.length<2)return [normName(raw)];
  var known=parts.some(function(x){return !!TEAM.hasOwnProperty(x)||PHONE.hasOwnProperty(x);});
  return known?parts:[normName(raw)];
}
function normRows(list){
  (list||[]).forEach(function(r){
    if(r.engineer)r.engineer=normName(r.engineer);
    if(r.applicant)r.applicant=normName(r.applicant);
    if(r.staff&&r.staff.length){
      var out=[],seen={};
      r.staff.forEach(function(x){
        splitNames(x).forEach(function(n){if(n&&!seen[n]){seen[n]=1;out.push(n);}});
      });
      r.staff=out;
    }
  });
  return list||[];
}

function applyStaff(l){
  // admin 是系統帳號，不該出現在通訊錄或任何人員清單
  STAFF=(l||[]).filter(function(s){
    return s&&String(s.name||'').trim()&&String(s.name).trim().toLowerCase()!=='admin';});
  PHONE={};SAFETY={};ALIAS={};TEAM={};STAFF_READY=true;
  STAFF.forEach(function(s){
    if(!s.name)return;
    PHONE[s.name]=s.phone||'';
    TEAM[s.name]=(s.team||'').trim();
    var cs=(s.certs||[]).map(function(o){
      return {type:String(o.t||'').trim(),cert:String(o.c||'').trim(),
              train:String(o.d||'').trim(),years:o.y,remind:(o.n!==false)};
    }).filter(function(o){return o.type||o.cert||o.train;});
    if(!cs.length&&(s.safety||s.trainDate||s.certNo))      // 相容舊資料
      cs=[{type:s.safety||'',cert:s.certNo||'',train:s.trainDate||''}];
    if(cs.length)SAFETY[s.name]=cs;
    String(s.alias||'').split(/[,、，;；\/\s]+/).forEach(function(a){
      a=a.trim();
      if(a&&a!==s.name)ALIAS[a.toLowerCase()]=s.name;
    });
  });
  // 別名可能在行程載入後才拿到，補正已在手上的資料
  ENGNAME=normName(ENGNAME);
  if(F.en)F.en=normName(F.en);
  normRows(allRows);normRows(todayRows);
}

/* ══ 篩選 ══ */
/** 這筆行程有沒有這個人出勤：只看監測人員與申報人員，工程師欄不算 */
function hasPerson(r,n){
  if(!n)return true;
  if(r.applicant===n)return true;
  if(r.staff&&r.staff.length&&r.staff.indexOf(n)>=0)return true;
  return false;
}
/** 把數量換成數字；「-1+1」這種寫法會相加。認不出來回 null（例如含文字或空白） */
function qtyNum(v){
  var s=String(v==null?'':v).trim();
  if(!s)return null;
  if(!/^[-+0-9.\s]+$/.test(s))return null;
  var m=s.match(/[-+]?\d+(\.\d+)?/g);
  if(!m)return null;
  var sum=0;
  m.forEach(function(x){sum+=parseFloat(x);});
  return Math.round(sum*1000)/1000;
}

function passF(r){
  // 現場人員：數量是 0 代表當天沒有要採的，不用列出來；PM 仍然看得到
  if(ROLE==='sampler'&&qtyNum(r.qty)===0)return false;
  if(F.rg&&(r.region||'')!==F.rg)return false;
  if(F.en&&r.engineer!==F.en)return false;
  if(F.st&&!hasPerson(r,F.st))return false;
  if(F.ty.length&&F.ty.indexOf(tyItem(r.type))<0)return false;
  if(F.q){
    var q=F.q.toLowerCase();
    var bits=[r.project,r.projectNo,r.location,r.reportNum,r.notes,
              r.type,r.engineer,r.car,r.equipment,r.applicant];
    if(r.staff&&r.staff.length)bits=bits.concat(r.staff);
    if(bits.join(' ').toLowerCase().indexOf(q)<0)return false;
  }
  return true;
}
var FT={rg:'',en:'',ty:[],q:'',st:''};   // 面板上的暫存條件，按「篩選」才套用

/* 篩選面板的類別選項：以前只從「目前畫面上載入的行程」收集，
   開了「只看我的」或只載了這個月，就會漏掉其他類別。改成向後端要排程裡出現過的全部類別。 */
var ALL_TYPES=[],TYPE_CNT={};
(function(){var c=jGet(CK+'types');if(c&&c.types){ALL_TYPES=c.types;TYPE_CNT=c.counts||{};}})();
function loadTypes(){
  var c=jGet(CK+'types');
  gas('getTypes',TOKEN,(c&&c.version)||'').then(function(r){
    if(!r||!r.ok||r.unchanged)return;
    ALL_TYPES=r.types||[];TYPE_CNT=r.counts||{};
    jSet(CK+'types',{version:r.version||'',types:ALL_TYPES,counts:TYPE_CNT});
    var sh=$('ov');
    if(sh&&sh.classList.contains('open')&&$('f-q'))paintFilter();   // 面板開著就補上新選項
  }).catch(function(){});
}
function openFilter(){
  loadTypes();
  FT={rg:F.rg,en:F.en,ty:F.ty.slice(),q:F.q||'',st:F.st||''};
  paintFilter();
  $('ov').classList.add('open');
}

var FSRC=[];   // 篩選選項的來源；即時篩選重新載入資料時手上暫時沒資料，先沿用上一份，選項才不會消失
function paintFilter(){
  var engs=[],tys=[],sts=[],s1={},s2={},s3={};
  var src=allRows.concat(todayRows);
  if(src.length)FSRC=src;else src=FSRC;
  src=src.concat(ALL_TYPES.map(function(t){return {type:t};}));   // 排程裡所有類別都列出來
  src.forEach(function(r){
    if(r.engineer&&!s1[r.engineer]){s1[r.engineer]=1;engs.push(r.engineer);}
    if(r.type){
      var it=tyItem(r.type);
      if(!s2[it]){s2[it]={};tys.push(it);TY_ITEM_G[it]=typeGroup(r.type);}
      s2[it][r.type]=1;                     // 記下這個項目涵蓋哪些原始寫法
    }
    (r.staff||[]).forEach(function(n){
      if(n&&!s3[n]){s3[n]=1;sts.push(n);}
    });
  });
  if(FT.en&&engs.indexOf(FT.en)<0)engs.push(FT.en);
  if(FT.st&&sts.indexOf(FT.st)<0)sts.push(FT.st);
  FT.ty.forEach(function(t){if(tys.indexOf(t)<0)tys.push(t);});
  engs.sort();
  sts.sort(function(a,b){return a.localeCompare(b,'zh-Hant');});
  // 依歸併規則的順序排（空品車固定第一），規則外的寫法排在該組最後
  tys.sort(function(a,b){return tyOrder(a)-tyOrder(b)||a.localeCompare(b,'zh-Hant');});

  var h='<div class="shh" style="align-items:center">'
    +'<h3 style="flex-shrink:0">篩選</h3>'
    +'<div style="display:flex;gap:7px;flex:1;justify-content:flex-end">'
    +'<button class="btn btn-sm" onclick="clearFilter()">清除</button>'
    +'<button class="btn btn-p btn-sm" onclick="applyFilter()">完成'
    +(nFT()?'（'+nFT()+'）':'')+'</button></div></div>'
    +'<p class="lb">關鍵字　<span style="color:var(--tx2)">專案、點位、報告編號、備註</span></p>'
    +'<input class="fld" id="f-q" value="'+he(FT.q||'')+'" placeholder="輸入任意關鍵字" style="margin-bottom:16px">'
    +'<p class="lb">地區</p><select class="fld" id="f-rg" style="margin-bottom:16px">'
    +[''].concat(rgShow(FT.rg)).map(function(o){
      return '<option value="'+o+'"'+(FT.rg===o?' selected':'')+'>'+(o||'全部地區')+'</option>';}).join('')
    +'</select>'
    +'<p class="lb">PM</p>'
    +pickBtn('en',FT.en,'全部 PM')
    +'<p class="lb">現場　<span style="color:var(--tx2)">含申報人員</span></p>'
    +pickBtn('st',FT.st,'全部現場人員')
    +'<p class="lb">類別　<span style="color:var(--tx2)">可複選</span></p>'
    +'<div class="opts" style="margin-bottom:4px">'
    +'<button class="ob'+(FT.ty.length?'':' on')+'" onclick="tyPick(\'\')">全部</button></div>'
    +'<input class="fld tysrch" id="f-tq" placeholder="搜尋類別，例如：水、噪音" value="'+he(TYQ)+'">'
    +'<div id="tyarea">'+tyAreaHTML(tys,s2)+'</div>'   // 「開啟時先篩選自己」的開關只留在「更多」頁
    +'<div style="height:8px"></div>';
  $('sheetin').innerHTML=h;
  $('f-rg').onchange=function(){FT.rg=this.value;paintFilter();};
  var tq=$('f-tq');
  if(tq)tq.oninput=function(){TYQ=this.value;$('tyarea').innerHTML=tyAreaHTML(TY_LAST.tys,TY_LAST.raw);};

  var q=$('f-q');
  if(q){
    q.oninput=function(){FT.q=this.value;liveFilter(350);};   // 打字時不重畫面板（避免失焦），停手 0.35 秒後背景套用
    q.onkeydown=function(e){if(e.key==='Enter'){FT.q=this.value;applyFilter();}};
  }
  liveFilter(0);                          // 面板上每改一個條件，背後的頁面就跟著篩
}
/* 即時篩選：不用按「完成」，條件一改背後的今日／月曆就更新 */
var LIVE_T=0;
function sameF(a,b){
  return a.rg===b.rg&&a.en===b.en&&a.st===b.st&&(a.q||'')===(b.q||'')
    &&a.ty.length===b.ty.length&&a.ty.every(function(t){return b.ty.indexOf(t)>=0;});
}
function liveFilter(ms){
  clearTimeout(LIVE_T);
  LIVE_T=setTimeout(function(){
    var el=$('f-q');if(el)FT.q=el.value;
    var nf={rg:FT.rg,en:FT.en,ty:FT.ty.slice(),q:(FT.q||'').trim(),st:FT.st||''};
    if(sameF(nf,F))return;
    F=nf;refetch();
  },ms||0);
}
/* ══ 測項分類 ══════════════════════════════════
   用關鍵字判斷，之後 Excel 出現新測項也會自動歸類 */
var TY_GROUPS=['空品','水質','噪音振動','交通','土壤廢棄物','生態','其他'];
/* 監測項目歸併：Excel 裡同一種監測有好幾種寫法（地下水／地下水質／地下水質(水位)…），
   篩選時合成一個項目。每組由上往下比對，先中先用（具體的放前面）；
   都對不到就保留原寫法自成一項，不會漏掉。新寫法要歸到哪，加在這裡就好。 */
var TY_ITEMS={
  '空品':[['空品車',/空品/],['TSP 含鹽類',/TSP.*鹽/i],['落塵量',/落塵/],
          ['粒狀物',/TSP|PM\s*10|PM\s*2\.?5|懸浮微粒|粉塵/i],['惡臭',/臭/],['戴奧辛',/戴奧辛/],
          ['揮發性有機物',/VOC|揮發/i],['氣象',/風速|氣象/],['排放管道',/排放|燃燒|煙道/],
          ['空氣品質',/空氣/]],
  '水質':[['地下水',/地下水/],['飲用水',/飲用水/],['自來水',/自來水/],['放流水',/放流/],
          ['海域水質',/海域|海水/],['納管水質',/納管/],['地面水',/地面水|河川|逕流/],
          ['山泉水',/山泉/],['冷卻水塔',/冷卻水/],['雨水',/雨水/],['除礦水',/除礦/],
          ['廢水',/廢水/],['水位',/水位/]],
  '噪音振動':[['營建低頻',/營建.*低頻|低頻.*營建/],['營建噪音',/營建/],['低頻噪音',/低頻/],
          ['噪音振動',/噪音|振動/]],
  '交通':[['交通流量',/流量|車流/],['行駛速率',/速率|延滯|旅行時間/],['交通錄影',/錄影/],['路況',/路況/]],
  '土壤廢棄物':[['土壤',/土壤/],['底泥',/底泥/],['廢棄物',/廢棄物|事業廢/],['毒化物',/毒化物/]]
};
var TY_ITEM_C={};
/** 原始類別 → 歸併後的監測項目名稱 */
function tyItem(t){
  t=String(t||'').trim();
  if(!t)return '';
  if(TY_ITEM_C[t]!==undefined)return TY_ITEM_C[t];
  if(/巡/.test(t))return (TY_ITEM_C[t]=t);         // 巡查、巡檢類是另一種工作，不併進監測項目
  var rules=TY_ITEMS[typeGroup(t)]||[],out=t;
  for(var i=0;i<rules.length;i++){if(rules[i][1].test(t)){out=rules[i][0];break;}}
  return (TY_ITEM_C[t]=out);
}
function tyOrder(n){
  var r=TY_ITEMS[itemGroup(n)]||[];
  for(var i=0;i<r.length;i++)if(r[i][0]===n)return i;
  return 99;
}
/** 歸併後的項目 → 所屬大類（用項目裡任一原始寫法判斷） */
var TY_ITEM_G={};
function itemGroup(n){return TY_ITEM_G[n]||typeGroup(n);}
function typeGroup(t){
  t=String(t||'');
  if(/交通|行駛速率|車流|路況/.test(t))return '交通';
  if(/噪音|振動|低頻/.test(t))return '噪音振動';
  if(/土壤|底泥|廢棄物|毒化物|事業廢/.test(t))return '土壤廢棄物';
  if(/水|pH/i.test(t))return '水質';      // 自來水、冷卻水塔、雨水 pH、除礦水、廢水…名稱有「水」都算水質
  if(/空品|空氣|特殊項|PM|TSP|落塵|惡臭|戴奧辛|粉塵|VOC|揮發|臭氧|風速|氣象|排放|燃燒/i.test(t))return '空品';   // 特殊項歸空品
  if(/植物|動物|生態|鳥|魚|昆蟲|底棲/.test(t))return '生態';
  return '其他';
}

/* ══ 人員選擇器 ══════════════════════════════════
   先用組別頁籤縮小範圍，再從網格挑人；也可以直接搜尋 */
var PK={who:'',q:'',team:''};

function pickBtn(who,val,empty){
  return '<button class="fld" style="margin-bottom:16px;display:flex;align-items:center;'
    +'justify-content:space-between;text-align:left" onclick="openPick(\''+who+'\')">'
    +'<span'+(val?'':' style="color:var(--tx3)"')+'>'+he(val||empty)
    +(val&&TEAM[val]?' <span style="font-size:11px;color:var(--tx3)">'+he(TEAM[val])+'</span>':'')
    +'</span><span style="color:var(--tx3);font-size:12px">選擇 ›</span></button>';
}
function openPick(who){
  PK={who:who,q:'',team:''};
  paintPicker();
}
function closePick(){PK.who='';paintFilter();}

/** 組別看起來是 PM（EIA-T-PM、SP-PM…） */
function isPMTeam(n){return /(^|[-_ ])PM$|PM[-_ ]/i.test(TEAM[n]||'');}
/** 這個人算不算 PM：組別是 PM，或曾經出現在行程的 PM 欄 */
function isPM(n){
  if(isPMTeam(n))return true;
  var rs=allRows.concat(todayRows);
  for(var i=0;i<rs.length;i++)if(rs[i].engineer===n)return true;
  return false;
}
/** 手上所有行程資料：畫面上的＋本機快取（含背景抓回來的整月不分人資料） */
function allKnownRows(){
  var out=allRows.concat(todayRows);
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k||k.indexOf(CK+'m_')!==0&&k.indexOf(CK+'today')!==0)continue;
      var c=jGet(k,null);
      if(c&&c.rows&&c.rows.length)out=out.concat(c.rows);
    }
  }catch(e){}
  return out;
}
/** 曾經出現在現場或申報欄的人（跨快取，所以篩選中也看得到其他人） */
function siteNames(){
  var m={};
  allKnownRows().forEach(function(r){
    splitNames(r.applicant).forEach(function(n){if(n)m[n]=1;});
    (r.staff||[]).forEach(function(x){
      splitNames(x).forEach(function(n){if(n)m[n]=1;});
    });
  });
  return m;
}

/** 可選的人：通訊錄全部人員，再補上行程裡出現過但通訊錄沒建的人 */
function pickNames(){
  var out=[],seen={};
  function add(n){
    n=String(n||'').trim();
    if(!n||n.toLowerCase()==='admin')return;     // 系統帳號不列出
    if(!seen[n]){seen[n]=1;out.push(n);}
  }
  if(PK.who==='en'){
    // PM 欄只列 PM，列不出來時才退回全部，免得變成空清單
    STAFF.forEach(function(s){if(isPM(s.name))add(s.name);});
    allRows.concat(todayRows).forEach(function(r){add(r.engineer);});
    if(!out.length)STAFF.forEach(function(s){add(s.name);});
  }else{
    // 現場欄只列真的跑過現場或申報的人；通訊錄其他人（PM、內勤）不列
    var seenSite=siteNames();
    STAFF.forEach(function(s){if(seenSite[s.name])add(s.name);});
    Object.keys(seenSite).forEach(add);
  }
  var cur=(PK.who==='en'?FT.en:FT.st);
  if(cur)add(cur);
  out.sort(function(a,b){
    var ta=TEAM[a]||'zzz',tb=TEAM[b]||'zzz';
    if(ta!==tb)return ta.localeCompare(tb,'zh-Hant');
    return a.localeCompare(b,'zh-Hant');
  });
  return out;
}
function pickTeams(names){
  var out=[],seen={},blank=false;
  names.forEach(function(n){
    var t=TEAM[n]||'';
    if(!t){blank=true;return;}
    if(!seen[t]){seen[t]=1;out.push(t);}
  });
  out.sort(function(a,b){return a.localeCompare(b,'zh-Hant');});
  if(blank)out.push('_n');
  return out;
}
function paintPicker(){
  var names=pickNames(),teams=pickTeams(names);
  var cur=(PK.who==='en'?FT.en:FT.st);
  var ttl=(PK.who==='en'?'選擇 PM':'選擇現場人員');
  var h='<div class="shh" style="align-items:center">'
    +'<button class="ib" onclick="closePick()">‹</button>'
    +'<h3 style="flex:1;font-size:17px">'+ttl+'</h3>'
    +'<button class="btn btn-sm" onclick="pickSet(\'\')">全部</button></div>'
    +'<input class="fld" id="pk-q" value="'+he(PK.q)+'" placeholder="搜尋姓名或組別" style="margin-bottom:10px">'
    +'<div class="etab">'
    +'<button class="et'+(PK.team?'':' on')+'" onclick="pickTeam(\'\')">全部</button>'
    +teams.map(function(t){
      return '<button class="et'+(PK.team===t?' on':'')+'" onclick="pickTeam(\''+esc(t)+'\')">'
        +he(t==='_n'?'未分組':t)+'</button>';}).join('')
    +'</div><div id="pkgrid">'+pickGridHTML()+'</div>';
  $('sheetin').innerHTML=h;
  var q=$('pk-q');
  if(q)q.oninput=function(){PK.q=this.value;paintPickGrid();};
}
function pickGridHTML(){
  var q=PK.q.trim().toLowerCase();

  var list=pickNames().filter(function(n){
    var t=TEAM[n]||'';
    if(PK.team==='_n'){if(t)return false;}

  if(!list.length)return '<div class="empty">查無符合的人員</div>';

      +he(n)+'<small>'+he(TEAM[n]||'未分組')+'</small></button>';
  }).join('')+'</div>';
}
function paintPickGrid(){

function pickTeam(t){PK.team=t;paintPicker();}
function pickSet(n){

/** 目前資料裡出現過的所有測項 */
function allTypes(){
  var out=[],seen={};
  allRows.concat(todayRows).forEach(function(r){
    var it=tyItem(r.type);
    if(it&&!seen[it]){seen[it]=1;out.push(it);TY_ITEM_G[it]=typeGroup(r.type);}

/** 清掉 Service Worker 與快取後重新載入，用來擺脫抓到舊檔的情況 */
function hardReload(){
  var jobs=[];
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){return r.unregister();}));
      }));
  }catch(e){}
  try{
    if(window.caches&&caches.keys)
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){return caches.delete(k);}));
      }));
  }catch(e){}
  Promise.all(jobs).catch(function(){}).then(function(){
    var u=location.href.split('#')[0].split('?')[0];
    location.replace(u+'?v='+Date.now());
  });
}

/* ══ 換頁動畫 ══════════════════════════════════════
   舊內容先滑出去，新內容再從另一側滑進來 */
var SLIDE_MS=300;
var SLIDE_EASE='transform .3s cubic-bezier(.28,.78,.32,1)';
function raf(fn){
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(fn);
  else setTimeout(fn,16);
}
/** 舊畫面與新畫面同時橫移，中間不會有空白 */
function slidePage(dir,fn){
  var el=$('page'),wrap=$('pwrap');
  if(!el||!wrap||!wrap.appendChild||typeof document.createElement!=='function'||!el.style){
    fn();return;
  }
  var g,h0=el.offsetHeight||0;
  try{
    g=document.createElement('div');
    g.className='pghost';
    g.innerHTML=el.innerHTML;
    wrap.appendChild(g);
  }catch(e){fn();return;}

  fn();                                   // 立刻換成新內容

  // 動畫期間鎖住高度，兩張畫面高度不同也不會上下抽動
  var h1=el.offsetHeight||0;
  if(wrap.style)wrap.style.minHeight=Math.max(h0,h1)+'px';

  var into=(dir>0?'100%':'-100%');        // 新畫面從哪一側進來
  var away=(dir>0?'-100%':'100%');        // 舊畫面往哪一側離開
  el.style.transition='none';
  el.style.transform='translateX('+into+')';
  raf(function(){
    el.style.transition=SLIDE_EASE;
    el.style.transform='translateX(0)';
    g.style.transition=SLIDE_EASE;
    g.style.transform='translateX('+away+')';
  });
  setTimeout(function(){
    if(g&&g.parentNode)g.parentNode.removeChild(g);
    el.style.transition='';el.style.transform='';
    if(wrap.style)wrap.style.minHeight='';
  },SLIDE_MS+40);
}
/** 面板換日：內容直接換掉，再從對應方向滑進來 */
/** 換日：面板不關閉，內容直接換掉後滑入。
 *  只留一層，避免兩層毛玻璃疊在一起產生殘影。 */
function slideSheet(dir,fn){
  var sh=$('sheet'),pane=$('sheetin');
  fn();                                   // 內層換成新的一天
  pane=$('sheetin');
  if(!pane||!pane.style)return;
  if(sh)sh.scrollTop=0;

  pane.style.transition='none';
  pane.style.transform='translateX('+(dir>0?'24%':'-24%')+')';
  pane.style.opacity='0';
  raf(function(){
    pane.style.transition='transform .26s cubic-bezier(.28,.78,.32,1),opacity .16s ease-out';
    pane.style.transform='translateX(0)';
    pane.style.opacity='1';
  });
  setTimeout(function(){
    pane.style.transition='';pane.style.transform='';pane.style.opacity='';
  },300);
}

  if(e.touches&&e.touches.length!==1){_sw=null;return;}
  var t=e.touches?e.touches[0]:e;
  _sw={x:t.clientX,y:t.clientY,t:Date.now()};
}

  var dx=t.clientX-st.x,dy=t.clientY-st.y;

function rowKey(r){

  return [r.date,r.project,r.projectNo,r.type,r.location,r.reportNum,r.engineer,
          r.applicant,r.equipment,r.car,r.sampTime,r.qty,r.notes,st].join('|');

  });
  return out;
}

function gcPicker(){
  var gs=gcGroups(),deps=gcDeps(gs),sel=gcNames();
  if(!GC_DEP||!deps.some(function(d){return d.k===GC_DEP;}))GC_DEP=deps.length?deps[0].k:'';
  var h='<input class="fld" placeholder="搜尋姓名或組別" value="'+he(GC.q)+'" oninput="GC.q=this.value;gcSearch()" style="margin:4px 0 0">'
    +'<div class="cchips" id="gc-q"></div>';
  // 分類切換
  h+='<div class="gseg">'+deps.map(function(d){
    return '<button class="'+(d.k===GC_DEP?'on':'')+'" onclick="GC_DEP=\''+esc(d.k)+'\';render()">'+he(d.k)+'</button>';
  }).join('')+'</div>';
  var mine=gs.filter(function(g){return g.dep===GC_DEP;});
  var dn=mine.reduce(function(a,g){return a+g.ppl.length;},0),dc=mine.reduce(function(a,g){return a+gcCount(g);},0);
  h+='<div class="gcard"><div class="grh">'+he(GC_DEP)+' <small>'+mine.length+' 組・'+dn+' 人</small>'
    +'<a href="#" onclick="gcDep('+(dc===dn?'false':'true')+');return false">'+(dc===dn&&dn?'全不選':'全選')+'</a></div>';
  mine.forEach(function(g){
    var c=gcCount(g),n=g.ppl.length,op=!!GC.open[g.key];
    h+='<div class="grow'+(op?' open':'')+'"><span onclick="gcTeam(\''+esc(g.key)+'\')" style="display:flex;padding:4px;margin:-4px">'+gcCk(c,n)+'</span>'
      +'<span class="gt" onclick="GC.open[\''+esc(g.key)+'\']=!GC.open[\''+esc(g.key)+'\'];render()">'+he(g.tm)
      +'<span class="gn">'+(c&&c<n?c+'/':'')+n+' 人</span><span class="gcv'+(op?' on':'')+'">'+ic('right',14)+'</span></span></div>';
    if(op)h+='<div class="gmem">'+g.ppl.map(function(p){
      return '<button class="cchip'+(GC.ppl[p]?' on':'')+'" onclick="gcPerson(\''+esc(p)+'\')">'+he(p)+'</button>';}).join('')+'</div>';
  });
  h+='</div>';
  // 已選
  var picked=gs.filter(function(g){return gcCount(g);});
  h+='<div class="sec" style="display:flex">已選<span style="flex:1"></span>'
    +(sel.length?'<a href="#" style="color:var(--accT)" onclick="GC.ppl={};render();return false">全部清除</a>':'')+'</div>'
    +'<div class="gcard" style="padding:10px 12px">'+(picked.length?'<div class="cchips" style="margin:0">'+picked.map(function(g){
      return '<span class="gtok">'+he(g.tm)+'・'+gcCount(g)+(gcCount(g)<g.ppl.length?'/'+g.ppl.length:'')
        +'<i onclick="gcAll(\''+esc(g.key)+'\',false)">✕</i></span>';}).join('')+'</div>'
      :'<span class="hint">還沒選人：點組別前的圓圈選整組，點組名挑個人</span>')+'</div>';
  return h;
}
function gcastPage(){
  if(!STAFF_READY)return loader('載入通訊錄…');
  var gs=gcGroups(),deps=gcDeps(gs),sel=gcNames(),tpl=CAST_TPL||[];
  if(!GC_DEP||!deps.some(function(d){return d.k===GC_DEP;}))GC_DEP=deps.length?deps[0].k:'';
  var h=gcPicker(),picked=gs.filter(function(g){return gcCount(g);});
  // 內容
  h+='<div class="sec" style="display:flex">內容<span style="flex:1"></span><a href="#" style="color:var(--accT)" onclick="tplOpen(\'gc\');return false">編輯常用語</a></div>';
  if(tpl.length)h+='<div class="cchips">'+tpl.map(function(t,i){return '<button class="cchip" onclick="gcTpl('+i+')">'+he(t)+'</button>';}).join('')+'</div>';
  h+='<textarea class="fld" id="gc-t" rows="4" maxlength="300" placeholder="輸入要通知的內容…" style="margin-top:8px;resize:vertical;border-radius:16px;line-height:1.5"'
    +' oninput="GC.text=this.value;$(\'gc-n\').textContent=this.value.length">'+he(GC.text)+'</textarea>'
    +'<div class="row" style="margin-top:4px"><a href="#" style="font-size:13px;color:var(--accT)" onclick="gcTplAdd();return false">＋ 存成常用語</a>'
    +'<span style="flex:1"></span><span class="hint"><span id="gc-n">'+GC.text.length+'</span>/300</span></div>';
  // 發送紀錄：預設收起來，點開才看（最小化）
  if(INBOX.sent.length&&!GC_EMBED){
    h+='<button class="fold" style="margin-top:14px" onclick="SENT_OPEN=!SENT_OPEN;render()"><span>我發出的通知</span>'
      +'<span class="foldn">7 天內 '+INBOX.sent.length+' 則</span><span class="foldc'+(SENT_OPEN?' on':'')+'">'+ic('right',15)+'</span></button>';
    if(SENT_OPEN)h+='<div class="ibox">'+INBOX.sent.map(function(x){return castItem(x,true);}).join('')+'</div>';
  }
  // 底部固定：已選人數＋送出（留一段空白，最後一則紀錄不會被蓋住）
  h+='<div class="gpad"></div><div class="gdock"><div class="gdt"><b>已選 '+sel.length+' 人</b><br>'
    +he(picked.map(function(g){var c=gcCount(g);return g.tm+(c<g.ppl.length?'（'+c+' 人）':'');}).join('、')||'尚未選擇')+'</div>'
    +'<button class="btn btn-p"'+(GC.busy||!sel.length?' disabled':'')+' onclick="gcSend()">'+(GC.busy?'送出中…':'送出')+'</button></div>';
  setTimeout(gcSearch,0);
  return h;
}
function gcDep(on){gcGroups().forEach(function(g){if(g.dep===GC_DEP)g.ppl.forEach(function(n){GC.ppl[n]=on;});});render();}
function gcFind(k){var gs=gcGroups();for(var i=0;i<gs.length;i++)if(gs[i].key===k)return gs[i];return null;}
function gcTeam(k){var g=gcFind(k);if(!g)return;var all=gcCount(g)===g.ppl.length;g.ppl.forEach(function(n){GC.ppl[n]=!all;});render();}
function gcAll(k,on){var g=gcFind(k);if(!g)return;g.ppl.forEach(function(n){GC.ppl[n]=on;});render();}
function gcPerson(n){GC.ppl[n]=!GC.ppl[n];render();}
function gcSearch(){
  var el=$('gc-q');if(!el)return;
  var q=String(GC.q||'').trim().toLowerCase(),me=String(ENGNAME||'').trim();
  if(!q){el.innerHTML='';return;}
  var teams=gcGroups().filter(function(g){return g.tm.toLowerCase().indexOf(q)>=0;}).slice(0,6);
  var hit=STAFF.filter(function(s){var n=String(s.name||'');return n&&n!==me&&n.toLowerCase().indexOf(q)>=0;}).slice(0,12);
  el.innerHTML=(teams.map(function(g){var c=gcCount(g);
      return '<button class="cchip'+(c===g.ppl.length?' on':'')+'" onclick="gcTeam(\''+esc(g.key)+'\')">'+he(g.tm)+'<small>'+g.ppl.length+' 人</small></button>';}).join('')
    +hit.map(function(s){
      return '<button class="cchip'+(GC.ppl[s.name]?' on':'')+'" onclick="gcPerson(\''+esc(s.name)+'\')">'+he(s.name)
        +'<small>'+he((s.team||'').trim())+'</small></button>';}).join(''))||'<span class="hint">找不到</span>';
}
function gcTpl(i){var t=(CAST_TPL||[])[i];if(!t)return;GC.text=GC.text.trim()?GC.text.replace(/\s+$/,'')+'\n'+t:t;render();}
function gcTplAdd(){
  var t=String(GC.text||'').trim();
  if(!t){toast('先在下面輸入內容，再存成常用語','',2500);return;}
  CAST_TPL=CAST_TPL||[];
  if(CAST_TPL.indexOf(t)>=0){toast('已經有這則常用語','',2000);return;}
  if(CAST_TPL.length>=TPL_MAX){toast('常用語最多 '+TPL_MAX+' 則','no',3000);return;}
  CAST_TPL.push(t.slice(0,100));castTplSave();render();toast('已存成常用語','ok');
}
/* ══ 公告：管理員發布（可附 PDF），指定對象發布後第一次開 App 跳出公告視窗 ══ */
var ANN={inbox:[],sent:[],loaded:false,busy:false}, ANN_CHK=0, ANN_Q=[], ANN_TRY=0, ANN_OPEN={};
var ANNF={title:'',text:'',file:null,busy:false};
var ANN_PDF_MAX=10*1024*1024;
function annUnread(){return ANN.inbox.filter(function(x){return !x.read;}).length;}
function annLoad(force,cb){
  if(ANN.busy)return;
  ANN.busy=true;if(sub==='ann'&&!ANN.loaded)render();
  gas('annMine',TOKEN).then(function(r){
    ANN.busy=false;
    if(r&&r.ok){ANN.inbox=r.inbox||[];ANN.sent=r.sent||[];ANN.loaded=true;}
    if(sub==='ann'||(tab==='more'&&!sub))render();
    if(cb)cb();
  }).catch(function(){ANN.busy=false;if(sub==='ann')render();});
}
/** 開 App／切回前景：抓公告，有沒讀過的就依序跳出（最多每 30 秒查一次） */
function annCheck(){
  if(!TOKEN||Date.now()-ANN_CHK<30000)return;
  ANN_CHK=Date.now();
  annLoad(false,function(){
    ANN_Q=ANN.inbox.filter(function(x){return !x.read;}).reverse();   // 舊的先看
    ANN_TRY=0;if(ANN_Q.length)setTimeout(annPop,600);
  });
}
function annBusyUI(){return $('onb').classList.contains('open')||$('ov').classList.contains('open')||!!$('pdfv')||!!$('annv');}
function annPop(){
  if(!ANN_Q.length)return;
  if(annBusyUI()){if(++ANN_TRY<60)setTimeout(annPop,2500);return;}   // 等其他視窗關掉再跳
  annShow(ANN_Q[0],ANN_Q.length);
}
function annFmtSize(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function annAt(t){return String(t||'').slice(5,16).replace('-','/');}
/** 公告視窗：queue＝剩幾則（從清單點開時為 0） */
function annShow(x,queue){
  var old=$('annv');if(old)old.remove();
  var d=document.createElement('div');d.id='annv';
  d.innerHTML='<div class="anc"><div class="anh"><span class="antag">'+ic('file',14)+'公告</span>'
    +(queue>1?'<span class="hint">還有 '+(queue-1)+' 則</span>':'')+'</div>'
    +'<h2 class="ant">'+he(x.title)+'</h2><div class="anm">'+he(x.from)+'　'+annAt(x.at)+'</div>'
    +'<div class="anb">'+(x.text?'<div class="anx">'+he(x.text)+'</div>':'')
    +(x.pdf?'<button class="anp" onclick="pdfOpen(\''+x.id+'\')"><span class="anpi">PDF</span>'
      +'<span class="anpn"><b>'+he(x.pdf.name)+'</b><small>'+annFmtSize(x.pdf.size)+'・點開查看詳細說明</small></span>'+ic('right',16)+'</button>':'')+'</div>'
    +'<button class="btn btn-p btn-full" onclick="annOk(\''+x.id+'\','+(queue?1:0)+')">'+(queue?'我知道了':'關閉')+'</button></div>';
  document.body.appendChild(d);
  requestAnimationFrame(function(){d.classList.add('open');});
  if(!queue&&!x.read)annMark(x);
}
function annMark(x){x.read=true;gas('annRead',TOKEN,x.id).catch(function(){});}
function annOk(id,fromQueue){
  var d=$('annv');if(d)d.remove();
  if(!fromQueue){if(sub==='ann'||tab==='more')render();return;}
  var x=ANN_Q.shift();if(x)annMark(x);
  if(sub==='ann'||tab==='more')render();
  if(ANN_Q.length)setTimeout(function(){annShow(ANN_Q[0],ANN_Q.length);},250);
}
function annOpenItem(id){var x=ANN.inbox.filter(function(a){return a.id===id;})[0]||ANN.sent.filter(function(a){return a.id===id;})[0];if(x)annShow(x,0);}

/* 更多 → 公告 */

  if(!ANN.loaded)return loader('讀取公告…');

  if(ROLE==='admin'){

function annStat(id){
  var x=ANN.sent.filter(function(a){return a.id===id;})[0];if(!x)return;
  var rd=x.rc.filter(function(p){return p.r;}),un=x.rc.filter(function(p){return !p.r;});
  var h='<div class="shh"><div><h3>'+he(x.title)+'</h3><p class="hint" style="margin-top:3px">'+annAt(x.at)+'　已讀 '+rd.length+'/'+x.rc.length+'</p></div>'
    +'<button class="ib" onclick="closeSheet()">✕</button></div>'
    +'<button class="btn btn-full" style="margin-top:6px" onclick="closeSheet();annShow(ANN.sent.filter(function(a){return a.id===\''+x.id+'\'})[0],0)">預覽公告</button>'
    +'<p class="lb" style="margin-top:14px">未讀 '+un.length+'</p><div class="cchips">'+(un.map(function(p){return '<span class="cchip">'+he(p.n)+'</span>';}).join('')||'<span class="hint">全部都讀了</span>')+'</div>'
    +'<p class="lb" style="margin-top:14px">已讀 '+rd.length+'</p>'+(rd.map(function(p){return '<div class="rrow"><span>'+he(p.n)+'</span><span class="hint">'+annAt(p.r)+'</span></div>';}).join('')||'<span class="hint">還沒有人讀</span>')
    +'<button class="btn btn-full" style="margin-top:18px;color:#d33b2f" onclick="annDel(\''+x.id+'\')">刪除這則公告</button>';
  openSheet(h);
}
function annDel(id){
  if(!confirm('刪除後大家都看不到這則公告，附件也會一起移除，確定刪除？'))return;
  gas('annDelete',TOKEN,id).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'刪除失敗','no');return;}
    closeSheet();toast('已刪除','ok');annLoad(true);
  }).catch(function(){toast('連線失敗','no');});
}

/* 更多 → 公告 → 發布公告（只有管理員） */

  if(!STAFF_READY)return loader('載入通訊錄…');
  var f=ANNF,sel=gcNames(),h='';
  h+='<div class="sec" style="margin-top:4px">標題</div><input class="fld" id="an-t" maxlength="60" placeholder="例如：10 月起採樣紀錄表改版" value="'+he(f.title)+'" oninput="ANNF.title=this.value" style="margin:0">';
  h+='<div class="sec">內容</div><textarea class="fld" id="an-x" rows="6" maxlength="3000" placeholder="公告內容…" style="margin:0;resize:vertical;border-radius:16px;line-height:1.55" oninput="ANNF.text=this.value">'+he(f.text)+'</textarea>';
  h+='<div class="sec">附件（選填）</div>'
    +(f.file?'<div class="anp" style="cursor:default"><span class="anpi">PDF</span><span class="anpn"><b>'+he(f.file.name)+'</b><small>'+annFmtSize(f.file.size)+'</small></span>'
      +'<span class="tpb del" onclick="ANNF.file=null;render()">✕</span></div>'
     :'<label class="anup"><input type="file" accept="application/pdf,.pdf" onchange="annPick(this)" style="display:none">'+ic('upload',18)+'<span>附上 PDF<small>10 MB 以內，大家可以在 App 裡直接看</small></span></label>');
  var all=STAFF.filter(function(x){var n=String(x.name||'').trim();return n&&n!==String(ENGNAME||'').trim();}).map(function(x){return String(x.name).trim();});
  var allOn=all.length&&all.every(function(n){return GC.ppl[n];});
  h+='<div class="sec" style="display:flex">對象<span style="flex:1"></span><a href="#" style="color:var(--accT)" onclick="annAll('+(allOn?'false':'true')+');return false">'+(allOn?'取消全部人員':'全部人員')+'</a></div>';
  h+=gcPicker();
  h+='<div class="gpad"></div><div class="gdock"><div class="gdt"><b>已選 '+sel.length+' 人</b><br>'+(f.file?'含 PDF 附件':'純文字公告')+'</div>'
    +'<button class="btn btn-p"'+(f.busy||!sel.length?' disabled':'')+' onclick="annSend()">'+(f.busy?(f.file?'上傳中…':'發布中…'):'發布')+'</button></div>';
  setTimeout(gcSearch,0);
  return h;
}
function annAll(on){STAFF.forEach(function(x){var n=String(x.name||'').trim();if(n&&n!==String(ENGNAME||'').trim())GC.ppl[n]=on;});render();}
function annPick(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){toast('只能附 PDF 檔','no');return;}
  if(f.size>ANN_PDF_MAX){toast('PDF 超過 10 MB，請先壓縮','no',3500);return;}
  ANNF.file=f;render();
}
function annSend(){
  var f=ANNF,names=gcNames(),title=String(f.title||'').trim(),text=String(f.text||'').trim();
  if(!title){toast('請輸入標題','no');return;}
  if(!text&&!f.file){toast('請輸入內容或附上 PDF','no');return;}
  if(!names.length){toast('請選擇對象','no');return;}
  if(!confirm('確定發布給 '+names.length+' 人？他們下次開 App 會看到公告。'))return;
  var groups=gcGroups().map(function(g){var c=gcCount(g);return !c?'':(c===g.ppl.length?g.tm:g.tm+'（'+c+' 人）');}).filter(String);
  f.busy=true;render();
  var go2=function(pdf){
    gas('annPost',TOKEN,title,text,names,groups,pdf).then(function(r){
      f.busy=false;
      if(!r||!r.ok){toast((r&&r.error)||'發布失敗','no',4000);render();return;}
      toast('已發布給 '+r.n+' 人','ok',3000);
      ANNF={title:'',text:'',file:null,busy:false};GC_ANN.ppl={};GC_ANN.open={};GC_ANN.q='';
      go('more','ann');
    }).catch(function(){f.busy=false;toast('連線失敗','no');render();});
  };
  if(!f.file){go2(null);return;}
  var rd=new FileReader();
  rd.onload=function(){go2({name:f.file.name,b64:String(rd.result).split(',')[1]||''});};
  rd.onerror=function(){f.busy=false;toast('讀不到檔案','no');render();};
  rd.readAsDataURL(f.file);
}

/* PDF 檢視：用 pdf.js 把每頁畫出來（iPhone 的 App 模式也能看完整份） */
var PDF_CACHE={}, PDFJS_P=null, PDFV={id:'',zoom:1,doc:null,name:''};
function pdfLib(){
  if(PDFJS_P)return PDFJS_P;
  PDFJS_P=new Promise(function(ok,no){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=function(){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(pdfjsLib);};
    sc.onerror=function(){PDFJS_P=null;no(new Error('PDF 檢視器載入失敗'));};
    document.head.appendChild(sc);
  });
  return PDFJS_P;
}
function pdfOpen(id){
  var x=ANN.inbox.concat(ANN.sent).filter(function(a){return a.id===id;})[0],name=(x&&x.pdf&&x.pdf.name)||'附件.pdf';
  var v=$('pdfv');if(v)v.remove();
  v=document.createElement('div');v.id='pdfv';
  v.innerHTML='<div class="pvh"><button class="ib" onclick="pdfClose()">✕</button><span class="pvn">'+he(name)+'</span>'
    +'<button class="ib" onclick="pdfZoom(-1)">−</button><button class="ib" onclick="pdfZoom(1)">＋</button>'
    +'<button class="ib" onclick="pdfSave()" title="下載">'+ic('upload',18).replace('<svg','<svg style="transform:rotate(180deg)"')+'</button></div>'
    +'<div class="pvb" id="pvb">'+loader('讀取 PDF…')+'</div>';
  document.body.appendChild(v);
  PDFV={id:id,zoom:1,doc:null,name:name};
  var bytes=PDF_CACHE[id]?Promise.resolve(PDF_CACHE[id]):gas('annPdf',TOKEN,id).then(function(r){
    if(!r||!r.ok)throw new Error((r&&r.error)||'讀取失敗');
    var bin=atob(r.b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    PDF_CACHE[id]=u;return u;
  });
  Promise.all([pdfLib(),bytes]).then(function(a){

function pdfRender(){
  var b=$('pvb'),doc=PDFV.doc;if(!b||!doc)return;
  var W=Math.min(b.clientWidth-16,900)*PDFV.zoom,dpr=Math.min(window.devicePixelRatio||1,2),seq=PDFV.seq=(PDFV.seq||0)+1;
  b.innerHTML='';
  var n=1;
  (function next(){
    if(n>doc.numPages||seq!==PDFV.seq||!$('pvb'))return;
    doc.getPage(n).then(function(pg){
      var v1=pg.getViewport({scale:1}),sc=W/v1.width,vp=pg.getViewport({scale:sc*dpr});
      var c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      c.style.width=Math.round(vp.width/dpr)+'px';c.style.height=Math.round(vp.height/dpr)+'px';
      b.appendChild(c);
      return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }).then(function(){n++;next();}).catch(function(){n++;next();});
  })();
}

    var file=new File([bl],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return;}
  }catch(e){}
  var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
}

function statBars(vals,labels,opt){
  // 單一數列長條圖：圓頭 4px、柱間 2px 空隙、淡格線；點柱子在標題顯示數值
  var W=opt.w||320,H=opt.h||120,n=vals.length,max=Math.max(1,Math.max.apply(null,vals));
  var step=W/n,bw=Math.max(2,step-2),top=Math.ceil(max/ (max>4?4:1))*(max>4?4:1);
  var svg='<svg class="sbar" viewBox="0 0 '+W+' '+(H+18)+'" preserveAspectRatio="none">';
  [0.5,1].forEach(function(f){var y=H-H*f;svg+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" class="sgl"/>';});
  vals.forEach(function(v,i){
    var h=v?Math.max(3,H*v/top):0,x=i*step+1,pick=(opt.pick===i);
    if(h)svg+='<path class="sb'+(pick?' on':'')+'" d="M'+x+' '+H+'V'+(H-h+Math.min(4,h/2))+'q0 -'+Math.min(4,h/2)+' '+Math.min(4,bw/2)+' -'+Math.min(4,h/2)+'H'+(x+bw-Math.min(4,bw/2))+'q'+Math.min(4,bw/2)+' 0 '+Math.min(4,bw/2)+' '+Math.min(4,h/2)+'V'+H+'z"/>';
    svg+='<rect x="'+(i*step)+'" y="0" width="'+step+'" height="'+H+'" fill="transparent" onclick="'+opt.click+'('+i+')"/>';
    if(labels[i])svg+='<text x="'+(i*step+step/2)+'" y="'+(H+14)+'" class="stx">'+labels[i]+'</text>';
  });
  return svg+'<line x1="0" x2="'+W+'" y1="'+H+'" y2="'+H+'" class="sax"/></svg>';

/** 點位編號分行 */
function locList(arr){
  if(!arr||!arr.length)return '';

/** 儀器排成標籤 */
function pills(arr){
  if(!arr||!arr.length)return '';
  var out=[];
  arr.forEach(function(v){
    String(v).split(/[\s、,，]+/).forEach(function(x){
      x=x.trim();if(x&&out.indexOf(x)<0)out.push(x);
    });
  });
  if(!out.length)return '';
  return out.map(function(x){return '<span class="pil">'+he(x)+'</span>';}).join('');
}

/** 電話欄位自動補 - */
function bindPhone(){
  var ph=$('s-p');
  if(!ph||!ph.addEventListener)return;
  var fp=function(){
    var atEnd=(ph.selectionStart===ph.value.length);
    var c=fmtPhone(ph.value);
    if(c===ph.value)return;
    ph.value=c;
    if(atEnd){try{ph.setSelectionRange(c.length,c.length);}catch(e){}}
  };
  ph.addEventListener('input',fp);
  ph.addEventListener('blur',fp);
}
/** 取用戶端 IP 作為簽署佐證；取不到就留空，不影響流程 */
function getIP(){
  return new Promise(function(done){
    var t=setTimeout(function(){done('');},2500);
    try{
      fetch('https://api.ipify.org?format=json')
        .then(function(r){return r.json();})
        .then(function(j){clearTimeout(t);done((j&&j.ip)||'');})
        .catch(function(){clearTimeout(t);done('');});
    }catch(e){clearTimeout(t);done('');}
  });
}

function savePwForce(){

      n=$('fp-n').value,c=$('fp-c').value;
  if(e)e.textContent='';

  if(n.length<PW_MIN){bad('新密碼至少需要 '+PW_MIN+' 個字元');return;}
  if(n!==c){bad('兩次新密碼不一致');return;}

  gas('changePassword',TOKEN,n,o).then(function(r){

    })
    .then(function(r2){
      if(!r2||!r2.ok)throw new Error((r2&&r2.error)||'記錄失敗');
      onbDone();
    })
    .catch(function(e){
      toast((e&&e.message)||'儲存失敗，請稍後再試','no',4000);
      if(b){b.disabled=false;b.textContent='同意並進入';}
    });

function expText(v,y){

function expCol(v,y){

/* ══ 下載行程（給客戶的行程表，桌機限定）══ */
function isDesk(){
  try{return (window.innerWidth||document.documentElement.clientWidth||0)>=900;}
  catch(e){return true;}
}
var DL={proj:'',ty:[],from:'',to:'',rows:null,loading:false,err:''};
function dlInit(){
  if(DL.from&&DL.to)return;
  var n=twDate(),y=n.getFullYear(),m=n.getMonth();
  DL.from=y+'-'+p2(m+1)+'-01';
  DL.to=y+'-'+p2(m+1)+'-'+p2(new Date(y,m+1,0).getDate());
}
/** 讀取期間內的全部行程（不套個人篩選，客戶要看的是整個專案） */
function dlLoad(force){
  if(!can('dl'))return;
  dlInit();
  DL.loading=true;DL.err='';
  if(tab==='dl')render();
  gas('getData',TOKEN,{dateFrom:DL.from,dateTo:DL.to}).then(function(r){
    DL.loading=false;
    if(!r||!r.ok){DL.err=(r&&r.error)||'讀取失敗';DL.rows=[];}
    else DL.rows=normRows(r.rows||[]);
    if(tab==='dl')render();
  }).catch(function(){
    DL.loading=false;DL.err='讀取失敗，請重試';DL.rows=DL.rows||[];
    if(tab==='dl')render();
  });
}
function dlSetDate(which,v){
  DL[which]=v;
  if(DL.from&&DL.to&&DL.from>DL.to){if(which==='from')DL.to=DL.from;else DL.from=DL.to;}
  dlLoad();
}
/* 下載行程：一律整個月 */
function dlSetMonth(ym){
  if(!/^\d{4}-\d{2}$/.test(ym))return;
  var y=+ym.slice(0,4),m=+ym.slice(5,7);
  DL.from=ym+'-01';DL.to=ym+'-'+p2(new Date(y,m,0).getDate());
  dlLoad();
}
function dlMove(k){var y=+DL.from.slice(0,4),m=+DL.from.slice(5,7)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;dlSetMonth(y+'-'+p2(m+1));}
function dlMonths(){   // 前 24 個月～後 6 個月
  var n=twDate(),out=[],cur=DL.from.slice(0,7),seen=false;
  for(var i=-24;i<=6;i++){var d=new Date(n.getFullYear(),n.getMonth()+i,1),k=d.getFullYear()+'-'+p2(d.getMonth()+1);if(k===cur)seen=true;out.push([k,d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月']);}
  if(!seen)out.unshift([cur,+cur.slice(0,4)+' 年 '+(+cur.slice(5,7))+' 月']);
  return out.reverse();
}
function dlSetProj(v){DL.proj=v;DL.ty=[];render();}
function dlTy(t){
  if(!t)DL.ty=[];
  else{
    var i=DL.ty.indexOf(t);
    if(i<0)DL.ty.push(t);else DL.ty.splice(i,1);
  }
  render();
}
/** 目前期間內有哪些專案（依筆數多寡排序） */
function dlProjects(){
  var m={},out=[];
  (DL.rows||[]).forEach(function(r){
    var k=r.project||'';
    if(!k)return;
    if(!m[k]){m[k]={name:k,no:'',n:0};out.push(m[k]);}
    m[k].n++;
    if(!m[k].no&&okNo(r.projectNo))m[k].no=okNo(r.projectNo);
  });
  out.sort(function(a,b){return b.n-a.n||a.name.localeCompare(b.name,'zh-Hant');});
  return out;
}
function dlTypes(){
  var out=[];
  (DL.rows||[]).forEach(function(r){
    if(DL.proj&&r.project!==DL.proj)return;
    if(r.type&&out.indexOf(r.type)<0)out.push(r.type);
  });
  return out.sort();
}
/** 挑出要印的列，並把同日期、同測項、同點位、同時間的重複合併 */
function dlPicked(){
  var m={},out=[];
  (DL.rows||[]).forEach(function(r){
    if(DL.proj&&r.project!==DL.proj)return;
    if(DL.ty.length&&DL.ty.indexOf(r.type)<0)return;
    var k=[r.date,r.type,r.location,r.sampTime].join('|');
    if(!m[k]){
      m[k]={date:r.date,type:r.type||'',loc:r.location||'',time:r.sampTime||'',
            qtys:[],qseen:{}};
      out.push(m[k]);
    }
    var g=m[k];
    var qk=String(r.reportNum||'')+'｜'+String(r.qty==null?'':r.qty).trim();
    if(!(r.reportNum&&g.qseen[qk]))g.qtys.push(String(r.qty==null?'':r.qty).trim());
    g.qseen[qk]=1;
  });
  out.sort(function(a,b){
    return a.date<b.date?-1:a.date>b.date?1:
      (typeGroup(a.type)+a.type).localeCompare(typeGroup(b.type)+b.type,'zh-Hant');
  });
  return out;
}
/* ── 下載行程：把連續監測合併成「期間」──
   數量 +1／1＝架設，-1＝收站，0＝監測中，「-1+1」＝假收站（同一天收了又架，其實沒中斷）。
   空品車：架站日～收站日整段都算監測期間；假收站（-1 後隔天或同天又 +1）不切開。
   噪音、振動、交通（錄影）：+1、-1 只是前一天架／後一天收，真正監測期間是 0 的那幾天；
     沒有 0（例如當天架當天收）就用整段。
   其他項目：照原本一天一列。 */
function dlKind(t){t=String(t||'');if(/空品車|監測車/.test(t))return 'car';if(/噪音|振動|交通/.test(t))return 'cont';return 'day';}
function dlQv(list){   // 一天的數量 → {n:數字或 null, x:是否同天收又架}
  var vals=(list||[]).map(function(v){return String(v==null?'':v).replace(/\s/g,'');}).filter(Boolean);
  if(!vals.length)return {n:null,x:false};
  var x=vals.some(function(v){return /-1.*\+1|\+1.*-1/.test(v);});
  if(x)return {n:null,x:true};
  if(vals.every(function(v){return /^[+-]?\d+(\.\d+)?$/.test(v);}))return {n:vals.reduce(function(a,b){return a+parseFloat(b);},0),x:false};
  return {n:null,x:false};
}
function dlRows(){
  var list=dlPicked(),out=[],seg={};
  list.forEach(function(g){
    var k=dlKind(g.type);
    if(k==='day'){out.push({a:g.date,b:g.date,type:g.type,loc:g.loc,time:g.time,q:qtyText(g.qtys)||'—',days:[g.date]});return;}
    var key=k+'|'+g.type+'|'+g.loc;
    (seg[key]=seg[key]||{kind:k,type:g.type,loc:g.loc,time:g.time,ds:{}}).ds[g.date]=dlQv(g.qtys);
    if(!seg[key].time&&g.time)seg[key].time=g.time;
  });
  Object.keys(seg).forEach(function(key){
    var S=seg[key],dates=Object.keys(S.ds).sort(),cur=null;
    var flush=function(){
      if(!cur)return;
      var all=cur.d,mon=all.filter(function(d){return S.ds[d].n===0;});
      var use=(S.kind==='cont'&&mon.length)?mon:all;
      out.push({a:use[0],b:use[use.length-1],type:S.type,loc:S.loc,time:S.time,q:use.length+' 天',days:use});
      cur=null;
    };
    dates.forEach(function(d){
      var v=S.ds[d];
      if(cur){
        var prev=cur.d[cur.d.length-1],gap=Math.round((new Date(d+'T00:00:00Z')-new Date(prev+'T00:00:00Z'))/864e5);
        var pv=S.ds[prev];
        if(gap>1&&!(pv.n!==null&&pv.n<0&&v.n!==null&&v.n>0&&gap<=2))flush();   // 中間斷掉就另起一段（-1 後隔一天又 +1 視為假收站）
        else if(pv.n!==null&&pv.n<0&&!(v.n!==null&&v.n>0)&&!v.x)flush();          // 前一天真的收站了
      }
      if(!cur)cur={d:[]};
      cur.d.push(d);
      if(v.n!==null&&v.n<0&&S.kind==='cont')flush();   // 噪音振動交通：-1 就是收站
    });
    flush();
  });
  out.sort(function(x,y){return x.a<y.a?-1:x.a>y.a?1:(typeGroup(x.type)+x.type).localeCompare(typeGroup(y.type)+y.type,'zh-Hant');});
  return out;
}

          +(on?ic('check',15):'')+he(t)+'</button>';}).join('')
      +'</div>'
      +'<button class="btn btn-p btn-full" onclick="dlPrint()">'+ic('file',17)+'　列印／另存 PDF</button>'
      +'<p class="hint" style="margin:9px 4px 0">列印視窗的「目的地」選「另存為 PDF」即可。</p>';
  }
  return h+'</div>';

function dlOut(){
  if(DL.loading)return '<div class="dlout">'+loader('讀取行程…')+'</div>';
  if(DL.err)return '<div class="dlout"><div class="dlempty">'+he(DL.err)+'</div></div>';
  if(!DL.proj)
    return '<div class="dlout"><div class="dlempty">選擇期間與專案後，這裡會顯示要給客戶的行程表</div></div>';

  var h='<div class="dlout" id="dlout">'
    +'<h4>'+he(DL.proj)+'　環境監測行程表</h4>'
    +'<p class="sub">'+(p&&p.no?'計畫編號 '+he(p.no)+'　·　':'')
    +(+DL.from.slice(0,4))+' 年 '+(+DL.from.slice(5,7))+' 月'
    +'　·　製表日期 '+he(twStr())+'</p>';
  if(!list.length)return h+'<div class="dlempty">這段期間沒有符合的行程</div></div>';
  var md=function(d){return (+d.slice(5,7))+'/'+(+d.slice(8));};
  h+='<table class="dlt"><thead><tr>'
    +'<th style="width:118px">日期</th><th style="width:56px">星期</th>'
    +'<th style="width:130px">監測類別</th><th>監測點位</th>'
    +'<th style="width:104px">監測時間</th><th class="num" style="width:62px">數量</th>'
    +'</tr></thead><tbody>';
  var last='';
  list.forEach(function(g){
    var rng=g.a!==g.b,lab=rng?md(g.a)+'～'+md(g.b):md(g.a),first=rng||(g.a!==last);
    h+='<tr'+(first?' class="d0"':'')+'>'
      +'<td>'+(first?he(lab):'')+'</td>'
      +'<td>'+(first?(rng?DW[dowOf(g.a)]+'～'+DW[dowOf(g.b)]:DW[dowOf(g.a)]):'')+'</td>'
      +'<td>'+he(g.type||'—')+'</td>'
      +'<td>'+he(g.loc||'—')+'</td>'
      +'<td>'+he(g.time||'—')+'</td>'
      +'<td class="num">'+he(g.q||'—')+'</td></tr>';
    last=rng?'':g.a;
  });
  h+='</tbody><tfoot><tr><td colspan="6">合計　'+nd+' 個監測天　'+list.length+' 個項目</td></tr></tfoot></table>'
    +'<p class="dlfoot">本表為預定行程，實際監測日期可能因天候或現場狀況調整，異動將另行通知。</p>'
    +'</div>';
  return h;
}

function setRegion(v){
  pRows.forEach(function(r){r.region=v;});

function doUpload(force){
  if(!pRows.length){toast('沒有可上傳的資料','no');return;}
  if(!pRows[0].region){toast('請先選擇地區','no');return;}
  var fn=pName,snap=pRows,mt=pMtime;
  gas('saveData',TOKEN,snap,fn,mt,!!force,APP_VER).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'上傳失敗','no');paintParse(false);return;}
    if(r.saved===0&&r.canForce){
      $('parse').innerHTML='<div class="card" style="margin-top:12px">'
        +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">未做任何變更</div>'
        +'<p class="hint">'+he(fn)+'<br>這份檔案的修改時間不比現有資料新'
        +(r.skipped?'（共 '+r.skipped+' 天）':'')+'，因此沒有覆蓋。'
        +'<br><br>若因解析規則更新需重跑，可強制覆蓋。</p>'
        +'<div style="display:flex;gap:8px;margin-top:14px">'
        +'<button class="btn btn-d btn-sm" onclick="forceUp()">強制覆蓋</button>'
        +'<button class="btn btn-sm" onclick="document.getElementById(\'parse\').innerHTML=\'\'">取消</button></div></div>';
      return;
    }
    var msg='已儲存 '+r.saved+' 筆';
    if(r.skipped)msg+='；另有 '+r.skipped+' 天因現有資料較新而保留';
    toast(msg,'ok',r.skipped?5000:3000);
    $('parse').innerHTML='<div class="card" style="margin-top:12px;border:1px solid var(--acc)">'
      +'<div style="font-size:15px;font-weight:600;color:var(--accT)">✓ 已儲存</div>'
      +'<p class="hint" style="margin-top:5px;word-break:break-all">'+he(fn)+'<br>寫入 '+r.saved+' 筆排程</p></div>';
    pRows=[];pName='';pMtime='';
    todayFor='';allRows=[];
    cPrune(true);cVer('up-'+Date.now());
    RUPD=null;

var HIST_MONTHS=3, HIST_SUPERSEDE_DAYS=3, histMore=false;
function histAge(v){
  var d=daysBetween(String(v||'').slice(0,10),twStr());
  return (d==null||isNaN(d))?0:d;          // 認不出日期就當成很新，不隱藏

function histHidden(r){

function histToggle(){histMore=!histMore;paintHistory();}

  var h='',old=0;

    h+='<div class="card" style="'+(isOld?'opacity:.55;':'')+'"><div class="row">'

      +he(r.filename)+'</div>'
      +'<div style="display:flex;gap:6px;margin:5px 0">'
      +(r.region?'<span class="tag g">'+he(r.region)+'</span>':'')
      +(r.month?'<span class="tag">'+he(r.month)+'</span>':'')
      +'<span class="tag'+(isOld?'':' g')+'">'+(isOld?'已被取代':'最新')+'</span></div>'
      +'<div class="hint">'+he(rng)+(r.days?'　·　'+r.days+' 天':'')+'　·　'+he(r.uploaded_by)+'<br>'
      +'檔案更新：'+(r.source_mtime?he(stamp(r.source_mtime)):'未記錄')
      +'　上傳：'+he(stamp(r.upload_time))
      +'<br>解析版本：'+(r.app_ver
        ?(r.app_ver===APP_VER
          ?'<span style="color:var(--ok)">'+he(r.app_ver)+'（最新）</span>'
          :'<span style="color:var(--warn)">'+he(r.app_ver)+'　建議用目前版本 '+he(APP_VER)+' 重傳</span>')
        :'<span style="color:var(--warn)">舊版　建議重新上傳</span>')
      +'</div></div>'
      +(can('upload')&&!isOld
        ?'<button class="ib" style="color:var(--err)" onclick="delUpload(\''+he(r.id)+'\',\''+esc(r.filename)+'\')">✕</button>':'')
      +'</div></div>';
  });
  if(hid.length)
    h+='<button class="btn btn-sm btn-full" style="margin-top:4px" onclick="histToggle()">'
      +(histMore?'收起較早的記錄':'顯示更早的記錄（'+hid.length+' 筆）')+'</button>';
  if(can('upload')&&old>1)
    h+='<button class="btn btn-sm btn-full" style="margin-top:8px" onclick="purgeOld('+old+')">清除 '+old+' 筆已被取代的記錄</button>';
  el.innerHTML=h;
}

/* ══ Excel 解析 ══ */
var PSTRUCK=0;   // 這次上傳略過的刪除線行程筆數
/* 找出 Excel 裡「整列（或案名）被加上刪除線」的列：回傳 {列索引(0 起算): true} */
function xlsxStruck(u8,sheetName){
  var out={};
  try{
    var zip=XLSX.CFB.read(u8,{type:'array'});
    var dec=new TextDecoder('utf-8');
    var get=function(p){var f=XLSX.CFB.find(zip,p)||XLSX.CFB.find(zip,'/'+p);return f&&f.content?dec.decode(f.content instanceof Uint8Array?f.content:new Uint8Array(f.content)):'';};
    var isStrike=function(x){var m=x.match(/<(?:\w+:)?strike\b([^>]*)\/?>/);return !!m&&!/val\s*=\s*"(0|false)"/.test(m[1]);};
    var unesc=function(s){return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");};
    // 哪個工作表檔
    var wbx=get('xl/workbook.xml'),rels=get('xl/_rels/workbook.xml.rels'),rid='',path='';
    (wbx.match(/<(?:\w+:)?sheet\b[^>]*>/g)||[]).forEach(function(t){
      var n=(t.match(/\bname="([^"]*)"/)||[])[1];if(n!=null&&unesc(n)===sheetName)rid=(t.match(/\br:id="([^"]*)"/)||t.match(/:id="([^"]*)"/)||[])[1]||'';
    });
    (rels.match(/<Relationship\b[^>]*>/g)||[]).forEach(function(t){
      if((t.match(/\bId="([^"]*)"/)||[])[1]===rid){var tg=(t.match(/\bTarget="([^"]*)"/)||[])[1]||'';path=tg.charAt(0)==='/'?tg.slice(1):'xl/'+tg;}
    });
    if(!path)return out;
    // 樣式：字型有刪除線 → 哪些儲存格格式（s 編號）有刪除線
    var st=get('xl/styles.xml');
    var fontsX=(st.match(/<(?:\w+:)?fonts\b[\s\S]*?<\/(?:\w+:)?fonts>/)||[''])[0];
    var fonts=(fontsX.match(/<(?:\w+:)?font\b(?:\/>|[\s\S]*?<\/(?:\w+:)?font>)/g)||[]).map(isStrike);
    var xfsX=(st.match(/<(?:\w+:)?cellXfs\b[\s\S]*?<\/(?:\w+:)?cellXfs>/)||[''])[0];
    var xfs=(xfsX.match(/<(?:\w+:)?xf\b[^>]*>/g)||[]).map(function(t){var f=(t.match(/\bfontId="(\d+)"/)||[])[1];return !!fonts[+f||0];});
    // 共用字串：整段文字都是刪除線的
    var rich=function(x){
      var runs=x.match(/<(?:\w+:)?r>[\s\S]*?<\/(?:\w+:)?r>/g);
      if(!runs)return false;
      var any=false,all=true;
      runs.forEach(function(r){var t=(r.match(/<(?:\w+:)?t\b[^>]*>([\s\S]*?)<\/(?:\w+:)?t>/)||[])[1]||'';if(!t.trim())return;any=true;if(!isStrike(r))all=false;});
      return any&&all;
    };
    var ss=(get('xl/sharedStrings.xml').match(/<(?:\w+:)?si>[\s\S]*?<\/(?:\w+:)?si>/g)||[]).map(rich);
    var colIdx=function(ref){var m=ref.match(/^([A-Z]+)/),n=0;if(!m)return -1;for(var i=0;i<m[1].length;i++)n=n*26+m[1].charCodeAt(i)-64;return n-1;};
    var sx=get(path);
    (sx.match(/<(?:\w+:)?row\b[^>]*>[\s\S]*?<\/(?:\w+:)?row>/g)||[]).forEach(function(rw){
      var r=+((rw.match(/^<(?:\w+:)?row\b[^>]*\br="(\d+)"/)||[])[1]||0);if(!r)return;
      var cells=rw.match(/<(?:\w+:)?c\b[^>]*?(?:\/>|>[\s\S]*?<\/(?:\w+:)?c>)/g)||[];
      var full=0,struck=0,projStruck=false;
      cells.forEach(function(c){
        var ref=(c.match(/\br="([A-Z]+\d+)"/)||[])[1]||'',ci=colIdx(ref);
        if(ci<3||ci>14)return;                              // 只看工程師～公務車這幾欄
        var v=(c.match(/<(?:\w+:)?v>([\s\S]*?)<\/(?:\w+:)?v>/)||[])[1],is=(c.match(/<(?:\w+:)?is>[\s\S]*?<\/(?:\w+:)?is>/)||[])[0];
        var t=(c.match(/\bt="(\w+)"/)||[])[1]||'';
        var text=is?(is.replace(/<[^>]+>/g,'')):(v||'');
        if(t==='s'&&v!=null)text='x';
        if(!String(text).trim())return;
        full++;
        var s=+((c.match(/\bs="(\d+)"/)||[])[1]||0);
        var k=!!xfs[s]||(t==='s'&&v!=null&&ss[+v])||(is&&rich(is));
        if(k){struck++;if(ci===5)projStruck=true;}
      });
      if(full&&(projStruck||struck*2>=full))out[r-1]=true;
    });
  }catch(e){console&&console.warn&&console.warn('刪除線判斷失敗',e);}
  return out;
}

function readXlsx(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var u8=new Uint8Array(e.target.result);
        var wb=XLSX.read(u8,{type:'array',raw:true});
        var name=null;
        if(wb.SheetNames.indexOf('採樣行程')>=0)name='採樣行程';
        else if(wb.SheetNames.indexOf('工作表1')>=0)name='工作表1';
        else name=wb.SheetNames[0];
        if(!name){res([]);return;}
        var raw=XLSX.utils.sheet_to_json(wb.Sheets[name],
          {header:1,raw:true,defval:null,range:{s:{r:0,c:0},e:{r:9999,c:21}}});
        var struck=xlsxStruck(u8,name);          // 被畫刪除線的行程＝已取消，不匯入
        res(parseSheet(raw,name,file.name,struck));
      }catch(ex){rej(ex);}
    };
    fr.onerror=function(){rej(new Error('檔案讀取失敗'));};
    fr.readAsArrayBuffer(file);
  });
}
function detectRegion(fn,sheet){
  var s=(fn||'')+' '+(sheet||'');
  if(/台中|臺中|中部|中區|taichung|\bTC\b/i.test(s))return '台中';
  if(/高雄|南部|南區|kaohsiung|\bKH\b/i.test(s))return '高雄';
  if(/台北|臺北|北部|北區|taipei|\bTP\b/i.test(s))return '台北';
  if(sheet==='採樣行程')return '高雄';
  return '';
}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){if(isNaN(v))return null;
    return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());}
  if(typeof v==='number'&&v>40000&&v<80000){
    try{var d=XLSX.SSF.parse_date_code(v);if(d&&d.y>2000)return d.y+'-'+p2(d.m)+'-'+p2(d.d);}catch(e){}
  }
  var s=String(v).trim();
  var m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m=s.match(/^(\d{2,3})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return (parseInt(m[1],10)+1911)+'-'+p2(m[2])+'-'+p2(m[3]);
  return null;
}
/* 欄位對照：C 執行日期 / D 工程師 / E 專案編號 / F 專案簡稱 / G 行程類型
   H 點位 / I 數量 / J 申報採樣時間 / K 採樣儀器 / L 申報人員 / M 報告編號 / N 備註 / O 公務車 */
function parseSheet(raw,sheet,fname,struck){
  struck=struck||{};PSTRUCK=0;
  if(!raw||raw.length<2)return [];
  var region=detectRegion(fname||'',sheet);
  var out=[];
  if(sheet==='採樣行程'){
    var kd='',kst=[],kcar='';         // 人員與公務車欄空白＝沿用上一筆，換日期才重來
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      var ds=parseDate(row[2]);
      if(!ds||parseInt(ds.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      if(ds!==kd){kd=ds;kst=[];kcar='';}
      var kstaff=[16,17,18,19,20].map(function(c){return sv(row[c]);}).filter(Boolean);
      if(kstaff.length)kst=kstaff;else kstaff=kst;
      var kc=sv(row[15]);if(kc)kcar=kc;else kc=kcar;
      if(struck[i]){PSTRUCK++;continue;}      // 刪除線＝已取消
      out.push({date:ds,engineer:eng,project:proj,projectNo:svNo(row[4]),type:type,
        location:sv(row[8]),qty:sv(row[9]),
        sampTime:sv(row[10]),equipment:sv(row[11]),applicant:sv(row[12]),
        reportNum:sv(row[7]),notes:[sv(row[13]),sv(row[14])].filter(Boolean).join('；'),
        car:kc,
        staff:kstaff.slice(),
        region:region});
    }
  }else{
    // 日期是合併儲存格，需往下延續；工程師空白＝休假／註記列，整列略過
    var last=null,lp='',lr='',lsm='',lc='',ln='',lst=[];
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      // 換日期時所有延續值歸零，人員不會跨日沿用
      if(row[2]!=null){var d2=parseDate(row[2]);if(d2&&d2!==last){last=d2;lp='';lr='';lsm='';lc='';ln='';lst=[];}}
      if(!last||parseInt(last.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      // 報告編號／採樣時間／專案編號屬於專案，換專案就重來；
      // 公務車和人員跟著「這一組人」走，換專案仍沿用
      if(proj&&proj!==lp){lp=proj;lr='';lsm='';ln='';}
      var no=svNo(row[4]);if(no)ln=no;else no=ln;
      var rpt=sv(row[12]);if(rpt)lr=rpt;else rpt=lr;
      var samp=sv(row[9]);if(samp)lsm=samp;else samp=lsm;
      var car=sv(row[14]);if(car)lc=car;else car=lc;   // 空白＝沿用同一台車
      // 人員欄空白＝跟上一筆同一組；專案換了也繼續沿用，只有換日期才重來
      var st=[15,16,17,18,19].map(function(c){return sv(row[c]);}).filter(Boolean);
      if(st.length)lst=st;else st=lst;
      if(struck[i]){PSTRUCK++;continue;}      // 刪除線＝已取消
      out.push({date:last,engineer:eng,project:proj,projectNo:no,type:type,
        location:sv(row[7]),qty:sv(row[8]),
        sampTime:samp,equipment:sv(row[10]),applicant:sv(row[11]),
        reportNum:rpt,notes:sv(row[13]),car:car,
        staff:st.slice(),
        region:region});
    }
  }
  return out;
}

/** 直屬主管的候選名單：排除自己與自己的下屬（避免循環） */
function mgrOptions(username,cur){
  var skip={};
  if(username){skip[username]=1;descendantsOf(username).forEach(function(n){skip[n]=1;});}
  var list=USERS.filter(function(x){return !skip[x.username];});
  list.sort(function(a,b){
    var ra=rankOf(a.role),rb=rankOf(b.role);
    if(ra!==rb)return ra-rb;
    return (a.engineerName||a.username).localeCompare(b.engineerName||b.username,'zh-Hant');
  });
  return '<option value="">最上層（沒有主管）</option>'
    +list.map(function(x){
      return '<option value="'+he(x.username)+'"'+(cur===x.username?' selected':'')+'>'
        +he(x.engineerName||x.username)+'（'+roleLabel(x.role)+'）</option>';}).join('');
}

/** 刪除帳號：兩段確認，第二段要打出工號，避免誤刪 */
function delUser(name){
  var u=null;
  USERS.forEach(function(x){if(x.username===name)u=x;});
  var who=u&&u.engineerName?u.engineerName+'（'+name+'）':name;
  if(!confirm('確定要刪除帳號 '+who+'？\n\n此動作無法復原，該帳號會立刻無法登入，'
    +'通訊錄裡對應的人員資料也會一併刪除。\n（只是暫時不用請改用「停用」）'))return;
  var typed=prompt('請輸入工號 '+name+' 以確認刪除：');
  if(typed===null)return;
  if(String(typed).trim().toUpperCase()!==String(name).trim().toUpperCase()){
    toast('工號不符，已取消','no');return;
  }
  gas('deleteUser',TOKEN,name).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'刪除失敗','no',4000);return;}
    toast(r.staffDeleted?('已刪除帳號與通訊錄資料'):'已刪除帳號','ok');
    closeSheet();loadUsers();
    if(r.staffDeleted)loadStaff(null,true);
  }).catch(function(){toast('操作失敗','no');});
}
function saveUser(name){
  var u=null;
  USERS.forEach(function(x){if(x.username===name)u=x;});
  if(!u)return;
  var f={},any=false;
  var role=$('e-r')&&!$('e-r').disabled?$('e-r').value:u.role;
  if(role!==u.role){f.role=role;any=true;}
  var eng=$('e-e').value.trim();
  if(!eng&&normRole(role)!=='admin'){toast('姓名不能空白','no');return;}   // 授權、通訊錄都靠姓名對應
  if(eng!==(u.engineerName||'')){f.engineerName=eng;any=true;}
  var rg=$('e-g').value;
  if(rg!==(u.region||'')){f.region=rg;any=true;}
  var tm=$('e-t').value.trim();
  if(tm!==(u.team||'')){f.team=tm;any=true;}
  if($('e-h')){var hd=$('e-h').classList.contains('on');if(hd!==!!u.hidden){f.hidden=hd;any=true;}}
  var mg=MG.join(','),oldMg=mgrsOf(u).join(',');
  if(MG_FOR===name&&mg!==oldMg){f.manager=mg;any=true;}
  var nu=$('e-u')?$('e-u').value.trim():name;
  var rename=(nu&&nu!==name);
  if(!rename&&!any){closeSheet();return;}

  // 先改工號，後面的欄位更新才會對到新帳號
  var first=rename?gas('renameUser',TOKEN,name,nu):Promise.resolve({ok:true});
  first.then(function(r){
    if(!r||!r.ok)throw new Error((r&&r.error)||'工號更新失敗');
    var target=rename?nu:name;
    if(rename&&r.self){                       // 改到自己的工號就要更新本機記錄
      saveSession(TOKEN,ROLE,nu,ENGNAME);
      $('u-nm').innerHTML=he((ENGNAME&&ENGNAME!==nu?ENGNAME+'　':'')+nu+'（'+roleLabel(ROLE)+'）')
        +(ROLE==='sampler'?'<span class="beta">BETA</span>':'');
    }
    return any?gas('updateUser',TOKEN,target,f):{ok:true};
  }).then(function(r2){
    if(!r2||!r2.ok)throw new Error((r2&&r2.error)||'儲存失敗');
    toast('已儲存','ok');closeSheet();loadUsers();
  }).catch(function(e){
    toast((e&&e.message)||'操作失敗','no',4000);
    loadUsers();
  });
}

function appURL(){
  try{
    var l=window.location;

  }catch(e){return '';}
}
/** 連結帶上帳號，開啟時會自動填入帳號欄（密碼不放進網址） */
function naLink(){
  if(!NA)return '';
  return NA.url+'?u='+encodeURIComponent(NA.u);
}
function naText(){
  if(!NA)return '';
  return ['ESPC 監測行程行事曆',
    '帳號：'+NA.u,
    '密碼：'+NA.p,
    '網址：'+naLink(),
    '第一次登入請確認個人資料並自行設定新密碼'].join('\n');
}
function copyText(t,okMsg){
  var done=function(){toast(okMsg||'已複製','ok');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done,function(){fallback();});
      return;
    }
  }catch(e){}
  fallback();
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      document.execCommand('copy');ta.remove();done();
    }catch(err){toast('複製失敗，請長按選取','no');}
  }
}
function naCopy(which){
  if(!NA)return;
  if(which==='u')copyText(NA.u,'已複製帳號');
  else if(which==='p')copyText(NA.p,'已複製密碼');
  else if(which==='url')copyText(naLink(),'已複製網址');
  else copyText(naText(),'已複製全部資訊');
}
function naShare(){
  if(!NA)return;
  var t=naText();
  try{
    if(navigator.share){
      navigator.share({title:'ESPC 監測行程行事曆',text:t}).catch(function(){});
      return;
    }
  }catch(e){}
  copyText(t,'已複製，貼上傳給他就好');
}
/* QR 只放網址，不放密碼；套件從 CDN 載入，載不到就把 QR 區塊收起來 */
function naQR(){
  var box=$('naqrbox');
  if(!box||!NA)return;
  var draw=function(){
    try{
      box.innerHTML='';
      new QRCode(box,{text:naLink(),width:148,height:148,
        colorDark:'#1c1c1e',colorLight:'#ffffff',
        correctLevel:QRCode.CorrectLevel.M});
    }catch(e){hide();}
  };
  var hide=function(){var w=$('naqr');if(w)w.style.display='none';};
  if(window.QRCode){draw();return;}
  var sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload=draw;
  sc.onerror=hide;
  document.body.appendChild(sc);
}

var PUSH_ASK_KEY='espc_pushask', PUSH_ASK_MS=3*86400000;   // 沒開通知的人每 3 天問一次

/* ══ 推播連線自我檢查 ══
   iPhone 會在背景把推播訂閱換掉或弄丟（例如 App 更新、隔夜、系統清理），
   舊代碼後台送出時仍顯示成功，但手機收不到。所以每次開 App（最多每小時一次）：
   1) 訂閱還在 → 重新取代碼，變了就換掉後台舊的；同一天也順便再登記一次，確保後台有
   2) 訂閱不見了 → iPhone 規定要使用者點一下才能重新訂閱，跳出「重新開啟通知」 */
var PUSH_CHK_AT=0;
function pushRefresh(){
  try{
    if(VIEWAS||!TOKEN||!FCM_VAPID||!pushSupported()||Notification.permission!=='granted')return;   // 檢視別人時不綁推播
    if(!ls('espc_push')&&ls('espc_push_want')!=='1')return;
    if(Date.now()-PUSH_CHK_AT<3600000)return;
    PUSH_CHK_AT=Date.now();
  }catch(e){return;}
  navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(reg){
    return reg.pushManager.getSubscription().then(function(sub){
      if(!sub){pushLost();return;}
      return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});}).then(function(tok){
        if(!tok){pushLost();return;}
        var old=ls('espc_push'),day=twStr();
        if(tok!==old||ls('espc_push_day')!==day){
          gas('savePush',TOKEN,tok,true,deviceName()).then(function(r){
            if(r&&r.ok){lsS('espc_push',tok);lsS('espc_push_want','1');lsS('espc_push_day',day);}
          }).catch(function(){});
          if(old&&old!==tok)gas('savePush',TOKEN,old,false).catch(function(){});
        }
      });
    });
  }).catch(function(){});
}
function pushLost(){
  lsD('espc_push');

  openSheet('<div class="shh"><div><h3>通知連線中斷</h3>'
    +'<p class="hint" style="margin-top:3px">iPhone 有時會把 App 的通知連線清掉，需要你點一下才能重新接上，否則收不到廣播與提醒。</p></div>'
    +'<button class="ib" onclick="closeSheet()">✕</button></div>'
    +'<button class="btn btn-p btn-full" style="margin-top:14px" onclick="closeSheet();pushOn()">重新開啟通知</button>');
}
function loadJS(src){
  return new Promise(function(ok,no){
    var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){no(new Error('載入失敗'));};
    document.head.appendChild(s);
  });
}
var FB_READY=null;
function fbMessaging(){
  if(!FB_READY){
    var v='10.14.1',base='https://www.gstatic.com/firebasejs/'+v+'/';
    FB_READY=loadJS(base+'firebase-app-compat.js')
      .then(function(){return loadJS(base+'firebase-messaging-compat.js');})
      .then(function(){if(!firebase.apps.length)firebase.initializeApp(FB_CFG);return firebase.messaging();});
    FB_READY.catch(function(){FB_READY=null;});

}
function deviceName(){
  var u=navigator.userAgent;
  if(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)return 'iPad';   // iPadOS 會假裝成 Mac
  return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'其他';

function pushOn(silent){
  if(PUSH.busy)return;
  PUSH.busy=true;if(!silent)render();

    if(p!=='granted')throw new Error('沒有取得通知權限');
    return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});
  }).then(function(reg){
    return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});});
  }).then(function(tok){
    if(!tok)throw new Error('取不到推播代碼');

      if(!r||!r.ok)throw new Error((r&&r.error)||'儲存失敗');

    DEVS=null;
