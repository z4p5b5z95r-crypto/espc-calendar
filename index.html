<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>娃娃車預約</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F36F21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="娃娃車預約">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4f2;--card:#fff;--card2:#f1ede9;--tx:#2b2522;--tx2:#6f6660;--tx3:#a1978f;--acc:#C44E06;--accT:#B54705;--tint:#fbe6d8;--ok:#1e7a44;--okBg:#e3f3e9;--err:#c62f22;--errBg:#fde4e1;--warn:#8a5a00;--warnBg:#fff1d6;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;overflow-x:clip;overscroll-behavior:none;max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.hd{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;background:linear-gradient(90deg,#fafafa 55%,#fdeee4)}
.hd .u{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px}.hd .u i{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center}
.hd .u a{margin-left:auto;color:var(--tx3);text-decoration:none}
.hd b{display:block;font-size:21px;margin-top:6px}
.bd{padding:4px 14px calc(40px + env(safe-area-inset-bottom))}
.sec{font-size:12px;color:var(--tx3);margin:14px 4px 6px}
.fld{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font-size:16px;font-family:inherit;color:var(--tx);outline:none}
.fld:focus{border-color:#f0b48d}
textarea.fld{border-radius:14px;height:84px;resize:none}
.seg{display:flex;background:#e9e6e3;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-size:14px;color:var(--tx2);font-family:inherit;cursor:pointer;line-height:1.3}
.seg button.on{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button:disabled{color:var(--tx3);opacity:.6}
.seg small{display:block;font-size:10.5px;font-weight:400;color:var(--tx3)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx)}
.chip.on{background:var(--tint);border-color:#f0b48d;color:var(--accT);font-weight:700}
.chip.s{padding:6px 12px;font-size:13px}
.me{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 14px;border:1px solid var(--line);font-size:14px}
.me i{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--tx2);flex-shrink:0}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:999px;padding:13px;font-weight:700;font-size:15px;margin-top:18px;background:var(--acc);color:#fff;font-family:inherit;cursor:pointer}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:var(--err)}.btn:disabled{opacity:.45}
.hint{font-size:12px;color:var(--tx3);line-height:1.55;margin:6px 4px 0}
.card{background:#fff;border-radius:18px;border:1px solid var(--line);padding:13px 14px;margin-bottom:9px}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.st.w{background:var(--warnBg);color:var(--warn)}.st.ok{background:var(--okBg);color:var(--ok)}.st.no{background:var(--errBg);color:var(--err)}.st.x{background:var(--card2);color:var(--tx3)}
.kv{font-size:13.5px;color:var(--tx2);margin-top:6px;line-height:1.7}.kv b{color:var(--tx);font-weight:600}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border:0;border-radius:999px;padding:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.acts .y{background:var(--acc);color:#fff}.acts .n{background:var(--card2);color:var(--err)}.acts .c{background:var(--card2);color:var(--tx2)}
.grp{font-size:13px;font-weight:700;margin:16px 4px 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:6px;white-space:nowrap}.grp em{font-style:normal;font-size:11px;background:var(--tint);color:var(--accT);border-radius:999px;padding:1px 8px}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:30px 0}
.nav{display:flex;gap:18px;margin-top:8px;font-size:14.5px;color:var(--tx3);overflow-x:auto}
.nav>span{position:relative;cursor:pointer;padding:6px 0 7px;white-space:nowrap}
.nav>span.on{color:var(--tx);font-weight:800}
.nav>span.on:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--acc)}
.nav sup{position:absolute;top:-2px;right:-14px;background:#e1261a;color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nav .ic{display:none}
@media(max-width:420px){.nav.many{font-size:12.5px}}
.ov{position:fixed;inset:0;z-index:15;display:none}.ov.on{display:block}
.dim{position:absolute;inset:0;background:rgba(20,16,12,.32)}
.sheet{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.15);max-height:90%;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,26,24,.9);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:25;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--tx2);background:var(--card2);border-radius:12px;padding:8px 11px;margin-top:8px;line-height:1.55}
.note.red{background:#fde4e1;color:#a5281d}
.pz{background:#7b3fb8;color:#fff;border-radius:6px;padding:0 5px;font-weight:700}
.pz.pr{background:#d32f2f}
.qrbox{background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px;text-align:center;margin-top:8px}
#qr{display:inline-block;padding:10px;background:#fff}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:#ddd;border:0;flex-shrink:0;cursor:pointer;transition:background .2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--acc)}.sw.on:after{left:21px}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}.li:first-child{border-top:0}
.embed .hd .u,.embed .hd b{display:none}.embed .hd{padding:4px 16px 0}.embed .hd:not(.hasnav){display:none}.embed .nav{margin-top:0}
.hrow{display:flex;align-items:center;gap:8px;margin:14px 4px 0}
.hrow .h2{flex:1;font-size:17px;font-weight:800;user-select:none;-webkit-user-select:none}
.mybtn{border:1.5px solid #f0b48d;background:#fff;color:var(--accT);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;font-family:inherit;cursor:pointer;white-space:nowrap}
.mybtn i{font-style:normal;min-width:17px;height:17px;border-radius:9px;background:#e1261a;color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.back{border:0;background:none;color:var(--accT);font-size:14px;font-weight:700;font-family:inherit;padding:4px 0;cursor:pointer}
.embed .bd{padding-top:6px}

/* ── 我的預約：車票（T5 橘色日期條）＋確認章／作廢章 ── */
.tk5{background:#fff;border-radius:18px;border:1px solid var(--line);margin:22px 4px 14px 0;position:relative}
.tk5 .bar{border-radius:18px 18px 0 0;background:linear-gradient(90deg,#F36F21,#C44E06);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:800}
.tk5 .bar small{font-weight:600;opacity:.92;margin-right:44px}
.tk5 .in{padding:12px 14px 12px}
.tk5 .tm{font-size:32px;font-weight:800;line-height:1;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk5 .tm s.old{font-size:20px;color:var(--tx3);font-weight:700;text-decoration:line-through;text-decoration-color:#d2402c;text-decoration-thickness:2.5px}
.tk5 .tm .nw{color:#c0442b}
.tk5 .tm .chg{font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:#d2402c;border-radius:6px;padding:2px 6px;letter-spacing:0;align-self:center}
.tk5 .lab{font-size:10.5px;color:var(--tx3);font-weight:600;letter-spacing:.5px}
.tk5 .sp{display:flex;justify-content:space-between;align-items:center}
.tk5 .rw{display:flex;align-items:center;gap:8px;margin-top:1px}
.tk5 .pl{font-size:20px;font-weight:800;white-space:nowrap}
.tk5 .road{flex:1;position:relative;height:24px;display:flex;align-items:center;justify-content:center;gap:6px}
.tk5 .road:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #ddd3ca}

.sfx{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(18,14,10,0);transition:background .3s;pointer-events:all;overflow:hidden}
.sfx.on{background:rgba(18,14,10,.62)}
.sfx .stage{position:relative;width:100%;height:150px}
.sfx .car{position:absolute;left:50%;bottom:26px;width:150px;margin-left:-75px;transform:translateX(0);opacity:0;transition:opacity .25s}
.sfx.on .car{opacity:1}
.sfx .car .vanbig{width:150px;height:108px;margin:0;transform:scaleX(-1);animation:idle .14s linear infinite alternate}
.sfx .road{position:absolute;left:0;right:0;bottom:24px;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 18px,transparent 18px 34px);opacity:0;transition:opacity .3s}
.sfx.on .road{opacity:1}
.sfx .puff{position:absolute;left:-6px;bottom:10px;width:14px;height:14px;border-radius:50%;background:rgba(235,230,224,.85);opacity:0;animation:puff .9s ease-out infinite}
.sfx .puff:nth-child(2){animation-delay:.3s}.sfx .puff:nth-child(3){animation-delay:.6s}
.sfx .msg{color:#fff;font-weight:700;font-size:16px;letter-spacing:.5px;margin-top:6px;transition:opacity .2s}
.sfx .msg .dots::after{content:'';animation:dots 1.2s steps(4) infinite}
.sfx .done{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;color:#fff;transition:all .35s cubic-bezier(.2,1.4,.4,1)}
.sfx .done i{display:flex;align-items:center;justify-content:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:#2e9d5b;font-style:normal;font-size:34px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sfx .done b{display:block;font-size:20px}.sfx .done span{display:block;font-size:13.5px;opacity:.85;margin-top:4px}
.sfx.go .car{transition:transform .85s cubic-bezier(.55,0,.9,.5);transform:translateX(75vw)}
.sfx.go .car .vanbig{animation:none}
.sfx.go .road{animation:road .3s linear infinite}
.sfx.go .puff{animation-duration:.45s}
.sfx.go .msg{opacity:0}
.sfx.ok .done{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sfx.ok .road,.sfx.ok .car{opacity:0}
.sfx.out{background:rgba(18,14,10,0)}.sfx.out .done{opacity:0}
@keyframes idle{from{transform:scaleX(-1) translateY(0) rotate(0)}to{transform:scaleX(-1) translateY(-1.5px) rotate(.6deg)}}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-34px,-10px) scale(1.6)}}
@keyframes road{to{background-position:-34px 0}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.rs{background:#fff;border:1.5px solid #ead9cc;border-radius:18px;padding:10px 14px 8px;margin:0 0 10px}
.rs .tt{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--tx2);margin-bottom:4px}
.rs .tt b{font-size:22px;color:var(--tx);font-weight:800}
.rs ol{list-style:none;margin:0;padding:0;position:relative}
.rs ol::before{content:'';position:absolute;left:11px;top:14px;bottom:14px;border-left:2px dashed #d8c7b8}
.rs li{position:relative;display:flex;align-items:center;gap:10px;padding:5px 0;min-height:30px}
.rs .no{flex:0 0 24px;height:24px;border-radius:50%;background:#fff;border:2px solid #c9b6a6;color:var(--tx2);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:1}
.rs li.hm .no{background:var(--acc);border-color:var(--acc);color:#fff}
.rs .nm{font-weight:800;font-size:15.5px;min-width:0;flex:1}
.rs .nm .pl{font-size:15px}
.rs .io{display:flex;gap:6px;flex:none}
.rs .io span{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.rs .dn{background:#fde9e4;color:#c0442b}.rs .up{background:#e3f3e8;color:#23824a}
.rs .ft{font-size:12px;color:var(--tx3);margin-top:4px;border-top:1px dashed var(--line);padding-top:6px}
.gx{background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:0 12px}
.gx>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 2px;font-size:14px;font-weight:700;cursor:pointer}

/* ── 時間（台灣） ── */
function tw(){var d=new Date(Date.now()+8*3600e3);return{day:d.toISOString().slice(0,10),min:d.getUTCHours()*60+d.getUTCMinutes()};}
function hm(s){var a=String(s||'').split(':');return +a[0]*60+ +a[1];}
var WK='日一二三四五六';
function dow(d){return new Date(d+'T12:00:00+08:00').getDay();}
function md(d){var a=d.split('-');return (a[0]!==tw().day.slice(0,4)?a[0]+'/':'')+(+a[1])+'/'+(+a[2]);}
function dlab(d){var t=tw().day,tm=new Date(new Date(t+'T12:00:00Z').getTime()+864e5).toISOString().slice(0,10);
  return (d===t?'今天 ':d===tm?'明天 ':'')+md(d)+'（'+WK[dow(d)]+'）';}
function slotLab(s){if(s==='10:00')return '上午 10:00';if(s==='14:00')return '下午 2:00';var m=hm(s);if(isNaN(m))return s;var H=Math.floor(m/60);return (m<720?'上午 ':'下午 ')+(H>12?H-12:H)+':'+('0'+m%60).slice(-2);}
function eff(day,slot){return (M&&M.re&&M.re[day+'|'+slot])||slot;}   // 司機改過時間就用新的
function expired(b){var n=tw(),t=b.kind==='call'?(b.at&&b.at!=='asap'?b.at:String(b.created||'').slice(11,16)):eff(b.day,b.slot);   // 表定發車後 1 小時：車票過期
  return b.day<n.day||(b.day===n.day&&n.min>=hm(t)+60);}
function departed(day,slot){var n=tw();return day<n.day||(day===n.day&&n.min>=hm(eff(day,slot)));}
function pl(n){return n==='紫軒'?'<span class="pz">紫軒</span>':n==='紅樓'?'<span class="pz pr">紅樓</span>':he(n);}

/* ── 狀態 ── */
/* 行事曆裡的「娃娃車」頁會用 iframe 打開這頁（?embed=1）：沿用行事曆的登入、通知也從行事曆跳出 */

function init(){
  // 行事曆換了人登入（或登出）：娃娃車跟著換
  if(EMBED&&TOKEN&&ls('espc_token')&&ls('bus_u')!==ls('espc_user'))logoutLocal();

  }
  // 同一個瀏覽器已經登入行事曆：直接沿用（不用再打密碼）
  var ct=ls('espc_token');
  if(ct&&ct.indexOf('VIEW-')!==0){

  }

/* ── 畫面 ── */
function render(){
  var hd=document.querySelector('.hd');

  if(!me.ext&&me.kind==='g'){$('ht').textContent='娃娃車預約';$('nav').style.display='none';$('bd').innerHTML=extHTML();return;}
  var act=(DATA.mine||[]).filter(function(b){return (b.st==='w'||b.st==='ok')&&(b.kind==='call'||!departed(b.day,b.slot));}).length;
  ACT=act;

  if(me.isDriver||me.isAdmin)navs=[['drv','🚐','娃娃車',(DATA.drv||[]).filter(function(b){return b.st==='w';}).length],['book','➕','預約',0],['qr','▦','QR code',0]];

/* 司機點「新的預約」通知：網址帶著這筆的內容 → 不用等下載，直接顯示、可以接單／不接單 */
var ORD=null,ORD_OPEN='',TK='';
/* 乘客點「司機確認／不接單／改時間／廣播／提醒」通知 → 直接打開我的預約、捲到那張車票並閃一下 */
function tkParse(s){var m=String(s||'').match(/^#?t=([A-Za-z0-9]+)(~.*)?$/);return m?m[1]:'';}
/* 通知網址帶著車票內容（#t=ID~資料）：點開馬上就有，不用等下載 */
function tkData(s){var m=String(s||'').match(/^#?t=([A-Za-z0-9]+)~(.+)$/);if(!m)return null;var o=null;
  try{o=JSON.parse(decodeURIComponent(m[2]));}catch(e){try{o=JSON.parse(m[2]);}catch(_){return null;}}
  return {id:m[1],kind:o.k||'bus',day:o.d||'',slot:o.s||'',trip:o.t||'',dest:o.ds||'',frm:o.f||'',n:+o.n||1,at:o.a||'',st:o.st||'w',drv:o.dr||'',drvExt:o.dx||'',why:o.w||'',eta:o.e||'',upd:o.u||'',trunk:!!o.tr,at2:o.a2||'',strike:!!o.sk,memo:o.m||'',rep:!!o.r};}
var TKP='',TKD=null;
function tkGo(id,data){if(!id||!M||!M.me)return;
  try{if(/^#t=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(PAGE!=='mine'){PAGE='mine';window.scrollTo(0,0);render();}
  TKD=data||null;tkPop(id);load();}
/** 像行事曆公告：背景模糊，中間一張車票，下面關閉 */
function tkPop(id){TKP=id;var b=findB(id,DATA.mine),d=TKD&&TKD.id===id?TKD:null;
  if(d&&(!b||(d.upd||'')>(b.upd||'')))b=d;   // 通知帶來的比手上的新就用通知的
  $('ov').innerHTML='<div class="dim blur" onclick="closeSheet()"></div><div class="tkpop">'+(b?tkHTML(b,true):'<div class="tk5" style="padding:30px 0">'+LD()+'</div>')
    +'<button class="btn tkx" onclick="closeSheet()">關閉</button></div>';
  $('ov').classList.add('on');}
function tkPopRefresh(){if(!TKP||!$('ov').classList.contains('on')||!document.querySelector('.tkpop'))return;
  var b=findB(TKP,DATA.mine);if(b&&(!TKD||TKD.id!==TKP||(b.upd||'')>=(TKD.upd||''))){TKD=null;tkPop(TKP);}}
function tkShow(){if(!TK)return;var e=$('tk-'+TK);if(!e)return;var id=TK;TK='';
  setTimeout(function(){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('hl');void e.offsetWidth;e.classList.add('hl');},60);}
function ordParse(s){var m=String(s||'').match(/^#?o=(.+)$/);if(!m)return null;var o=null;
  try{o=JSON.parse(decodeURIComponent(m[1]));}catch(e){try{o=JSON.parse(m[1]);}catch(_){return null;}}
  if(!o||!o.i)return null;
  return {id:o.i,who:o.w||'',ext:o.x||'',day:o.d||'',slot:o.s||'',trip:o.t||'',dest:o.ds||'',frm:o.f||'',n:+o.n||1,kind:o.k||'bus',at:o.a||'',trunk:!!o.tr,memo:o.m||'',st:'w',_n:1};}
function ordB(id){return ORD&&ORD.id===id?ORD:null;}
function ordGo(o){if(!o||!M||!M.me||!(M.me.isDriver||M.me.isAdmin))return;ORD=o;
  try{if(/^#o=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(PAGE!=='drv'){PAGE='drv';render();}ordSheet(o.id);load();}
function ordSheet(id){var b=findB(id,DATA.drv)||ordB(id);if(!b)return;ORD_OPEN=id;
  var call=b.kind==='call';
  var stx=b.st==='ok'?'<span class="st ok">'+he(b.drv||'')+' 已確認</span>':b.st==='no'?'<span class="st no">已回覆不接單</span>':b.st==='x'?'<span class="st x">已取消</span>':'<span class="st w">待確認</span>';
  var h='<div style="display:flex;align-items:center;gap:8px"><b style="font-size:17px">'+(call?'🚨 臨時叫車':'🚐 新的預約')+'</b>'+stx+'</div>'
    +'<div class="ordc"><div class="on">'+he(b.who)+(b.ext?' <span>#'+he(b.ext)+'</span>':'')+'</div>'
    +'<div class="ot">'+(call?(b.at==='asap'?'盡快':'今天 '+he(b.at)):dlab(b.day)+'　'+tripLab(b))+'</div>'
    +'<div class="or">'+route(b)+'・'+b.n+' 人'+(b.trunk?'・後車廂':'')+'</div>'
    +(b.memo?'<div class="om">備註：'+he(b.memo)+'</div>':'')+'</div>';
  if(b.st==='w'&&M.me.isDriver){
    if(call)h+='<div class="sec" style="margin-left:0">接單：大約多久到上車地點</div><div class="chips">'+[5,10,15,20,30].map(function(m){return '<button class="chip" onclick="this.disabled=true;accFx(\''+id+'\','+m+')">'+m+' 分鐘</button>';}).join('')+'</div>';
    else h+='<button class="btn" onclick="accFx(\''+id+'\',0)">接單</button>';
    h+='<button class="btn g" style="margin-top:8px" onclick="rejectOpen(\''+id+'\')">不接單</button>';
  }
  h+='<button class="btn g" style="margin-top:8px" onclick="ORD_OPEN=\'\';closeSheet()">'+(b.st==='w'?'等一下再說':'關閉')+'</button>';
  sheet(h);}
function ordRefresh(){   // 背景抓到最新清單：這筆的狀態變了（別的司機接走、乘客取消）就更新畫面
  if(!ORD_OPEN||!$('ov').classList.contains('on'))return;
  var x=findB(ORD_OPEN,DATA.drv);
  if(x){if(ORD&&ORD.id===ORD_OPEN&&x.st===ORD.st&&!ORD._n)return;ORD=Object.assign({},x);ordSheet(ORD_OPEN);}
  else if(ORD&&ORD.id===ORD_OPEN&&ORD.st!=='x'){ORD.st='x';ORD._n=0;ordSheet(ORD_OPEN);}
}
function swOpenTake(){if(!window.caches)return;caches.open('bus-open').then(function(c){return c.match('./__open').then(function(r){return r?r.json():null;}).then(function(j){
  if(!j)return;c.delete('./__open');if(Date.now()-(j.at||0)>120000||!M)return;
  var hs=String(j.url||'').split('#')[1],o=ordParse(hs);if(o)ordGo(o);else if(tkParse(hs))tkGo(tkParse(hs),tkData(hs));else if(/#mine/.test(j.url||'')&&PAGE!=='mine')go('mine');});}).catch(function(){});}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')setTimeout(swOpenTake,150);});
window.addEventListener('hashchange',function(){var o=ordParse(location.hash.slice(1));if(o)ordGo(o);else if(tkParse(location.hash))tkGo(tkParse(location.hash),tkData(location.hash));else if(location.hash==='#mine'&&M&&PAGE!=='mine')go('mine');});
function pageOk(p){if(!M||!M.me)return '';var d=M.me.isDriver||M.me.isAdmin;if(/^o=/.test(p))return d?'drv':'';if(/^t=/.test(p))return 'mine';
  if(p==='mine'||p==='book')return p;if(p==='drv'&&d)return 'drv';return M.me.isDriver?'drv':'';}
window.busGo=function(p){p=String(p||'');if(!M||!M.me){PEND=p;return;}var o=ordParse(p);if(o){ordGo(o);return;}if(tkParse(p)){tkGo(tkParse(p),tkData(p));return;}var q=pageOk(p);if(q&&q!==PAGE)go(q);else load();};
function go(p){PAGE=p;window.scrollTo(0,0);render();load();}
function logoutAsk(){sheet('<b style="font-size:17px">登出娃娃車？</b><p class="hint">'+(M&&M.me.kind==='g'?'下次輸入工號就能再進來。':'下次輸入工號就能再進來。')+'</p><button class="btn r" onclick="closeSheet();logout()">登出</button><button class="btn g" style="margin-top:8px" onclick="closeSheet()">取消</button>');}
/* 取資料 */
function load(){
  if(!TOKEN||!M||(!M.me.ext&&M.me.kind==='g'))return;
  var fn=PAGE==='drv'?'drvList':PAGE==='adm'?'admLoad':(PAGE==='mine'||PAGE==='book')?'mine':'';
  if(!fn)return;
  var p=PAGE;
  gas(fn,TOKEN).then(function(j){
    if(!j.ok){toast(j.error||'讀取失敗');return;}
    if(j.me)setMe(j);
    if(fn==='drvList'){DATA.drv=j.list;DATA.sent=j.sent;DATA.push=j.push;DATA.reps=j.reps||[];ordRefresh();}
    try{if(fn==='drvList'||fn==='mine')lsS('bus_d_'+fn+'_'+uid(),JSON.stringify({d:tw().day,l:j.list,s:j.sent||null}));}catch(e){}
    if(fn==='mine'){DATA.mine=j.list;DATA.push=j.push;if(j.reps)DATA.reps=j.reps;tkPopRefresh();}
    if(fn==='admLoad')DATA.adm=j;
    if(PAGE===p&&!$('ov').classList.contains('on')&&!typing()&&!DRAG)render();
  }).catch(function(e){toast(e.message);});
}
function typing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
setInterval(function(){if(document.visibilityState==='visible')load();},30000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){load();pushRefresh();}});

/* ── 登入 ── */
function loginHTML(){
  var h='<div style="text-align:center;margin:26px 0 6px"><img src="icon-192.png" style="width:76px;height:76px;border-radius:20px;box-shadow:0 6px 16px rgba(212,71,14,.3)" alt="">'
    +'<div style="font-size:21px;font-weight:800;margin-top:12px">娃娃車預約</div><div class="hint" style="text-align:center">從'+HOME+'出發・每天上午 10:00、下午 2:00<br>週六日、國定假日停駛</div></div>';
  var err=LG.err?'<p class="hint" style="color:var(--err)">'+he(LG.err)+'</p>':'';
  if(LG.step===1){
    h+='<div class="card" style="margin-top:18px"><div class="sec" style="margin-top:0">工號</div>'
      +'<input class="fld" id="lgid" placeholder="例如 T30001" autocapitalize="characters" value="'+he(LG.gid)+'" style="font-size:18px;letter-spacing:1px;text-align:center" oninput="LG.gid=this.value.toUpperCase().replace(/\\s/g,\'\');this.value=LG.gid;$(\'lgb\').disabled=LG.gid.length<3" onkeydown="if(event.key===\'Enter\'&&LG.gid.length>=3)gidGo()">'+err
      +'<button class="btn" id="lgb" '+(LG.gid.length<3||LG.busy?'disabled':'')+' onclick="gidGo()">'+(LG.busy?'請稍候…':'下一步')+'</button></div>'
      +'<p class="hint" style="text-align:center;margin-top:12px">不用密碼，輸入工號就能預約<br>有行事曆帳號的同事，姓名、分機會自動帶入</p>';
  }else{
    h+='<div class="card" style="margin-top:12px"><div style="font-weight:700">第一次使用</div><div class="hint" style="margin:2px 0 0">工號 '+he(LG.gid)+'，請輸入姓名和分機</div>'
      +'<div class="sec">姓名</div><input class="fld" id="lgn" placeholder="王小明" value="'+he(LG.name)+'" oninput="LG.name=this.value;lgChk()">'
      +'<div class="sec">分機</div><input class="fld" id="lge" placeholder="2538" inputmode="numeric" value="'+he(LG.ext)+'" oninput="LG.ext=this.value.replace(/[^0-9#-]/g,\'\');this.value=LG.ext;lgChk()">'+err
      +'<button class="btn" id="lgb" disabled onclick="regGo()">'+(LG.busy?'請稍候…':'完成，開始預約')+'</button>'
      +'<button class="btn g" style="margin-top:8px" onclick="LG.step=1;LG.err=\'\';render()">返回</button></div>';
    setTimeout(lgChk,0);
  }
  return h;
}
function lgChk(){var b=$('lgb');if(b)b.disabled=LG.busy||!(LG.name.trim()&&LG.ext.trim());}
function loginOk(j,first){TOKEN=j.token;lsS('bus_token',TOKEN);setMe(j);LG={step:1,gid:'',name:'',ext:'',u:'',p:'',err:'',busy:false};PAGE='';toast('歡迎，'+j.me.name);afterLogin(first,true);}
function gidGo(){
  if(LG.busy)return;LG.busy=true;LG.err='';render();
  gas('loginGid',LG.gid).then(function(j){LG.busy=false;
    if(!j.ok){LG.err=j.error;render();return;}
    if(j.need){LG.step=2;render();setTimeout(function(){var f=$('lgn');if(f)f.focus();},50);return;}
    loginOk(j,false);
  }).catch(function(e){LG.busy=false;LG.err=e.message;render();});
}
function regGo(){
  if(LG.busy)return;LG.busy=true;render();
  gas('regGid',LG.gid,LG.name.trim(),LG.ext.trim()).then(function(j){LG.busy=false;
    if(!j.ok){LG.err=j.error;render();return;}
    loginOk(j,true);
  }).catch(function(e){LG.busy=false;LG.err=e.message;render();});
}
/* 行事曆帳號沒有分機（通訊錄沒填）：問一次 */
function extHTML(){
  return '<div class="card" style="margin-top:12px"><div class="sec" style="margin-top:0">請輸入分機</div><input class="fld" id="exf" inputmode="numeric" placeholder="2538" oninput="this.value=this.value.replace(/[^0-9#-]/g,\'\')">'
    +'<button class="btn" onclick="extGo()">完成</button></div>';

/* 用工號登入的司機／管理員：輸入行事曆密碼才開司機、管理功能（只有工號的話任何人都打得出來） */
function unlockCard(){
  if(!M||!M.me.needPw)return '';
  return '<div class="note" style="margin:10px 0"><b>你是管理員</b>，輸入行事曆密碼開啟管理功能'
    +'<div style="display:flex;gap:8px;margin-top:8px"><input class="fld" id="ulp" type="password" autocomplete="current-password" placeholder="行事曆密碼" style="flex:1;min-width:0;padding:8px 13px;font-size:15px" onkeydown="if(event.key===\'Enter\')unlockGo()">'
    +'<button class="chip s" style="background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700" id="ulb" onclick="unlockGo()">開啟</button></div></div>';
}
function unlockGo(){var v=$('ulp').value;if(!v){toast('請輸入密碼');return;}$('ulb').disabled=true;
  gas('unlock',TOKEN,v).then(function(j){if(!j.ok){toast(j.error,2500);$('ulb').disabled=false;return;}setMe(j);toast('已開啟管理功能');go(j.me.isDriver?'drv':'book');}).catch(function(e){toast(e.message);$('ulb').disabled=false;});}

/* ── 預約 ── */
function meCard(){
  return '';   // 預約人不另外顯示：表頭已經有「名字 #分機」
  var me=M.me;
  return '<div class="sec">預約人</div><div class="me"><i>'+he(me.name.slice(0,1))+'</i><div style="flex:1"><b>'+he(me.name)+'</b><div class="hint" style="margin:0">'
    +(me.kind==='g'?he(me.gid)+(me.ext?'・':''):'')+(me.ext?'分機 '+he(me.ext):'')+'</div></div>'
    +(me.kind==='g'?'<a href="#" style="color:var(--accT);font-size:13px" onclick="logout();return false">不是我</a>':'')+'</div>';
}
var ACT=0;
function myBtn(){if(WIDE())return '';return '<button class="mybtn" onclick="go(\'mine\')">📋 我的預約'+(ACT?'<i>'+ACT+'</i>':'')+'</button>';}
function bookHTML(){
  var h=unlockCard()+meCard();
  h+='<div class="hrow"><div class="h2" onclick="tap3()">預約班次</div>'+myBtn()+'</div>';
  if(CALLON)h+='<div style="height:10px"></div>';
  if(!CALLON){}
  else h+='<div class="seg" style="margin-top:14px">'+[['bus','🚐 預約班次'],['call','🚨 臨時叫車']].map(function(m){return '<button class="'+((F.mode||'bus')===m[0]?'on':'')+'" onclick="F.mode=\''+m[0]+'\';render()" style="font-weight:700">'+m[1]+'</button>';}).join('')+'</div>';
  if(F.mode==='call')return h+callHTML();
  var days=(M.days||[]).filter(function(d){return !departed(d,'14:00');});
  if(!days.length)return h+'<div class="empty">近期沒有可以預約的班次<br><span style="font-size:12px">週六日、國定假日停駛</span></div>';
  if(days.indexOf(F.day)<0)F.day=days[0];
  var slots=['10:00','14:00'];
  if(!F.slot||(!F.rep&&departed(F.day,F.slot)))F.slot=F.rep?'10:00':slots.filter(function(s){return !departed(F.day,s);})[0];
  var drv=M.me.isDriver||M.me.isAdmin,R=drv&&F.rep;
  if(drv)h+='<div class="sec">預約方式</div><div class="seg">'+[[0,'單次'],[1,'🔁 固定搭車（每週重複）']].map(function(t){return '<button class="'+(!!F.rep===!!t[0]?'on':'')+'" onclick="F.rep='+(t[0]?'true':'false')+';render()">'+t[1]+'</button>';}).join('')+'</div>';
  if(R)h+='<div class="sec">每週哪幾天</div><div class="seg">'+DOWS.map(function(d){return '<button class="'+(F.dows.indexOf(d[0])>=0?'on':'')+'" onclick="F.dows=F.dows.indexOf(\''+d[0]+'\')>=0?F.dows.replace(\''+d[0]+'\',\'\'):(F.dows+\''+d[0]+'\').split(\'\').sort().join(\'\');render()">'+d[1]+'</button>';}).join('')+'</div>';
  if(M.offToday&&!R)h+='<div class="note red" style="margin-top:12px">今天停駛（'+he(M.offToday)+'）</div>';
  if(!R)h+='<div class="sec">日期</div><div class="seg">'+days.map(function(d){var l=dlab(d).split(' ');return '<button class="'+(F.day===d?'on':'')+'" onclick="F.day=\''+d+'\';F.slot=\'\';render()">'+(l.length>1?l[0]+'<small>'+l[1]+'</small>':l[0])+'</button>';}).join('')+'</div>';
  var offs=R?[]:(M.off||[]).filter(function(o){return o.d>tw().day&&o.d<=days[days.length-1];});
  if(offs.length)h+='<p class="hint">'+offs.map(function(o){return md(o.d)+' '+he(o.n);}).join('、')+' 停駛</p>';
  h+='<div class="sec">行程</div><div class="seg">'+[['rt','來回'],['go','去程'],['back','回程']].map(function(t){return '<button class="'+(F.trip===t[0]?'on':'')+'" onclick="F.trip=\''+t[0]+'\';render()">'+t[1]+'</button>';}).join('')+'</div>';
  h+='<div class="sec">'+(F.trip==='rt'?'班次':F.trip==='back'?'回程班次（從目的地接回）':'去程班次')+'</div><div class="seg">'+slots.map(function(s){var gone=!R&&departed(F.day,s);
    return '<button class="'+(F.slot===s?'on':'')+'" '+(gone?'disabled':'')+' onclick="F.slot=\''+s+'\';render()">'+slotLab(eff(F.day,s))+(gone?'<small>已發車</small>':eff(F.day,s)!==s?'<small>原 '+slotLab(s)+'・司機改時間</small>':'')+'</button>';}).join('')+'</div>';
  h+='<div class="sec">'+(F.trip==='back'?'從哪裡接回（回到'+HOME+'）':F.trip==='rt'?'目的地（從'+HOME+'出發，再接回'+HOME+'）':'目的地（從'+HOME+'出發）')+'</div><div class="chips">'+DESTS.map(function(t){return '<button class="chip'+(F.dest===t?' on':'')+'" onclick="F.dest=\''+t+'\';render()">'+t+'</button>';}).join('')+'</div>';
  if(F.dest==='其他')h+='<input class="fld" id="oth" style="margin-top:8px" maxlength="40" placeholder="例如：捷運新北產業園區站" value="'+he(F.other)+'" oninput="F.other=this.value;chk()">';
  h+='<div class="sec">人數</div><div class="seg" style="max-width:220px">'+[1,2,3,4].map(function(n){return '<button class="'+(F.n===n?'on':'')+'" onclick="F.n='+n+';render()">'+n+(n===4?'+':'')+'</button>';}).join('')+'</div>';
  h+='<div class="sec">備註（選填）</div><input class="fld" maxlength="100" placeholder="例如：有大件行李" value="'+he(F.memo)+'" oninput="F.memo=this.value">';
  if(M.me.isDriver||M.me.isAdmin){peopleLoad();   // 司機／管理員：可以幫別人預約
    h+='<div class="sec">'+(R?'乘客（不填就是自己）':'幫誰預約（選填，不填就是自己）')+'</div><div style="display:flex;gap:8px"><input class="fld" style="flex:1.4" list="ppl" maxlength="20" placeholder="名字" value="'+he(F.forName)+'" oninput="F.forName=this.value;forFill(this.value,\'fext\',\'forExt\')">'
      +'<input class="fld" style="flex:1" id="fext" inputmode="numeric" maxlength="10" placeholder="分機" value="'+he(F.forExt)+'" oninput="F.forExt=this.value"></div>'+pplList();}
  h+='<button class="btn" id="go" onclick="'+(R?'repGoF()':'bookGo()')+'">'+(BUSY?'送出中…':R?'🔁 設定固定搭車':'送出預約')+'</button>';
  if(R)h+='<p class="hint" style="text-align:center">會自動排進可以預約的日子（已確認、佔一個位子）；某天不搭，乘客取消那一天就好</p>';
  if(drv)h+=repList();
  if(!R)h+='<p class="hint" style="text-align:center">不限人數，發車前都可以約；送出後司機會確認</p>';
  setTimeout(chk,0);

  if(!pushSupported())return '<div class="note" style="margin:10px 0">這個瀏覽器不支援通知。<a href="#" style="color:var(--accT);font-weight:700" onclick="a2hsOpen();return false">加入主畫面</a>後再打開試試</div>';
  if(Notification.permission==='denied')return '<div class="note red" style="margin:10px 0">通知被封鎖了，請到手機「設定」裡允許娃娃車通知</div>';
  return '<div class="note" style="margin:10px 0;display:flex;align-items:center;gap:10px"><span style="flex:1">🔔 開啟通知，司機回覆、出發前 3 分鐘、發車廣播會跳出來'+(M&&M.me.kind==='u'?'<br><span style="color:var(--tx3)">沒開的話，會改從行事曆 App 通知</span>':'')+'</span><button class="chip s" style="background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700" id="pbtn" onclick="pushOn()">開啟</button></div>';
}
var FB_READY=null;
function fbMessaging(){
  if(!FB_READY){var base='https://www.gstatic.com/firebasejs/10.14.1/';
    FB_READY=loadJS(base+'firebase-app-compat.js').then(function(){return loadJS(base+'firebase-messaging-compat.js');})
      .then(function(){if(!firebase.apps.length)firebase.initializeApp(FB_CFG);return firebase.messaging();});
    FB_READY.catch(function(){FB_READY=null;});}
  return FB_READY;
}
function swReg(){return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});}
function pushOn(){
  var b=$('pbtn');if(b){b.disabled=true;b.textContent='…';}
  (Notification.permission==='granted'?Promise.resolve('granted'):Notification.requestPermission()).then(function(p){
    if(p!=='granted')throw new Error('沒有取得通知權限');return swReg();
  }).then(function(reg){return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});});
  }).then(function(tok){if(!tok)throw new Error('取不到推播代碼');
    return gas('savePush',TOKEN,tok,true).then(function(r){if(!r.ok)throw new Error(r.error);lsS('bus_push',tok);lsS('bus_push_day',tw().day);});
  }).then(function(){toast('已開啟通知');render();}).catch(function(e){toast(e.message||'開啟失敗',3000);render();});
}
/* 每次打開（最多每小時一次）：推播代碼換了就更新後台 */
var PUSH_AT=0;
function pushRefresh(){
  if(!TOKEN||!pushReady()||!pushSupported()||Notification.permission!=='granted'||!ls('bus_push'))return;
  if(Date.now()-PUSH_AT<3600000)return;PUSH_AT=Date.now();
  swReg().then(function(reg){return reg.pushManager.getSubscription().then(function(sub){
    if(!sub){lsD('bus_push');render();return;}
    return fbMessaging().then(function(m){return m.getToken({vapidKey:FCM_VAPID,serviceWorkerRegistration:reg});}).then(function(tok){
      var old=ls('bus_push');
      if(tok&&(tok!==old||ls('bus_push_day')!==tw().day))gas('savePush',TOKEN,tok,true).then(function(r){if(r.ok){lsS('bus_push',tok);lsS('bus_push_day',tw().day);}});
      if(tok&&old&&old!==tok)gas('savePush',TOKEN,old,false).catch(function(){});
    });
  });}).catch(function(){});
}
/* 加入主畫面教學（第一次用工號登入會自動跳出） */
var A2={os:''};
function a2hsOpen(os){A2.os=os||A2.os||(/Android/i.test(navigator.userAgent)?'and':'ios');
  var step=function(n,t,ic){return '<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)"><span style="width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--accT);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+n+'</span><span style="flex:1;font-size:14px;line-height:1.5">'+t+'</span>'+(ic?'<span style="font-size:20px">'+ic+'</span>':'')+'</div>';};
  var ios=step(1,'按 Safari 下方的<b>「分享」</b>按鈕','⬆️')+step(2,'往下滑，點<b>「加入主畫面」</b>','➕')+step(3,'右上角按<b>「新增」</b>','✅')+step(4,'從主畫面打開<b>娃娃車預約</b>，在「我的預約」按<b>「開啟通知」</b>','🔔');
  var and=step(1,'按 Chrome 右上角的<b>「⋮」</b>','⋮')+step(2,'點<b>「加到主畫面」</b>或<b>「安裝應用程式」</b>','➕')+step(3,'按<b>「新增／安裝」</b>','✅')+step(4,'打開後在「我的預約」按<b>「開啟通知」</b>','🔔');
  sheet('<div style="text-align:center"><div style="font-size:34px">🔔</div><b style="font-size:18px">加入主畫面，才收得到通知</b>'
    +'<p class="hint" style="text-align:center;margin-top:6px">司機接單／不接單、出發前 3 分鐘提醒、發車廣播，都要把這頁加入主畫面才會跳出來</p></div>'
    +'<div class="seg" style="margin:12px 0 4px"><button class="'+(A2.os==='ios'?'on':'')+'" onclick="a2hsOpen(\'ios\')">iPhone</button><button class="'+(A2.os==='and'?'on':'')+'" onclick="a2hsOpen(\'and\')">Android</button></div>'
    +(A2.os==='ios'?ios:and)+'<button class="btn" onclick="closeSheet()">我知道了</button>');
}
/* 點通知打開：service worker 叫畫面重新整理 */
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){var d=e.data||{};if(d.type==='open'){var hs=String(d.url||'').split('#')[1];if(tkParse(hs)){if(window.caches)caches.open('bus-open').then(function(c){c.delete('./__open');});tkGo(tkParse(hs),tkData(hs));return;}var o=ordParse(hs);if(o){if(window.caches)caches.open('bus-open').then(function(c){c.delete('./__open');});ordGo(o);return;}}if(d.type==='push'||d.type==='open'){if(d.type==='open'&&d.url&&d.url.indexOf('#mine')>=0&&M)PAGE='mine';load();}});

init();
</script>
