<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ESPC 監測行程</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#16161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESPC 行程">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#16161a; --card:#1e1e24; --card2:#26262c; --line:#2a2a30;
  --tx:#fafafa; --tx2:#a1a1aa; --tx3:#71717a;
  --acc:#4ade80; --accTx:#14532d; --tint:rgba(74,222,128,.18);
  --err:#f87171; --errBg:rgba(248,113,113,.14);
  --warn:#fbbf24; --warnBg:rgba(251,191,36,.14);
  --r:14px; --sh:0 8px 24px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f4f4f5; --card:#ffffff; --card2:#ececef; --line:#e4e4e7;
  --tx:#18181b; --tx2:#52525b; --tx3:#a1a1aa;
  --acc:#16a34a; --accTx:#ffffff; --tint:rgba(22,163,74,.13);
  --err:#dc2626; --errBg:rgba(220,38,38,.09);
  --warn:#b45309; --warnBg:rgba(180,83,9,.11);
  --sh:0 8px 24px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;color:inherit;}
a{color:var(--acc);text-decoration:none;}
input,select,textarea{font-size:16px;}
::-webkit-scrollbar{width:0;height:0;}

/* ── 通用元件 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:999px;padding:11px 20px;font-size:14px;font-weight:500;
  background:var(--card);border:1px solid var(--line);min-height:44px;transition:.15s;}
.btn:active{transform:scale(.97);}
.btn-p{background:var(--acc);color:var(--accTx);border-color:var(--acc);}
.btn-d{color:var(--err);border-color:var(--err);}
.btn-sm{padding:8px 15px;font-size:13px;min-height:38px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.5;}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:12px 16px;font-size:16px;outline:none;min-height:46px;}
.fld:focus{border-color:var(--acc);}
select.fld{appearance:none;padding-right:38px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
.lb{font-size:12px;color:var(--tx3);margin:0 0 7px 6px;}
.sec{font-size:12px;color:var(--tx3);margin:20px 6px 9px;}
.sec:first-child{margin-top:8px;}
.card{background:var(--card);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.muted{color:var(--tx2);font-size:13px;}
.hint{font-size:12px;color:var(--tx3);line-height:1.7;}
.note{background:var(--warnBg);color:var(--warn);border-radius:var(--r);padding:11px 14px;
  font-size:13px;line-height:1.7;margin-bottom:10px;}
.note.bad{background:var(--errBg);color:var(--err);}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.load{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--tx3);font-size:13px;}
.empty{text-align:center;color:var(--tx3);font-size:14px;padding:36px 20px;}
.sw{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.18s;}
.sw.on{background:var(--acc);}
.sw::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:.18s;}
.sw.on::after{transform:translateX(19px);}

/* ── 登入 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.lcard{width:100%;max-width:360px;}
.lcard h1{font-size:26px;font-weight:600;margin-bottom:6px;}
.lcard p{font-size:13px;color:var(--tx3);margin-bottom:26px;}
.lcard .fld{margin-bottom:11px;}
.lerr{color:var(--err);font-size:13px;min-height:19px;margin:4px 0 8px 6px;}

/* ── 外框 ── */
#app{display:none;flex-direction:column;min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom));}
.bar{position:sticky;top:0;z-index:40;background:var(--bg);padding-top:env(safe-area-inset-top);}
.who{display:flex;align-items:center;gap:9px;padding:11px 16px 0;}
.avt{width:26px;height:26px;border-radius:999px;background:var(--acc);color:var(--accTx);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.who-n{font-size:12px;color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 13px 10px;}
.ttl{font-size:24px;font-weight:600;padding:3px 5px;border-radius:999px;letter-spacing:-.01em;}
.ttl.tap::after{content:" ▾";font-size:13px;color:var(--tx3);font-weight:400;}
.rb{display:flex;gap:5px;align-items:center;}
.ib{background:var(--card2);width:36px;height:36px;border-radius:999px;font-size:15px;
  color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ib:active{transform:scale(.94);}
.ib svg,.who svg{display:block;}
.ib.w{width:auto;padding:0 14px;font-size:13px;gap:5px;}
.ib.act{background:var(--tint);color:var(--acc);}
.bdg{background:var(--acc);color:var(--accTx);font-size:10px;min-width:17px;height:17px;
  border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600;}
#page{flex:1;padding:0 12px;}

/* ── 篩選標籤 ── */
.fchips{display:flex;gap:6px;padding:0 13px 9px;flex-wrap:wrap;}
.fchips:empty{display:none;}
.fc{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:5px 6px 5px 12px;
  border-radius:999px;background:var(--tint);color:var(--acc);}
.fc button{font-size:12px;padding:2px 4px;color:inherit;line-height:1;}

/* ── 月曆 ── */
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--tx3);
  text-align:center;padding:2px 0 5px;}
.dow .sun{color:var(--err);}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cell{height:74px;padding:3px 2px;border-radius:10px;overflow:hidden;cursor:pointer;}
.cell:active{background:var(--card);}
.cell.tdy{outline:1.5px solid var(--acc);outline-offset:-1px;}
.dn{font-size:11px;text-align:center;line-height:1.35;font-weight:500;}
.dn.out{color:var(--tx3);font-weight:400;}
.dn.sun{color:var(--err);}
.evc{display:block;font-size:9.5px;line-height:1.5;padding:0 4px;margin-top:2px;
  border-radius:999px;color:#fff;overflow:hidden;white-space:nowrap;}
@media(min-width:420px){.cell{height:84px;}.evc{font-size:10.5px;}}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:14px 4px 4px;}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);}
.lgd{width:8px;height:8px;border-radius:999px;flex-shrink:0;}

/* ── 年月選擇 ── */
.pk{position:fixed;left:12px;right:12px;top:calc(96px + env(safe-area-inset-top));z-index:60;
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;
  display:none;box-shadow:var(--sh);max-width:400px;margin:0 auto;}
.pk.open{display:block;}
.pkh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.pkh span{font-size:16px;font-weight:600;}
.pkg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.pkb{padding:12px 0;border-radius:999px;background:var(--card2);font-size:14px;}
.pkb.cur{background:var(--acc);color:var(--accTx);font-weight:600;}
.pkb.now{outline:1.5px solid var(--acc);color:var(--acc);font-weight:500;}

/* ── 行程卡 ── */
.ev{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;
  display:flex;gap:11px;cursor:pointer;}
.ev:active{opacity:.75;}
.evb{width:3.5px;border-radius:999px;flex-shrink:0;}
.evt{font-size:11.5px;font-weight:500;}
.evn{font-size:15px;font-weight:600;line-height:1.35;margin-top:2px;}
.evm{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.6;}
.dbox{min-width:30px;text-align:center;flex-shrink:0;}
.dbox b{font-size:18px;font-weight:600;line-height:1;display:block;}
.dbox span{font-size:10px;color:var(--tx3);}

/* ── 底部列 ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;
  justify-content:space-around;background:var(--card);border-top:1px solid var(--line);
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));}
.nb{display:flex;align-items:center;padding:9px;border-radius:999px;color:var(--tx3);font-size:12.5px;}
.nb svg{width:22px;height:22px;}
.nb em{display:none;font-style:normal;font-weight:600;}
.nb.on{background:var(--tint);color:var(--acc);padding:9px 17px 9px 14px;gap:7px;}
.nb.on em{display:inline;}

/* ── 底部面板 ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;align-items:flex-end;}
.ov.open{display:flex;}
.sheet{background:var(--bg);width:100%;max-width:520px;margin:0 auto;
  border-radius:22px 22px 0 0;padding:16px 16px calc(26px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;animation:up .22s ease;}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.shh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
.shh h3{font-size:19px;font-weight:600;line-height:1.3;}
.kv{font-size:13.5px;color:var(--tx2);line-height:2;}
.kv b{color:var(--tx);font-weight:500;}
.opts{display:flex;flex-wrap:wrap;gap:7px;}
.ob svg{margin-right:-1px;}
.ob{font-size:13px;padding:9px 15px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;color:var(--tx2);}
.ob.on{background:var(--acc);color:var(--accTx);border-color:var(--acc);font-weight:500;}

/* ── 清單 ── */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--card);
  border-radius:var(--r);margin-bottom:7px;}
.pav{width:36px;height:36px;border-radius:999px;background:var(--card2);color:var(--tx2);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.tag{font-size:11px;padding:4px 11px;border-radius:999px;background:var(--card2);color:var(--tx2);white-space:nowrap;}
.tag.g{background:var(--tint);color:var(--acc);}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border-radius:var(--r);padding:14px 15px;margin-bottom:7px;width:100%;
  font-size:15px;text-align:left;}
.link svg{color:var(--tx3);flex-shrink:0;}
.link:active{opacity:.7;}

/* ── 上傳 ── */
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;cursor:pointer;}
.drop:active,.drop.over{border-color:var(--acc);background:var(--tint);}
.drop svg{color:var(--tx3);margin:0 auto;}
#fi{display:none;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{background:var(--card2);padding:9px 11px;text-align:left;font-weight:500;
  color:var(--tx2);white-space:nowrap;font-size:11.5px;}
.tbl td{padding:9px 11px;border-top:1px solid var(--line);white-space:nowrap;}
.scroll{overflow-x:auto;border-radius:var(--r);background:var(--card);}

/* ── 提示 ── */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.ts{background:var(--tx);color:var(--bg);padding:13px 18px;border-radius:14px;font-size:13.5px;
  box-shadow:var(--sh);animation:up .2s ease;line-height:1.6;text-align:center;}
.ts.ok{background:var(--acc);color:var(--accTx);}
.ts.no{background:var(--err);color:#fff;}
</style>
</head>
<body>

<div id="login">
  <div class="lcard">
    <h1>ESPC 監測行程</h1>
    <p>請登入以查看排程</p>
    <input class="fld" id="i-u" type="text" autocomplete="username" placeholder="帳號">
    <input class="fld" id="i-p" type="password" autocomplete="current-password" placeholder="密碼">
    <div class="lerr" id="l-err"></div>
    <button class="btn btn-p btn-full" id="l-btn" onclick="doLogin()">登入</button>
  </div>
</div>

<div id="app">
  <div class="bar">
    <div class="who">
      <div class="avt" id="u-av"></div>
      <div class="who-n" id="u-nm"></div>
      <button class="ib" onclick="doLogout()" title="登出" style="width:32px;height:32px"><span data-ic="logout"></span></button>
    </div>
    <div class="hd">
      <button class="ttl" id="h-ttl" onclick="onTitle()"></button>
      <div class="rb" id="h-rb"></div>
    </div>
    <div class="fchips" id="fchips"></div>
  </div>

  <div class="pk" id="pk"></div>
  <div id="page"></div>

  <div class="nav" id="nav">
    <button class="nb on" data-t="today"><span data-ic="sun"></span><em>今日</em></button>
    <button class="nb" data-t="cal"><span data-ic="cal"></span><em>行事曆</em></button>
    <button class="nb" data-t="book"><span data-ic="book"></span><em>通訊錄</em></button>
    <button class="nb" data-t="more"><span data-ic="menu"></span><em>更多</em></button>
  </div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input id="fi" type="file" accept=".xlsx,.xls" onchange="onPick(event)">

<script>
/* ══════════════════════════════════════════════════════════
   ESPC 監測行程 — 前端
   後端：Google Apps Script（下方 GAS_URL）
   ══════════════════════════════════════════════════════════ */
var GAS_URL='https://script.google.com/macros/s/AKfycbxq0Lj59wXYKQkVnbaG607FOBmEmH64VkbxqfIOBbNnbufWlqQ82x5RAKmlbFhpOssHng/exec';

function gas(fn){
  var args=Array.prototype.slice.call(arguments,1);
  var payload=JSON.stringify({fn:fn,args:args});
  if(payload.length<1800){
    return fetch(GAS_URL+'?payload='+encodeURIComponent(payload)).then(function(r){return r.json();});
  }
  return fetch(GAS_URL,{method:'POST',body:payload}).then(function(r){return r.json();});
}


/* ── 內嵌 SVG 圖示（不依賴外部字型，離線也正常）── */
var ICON={
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
 book:'<path d="M20 3v18H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M5 8H3M5 12H3M5 16H3"/><circle cx="13" cy="10" r="2"/><path d="M10 16a3 3 0 0 1 6 0"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 logout:'<path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M9 12h11M17 9l3 3-3 3"/>',
 filter:'<path d="M4 4h16l-6 7v7l-4 2v-9z"/>',
 upload:'<path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 9l5-5 5 5M12 4v12"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 users:'<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.9"/>',
 bell:'<path d="M10 5a2 2 0 1 1 4 0 7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/>',
 file:'<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M8 11h8M8 15h5"/>',
 check:'<path d="M5 12l5 5L20 7"/>',
 right:'<path d="M9 6l6 6-6 6"/>'
};
function ic(n,sz){
  return '<svg viewBox="0 0 24 24" width="'+(sz||20)+'" height="'+(sz||20)+'" fill="none" '
    +'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" '
    +'style="display:block;flex-shrink:0">'+(ICON[n]||'')+'</svg>';
}

/* ── 小工具 ── */
function he(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function p2(n){return String(n).padStart(2,'0');}
function sv(v){return v!=null?String(v).trim():'';}
function $(id){return document.getElementById(id);}
function ls(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsS(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsD(k){try{localStorage.removeItem(k);}catch(e){}}
function jGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function jSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ── 時間一律台灣（UTC+8）── */
var TWO=480;
function twDate(d){d=d?new Date(d):new Date();if(isNaN(d))return d;
  return new Date(d.getTime()+(d.getTimezoneOffset()+TWO)*60000);}
function twStr(d){var t=twDate(d);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());}
function dowOf(s){var a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2]).getDay();}
function stamp(v){if(!v)return '';var d=new Date(v);
  if(isNaN(d))return String(v).slice(0,16).replace('T',' ');
  var t=twDate(d);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())+' '+p2(t.getHours())+':'+p2(t.getMinutes());}

var DW=['日','一','二','三','四','五','六'];
var MO=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

/* ── 主題 ── */
function applyTheme(){
  var t=ls('espc_theme')||'light';
  document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');
  var mt=document.querySelector('meta[name=theme-color]');
  if(mt)mt.setAttribute('content',t==='dark'?'#16161a':'#f4f4f5');
}
function toggleTheme(){lsS('espc_theme',(ls('espc_theme')||'light')==='dark'?'light':'dark');applyTheme();render();}
applyTheme();

/* ── 提示 ── */
function toast(msg,kind,ms){
  var el=document.createElement('div');
  el.className='ts'+(kind?' '+kind:'');el.textContent=msg;
  $('toast').appendChild(el);
  setTimeout(function(){el.remove();},ms||3000);
}

/* ── 身分 ── */
var TOKEN=ls('espc_token'),ROLE=ls('espc_role'),UNAME=ls('espc_user'),ENGNAME=ls('espc_eng');
var ROLE_LABEL={admin:'管理員',supervisor:'主管',scheduler:'排程',pm:'PM',viewer:'現場'};
var ROLE_ORDER=['admin','supervisor','scheduler','pm','viewer'];
var ROLE_WRITE=['admin','supervisor','scheduler'];
function roleLabel(r){return ROLE_LABEL[r]||r;}
function canWrite(r){return ROLE_WRITE.indexOf(r)>=0;}
function saveSession(t,r,u,e){TOKEN=t;ROLE=r;UNAME=u;ENGNAME=e||'';
  lsS('espc_token',t);lsS('espc_role',r);lsS('espc_user',u);lsS('espc_eng',ENGNAME);}
function clearSession(){
  TOKEN=ROLE=UNAME=ENGNAME='';
  ['espc_token','espc_role','espc_user','espc_eng','espc_sync'].forEach(lsD);
  try{for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);
    if(k&&k.indexOf('espc_c_')===0)localStorage.removeItem(k);}}catch(e){}
}

/* ── 本機快取（版本比對）── */
var CK='espc_c_';
function cGet(k){return jGet(CK+k,null);}
function cSet(k,o){try{localStorage.setItem(CK+k,JSON.stringify(o));}catch(e){cPrune(true);
  try{localStorage.setItem(CK+k,JSON.stringify(o));}catch(e2){}}}
function cPrune(hard){
  try{var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k&&k.indexOf(CK+'m_')===0)ks.push(k);}
    ks.sort();while(ks.length>(hard?2:8))localStorage.removeItem(ks.shift());}catch(e){}
}
function cVer(v){
  if(!v)return;
  var cur=ls(CK+'ver');
  if(cur&&cur!==v){try{var del=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k&&k.indexOf(CK+'m_')===0)del.push(k);}del.forEach(function(k){localStorage.removeItem(k);});}catch(e){}}
  lsS(CK+'ver',v);
}

function doLogin(){
  var u=$('i-u').value.trim(),p=$('i-p').value,btn=$('l-btn');
  if(!u||!p){$('l-err').textContent='請輸入帳號與密碼';return;}
  btn.disabled=true;btn.textContent='登入中…';$('l-err').textContent='';
  gas('login',u,p).then(function(r){
    if(r&&r.ok){saveSession(r.token,r.role,r.username,r.engineerName||'');boot(r.username,r.role,r.engineerName||'');}
    else{$('l-err').textContent=(r&&r.error)||'登入失敗';btn.disabled=false;btn.textContent='登入';}
  }).catch(function(){$('l-err').textContent='連線失敗，請稍後再試';btn.disabled=false;btn.textContent='登入';});
}
function doLogout(){
  if(!confirm('確定要登出？'))return;
  gas('logout',TOKEN).catch(function(){});
  clearSession();location.reload();
}

function boot(u,r,eng){
  ROLE=r;UNAME=u;ENGNAME=eng;lsS('espc_eng',eng||'');
  $('login').style.display='none';
  $('app').style.display='flex';

  $('u-nm').textContent=(eng&&eng!==u?eng+'　':'')+u+'（'+roleLabel(r)+'）';

}

function go(t,s){
  tab=t;sub=s||'';
  $('pk').classList.remove('open');

  document.querySelectorAll('.nb').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-t')===t);
  });

/* ── 今日 ── */
function todayPage(){
  var t=twStr(),parts=t.split('-');
  var mine=todayRows.filter(function(r){return r.date===t;});
  var h='<div class="sec" style="margin-top:2px">'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日　週'+DW[dowOf(t)]+'</div>';
  if(!mine.length)h+='<div class="card"><div class="empty" style="padding:22px">今日沒有排程</div></div>';
  else h+=groupBy(mine).map(function(g){return evCard(g,t,true);}).join('');

  var fut={},order=[];
  todayRows.forEach(function(r){
    if(r.date<=t)return;
    if(!fut[r.date]){fut[r.date]=[];order.push(r.date);}
    fut[r.date].push(r);
  });
  order.sort();
  if(order.length){
    h+='<div class="sec">接下來</div>';
    order.slice(0,20).forEach(function(d){
      groupBy(fut[d]).forEach(function(g){
        var dd=d.split('-'),c=pcolor(g.project);
        h+='<div class="ev" onclick="openEv(\''+d+'\',\''+he(esc(g.project))+'\')" style="padding:10px 13px">'
          +'<div class="dbox"><b>'+parseInt(dd[2])+'</b><span>'+DW[dowOf(d)]+'</span></div>'
          +'<div class="evb" style="background:'+c+'"></div>'
          +'<div style="min-width:0;flex:1"><div class="evn" style="font-size:14px">'+he(g.project)+'</div>'
          +'<div class="evm">'+he(g.types.join('、'))
          +(g.locs[0]?'　·　'+he(g.locs[0]):'')+'</div></div></div>';
      });
    });
  }
  return h;
}

function evCard(g,d,full){
  var c=pcolor(g.project);
  var h='<div class="ev" onclick="openEv(\''+d+'\',\''+he(esc(g.project))+'\')">'
    +'<div class="evb" style="background:'+c+'"></div><div style="min-width:0;flex:1">'
    +'<div class="evt" style="color:'+c+'">'+he(g.types.join('、'))+'</div>'
    +'<div class="evn">'+he(g.project)+(g.no?' <span style="font-size:12px;font-weight:400;color:var(--tx3)">'+he(g.no)+'</span>':'')+'</div>';
  if(g.locs.length)h+='<div class="evm">點位：'+he(g.locs.join(' / '))+'</div>';
  if(full){
    if(g.samp)h+='<div class="evm">採樣時間：'+he(g.samp)+'</div>';
    if(g.engs.length)h+='<div class="evm">工程師：'+g.engs.map(telLink).join('、')+'</div>';
    if(g.cars.length)h+='<div class="evm">公務車：'+he(g.cars.join('、'))+'</div>';
  }
  return h+'</div></div>';
}
function esc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

/* ── 月曆 ── */
function calPage(){
  pmap={};pidx=0;
  var byDate={};
  rows.forEach(function(r){
    if(!r.date)return;
    (byDate[r.date]=byDate[r.date]||[]).push(r);
  });
  var groups={};
  Object.keys(byDate).forEach(function(d){groups[d]=groupBy(byDate[d]);});

  var first=new Date(curY,curM,1).getDay();
  var dim=new Date(curY,curM+1,0).getDate();
  var pdim=new Date(curY,curM,0).getDate();
  var today=twStr();

  var h='<div class="dow">'+DW.map(function(d,i){
    return '<span'+(i===0?' class="sun"':'')+'>'+d+'</span>';}).join('')+'</div><div class="cgrid">';
  var total=Math.ceil((first+dim)/7)*7;
  for(var i=0;i<total;i++){
    var day,ds,out=false;
    if(i<first){day=pdim-first+i+1;out=true;
      var pm=curM===0?12:curM,py=curM===0?curY-1:curY;ds=py+'-'+p2(pm)+'-'+p2(day);}
    else if(i>=first+dim){day=i-first-dim+1;out=true;
      var nm=curM===11?1:curM+2,ny=curM===11?curY+1:curY;ds=ny+'-'+p2(nm)+'-'+p2(day);}
    else{day=i-first+1;ds=curY+'-'+p2(curM+1)+'-'+p2(day);}
    var gs=out?[]:(groups[ds]||[]);
    h+='<div class="cell'+(ds===today?' tdy':'')+'" onclick="openDay(\''+ds+'\')">'
      +'<div class="dn'+(out?' out':'')+(i%7===0&&!out?' sun':'')+'">'+day+'</div>';
    gs.forEach(function(g){
      h+='<span class="evc" style="background:'+pcolor(g.project)+'"'
        +' onclick="event.stopPropagation();openEv(\''+ds+'\',\''+he(esc(g.project))+'\')">'
        +he(g.project)+'</span>';
    });
    h+='</div>';
  }
  h+='</div>';

  var ps=Object.keys(pmap);
  if(ps.length){
    h+='<div class="legend">';
    ps.forEach(function(p){h+='<div class="lg"><span class="lgd" style="background:'+pmap[p]+'"></span>'+he(p)+'</div>';});
    h+='</div>';
  }else h+='<div class="empty">本月沒有符合條件的排程</div>';
  return h;
}

/** 同日期同專案合併成一筆 */
function groupBy(list){
  var m={},order=[];
  list.forEach(function(r){
    var k=r.project||'（未分類）';
    if(!m[k]){m[k]={project:k,rows:[],types:[],locs:[],engs:[],cars:[],staff:[],
      notes:[],reps:[],eqs:[],nums:[],no:'',samp:''};order.push(k);}
    var g=m[k];g.rows.push(r);
    function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}
    add(g.types,r.type);add(g.locs,r.location);add(g.engs,r.engineer);
    add(g.notes,r.notes);add(g.reps,r.applicant);add(g.eqs,r.equipment);add(g.nums,r.reportNum);
    if(!g.no&&r.projectNo)g.no=r.projectNo;
    if(!g.samp&&r.sampTime)g.samp=r.sampTime;
    if(r.car)String(r.car).split(/[、，,]/).forEach(function(c){add(g.cars,c.trim());});
    var ss=Array.isArray(r.staff)?r.staff:String(r.staff||'').split('、');
    ss.forEach(function(p){add(g.staff,p.trim());});
  });
  return order.map(function(k){return m[k];});
}

/* ── 通訊錄 ── */
var bookQ='',bookRg='',bookTm='';
function bookPage(){
  var q=bookQ.toLowerCase();
  var list=STAFF.filter(function(s){
    var rg=(s.region||'').trim(),tm=(s.team||'').trim();
    if(bookRg==='_n'){if(rg)return false;}else if(bookRg&&rg!==bookRg)return false;
    if(bookTm==='_n'){if(tm)return false;}else if(bookTm&&tm!==bookTm)return false;
    if(!q)return true;
    return [s.name,s.phone,s.note,rg,tm].join(' ').toLowerCase().indexOf(q)>=0;
  });
  var used={},blank=false;
  STAFF.forEach(function(s){var t=(s.team||'').trim();if(t)used[t]=(used[t]||0)+1;else blank=true;});
  var teams=TEAMS.slice();
  STAFF.forEach(function(s){var t=(s.team||'').trim();if(t&&teams.indexOf(t)<0)teams.push(t);});

  var h='<input class="fld" placeholder="搜尋姓名、電話或組別" value="'+he(bookQ)+'" oninput="bookQ=this.value;paintBook()" style="margin-bottom:9px">'
    +'<div style="display:flex;gap:7px;margin-bottom:12px">'
    +'<select class="fld" onchange="bookRg=this.value;paintBook()" style="flex:1">'
    +['','台北','台中','高雄','_n'].map(function(o){
      return '<option value="'+o+'"'+(bookRg===o?' selected':'')+'>'+(o==='_n'?'未指定地區':(o||'全部地區'))+'</option>';}).join('')
    +'</select>'
    +'<select class="fld" onchange="bookTm=this.value;paintBook()" style="flex:1">'
    +'<option value="">全部組別</option>'
    +teams.filter(function(t){return used[t];}).map(function(t){
      return '<option value="'+he(t)+'"'+(bookTm===t?' selected':'')+'>'+he(t)+'（'+used[t]+'）</option>';}).join('')
    +(blank?'<option value="_n"'+(bookTm==='_n'?' selected':'')+'>未填組別</option>':'')
    +'</select></div>'
    +bookList();
  if(canWrite(ROLE))
    h+='<button class="btn btn-p btn-full" style="margin-top:12px" onclick="editStaff()">新增人員</button>';
  return h;
}

function bookList(){

    var rg=(s.region||'').trim(),tm=(s.team||'').trim();
    if(bookRg==='_n'){if(rg)return false;}else if(bookRg&&rg!==bookRg)return false;
    if(bookTm==='_n'){if(tm)return false;}else if(bookTm&&tm!==bookTm)return false;
    if(!q)return true;
    return [s.name,s.phone,s.note,rg,tm].join(' ').toLowerCase().indexOf(q)>=0;

      +(canWrite(ROLE)?'<button class="ib" style="width:32px;height:32px;font-size:13px" onclick="editStaff(\''+esc(s.name)+'\')">✎</button>':'')

/* ══ 資料載入 ══ */
function todayRange(t){
  var d=new Date(t+'T00:00:00');
  var me=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
  var d15=new Date(d);d15.setDate(d15.getDate()+15);
  var m15=d15.getFullYear()+'-'+p2(d15.getMonth()+1)+'-'+p2(d15.getDate());
  return me>m15?me:m15;
}

function loadToday(force){
  var t=twStr();
  if(!force&&todayFor===t){render();return;}
  var c=force?null:cGet('today');
  if(c&&c.date===t&&c.rows){paintToday(t,c.rows);}
  else{$('page').innerHTML='<div class="load"><div class="spin"></div> 載入中…</div>';c=null;}
  var o={dateFrom:t,dateTo:todayRange(t)};
  if(c&&c.version)o.version=c.version;
  gas('getData',TOKEN,o).then(function(r){
    if(!r||!r.ok){if(!c)$('page').innerHTML='<div class="empty">'+he((r&&r.error)||'載入失敗')+'</div>';return;}
    cVer(r.version);
    if(r.unchanged)return;
    cSet('today',{date:t,version:r.version||'',rows:r.rows||[]});
    paintToday(t,r.rows||[]);
  }).catch(function(){if(!c)$('page').innerHTML='<div class="empty">載入失敗，請重試</div>';});
}
function paintToday(t,all){
  todayRows=(all||[]).filter(passF);
  todayFor=t;
  jSet(NTC,{date:t,rows:(all||[]).filter(function(r){return r.date===t;})});
  if(tab==='today'&&!sub)render();
}

function loadMonth(force){
  var key='m_'+curY+'-'+p2(curM+1);
  var first=curY+'-'+p2(curM+1)+'-01';
  var last=curY+'-'+p2(curM+1)+'-'+p2(new Date(curY,curM+1,0).getDate());
  var c=force?null:cGet(key);
  if(c&&c.rows)paintMonth(c.rows);
  else{$('page').innerHTML='<div class="load"><div class="spin"></div> 載入中…</div>';c=null;}
  var o={dateFrom:first,dateTo:last};
  if(c&&c.version)o.version=c.version;
  gas('getData',TOKEN,o).then(function(r){
    if(!r||!r.ok){if(!c)toast((r&&r.error)||'載入失敗','no');return;}
    cVer(r.version);
    if(r.unchanged)return;
    cSet(key,{version:r.version||'',rows:r.rows||[]});
    paintMonth(r.rows||[]);
  }).catch(function(){if(!c)$('page').innerHTML='<div class="empty">載入失敗，請重試</div>';});
}
function paintMonth(list){allRows=list||[];applyF();}

function moveM(d){
  curM+=d;if(curM>11){curM=0;curY++;}if(curM<0){curM=11;curY--;}
  allRows=[];loadMonth();render();
}
function goToday(){var n=twDate();curY=n.getFullYear();curM=n.getMonth();allRows=[];loadMonth();render();}

function loadStaff(cb,force){
  var c=force?null:cGet('staff');
  if(c&&c.staff){applyStaff(c.staff);STAFF_VER=c.version||'';if(cb){cb();cb=null;}}
  gas('getStaff',TOKEN,c?c.version:'').then(function(r){
    if(r&&r.ok&&!r.unchanged){
      applyStaff(r.staff||[]);STAFF_VER=r.version||'';
      cSet('staff',{version:STAFF_VER,staff:STAFF});
      if(tab==='book'&&!sub)render();
    }
    if(cb)cb();
  }).catch(function(){if(cb)cb();});
}
function applyStaff(l){
  STAFF=l||[];PHONE={};
  STAFF.forEach(function(s){if(s.name)PHONE[s.name]=s.phone||'';});
}

/* ══ 篩選 ══ */
function passF(r){
  if(F.rg&&(r.region||'')!==F.rg)return false;
  if(F.en&&r.engineer!==F.en)return false;
  if(F.ty.length&&F.ty.indexOf(r.type)<0)return false;
  return true;
}
function applyF(){
  rows=allRows.filter(passF);
  var t=twStr(),c=jGet(NTC,null);
  if(c&&c.date===t)todayRows=(cGet('today')&&cGet('today').rows||c.rows).filter(passF);
  render();
}

function openFilter(){
  var engs=[],tys=[],seen={},seen2={};
  allRows.concat(todayRows).forEach(function(r){
    if(r.engineer&&!seen[r.engineer]){seen[r.engineer]=1;engs.push(r.engineer);}
    if(r.type&&!seen2[r.type]){seen2[r.type]=1;tys.push(r.type);}
  });
  if(F.en&&engs.indexOf(F.en)<0)engs.push(F.en);
  F.ty.forEach(function(t){if(tys.indexOf(t)<0)tys.push(t);});
  engs.sort();tys.sort();

  var h='<div class="shh"><h3>篩選</h3><button class="ib" onclick="closeSheet()">✕</button></div>'
    +'<p class="lb">地區</p><select class="fld" id="f-rg" style="margin-bottom:16px">'
    +['','台北','台中','高雄'].map(function(o){
      return '<option value="'+o+'"'+(F.rg===o?' selected':'')+'>'+(o||'全部地區')+'</option>';}).join('')+'</select>'
    +'<p class="lb">工程師</p><select class="fld" id="f-en" style="margin-bottom:16px">'
    +'<option value="">全部工程師</option>'
    +engs.map(function(o){return '<option value="'+he(o)+'"'+(F.en===o?' selected':'')+'>'+he(o)+'</option>';}).join('')
    +'</select>'
    +'<p class="lb">類別　<span style="color:var(--tx2)">可複選</span></p><div class="opts">'
    +'<button class="ob'+(F.ty.length?'':' on')+'" onclick="pickTy(\'\')">全部</button>'
    +tys.map(function(t){
      var on=F.ty.indexOf(t)>=0;
      return '<button class="ob'+(on?' on':'')+'" onclick="pickTy(\''+esc(t)+'\')">'
        +(on?ic('check',15):'')+he(t)+'</button>';}).join('')
    +'</div>'
    +'<button class="btn btn-full" style="margin-top:18px" onclick="F={rg:\'\',en:\'\',ty:[]};closeSheet();refetch()">清除全部篩選</button>';
  openSheet(h);
  $('f-rg').onchange=function(){F.rg=this.value;refetch();};
  $('f-en').onchange=function(){F.en=this.value;refetch();};
}
function pickTy(t){
  if(!t)F.ty=[];
  else{var i=F.ty.indexOf(t);if(i>=0)F.ty.splice(i,1);else F.ty.push(t);}
  refetch();openFilter();
}
function refetch(){
  var cc=cGet('today'),t=twStr();
  if(cc&&cc.date===t)todayRows=(cc.rows||[]).filter(passF);
  rows=allRows.filter(passF);
  render();
}

/* ══ 底部面板 ══ */
function openSheet(html){$('sheet').innerHTML=html;$('ov').classList.add('open');}
function closeSheet(){$('ov').classList.remove('open');}

/** 取某日的行程：合併當月與今日視窗兩份來源並去重 */
function dayRows(d){
  var seen={},out=[];
  allRows.concat(todayRows).forEach(function(r){
    if(r.date!==d||!passF(r))return;
    var k=[r.date,r.project,r.type,r.location,r.reportNum,r.engineer].join('|');
    if(seen[k])return;
    seen[k]=1;out.push(r);
  });
  return out;
}

function openDay(d){
  var gs=groupBy(dayRows(d));
  var dd=d.split('-');
  var h='<div class="shh"><div><h3>'+parseInt(dd[1])+'月'+parseInt(dd[2])+'日　週'+DW[dowOf(d)]+'</h3>'
    +'<p class="hint" style="margin-top:3px">共 '+gs.length+' 項行程</p></div>'
    +'<button class="ib" onclick="closeSheet()">✕</button></div>';
  if(!gs.length)h+='<div class="empty">此日無排程</div>';
  gs.forEach(function(g){h+=evCard(g,d,false);});
  openSheet(h);
}

function openEv(d,proj){
  var gs=groupBy(dayRows(d));
  var g=null;
  gs.forEach(function(x){if(x.project===proj)g=x;});
  if(!g){openDay(d);return;}
  var dd=d.split('-'),c=pcolor(g.project);
  var h='<div class="shh"><div>'
    +'<div class="evt" style="color:'+c+'">'+he(g.types.join('、'))+'</div>'
    +'<h3 style="margin-top:3px">'+he(g.project)+'</h3>'
    +'<p class="hint" style="margin-top:3px">'+parseInt(dd[1])+'月'+parseInt(dd[2])+'日　週'+DW[dowOf(d)]
    +(g.no?'　·　'+he(g.no):'')+'</p></div>'
    +'<button class="ib" onclick="closeSheet()">✕</button></div><div class="kv">';
  if(g.locs.length)h+='點位：<b>'+he(g.locs.join(' / '))+'</b><br>';
  if(g.samp)h+='申報採樣時間：<b>'+he(g.samp)+'</b><br>';
  if(g.eqs.length)h+='採樣儀器：<b>'+he(g.eqs.join('　'))+'</b><br>';
  if(g.reps.length)h+='申報人員：<b>'+g.reps.map(telLink).join('、')+'</b><br>';
  if(g.nums.length)h+='報告編號：<b>'+he(g.nums.join(' / '))+'</b><br>';
  if(g.engs.length)h+='工程師：<b>'+g.engs.map(telLink).join('、')+'</b><br>';
  if(g.cars.length)h+='公務車：<b>'+he(g.cars.join('、'))+'</b><br>';
  if(g.staff.length)h+='現場人員：<b>'+g.staff.map(telLink).join('、')+'</b><br>';
  if(g.notes.length)h+='備註：<b>'+he(g.notes.join('；'))+'</b><br>';
  if(g.rows[0]&&g.rows[0].region)h+='地區：<b>'+he(g.rows[0].region)+'</b>';
  h+='</div>';
  if(gs.length>1){
    h+='<div class="sec">當天其他 '+(gs.length-1)+' 項</div>';
    gs.forEach(function(x){if(x.project!==proj)h+=evCard(x,d,false);});
  }
  openSheet(h);
}

/* ══ 年月選擇 ══ */
function renderPk(){
  var n=twDate(),ty=n.getFullYear(),tm=n.getMonth();

function pickM(y,m){
  curY=y;curM=m;$('pk').classList.remove('open');
  allRows=[];loadMonth();render();
}

/* ══ 人員編輯 ══ */

  STAFF.forEach(function(x){if(x.name===name)s=x;});

function saveStaff(){

  }).catch(function(){toast('操作失敗','no');});
}

/* ══ 上傳 ══ */
var pRows=[],pName='',pMtime='';
function uploadPage(){
  return '<div class="drop" id="dz" onclick="document.getElementById(\'fi\').click()"'
    +' ondragover="event.preventDefault();this.classList.add(\'over\')"'
    +' ondragleave="this.classList.remove(\'over\')" ondrop="onDrop(event)">'
    +ic('file',40)
    +'<p style="font-size:15px;margin-top:10px">點擊或拖曳 Excel 檔案</p>'
    +'<p class="hint" style="margin-top:6px">支援台北、台中、高雄格式<br>檔名可辨識地區時會直接上傳</p></div>'
    +'<div id="parse"></div>'
    +'<div class="sec">上傳記錄</div><div id="hist"><div class="load"><div class="spin"></div></div></div>'
    +(ROLE==='admin'?'<div class="sec">危險操作</div>'
      +'<div class="card"><p class="hint" style="margin-bottom:12px">清除所有排程資料，無法還原。</p>'
      +'<button class="btn btn-d btn-sm" onclick="clearAll()">清除全部資料</button></div>':'');
}
function onDrop(e){e.preventDefault();$('dz').classList.remove('over');
  var f=e.dataTransfer.files[0];if(f)handleFile(f);}
function onPick(e){var f=e.target.files[0];if(f)handleFile(f);e.target.value='';}

function handleFile(file){
  pName=file.name;
  pMtime=file.lastModified?new Date(file.lastModified).toISOString():'';
  $('parse').innerHTML='<div class="load"><div class="spin"></div> 解析中…</div>';
  readXlsx(file).then(function(list){
    pRows=list;
    var ok=list.filter(function(r){return r.engineer&&r.date;});
    if(ok.length&&list[0].region){paintParse(true);doUpload();}
    else paintParse(false);
  }).catch(function(err){
    $('parse').innerHTML='';toast('解析失敗：'+(err.message||err),'no',5000);
  });
}
function paintParse(uploading){
  var ok=pRows.filter(function(r){return r.engineer&&r.date;});
  var det=pRows.length?(pRows[0].region||''):'';
  var h='<div class="card" style="margin-top:12px"><div class="row" style="margin-bottom:10px">'
    +'<div style="font-size:14px;font-weight:500;word-break:break-all">'+he(pName)+'</div>'
    +'<span class="tag'+(ok.length?' g':'')+'">'+ok.length+' / '+pRows.length+'</span></div>';
  if(!pRows.length)return void($('parse').innerHTML=h+'<p class="hint">找不到有效資料，請確認檔案格式。</p></div>');
  if(uploading){
    h+='<div style="display:flex;align-items:center;gap:10px"><div class="spin"></div>'
      +'<span style="font-size:14px">地區「'+he(det)+'」，上傳中…</span></div>';
  }else{
    h+='<p class="lb" style="margin-left:0">地區</p><select class="fld" onchange="setRegion(this.value)">'
      +'<option value=""'+(det?'':' selected')+'>請選擇…</option>'
      +['台北','台中','高雄'].map(function(x){
        return '<option value="'+x+'"'+(x===det?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'
      +'<p class="hint" style="margin-top:8px">'
      +(det?'已依檔名判斷為「'+he(det)+'」，可修改。':'<span style="color:var(--err)">檔名看不出地區，請手動選擇。</span>')+'</p>';
  }
  h+='</div><div class="scroll" style="margin-bottom:10px"><table class="tbl"><thead><tr>'
    +'<th>日期</th><th>工程師</th><th>專案編號</th><th>專案</th><th>類別</th><th>點位</th>'
    +'<th>採樣時間</th><th>儀器</th><th>報告編號</th><th>地區</th></tr></thead><tbody>';
  pRows.slice(0,60).forEach(function(r){
    h+='<tr><td>'+he(r.date)+'</td><td>'+(r.engineer?he(r.engineer):'—')+'</td>'
      +'<td>'+he(r.projectNo)+'</td><td>'+he(r.project)+'</td><td>'+he(r.type)+'</td>'
      +'<td>'+he(r.location)+'</td><td>'+he(r.sampTime)+'</td><td>'+he(r.equipment)+'</td>'
      +'<td>'+he(r.reportNum)+'</td><td class="rgc">'+(r.region||'—')+'</td></tr>';
  });
  if(pRows.length>60)h+='<tr><td colspan="10" style="text-align:center;color:var(--tx3)">…僅顯示前 60 筆</td></tr>';
  h+='</tbody></table></div>';
  if(!uploading)h+='<div style="display:flex;gap:8px"><button class="btn btn-p" onclick="doUpload()">確認上傳</button>'
    +'<button class="btn" onclick="document.getElementById(\'parse\').innerHTML=\'\'">取消</button></div>';
  $('parse').innerHTML=h;
}
function setRegion(v){
  pRows.forEach(function(r){r.region=v;});
  document.querySelectorAll('#parse .rgc').forEach(function(td){td.textContent=v||'—';});
}

function doUpload(force){
  if(!pRows.length){toast('沒有可上傳的資料','no');return;}
  if(!pRows[0].region){toast('請先選擇地區','no');return;}
  var fn=pName,snap=pRows,mt=pMtime;
  gas('saveData',TOKEN,snap,fn,mt,!!force).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'上傳失敗','no');paintParse(false);return;}
    if(r.saved===0&&r.canForce){
      $('parse').innerHTML='<div class="card" style="margin-top:12px">'
        +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">未做任何變更</div>'
        +'<p class="hint">'+he(fn)+'<br>這份檔案的修改時間不比現有資料新'
        +(r.skipped?'（共 '+r.skipped+' 天）':'')+'，因此沒有覆蓋。'
        +'<br><br>若因解析規則更新需重跑，可強制覆蓋。</p>'
        +'<div style="display:flex;gap:8px;margin-top:14px">'
        +'<button class="btn btn-d btn-sm" onclick="forceUp()">強制覆蓋</button>'
        +'<button class="btn btn-sm" onclick="document.getElementById(\'parse\').innerHTML=\'\'">取消</button></div></div>';
      return;
    }
    var msg='已儲存 '+r.saved+' 筆';
    if(r.skipped)msg+='；另有 '+r.skipped+' 天因現有資料較新而保留';
    toast(msg,'ok',r.skipped?5000:3000);
    $('parse').innerHTML='<div class="card" style="margin-top:12px;border:1px solid var(--acc)">'
      +'<div style="font-size:15px;font-weight:600;color:var(--acc)">✓ 已儲存</div>'
      +'<p class="hint" style="margin-top:5px;word-break:break-all">'+he(fn)+'<br>寫入 '+r.saved+' 筆排程</p></div>';
    pRows=[];pName='';pMtime='';
    todayFor='';allRows=[];
    cPrune(true);cVer('up-'+Date.now());
    loadHistory();loadToday(true);
  }).catch(function(){toast('上傳失敗，請稍後再試','no');paintParse(false);});
}
function forceUp(){
  if(!confirm('強制覆蓋？\n\n會用這份檔案取代同地區、同日期的資料，無法還原。'))return;
  $('parse').innerHTML='<div class="load"><div class="spin"></div> 強制覆蓋中…</div>';
  doUpload(true);
}

var HIST=[];
function loadHistory(){
  gas('getUploadHistory',TOKEN).then(function(r){
    HIST=(r&&r.ok)?(r.records||[]):[];
    paintHistory();
  }).catch(function(){HIST=[];paintHistory();});
}
function paintHistory(){
  var el=$('hist');if(!el)return;
  if(!HIST.length){el.innerHTML='<div class="empty">尚無上傳記錄</div>';return;}
  var h='',old=0;
  HIST.forEach(function(r){
    var isOld=r.status==='superseded';if(isOld)old++;
    var rng=r.date_from===r.date_to?r.date_from:(r.date_from+' ~ '+r.date_to);
    h+='<div class="card" style="'+(isOld?'opacity:.55;':'')+'"><div class="row">'
      +'<div style="min-width:0;flex:1">'
      +'<div style="font-size:14px;font-weight:500;word-break:break-all;'+(isOld?'text-decoration:line-through;':'')+'">'
      +he(r.filename)+'</div>'
      +'<div style="display:flex;gap:6px;margin:5px 0">'
      +(r.region?'<span class="tag g">'+he(r.region)+'</span>':'')
      +(r.month?'<span class="tag">'+he(r.month)+'</span>':'')
      +'<span class="tag'+(isOld?'':' g')+'">'+(isOld?'已被取代':'最新')+'</span></div>'
      +'<div class="hint">'+he(rng)+(r.days?'　·　'+r.days+' 天':'')+'　·　'+he(r.uploaded_by)+'<br>'
      +'檔案更新：'+(r.source_mtime?he(stamp(r.source_mtime)):'未記錄')
      +'　上傳：'+he(stamp(r.upload_time))+'</div></div>'
      +(canWrite(ROLE)&&!isOld
        ?'<button class="ib" style="color:var(--err)" onclick="delUpload(\''+he(r.id)+'\',\''+esc(r.filename)+'\')">✕</button>':'')
      +'</div></div>';
  });
  if(canWrite(ROLE)&&old>1)
    h+='<button class="btn btn-sm btn-full" onclick="purgeOld('+old+')">清除 '+old+' 筆已被取代的記錄</button>';
  el.innerHTML=h;

/* ══ Excel 解析 ══ */
function readXlsx(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',raw:true});
        var name=null;
        if(wb.SheetNames.indexOf('採樣行程')>=0)name='採樣行程';
        else if(wb.SheetNames.indexOf('工作表1')>=0)name='工作表1';
        else name=wb.SheetNames[0];
        if(!name){res([]);return;}
        var raw=XLSX.utils.sheet_to_json(wb.Sheets[name],
          {header:1,raw:true,defval:null,range:{s:{r:0,c:0},e:{r:9999,c:21}}});
        res(parseSheet(raw,name,file.name));
      }catch(ex){rej(ex);}
    };
    fr.onerror=function(){rej(new Error('檔案讀取失敗'));};
    fr.readAsArrayBuffer(file);
  });
}
function detectRegion(fn,sheet){
  var s=(fn||'')+' '+(sheet||'');
  if(/台中|臺中|中部|中區|taichung|\bTC\b/i.test(s))return '台中';
  if(/高雄|南部|南區|kaohsiung|\bKH\b/i.test(s))return '高雄';
  if(/台北|臺北|北部|北區|taipei|\bTP\b/i.test(s))return '台北';
  if(sheet==='採樣行程')return '高雄';
  return '';
}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){if(isNaN(v))return null;
    return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());}
  if(typeof v==='number'&&v>40000&&v<80000){
    try{var d=XLSX.SSF.parse_date_code(v);if(d&&d.y>2000)return d.y+'-'+p2(d.m)+'-'+p2(d.d);}catch(e){}
  }
  var s=String(v).trim();
  var m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m=s.match(/^(\d{2,3})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return (parseInt(m[1],10)+1911)+'-'+p2(m[2])+'-'+p2(m[3]);
  return null;
}
/* 欄位對照：C 執行日期 / D 工程師 / E 專案編號 / F 專案簡稱 / G 行程類型
   H 點位 / I 數量 / J 申報採樣時間 / K 採樣儀器 / L 申報人員 / M 報告編號 / N 備註 / O 公務車 */
function parseSheet(raw,sheet,fname){
  if(!raw||raw.length<2)return [];
  var region=detectRegion(fname||'',sheet);
  var out=[];
  if(sheet==='採樣行程'){
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      var ds=parseDate(row[2]);
      if(!ds||parseInt(ds.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      out.push({date:ds,engineer:eng,project:proj,projectNo:sv(row[4]),type:type,
        location:sv(row[8]),qty:parseFloat(String(row[9]!=null?row[9]:''))||0,
        sampTime:sv(row[10]),equipment:sv(row[11]),applicant:sv(row[12]),
        reportNum:sv(row[7]),notes:[sv(row[13]),sv(row[14])].filter(Boolean).join('；'),
        car:sv(row[15]),
        staff:[16,17,18,19,20].map(function(c){return sv(row[c]);}).filter(Boolean),
        region:region});
    }
  }else{
    // 日期是合併儲存格，需往下延續；工程師空白＝休假／註記列，整列略過
    var last=null,lp='',lr='',lsm='',lc='',ln='';
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      if(row[2]!=null){var d2=parseDate(row[2]);if(d2){last=d2;lp='';lr='';lsm='';lc='';ln='';}}
      if(!last||parseInt(last.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      if(proj&&proj!==lp){lp=proj;lr='';lsm='';lc='';ln='';}
      var no=sv(row[4]);if(no)ln=no;else no=ln;
      var rpt=sv(row[12]);if(rpt)lr=rpt;else rpt=lr;
      var samp=sv(row[9]);if(samp)lsm=samp;else samp=lsm;
      var car=sv(row[14]);if(car)lc=car;else car=lc;
      out.push({date:last,engineer:eng,project:proj,projectNo:no,type:type,
        location:sv(row[7]),qty:parseFloat(String(row[8]!=null?row[8]:''))||0,
        sampTime:samp,equipment:sv(row[10]),applicant:sv(row[11]),
        reportNum:rpt,notes:sv(row[13]),car:car,
        staff:[15,16,17,18,19].map(function(c){return sv(row[c]);}).filter(Boolean),
        region:region});
    }
  }
  return out;
}

var NT='espc_notify',SWREG=null,ntBusy=false;
function ntCfg(){

function ntSup(){return 'Notification' in window;}
function regSW(){

}
function ntInit(){

  else if(perm==='denied')h+='<div class="note bad">通知權限已被封鎖，請到瀏覽器或系統設定允許本網站傳送通知。</div>';

    +'<div class="card"><div class="row"><div style="font-size:15px">六日不提醒</div>'
    +'<button class="sw'+(c.skipWeekend?' on':'')+'" onclick="ntSet(\'skipWeekend\',!'+c.skipWeekend+')"></button></div></div>'
    +'<div class="card"><div class="row"><div><div style="font-size:15px">沒有行程時仍提醒</div>'
    +'<div class="hint" style="margin-top:2px">關閉時，當天沒排程就不跳通知</div></div>'
    +'<button class="sw'+(c.notifyEmpty?' on':'')+'" onclick="ntSet(\'notifyEmpty\',!'+c.notifyEmpty+')"></button></div></div>';

  if(c.on)h+='<div class="note">手機系統會在 App 切到背景後數秒內凍結程式，因此只有在<b>該時刻 App 正開著</b>時才會即時跳通知。其餘情況會在下次開啟時補提醒。</div>';

function ntSet(k,v){var c=ntCfg();c[k]=v;jSet(NT,c);render();}
function ntToggle(){
  var c=ntCfg();
  if(c.on){c.on=false;jSet(NT,c);render();return;}
  if(!ntSup()){toast('此瀏覽器不支援通知','no');return;}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){c.on=true;c.last='';jSet(NT,c);regSW();toast('已開啟每日提醒','ok');}

function showNotif(title,body){
  var o={body:body,tag:'espc-daily',icon:'icon.png',badge:'icon.png',renotify:true};
  if(SWREG&&SWREG.showNotification){try{SWREG.showNotification(title,o);return true;}catch(e){}}
  if(navigator.serviceWorker&&navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(function(r){SWREG=r;
      try{r.showNotification(title,o);}catch(e){try{new Notification(title,o);}catch(e2){}}
    }).catch(function(){try{new Notification(title,o);}catch(e){}});
    return true;
  }
  try{new Notification(title,o);return true;}catch(e){return false;}
}
function ntText(t,list){
  var dd=t.split('-'),head=parseInt(dd[1])+'/'+parseInt(dd[2])+'（'+DW[dowOf(t)]+'）';
  if(!list.length)return {title:head+' 今日無排程',body:'今天沒有安排監測行程。'};
  var lines=groupBy(list).map(function(g){
    return '• '+g.project+(g.types.length?'（'+g.types.join('、')+'）':'')
      +(g.locs[0]?'\n　'+g.locs[0]:'')+(g.samp?'　'+g.samp:'');
  });
  return {title:head+' 今日 '+lines.length+' 項行程',body:lines.join('\n')};

function ntFire(t,done){
  function go(list,fresh){
    var eng=ENGNAME.trim();
    var mine=eng?list.filter(function(r){return String(r.engineer||'').trim()===eng;}):list;
    var c=ntCfg();
    if(!mine.length&&!c.notifyEmpty){if(done)done(!!fresh);return;}
    var m=ntText(t,mine);
    if(done)done(showNotif(m.title,m.body));
  }
  if(TOKEN){
    gas('getData',TOKEN,{dateFrom:t,dateTo:t}).then(function(r){
      if(r&&r.ok&&!r.unchanged){jSet(NTC,{date:t,rows:r.rows||[]});go(r.rows||[],true);}
      else{var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,true);else if(done)done(false);}
    }).catch(function(){var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,false);else if(done)done(false);});
  }else{var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,false);else if(done)done(false);}
}
function ntTick(){
  if(ntBusy)return;
  var c=ntCfg();
  if(!c.on||!ntSup()||Notification.permission!=='granted')return;
  var now=twDate(),t=twStr();
  if(c.last===t)return;
  var dw=now.getDay();
  if(c.skipWeekend&&(dw===0||dw===6))return;
  var hm=(c.time||'08:30').split(':');
  var target=new Date(now);
  target.setHours(parseInt(hm[0],10)||0,parseInt(hm[1],10)||0,0,0);
  if(now<target)return;
  ntBusy=true;
  ntFire(t,function(ok){ntBusy=false;if(!ok)return;
    var cc=ntCfg();cc.last=t;jSet(NT,cc);});
}
function ntTest(){
  if(!ntSup()){toast('此瀏覽器不支援通知','no');return;}

    Notification.requestPermission().then(function(p){

  var eng=ENGNAME.trim();

  var m=ntText(t,list);

    :perm!=='granted'?'沒有通知權限，請重新開啟開關授權。'
    :(isIOS&&!standalone)?'iPhone 必須從主畫面圖示開啟才會跳通知。'
    :(n===0&&!c.notifyEmpty)?'今天沒有你的行程，而「沒有行程時仍提醒」是關閉的，所以不會跳。'
    :(c.last===t)?'今天已經提醒過了（同一天只提醒一次）。'
    :'設定正常。若時間已過卻沒跳，多半是當時 App 已完全關閉。';
  el.innerHTML='<div class="card" style="margin-top:10px">'
    +r('提醒開關',c.on?'已開啟':'未開啟',!!c.on)
    +r('通知權限',perm==='granted'?'已允許':perm==='denied'?'已封鎖':'尚未詢問',perm==='granted')
    +(isIOS?r('加入主畫面',standalone?'是':'否（必須）',standalone):'')
    +r('Service Worker',SWREG?'已就緒':'載入中／不支援',!!SWREG)
    +r('提醒時間',c.time+(c.skipWeekend?'（六日不提醒）':''))
    +r('上次提醒',c.last||'尚未提醒過')
    +r('今天行程',n+' 筆',n>0||c.notifyEmpty)
    +r('目前時間',stamp(new Date()))
    +'<p class="hint" style="margin-top:10px">'+he(why)+'</p>'
    +'<button class="btn btn-sm btn-full" style="margin-top:10px" onclick="ntReset()">清除「今天已提醒」重測</button></div>';
}
function ntReset(){
  var c=ntCfg();c.last='';jSet(NT,c);
  toast('已清除，若已過提醒時間，30 秒內會跳通知','ok',4000);
  ntTick();ntDiag();ntDiag();
}
</script>
</body>
</html>
