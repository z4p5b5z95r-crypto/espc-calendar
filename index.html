      +'<div style="flex:1;min-width:0"><p class="lb">效期</p>'
      +'<select class="fld" id="c-y'+i+'" onchange="ecExp('+i+')">'
      +YEAR_OPTS.concat([0]).map(function(y){
        return '<option value="'+y+'"'+(ecYears(c)===y?' selected':'')+'>'+yearLabel(y)+'</option>';}).join('')
      +'</select></div></div>'
      +'<p class="hint" id="c-e'+i+'" style="margin:4px 0 2px 10px">'+expText(c.train,ecYears(c))+'</p>'
      +'<div class="row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">'
      +'<div><div style="font-size:14px">到期提醒</div>'
      +'<div class="hint" style="margin-top:2px">關閉後不會進回訓名單</div></div>'
      +'<button class="sw'+(c.remind===false?'':' on')+'" onclick="ecRemind('+i+')"></button></div>'
      +'</div>';
  });
  return h+'<button class="addc"'+(EC.length?' style="margin-top:9px"':'')
    +' onclick="ecAdd()">＋ 新增證照</button>';
}
function expText(v,y){
  if(!y)return '此證照設為無期限，不會提醒回訓';
  if(!v)return '填入訓練日期後會自動計算有效期限';
  var ex=addYears(v,y),d=daysBetween(twStr(),ex);
  return '有效期限至 '+ex+(d<0?'　已逾期 '+Math.abs(d)+' 天':'　剩 '+d+' 天');
}
function expCol(v,y){
  if(!y||!v)return '';
  var d=daysBetween(twStr(),addYears(v,y));
  return d<0?'var(--err)':(d<=SAFETY_WARN_DAYS?'var(--warn)':'var(--ok)');
}
function ecExp(i){
  var e=$('c-e'+i);
  if(!e)return;
  var v=$('c-d'+i)?$('c-d'+i).value:'';
  var y=$('c-y'+i)?parseInt($('c-y'+i).value,10):SAFETY_YEARS;
  e.textContent=expText(v,y);e.style.color=expCol(v,y);
}
/** 把畫面上的值收回 EC，重畫時才不會遺失 */
function ecSync(){
  EC.forEach(function(c,i){
    if($('c-t'+i))c.type=$('c-t'+i).value.trim();
    if($('c-c'+i))c.cert=$('c-c'+i).value.trim();
    if($('c-d'+i))c.train=$('c-d'+i).value;
    if($('c-y'+i))c.years=parseInt($('c-y'+i).value,10);
  });
}
function paintCerts(){
  var el=$('certs');
  if(el){el.innerHTML=certsHTML();EC.forEach(function(c,i){ecExp(i);});}
}
function ecRemind(i){
  ecSync();
  EC[i].remind=(EC[i].remind===false);
  paintCerts();
}
function ecAdd(){
  ecSync();
  if(EC.length>=10){toast('最多 10 張證照','no');return;}
  EC.push({type:'',cert:'',train:'',years:SAFETY_YEARS,remind:true});
  paintCerts();
  var el=$('c-t'+(EC.length-1));if(el)el.focus();
}
function ecDel(i){
  ecSync();EC.splice(i,1);paintCerts();
}
/** 分機：只留數字，最多 6 碼；選了「無分機」就存 EXT_NO */
function extVal(){
  if(EXT_NONE)return EXT_NO;
  var el=$('s-x');
  if(!el)return (EDIT_S&&EDIT_S.ext)||'';
  return String(el.value||'').replace(/[^0-9]/g,'').slice(0,6);
}
function saveStaff(){
  var n=$('s-n').value.trim();
  if(!n){toast('請輸入姓名','no');return;}
  if(!extOK()){toast('請填分機，沒有分機請點旁邊的「無分機」','no',3500);return;}
  ecSync();
  var certs=EC.map(function(c){
                return {t:c.type||'',c:c.cert||'',d:c.train||'',y:ecYears(c),n:c.remind!==false};})
              .filter(function(o){return o.t||o.c||o.d;});
  gas('saveStaff',TOKEN,n,fmtPhone($('s-p').value),$('s-r').value,$('s-t').value.trim(),
      JSON.stringify(certs),
      (EDIT_S&&EDIT_S.note)||'',(EDIT_S&&EDIT_S.alias)||'',extVal())
    .then(function(r){
      if(!r||!r.ok){toast((r&&r.error)||'儲存失敗','no');return;}
      toast('已儲存','ok');closeSheet();loadStaff(render,true);
    }).catch(function(){toast('操作失敗','no');});
}
function delStaff(n){
  if(!confirm('確定刪除「'+n+'」？'))return;
  gas('deleteStaff',TOKEN,n).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'刪除失敗','no');return;}
    toast('已刪除','ok');closeSheet();loadStaff(render,true);
  }).catch(function(){toast('操作失敗','no');});
}

/* ══ 下載行程（給客戶的行程表，桌機限定）══ */
function isDesk(){
  try{return (window.innerWidth||document.documentElement.clientWidth||0)>=900;}
  catch(e){return true;}
}
var DL={proj:'',ty:[],from:'',to:'',rows:null,loading:false,err:''};
function dlInit(){
  if(DL.from&&DL.to)return;
  var n=twDate(),y=n.getFullYear(),m=n.getMonth();
  DL.from=y+'-'+p2(m+1)+'-01';
  DL.to=y+'-'+p2(m+1)+'-'+p2(new Date(y,m+1,0).getDate());
}
/** 讀取期間內的全部行程（不套個人篩選，客戶要看的是整個專案） */
function dlLoad(force){
  if(ROLE!=='admin')return;
  dlInit();
  DL.loading=true;DL.err='';
  if(tab==='dl')render();
  gas('getData',TOKEN,{dateFrom:DL.from,dateTo:DL.to}).then(function(r){
    DL.loading=false;
    if(!r||!r.ok){DL.err=(r&&r.error)||'讀取失敗';DL.rows=[];}
    else DL.rows=normRows(r.rows||[]);
    if(tab==='dl')render();
  }).catch(function(){
    DL.loading=false;DL.err='讀取失敗，請重試';DL.rows=DL.rows||[];
    if(tab==='dl')render();
  });
}
function dlSetDate(which,v){
  DL[which]=v;
  if(DL.from&&DL.to&&DL.from>DL.to){if(which==='from')DL.to=DL.from;else DL.from=DL.to;}
  dlLoad();
}
function dlSetProj(v){DL.proj=v;DL.ty=[];render();}
function dlTy(t){
  if(!t)DL.ty=[];
  else{
    var i=DL.ty.indexOf(t);
    if(i<0)DL.ty.push(t);else DL.ty.splice(i,1);
  }
  render();
}
/** 目前期間內有哪些專案（依筆數多寡排序） */
function dlProjects(){
  var m={},out=[];
  (DL.rows||[]).forEach(function(r){
    var k=r.project||'';
    if(!k)return;
    if(!m[k]){m[k]={name:k,no:'',n:0};out.push(m[k]);}
    m[k].n++;
    if(!m[k].no&&okNo(r.projectNo))m[k].no=okNo(r.projectNo);
  });
  out.sort(function(a,b){return b.n-a.n||a.name.localeCompare(b.name,'zh-Hant');});
  return out;
}
function dlTypes(){
  var out=[];
  (DL.rows||[]).forEach(function(r){
    if(DL.proj&&r.project!==DL.proj)return;
    if(r.type&&out.indexOf(r.type)<0)out.push(r.type);
  });
  return out.sort();
}
/** 挑出要印的列，並把同日期、同測項、同點位、同時間的重複合併 */
function dlPicked(){
  var m={},out=[];
  (DL.rows||[]).forEach(function(r){
    if(DL.proj&&r.project!==DL.proj)return;
    if(DL.ty.length&&DL.ty.indexOf(r.type)<0)return;
    var k=[r.date,r.type,r.location,r.sampTime].join('|');
    if(!m[k]){
      m[k]={date:r.date,type:r.type||'',loc:r.location||'',time:r.sampTime||'',
            qtys:[],qseen:{}};
      out.push(m[k]);
    }
    var g=m[k];
    var qk=String(r.reportNum||'')+'｜'+String(r.qty==null?'':r.qty).trim();
    if(!(r.reportNum&&g.qseen[qk]))g.qtys.push(String(r.qty==null?'':r.qty).trim());
    g.qseen[qk]=1;
  });
  out.sort(function(a,b){
    return a.date<b.date?-1:a.date>b.date?1:
      (typeGroup(a.type)+a.type).localeCompare(typeGroup(b.type)+b.type,'zh-Hant');
  });
  return out;
}
function dlPage(){
  dlInit();
  if(ROLE!=='admin')
    return '<div class="card"><div class="empty" style="padding:30px">沒有這個功能的權限</div></div>';
  if(!isDesk())
    return '<div class="card"><div class="empty" style="padding:30px">'
      +'下載行程表請在電腦上操作<br><span style="font-size:12px">需要較寬的畫面才能預覽並列印</span></div></div>';
  return '<div class="dlw">'+dlSide()+'<div>'+dlOut()+'</div></div>';
}
function dlSide(){
  var ps=dlProjects(),tys=dlTypes();
  var h='<div class="dlside">'
    +'<p class="lb">期間</p>'
    +'<div style="display:flex;gap:8px;margin-bottom:13px">'
    +'<input class="fld" type="date" value="'+he(DL.from)+'" onchange="dlSetDate(\'from\',this.value)">'
    +'<input class="fld" type="date" value="'+he(DL.to)+'" onchange="dlSetDate(\'to\',this.value)">'
    +'</div>'
    +'<p class="lb">專案</p>'
    +'<select class="fld" style="margin-bottom:13px" onchange="dlSetProj(this.value)">'
    +'<option value="">請選擇專案</option>'
    +ps.map(function(p){
      return '<option value="'+he(p.name)+'"'+(DL.proj===p.name?' selected':'')+'>'
        +he(p.name)+'（'+p.n+'）</option>';}).join('')
    +'</select>';
  if(DL.proj){
    h+='<p class="lb">監測類別　<span style="color:var(--tx3);font-weight:400">不選＝全部</span></p>'
      +'<div class="opts" style="margin-bottom:13px">'
      +'<button class="ob'+(DL.ty.length?'':' on')+'" onclick="dlTy(\'\')">全部</button>'
      +tys.map(function(t){
        var on=DL.ty.indexOf(t)>=0;
        return '<button class="ob'+(on?' on':'')+'" onclick="dlTy(\''+he(esc(t))+'\')">'
          +(on?ic('check',15):'')+he(t)+'</button>';}).join('')
      +'</div>'
      +'<button class="btn btn-p btn-full" onclick="dlPrint()">'+ic('file',17)+'　列印／另存 PDF</button>'
      +'<p class="hint" style="margin:9px 4px 0">列印視窗的「目的地」選「另存為 PDF」即可。</p>';
  }
  return h+'</div>';
}
function dlOut(){
  if(DL.loading)return '<div class="dlout">'+loader('讀取行程…')+'</div>';
  if(DL.err)return '<div class="dlout"><div class="dlempty">'+he(DL.err)+'</div></div>';
  if(!DL.proj)
    return '<div class="dlout"><div class="dlempty">選擇期間與專案後，這裡會顯示要給客戶的行程表</div></div>';
  var list=dlPicked();
  var p=null;
  dlProjects().forEach(function(x){if(x.name===DL.proj)p=x;});
  var days={},nd=0,tot=[];
  list.forEach(function(g){
    if(!days[g.date]){days[g.date]=1;nd++;}
    g.qtys.forEach(function(q){tot.push(q);});
  });
  var h='<div class="dlout" id="dlout">'
    +'<h4>'+he(DL.proj)+'　環境監測行程表</h4>'
    +'<p class="sub">'+(p&&p.no?'計畫編號 '+he(p.no)+'　·　':'')
    +he(dlDate(DL.from))+' ～ '+he(dlDate(DL.to))
    +'　·　製表日期 '+he(twStr())+'</p>';
  if(!list.length)return h+'<div class="dlempty">這段期間沒有符合的行程</div></div>';
  h+='<table class="dlt"><thead><tr>'
    +'<th style="width:82px">日期</th><th style="width:44px">星期</th>'
    +'<th style="width:130px">監測類別</th><th>監測點位</th>'
    +'<th style="width:104px">監測時間</th><th class="num" style="width:62px">數量</th>'
    +'</tr></thead><tbody>';
  var last='';
  list.forEach(function(g){
    var first=(g.date!==last);
    h+='<tr'+(first?' class="d0"':'')+'>'
      +'<td>'+(first?he(dlDate(g.date)):'')+'</td>'
      +'<td>'+(first?DW[dowOf(g.date)]:'')+'</td>'
      +'<td>'+he(g.type||'—')+'</td>'
      +'<td>'+he(g.loc||'—')+'</td>'
      +'<td>'+he(g.time||'—')+'</td>'
      +'<td class="num">'+he(qtyText(g.qtys)||'—')+'</td></tr>';
    last=g.date;
  });
  h+='</tbody><tfoot><tr><td colspan="5">合計　'+nd+' 個工作天　'+list.length+' 個項目</td>'
    +'<td class="num">'+he(qtyText(tot)||'—')+'</td></tr></tfoot></table>'
    +'<p class="dlfoot">本表為預定行程，實際監測日期可能因天候或現場狀況調整，異動將另行通知。</p>'
    +'</div>';
  return h;
}
function dlDate(d){
  var a=String(d||'').split('-');
  return a.length===3?(a[0]+'/'+a[1]+'/'+a[2]):String(d||'');
}
function dlPrint(){
  try{window.print();}catch(e){toast('無法開啟列印視窗','no');}
}

/* ══ 上傳 ══ */
var pRows=[],pName='',pMtime='';
function uploadPage(){
  return '<div class="drop" id="dz" onclick="document.getElementById(\'fi\').click()"'
    +' ondragover="event.preventDefault();this.classList.add(\'over\')"'
    +' ondragleave="this.classList.remove(\'over\')" ondrop="onDrop(event)">'
    +ic('file',40)
    +'<p style="font-size:15px;margin-top:10px">點擊或拖曳 Excel 檔案</p>'
    +'<p class="hint" style="margin-top:6px">支援台北、台中、高雄格式<br>檔名可辨識地區時會直接上傳</p></div>'
    +'<div id="parse"></div>'
    +'<div class="sec">上傳記錄</div><div id="hist">'+loader('載入上傳記錄…')+'</div>'
    +(ROLE==='admin'?'<div class="sec">危險操作</div>'
      +'<div class="card"><p class="hint" style="margin-bottom:12px">清除所有排程資料，無法還原。</p>'
      +'<button class="btn btn-d btn-sm" onclick="clearAll()">清除全部資料</button></div>':'');
}
function onDrop(e){e.preventDefault();$('dz').classList.remove('over');
  var f=e.dataTransfer.files[0];if(f)handleFile(f);}
function onPick(e){var f=e.target.files[0];if(f)handleFile(f);e.target.value='';}

function handleFile(file){
  pName=file.name;
  // 送台灣時間字串，後端與顯示都用同一種寫法
  pMtime=file.lastModified?stamp(new Date(file.lastModified)):'';
  $('parse').innerHTML=loader('解析中…');
  readXlsx(file).then(function(list){
    pRows=list;
    var ok=list.filter(function(r){return r.engineer&&r.date;});
    if(ok.length&&list[0].region){paintParse(true);doUpload();}
    else paintParse(false);
  }).catch(function(err){
    $('parse').innerHTML='';toast('解析失敗：'+(err.message||err),'no',5000);
  });
}
function paintParse(uploading){
  var ok=pRows.filter(function(r){return r.engineer&&r.date;});
  var det=pRows.length?(pRows[0].region||''):'';
  var h='<div class="card" style="margin-top:12px"><div class="row" style="margin-bottom:10px">'
    +'<div style="font-size:14px;font-weight:500;word-break:break-all">'+he(pName)+'</div>'
    +'<span class="tag'+(ok.length?' g':'')+'">'+ok.length+' / '+pRows.length+'</span></div>';
  if(!pRows.length)return void($('parse').innerHTML=h+'<p class="hint">找不到有效資料，請確認檔案格式。</p></div>');
  if(uploading){
    h+='<div style="display:flex;align-items:center;gap:10px"><div class="spin"></div>'
      +'<div><div style="font-size:14px">地區「'+he(det)+'」，上傳中…</div>'
      +'<div class="hint" style="margin-top:2px">'+ok.length+' 筆資料寫入試算表，可能需要 1～2 分鐘，請不要關閉頁面</div></div></div>';
  }else{
    h+='<p class="lb" style="margin-left:0">地區</p><select class="fld" onchange="setRegion(this.value)">'
      +'<option value=""'+(det?'':' selected')+'>請選擇…</option>'
      +['台北','台中','高雄'].map(function(x){
        return '<option value="'+x+'"'+(x===det?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'
      +'<p class="hint" style="margin-top:8px">'
      +(det?'已依檔名判斷為「'+he(det)+'」，可修改。':'<span style="color:var(--err)">檔名看不出地區，請手動選擇。</span>')+'</p>';
  }
  h+='</div><div class="scroll" style="margin-bottom:10px"><table class="tbl"><thead><tr>'
    +'<th>日期</th><th>PM</th><th>專案編號</th><th>專案</th><th>類別</th><th>點位</th>'
    +'<th>數量</th><th>採樣時間</th><th>儀器</th><th>報告編號</th>'
    +'<th>公務車</th><th>現場</th><th>地區</th></tr></thead><tbody>';
  pRows.slice(0,60).forEach(function(r){
    h+='<tr><td>'+he(r.date)+'</td><td>'+(r.engineer?he(r.engineer):'—')+'</td>'
      +'<td>'+he(okNo(r.projectNo))+'</td><td>'+he(r.project)+'</td><td>'+he(r.type)+'</td>'
      +'<td>'+he(r.location)+'</td><td>'+he(r.qty)+'</td><td>'+he(r.sampTime)+'</td><td>'+he(r.equipment)+'</td>'
      +'<td>'+he(r.reportNum)+'</td>'
      +'<td>'+he(r.car||'')+'</td>'
      +'<td>'+he((r.staff||[]).join('、'))+'</td>'
      +'<td class="rgc">'+(r.region||'—')+'</td></tr>';
  });
  if(pRows.length>60)h+='<tr><td colspan="13" style="text-align:center;color:var(--tx3)">…僅顯示前 60 筆</td></tr>';
  h+='</tbody></table></div>';
  if(!uploading)h+='<div style="display:flex;gap:8px"><button class="btn btn-p" onclick="doUpload()">確認上傳</button>'
    +'<button class="btn" onclick="document.getElementById(\'parse\').innerHTML=\'\'">取消</button></div>';
  $('parse').innerHTML=h;
}
function setRegion(v){
  pRows.forEach(function(r){r.region=v;});
  document.querySelectorAll('#parse .rgc').forEach(function(td){td.textContent=v||'—';});
}

function doUpload(force){
  if(!pRows.length){toast('沒有可上傳的資料','no');return;}
  if(!pRows[0].region){toast('請先選擇地區','no');return;}
  var fn=pName,snap=pRows,mt=pMtime;
  gas('saveData',TOKEN,snap,fn,mt,!!force,APP_VER).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'上傳失敗','no');paintParse(false);return;}
    if(r.saved===0&&r.canForce){
      $('parse').innerHTML='<div class="card" style="margin-top:12px">'
        +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">未做任何變更</div>'
        +'<p class="hint">'+he(fn)+'<br>這份檔案的修改時間不比現有資料新'
        +(r.skipped?'（共 '+r.skipped+' 天）':'')+'，因此沒有覆蓋。'
        +'<br><br>若因解析規則更新需重跑，可強制覆蓋。</p>'
        +'<div style="display:flex;gap:8px;margin-top:14px">'
        +'<button class="btn btn-d btn-sm" onclick="forceUp()">強制覆蓋</button>'
        +'<button class="btn btn-sm" onclick="document.getElementById(\'parse\').innerHTML=\'\'">取消</button></div></div>';
      return;
    }
    var msg='已儲存 '+r.saved+' 筆';
    if(r.skipped)msg+='；另有 '+r.skipped+' 天因現有資料較新而保留';
    toast(msg,'ok',r.skipped?5000:3000);
    $('parse').innerHTML='<div class="card" style="margin-top:12px;border:1px solid var(--acc)">'
      +'<div style="font-size:15px;font-weight:600;color:var(--accT)">✓ 已儲存</div>'
      +'<p class="hint" style="margin-top:5px;word-break:break-all">'+he(fn)+'<br>寫入 '+r.saved+' 筆排程</p></div>';
    pRows=[];pName='';pMtime='';
    todayFor='';allRows=[];
    cPrune(true);cVer('up-'+Date.now());
    RUPD=null;
    loadHistory();loadToday(true);
  }).catch(function(e){
    toast(e&&e.message?e.message:'上傳失敗，請稍後再試','no',6000);
    paintParse(false);
  });
}
function forceUp(){
  if(!confirm('強制覆蓋？\n\n會用這份檔案取代同地區、同日期的資料，無法還原。'))return;
  $('parse').innerHTML=loader('強制覆蓋中…');
  doUpload(true);
}

var HIST=[];
function loadHistory(){
  gas('getUploadHistory',TOKEN).then(function(r){
    if(!r||!r.ok){
      var el=$('hist');
      if(el)el.innerHTML='<div class="empty">'+he((r&&r.error)||'載入失敗')

      return;

      +'<br><button class="btn btn-sm" style="margin-top:10px" onclick="loadHistory()">重試</button></div>';
  });

/* 上傳記錄顯示規則：
   · 只列出三個月內上傳的
   · 被取代的記錄，取代後滿三天就收起來
   其餘都放進「更早的記錄」裡，需要時才展開 */
var HIST_MONTHS=3, HIST_SUPERSEDE_DAYS=3, histMore=false;
function histAge(v){
  var d=daysBetween(String(v||'').slice(0,10),twStr());
  return (d==null||isNaN(d))?0:d;          // 認不出日期就當成很新，不隱藏
}
function histHidden(r){
  if(histAge(r.upload_time)>HIST_MONTHS*31)return true;
  if(r.status==='superseded'){
    var t=r.superseded_at||r.upload_time;
    if(histAge(t)>HIST_SUPERSEDE_DAYS)return true;
  }
  return false;
}
function histToggle(){histMore=!histMore;paintHistory();}

function paintHistory(){
  var el=$('hist');if(!el)return;
  if(!HIST.length){el.innerHTML='<div class="empty">尚無上傳記錄</div>';return;}
  var open=[],hid=[];
  HIST.forEach(function(r){(histHidden(r)?hid:open).push(r);});
  var list=histMore?open.concat(hid):open;
  var h='',old=0;
  if(!list.length)h+='<div class="empty">三個月內沒有上傳記錄</div>';
  list.forEach(function(r){
    var isOld=r.status==='superseded';if(isOld)old++;
    var rng=r.date_from===r.date_to?r.date_from:(r.date_from+' ~ '+r.date_to);
    h+='<div class="card" style="'+(isOld?'opacity:.55;':'')+'"><div class="row">'
      +'<div style="min-width:0;flex:1">'
      +'<div style="font-size:14px;font-weight:500;word-break:break-all;'+(isOld?'text-decoration:line-through;':'')+'">'
      +he(r.filename)+'</div>'
      +'<div style="display:flex;gap:6px;margin:5px 0">'
      +(r.region?'<span class="tag g">'+he(r.region)+'</span>':'')
      +(r.month?'<span class="tag">'+he(r.month)+'</span>':'')
      +'<span class="tag'+(isOld?'':' g')+'">'+(isOld?'已被取代':'最新')+'</span></div>'
      +'<div class="hint">'+he(rng)+(r.days?'　·　'+r.days+' 天':'')+'　·　'+he(r.uploaded_by)+'<br>'
      +'檔案更新：'+(r.source_mtime?he(stamp(r.source_mtime)):'未記錄')
      +'　上傳：'+he(stamp(r.upload_time))
      +'<br>解析版本：'+(r.app_ver
        ?(r.app_ver===APP_VER
          ?'<span style="color:var(--ok)">'+he(r.app_ver)+'（最新）</span>'
          :'<span style="color:var(--warn)">'+he(r.app_ver)+'　建議用目前版本 '+he(APP_VER)+' 重傳</span>')
        :'<span style="color:var(--warn)">舊版　建議重新上傳</span>')
      +'</div></div>'
      +(canWrite(ROLE)&&!isOld
        ?'<button class="ib" style="color:var(--err)" onclick="delUpload(\''+he(r.id)+'\',\''+esc(r.filename)+'\')">✕</button>':'')
      +'</div></div>';
  });
  if(hid.length)
    h+='<button class="btn btn-sm btn-full" style="margin-top:4px" onclick="histToggle()">'
      +(histMore?'收起較早的記錄':'顯示更早的記錄（'+hid.length+' 筆）')+'</button>';
  if(canWrite(ROLE)&&old>1)
    h+='<button class="btn btn-sm btn-full" style="margin-top:8px" onclick="purgeOld('+old+')">清除 '+old+' 筆已被取代的記錄</button>';
  el.innerHTML=h;
}

/* ══ Excel 解析 ══ */
function readXlsx(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',raw:true});
        var name=null;
        if(wb.SheetNames.indexOf('採樣行程')>=0)name='採樣行程';
        else if(wb.SheetNames.indexOf('工作表1')>=0)name='工作表1';
        else name=wb.SheetNames[0];
        if(!name){res([]);return;}
        var raw=XLSX.utils.sheet_to_json(wb.Sheets[name],
          {header:1,raw:true,defval:null,range:{s:{r:0,c:0},e:{r:9999,c:21}}});
        res(parseSheet(raw,name,file.name));
      }catch(ex){rej(ex);}
    };
    fr.onerror=function(){rej(new Error('檔案讀取失敗'));};
    fr.readAsArrayBuffer(file);
  });
}
function detectRegion(fn,sheet){
  var s=(fn||'')+' '+(sheet||'');
  if(/台中|臺中|中部|中區|taichung|\bTC\b/i.test(s))return '台中';
  if(/高雄|南部|南區|kaohsiung|\bKH\b/i.test(s))return '高雄';
  if(/台北|臺北|北部|北區|taipei|\bTP\b/i.test(s))return '台北';
  if(sheet==='採樣行程')return '高雄';
  return '';
}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){if(isNaN(v))return null;
    return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());}
  if(typeof v==='number'&&v>40000&&v<80000){
    try{var d=XLSX.SSF.parse_date_code(v);if(d&&d.y>2000)return d.y+'-'+p2(d.m)+'-'+p2(d.d);}catch(e){}
  }
  var s=String(v).trim();
  var m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m=s.match(/^(\d{2,3})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return (parseInt(m[1],10)+1911)+'-'+p2(m[2])+'-'+p2(m[3]);
  return null;
}
/* 欄位對照：C 執行日期 / D 工程師 / E 專案編號 / F 專案簡稱 / G 行程類型
   H 點位 / I 數量 / J 申報採樣時間 / K 採樣儀器 / L 申報人員 / M 報告編號 / N 備註 / O 公務車 */
function parseSheet(raw,sheet,fname){
  if(!raw||raw.length<2)return [];
  var region=detectRegion(fname||'',sheet);
  var out=[];
  if(sheet==='採樣行程'){
    var kd='',kst=[],kcar='';         // 人員與公務車欄空白＝沿用上一筆，換日期才重來
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      var ds=parseDate(row[2]);
      if(!ds||parseInt(ds.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      if(ds!==kd){kd=ds;kst=[];kcar='';}
      var kstaff=[16,17,18,19,20].map(function(c){return sv(row[c]);}).filter(Boolean);
      if(kstaff.length)kst=kstaff;else kstaff=kst;
      var kc=sv(row[15]);if(kc)kcar=kc;else kc=kcar;
      out.push({date:ds,engineer:eng,project:proj,projectNo:svNo(row[4]),type:type,
        location:sv(row[8]),qty:sv(row[9]),
        sampTime:sv(row[10]),equipment:sv(row[11]),applicant:sv(row[12]),
        reportNum:sv(row[7]),notes:[sv(row[13]),sv(row[14])].filter(Boolean).join('；'),
        car:kc,
        staff:kstaff.slice(),
        region:region});
    }
  }else{
    // 日期是合併儲存格，需往下延續；工程師空白＝休假／註記列，整列略過
    var last=null,lp='',lr='',lsm='',lc='',ln='',lst=[];
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      // 換日期時所有延續值歸零，人員不會跨日沿用
      if(row[2]!=null){var d2=parseDate(row[2]);if(d2&&d2!==last){last=d2;lp='';lr='';lsm='';lc='';ln='';lst=[];}}
      if(!last||parseInt(last.slice(0,4),10)<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      // 報告編號／採樣時間／專案編號屬於專案，換專案就重來；
      // 公務車和人員跟著「這一組人」走，換專案仍沿用
      if(proj&&proj!==lp){lp=proj;lr='';lsm='';ln='';}
      var no=svNo(row[4]);if(no)ln=no;else no=ln;
      var rpt=sv(row[12]);if(rpt)lr=rpt;else rpt=lr;
      var samp=sv(row[9]);if(samp)lsm=samp;else samp=lsm;
      var car=sv(row[14]);if(car)lc=car;else car=lc;   // 空白＝沿用同一台車
      // 人員欄空白＝跟上一筆同一組；專案換了也繼續沿用，只有換日期才重來
      var st=[15,16,17,18,19].map(function(c){return sv(row[c]);}).filter(Boolean);
      if(st.length)lst=st;else st=lst;
      out.push({date:last,engineer:eng,project:proj,projectNo:no,type:type,
        location:sv(row[7]),qty:sv(row[8]),
        sampTime:samp,equipment:sv(row[10]),applicant:sv(row[11]),
        reportNum:rpt,notes:sv(row[13]),car:car,
        staff:st.slice(),
        region:region});
    }
  }
  return out;
}

/* ── 拖拉改上下關係 ── */
var DRAG=null,DRAG_JUST=false;
function ocCardEl(el){
  while(el&&el!==document.body){
    if(el.classList&&(el.classList.contains('occ')||el.classList.contains('ocip')))return el;
    el=el.parentNode;
  }
  return null;
}
function userOf(u){
  var out=null;
  USERS.forEach(function(x){if(x.username===u)out=x;});
  return out;
}
/** 可不可以把 u 掛到 mgr 底下（空字串＝最上層） */
function canDropOn(u,mgr){
  if(!u||u===mgr)return false;
  var me=userOf(u);
  if(!me||!canTouchUser(me))return false;
  if(mgrsOf(me).length===1&&mgrsOf(me)[0]===mgr)return false;   // 沒有變動
  if(!mgr)return mgrsOf(me).length>0;
  if(!userOf(mgr))return false;
  if(descendantsOf(u).indexOf(mgr)>=0)return false;             // 會繞成循環
  return true;
}
function dragMark(el,on){
  if(el&&el.classList)el.classList.toggle('drop',!!on);
}
function ocDown(e){
  if(tab!=='admin'||sub)return;
  var card=ocCardEl(e.target);
  if(!card||!card.getAttribute('data-can'))return;
  DRAG={u:card.getAttribute('data-u'),card:card,
        x:e.clientX,y:e.clientY,on:false,over:null,ghost:null};
}
function ocMove(e){
  if(!DRAG)return;
  var dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;
  if(!DRAG.on){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    DRAG.on=true;
    DRAG.card.classList.add('drag');
    var g=document.createElement('div');
    g.className='occ ocghost';
    g.innerHTML=DRAG.card.innerHTML;
    document.body.appendChild(g);
    DRAG.ghost=g;
    var rz=$('ocroot');
    if(rz)rz.classList.add('show');
  }
  if(e.cancelable)e.preventDefault();
  DRAG.ghost.style.left=e.clientX+'px';
  DRAG.ghost.style.top=e.clientY+'px';
  var el=document.elementFromPoint(e.clientX,e.clientY);
  var rz=$('ocroot');
  var target=ocCardEl(el);
  var onRoot=!!(el&&rz&&(el===rz||rz.contains(el)));
  var next=onRoot?rz:(target&&target!==DRAG.card
    &&canDropOn(DRAG.u,target.getAttribute('data-u'))?target:null);
  if(next!==DRAG.over){
    dragMark(DRAG.over,false);
    dragMark(next,true);
    DRAG.over=next;
  }
}
function ocUp(){
  if(!DRAG)return;
  var d=DRAG;DRAG=null;
  if(!d.on)return;
  DRAG_JUST=true;
  setTimeout(function(){DRAG_JUST=false;},300);
  if(d.ghost&&d.ghost.remove)d.ghost.remove();
  d.card.classList.remove('drag');
  dragMark(d.over,false);
  var rz=$('ocroot');
  if(rz)rz.classList.remove('show');
  if(!d.over)return;
  var mgr=(d.over===rz)?'':d.over.getAttribute('data-u');
  askDrop(d.u,mgr);
}
/** 放開後：已經有主管就問「搬過去」還是「加成共管」，否則直接確認 */
function askDrop(u,mgr){
  if(!canDropOn(u,mgr))return;

  var nm=(me&&(me.engineerName||me.username))||u;
  var tn=to?(to.engineerName||to.username):'最上層';
  var cur=mgrsOf(me);
  if(!mgr||!cur.length){                       // 沒有原主管就沒有共管的問題
    if(confirm('把「'+nm+'」改成「'+tn+'」底下？'))applyDrop(u,mgr,'move');
    return;
  }
  var curTxt=cur.map(function(m){
    var x=userOf(m);return x?(x.engineerName||x.username):m;}).join('、');
  openSheet('<div class="shh"><div>'
    +'<div class="evt" style="color:var(--accT)">調整上下關係</div>'
    +'<h3 style="margin-top:3px">'+he(nm)+' → '+he(tn)+'</h3>'

    +'<button class="ib" onclick="closeSheet()">✕</button></div>'

function applyDrop(u,mgr,mode){

  var me=userOf(u),to=mgr?userOf(mgr):null;
  var nm=(me&&(me.engineerName||me.username))||u;

  var list;
  if(mode==='add'){

  }else list=mgr?[mgr]:[];

/** 直屬主管的候選名單：排除自己與自己的下屬（避免循環） */
function mgrOptions(username,cur){
  var skip={};
  if(username){skip[username]=1;descendantsOf(username).forEach(function(n){skip[n]=1;});}
  var list=USERS.filter(function(x){return !skip[x.username];});
  list.sort(function(a,b){
    var ra=rankOf(a.role),rb=rankOf(b.role);
    if(ra!==rb)return ra-rb;
    return (a.engineerName||a.username).localeCompare(b.engineerName||b.username,'zh-Hant');
  });
  return '<option value="">最上層（沒有主管）</option>'
    +list.map(function(x){
      return '<option value="'+he(x.username)+'"'+(cur===x.username?' selected':'')+'>'
        +he(x.engineerName||x.username)+'（'+roleLabel(x.role)+'）</option>';}).join('');
}

/** 通訊錄裡的那一筆（查不到回 null） */
function staffOf(name){
  var n=String(name||'').trim(),out=null;
  if(!n)return null;
  STAFF.forEach(function(x){if(x.name===n)out=x;});
  return out;
}
/** 從帳號管理改分機：寫回通訊錄，其他欄位原值帶回去不動 */
function saveExtFor(name,ext){
  return new Promise(function(done){
    var n=String(name||'').trim();
    if(!n){done();return;}
    var run=function(){
      var st=staffOf(n);
      gas('saveStaff',TOKEN,n,(st&&st.phone)||'',(st&&st.region)||'',(st&&st.team)||'',
          JSON.stringify((st&&st.certs)||[]),(st&&st.note)||'',(st&&st.alias)||'',ext)
        .then(function(){loadStaff(null,true);done();})
        .catch(function(){done();});
    };
    if(STAFF_READY)run();               // 通訊錄沒載好就先載，免得把既有資料洗掉
    else loadStaff(run,true);
  });
}

/** 刪除帳號：兩段確認，第二段要打出工號，避免誤刪 */
function delUser(name){
  var u=null;
  USERS.forEach(function(x){if(x.username===name)u=x;});
  var who=u&&u.engineerName?u.engineerName+'（'+name+'）':name;
  if(!confirm('確定要刪除帳號 '+who+'？\n\n此動作無法復原，該帳號會立刻無法登入，'
    +'通訊錄裡對應的人員資料也會一併刪除。\n（只是暫時不用請改用「停用」）'))return;
  var typed=prompt('請輸入工號 '+name+' 以確認刪除：');
  if(typed===null)return;
  if(String(typed).trim().toUpperCase()!==String(name).trim().toUpperCase()){
    toast('工號不符，已取消','no');return;
  }
  gas('deleteUser',TOKEN,name).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||'刪除失敗','no',4000);return;}
    toast(r.staffDeleted?('已刪除帳號與通訊錄資料'):'已刪除帳號','ok');
    closeSheet();loadUsers();
    if(r.staffDeleted)loadStaff(null,true);
  }).catch(function(){toast('操作失敗','no');});
}
function saveUser(name){
  var u=null;
  USERS.forEach(function(x){if(x.username===name)u=x;});
  if(!u)return;
  var f={},any=false;
  var role=$('e-r')&&!$('e-r').disabled?$('e-r').value:u.role;
  if(role!==u.role){f.role=role;any=true;}
  var eng=$('e-e').value.trim();
  if(eng!==(u.engineerName||'')){f.engineerName=eng;any=true;}
  var rg=$('e-g').value;
  if(rg!==(u.region||'')){f.region=rg;any=true;}
  var tm=$('e-t').value.trim();
  if(tm!==(u.team||'')){f.team=tm;any=true;}
  var mg=MG.join(','),oldMg=mgrsOf(u).join(',');
  if(MG_FOR===name&&mg!==oldMg){f.manager=mg;any=true;}
  var nu=$('e-u')?$('e-u').value.trim():name;
  var rename=(nu&&nu!==name);
  if(eng&&!extOK()){toast('請填分機，沒有分機請點旁邊的「無分機」','no',3500);return;}
  var ex=extVal(),sOld=staffOf(eng||u.engineerName);
  var extChanged=(eng&&ex!==String((sOld&&sOld.ext)||''));
  if(!rename&&!any&&!extChanged){closeSheet();return;}

  // 先改工號，後面的欄位更新才會對到新帳號
  var first=rename?gas('renameUser',TOKEN,name,nu):Promise.resolve({ok:true});
  first.then(function(r){
    if(!r||!r.ok)throw new Error((r&&r.error)||'工號更新失敗');
    var target=rename?nu:name;
    if(rename&&r.self){                       // 改到自己的工號就要更新本機記錄
      saveSession(TOKEN,ROLE,nu,ENGNAME);
      $('u-nm').innerHTML=he((ENGNAME&&ENGNAME!==nu?ENGNAME+'　':'')+nu+'（'+roleLabel(ROLE)+'）')
        +(ROLE==='sampler'?'<span class="beta">BETA</span>':'');
    }
    return any?gas('updateUser',TOKEN,target,f):{ok:true};
  }).then(function(r2){
    if(!r2||!r2.ok)throw new Error((r2&&r2.error)||'儲存失敗');
    return extChanged?saveExtFor(eng,ex):null;
  }).then(function(){
    toast('已儲存','ok');closeSheet();loadUsers();
  }).catch(function(e){
    toast((e&&e.message)||'操作失敗','no',4000);
    loadUsers();
  });
}

    +'<button class="sw'+(c.skipWeekend?' on':'')+'" onclick="ntSet(\'skipWeekend\',!'+c.skipWeekend+')"></button></div></div>'
    +'<div class="card"><div class="row"><div><div style="font-size:15px">沒有行程時仍提醒</div>'
    +'<div class="hint" style="margin-top:2px">關閉時，當天沒排程就不跳通知</div></div>'
    +'<button class="sw'+(c.notifyEmpty?' on':'')+'" onclick="ntSet(\'notifyEmpty\',!'+c.notifyEmpty+')"></button></div></div>';

  if(c.on)h+='<div class="note">手機系統會在 App 切到背景後數秒內凍結程式，因此只有在<b>該時刻 App 正開著</b>時才會即時跳通知。其餘情況會在下次開啟時補提醒。</div>';

  h+='<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-sm" onclick="ntTest()">發送測試通知</button>'
    +'<button class="btn btn-sm" onclick="ntDiag()">檢查設定</button></div><div id="diag"></div>';
  return h;
}
function ntSet(k,v){var c=ntCfg();c[k]=v;jSet(NT,c);render();}
function ntToggle(){
  var c=ntCfg();
  if(c.on){c.on=false;jSet(NT,c);render();return;}
  if(!ntSup()){toast('此瀏覽器不支援通知','no');return;}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){c.on=true;c.last='';jSet(NT,c);regSW();toast('已開啟每日提醒','ok');}
    else toast('未取得通知權限','no');
    render();
  }).catch(function(){render();});
}
function showNotif(title,body){
  var o={body:body,tag:'espc-daily',icon:'icon.png',badge:'icon.png',renotify:true};
  if(SWREG&&SWREG.showNotification){try{SWREG.showNotification(title,o);return true;}catch(e){}}
  if(navigator.serviceWorker&&navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(function(r){SWREG=r;
      try{r.showNotification(title,o);}catch(e){try{new Notification(title,o);}catch(e2){}}
    }).catch(function(){try{new Notification(title,o);}catch(e){}});
    return true;
  }
  try{new Notification(title,o);return true;}catch(e){return false;}
}
function ntText(t,list){
  var dd=t.split('-'),head=parseInt(dd[1])+'/'+parseInt(dd[2])+'（'+DW[dowOf(t)]+'）';
  if(!list.length)return {title:head+' 今日無排程',body:'今天沒有安排監測行程。'};
  var lines=groupBy(list).map(function(g){
    return '• '+g.project+(g.types.length?'（'+g.types.join('、')+'）':'')
      +(g.locs[0]?'\n　'+g.locs[0]:'')+(g.samp?'　'+g.samp:'');
  });
  return {title:head+' 今日 '+lines.length+' 項行程',body:lines.join('\n')};
}
function ntFire(t,done){
  function go(list,fresh){
    var eng=ENGNAME.trim();
    var mine=eng?list.filter(function(r){return String(r.engineer||'').trim()===eng;}):list;
    var c=ntCfg();
    if(!mine.length&&!c.notifyEmpty){if(done)done(!!fresh);return;}
    var m=ntText(t,mine);
    if(done)done(showNotif(m.title,m.body));
  }
  if(TOKEN){
    gas('getData',TOKEN,{dateFrom:t,dateTo:t}).then(function(r){
      if(r&&r.ok&&!r.unchanged){jSet(NTC,{date:t,rows:r.rows||[]});go(r.rows||[],true);}
      else{var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,true);else if(done)done(false);}
    }).catch(function(){var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,false);else if(done)done(false);});
  }else{var c=jGet(NTC,null);if(c&&c.date===t)go(c.rows,false);else if(done)done(false);}
}
function ntTick(){
  if(ntBusy)return;
  var c=ntCfg();
  if(!c.on||!ntSup()||Notification.permission!=='granted')return;
  var now=twDate(),t=twStr();
  if(c.last===t)return;
  var dw=now.getDay();
  if(c.skipWeekend&&(dw===0||dw===6))return;
  var hm=(c.time||'08:30').split(':');
  var target=new Date(now);
  target.setHours(parseInt(hm[0],10)||0,parseInt(hm[1],10)||0,0,0);
  if(now<target)return;
  ntBusy=true;
  ntFire(t,function(ok){ntBusy=false;if(!ok)return;
    var cc=ntCfg();cc.last=t;jSet(NT,cc);});
}
function ntTest(){
  if(!ntSup()){toast('此瀏覽器不支援通知','no');return;}
  if(Notification.permission!=='granted'){
    Notification.requestPermission().then(function(p){
      if(p==='granted')ntTest();else toast('未取得通知權限','no');});
    return;
  }
  var t=twStr();
  var c=jGet(NTC,null);
  var list=(c&&c.date===t)?c.rows:todayRows.filter(function(r){return r.date===t;});
  var eng=ENGNAME.trim();
  if(eng)list=list.filter(function(r){return String(r.engineer||'').trim()===eng;});
  var m=ntText(t,list);
  if(showNotif(m.title,m.body))toast('已發送測試通知','ok');
  else toast('無法發送通知','no');
}
function ntDiag(){
  var el=$('diag');if(!el)return;
  if(el.innerHTML){el.innerHTML='';return;}
  var c=ntCfg();
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  var perm=ntSup()?Notification.permission:'不支援';
  var t=twStr();
  var cc=jGet(NTC,null);
  var n=(cc&&cc.date===t)?cc.rows.length:0;
  function r(l,v,ok){
    return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">'
      +'<span style="color:var(--tx3)">'+l+'</span><b style="color:'
      +(ok===true?'var(--accT)':ok===false?'var(--err)':'var(--tx)')+'">'+he(v)+'</b></div>';
  }
  var why=!c.on?'提醒開關沒開。'
    :perm!=='granted'?'沒有通知權限，請重新開啟開關授權。'
    :(isIOS&&!standalone)?'iPhone 必須從主畫面圖示開啟才會跳通知。'
    :(n===0&&!c.notifyEmpty)?'今天沒有你的行程，而「沒有行程時仍提醒」是關閉的，所以不會跳。'
    :(c.last===t)?'今天已經提醒過了（同一天只提醒一次）。'
    :'設定正常。若時間已過卻沒跳，多半是當時 App 已完全關閉。';
  el.innerHTML='<div class="card" style="margin-top:10px">'
    +r('提醒開關',c.on?'已開啟':'未開啟',!!c.on)
    +r('通知權限',perm==='granted'?'已允許':perm==='denied'?'已封鎖':'尚未詢問',perm==='granted')
    +(isIOS?r('加入主畫面',standalone?'是':'否（必須）',standalone):'')
    +r('Service Worker',SWREG?'已就緒':'載入中／不支援',!!SWREG)
    +r('提醒時間',c.time+(c.skipWeekend?'（六日不提醒）':''))
    +r('上次提醒',c.last||'尚未提醒過')
    +r('今天行程',n+' 筆',n>0||c.notifyEmpty)
    +r('目前時間',stamp(new Date()))
    +'<p class="hint" style="margin-top:10px">'+he(why)+'</p>'
    +'<button class="btn btn-sm btn-full" style="margin-top:10px" onclick="ntReset()">清除「今天已提醒」重測</button></div>';
}
function ntReset(){
  var c=ntCfg();c.last='';jSet(NT,c);
  toast('已清除，若已過提醒時間，30 秒內會跳通知','ok',4000);
  ntTick();ntDiag();ntDiag();
}
</script>
</body>
</html>
