<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ESPC 監測行程</title>
<link rel="manifest" href="manifest.json?v=4">
<link rel="apple-touch-icon" href="icon-v4.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-v4.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v4.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512-v4.png">
<meta name="theme-color" content="#F36F21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESPC 行程">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* SGS 企業色：橘 #F36F21（主）／灰 #77787B（輔）／白 */
:root{
  --bg:#f4f4f5; --card:#ffffff; --card2:#ebebec; --line:#e2e2e4;
  --tx:#1c1c1e; --tx2:#5c5d61; --tx3:#98989c;
  --brand:#F36F21;          /* SGS 品牌橘：大面積識別用 */
  --acc:#C44E06;            /* 填色：按鈕、膠囊底（白字對比 4.7:1）*/
  --accTx:#ffffff;
  --accT:#B54705;           /* 文字／圖示用（淺底對比 4.9:1）*/
  --tint:rgba(243,111,33,.12);
  --err:#c62828; --errBg:rgba(198,40,40,.09);
  --warn:#a85600; --warnBg:rgba(243,111,33,.13);
  --ok:#1e7a44;             /* 效期內綠（淺底對比 4.8:1）*/
  --r:14px; --sh:0 8px 24px rgba(0,0,0,.12);
  --gl:rgba(255,255,255,.5);         /* 玻璃底（2026-09-25za 統一 0.5，原 .62／.78） */
  --glStrong:rgba(255,255,255,.5);   /* 卡片、按鈕、輸入框 */
  --glLine:rgba(255,255,255,.7);     /* 玻璃邊緣高光 */
  --blur:saturate(180%) blur(20px);
}
html[data-theme="dark"]{
  --bg:#1a1a1c; --card:#242427; --card2:#2d2d31; --line:#343438;
  --tx:#fafafa; --tx2:#a8a8ad; --tx3:#77787B;   /* SGS 灰 */
  --brand:#F36F21;
  --acc:#C44E06;            /* 按鈕填色，白字對比 4.7:1 */
  --accTx:#ffffff;
  --accT:#FF8C4D;           /* 深底上提亮（對比 7.5:1）*/
  --tint:rgba(243,111,33,.2);
  --err:#ef5350; --errBg:rgba(239,83,80,.16);
  --warn:#ffb74d; --warnBg:rgba(255,183,77,.14);
  --ok:#5ed18f;             /* 深底上提亮 */
  --sh:0 8px 24px rgba(0,0,0,.4);
  --gl:rgba(38,38,42,.5);
  --glStrong:rgba(38,38,42,.5);
  --glLine:rgba(255,255,255,.1);
  --blur:saturate(180%) blur(20px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;}
/* 背景色團：讓毛玻璃有東西可折射 */
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:-2;
  pointer-events:none;filter:blur(70px);opacity:.5;}
body::before{width:60vw;height:60vw;max-width:420px;max-height:420px;
  background:rgba(243,111,33,.5);top:-14vh;right:-16vw;}
body::after{width:55vw;height:55vw;max-width:380px;max-height:380px;
  background:rgba(119,120,123,.42);bottom:-12vh;left:-18vw;}
html[data-theme="dark"] body::before{opacity:.32;}
html[data-theme="dark"] body::after{opacity:.3;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;color:inherit;}
a{color:var(--accT);text-decoration:none;}
input,select,textarea{font-size:16px;}
::-webkit-scrollbar{width:0;height:0;}

/* ── 通用元件 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:999px;padding:11px 20px;font-size:14px;font-weight:500;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);min-height:44px;transition:.15s;}
.btn:active{transform:scale(.97);}
.btn-p{background:var(--acc);color:var(--accTx);border-color:var(--acc);font-weight:600;backdrop-filter:none;}
.btn-d{color:var(--err);border-color:var(--err);}
.btn-sm{padding:8px 15px;font-size:13px;min-height:38px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.5;}
.fld{width:100%;background:var(--glStrong);backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:999px;
  padding:12px 16px;font-size:16px;outline:none;min-height:46px;}
.fld:focus{border-color:var(--acc);}
/* 面板開啟時鎖住背景，避免鍵盤彈出把整頁推走 */
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden;}
/* 初次登入的資料確認與同意 */
#onb{display:none;position:fixed;inset:0;z-index:95;overflow-y:auto;
  background:var(--bg);padding:calc(24px + env(safe-area-inset-top)) 16px
             calc(32px + env(safe-area-inset-bottom));}
#onb.open{display:block;}
.onbw{max-width:520px;margin:0 auto;}
.onbh{font-size:23px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px;}
.onbs{font-size:13.5px;color:var(--tx2);line-height:1.75;margin-bottom:20px;}
.onbn{font-size:12.5px;color:var(--tx2);line-height:1.8;
  background:var(--card2);border-radius:12px;padding:13px 15px;margin:18px 0 14px;}
.onbn b{color:var(--tx);}
.agree{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;
  background:var(--glStrong);border:1px solid var(--line);margin-bottom:14px;
  font-size:13.5px;line-height:1.6;text-align:left;width:100%;}
.agree.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
.agbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:12px;font-weight:700;}
.agree.on .agbox{background:var(--acc);border-color:var(--acc);color:var(--accTx);}
/* 證照卡片 */
.cbox{background:var(--glStrong);border:1px solid var(--line);
  border-radius:16px;padding:12px 13px;}
.cbh{display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:9px;}
.cbh span{font-size:12px;color:var(--tx3);}
.cbh button{font-size:12px;color:var(--err);padding:3px 8px;border-radius:8px;}
.addc{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px dashed var(--line);border-radius:14px;padding:11px;
  font-size:14px;color:var(--accT);background:transparent;}
.addc:active{background:var(--tint);}
/* iOS 的日期欄位預設會置右且高度不一致，這裡拉回跟其他欄位一樣 */
input[type="date"].fld{-webkit-appearance:none;appearance:none;
  text-align:left;display:block;line-height:22px;height:46px;}
input[type="date"].fld::-webkit-date-and-time-value{text-align:left;margin:0;}
input[type="date"].fld::-webkit-calendar-picker-indicator{margin-left:auto;opacity:.55;}
select.fld{appearance:none;padding-right:38px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
.lb{font-size:12px;color:var(--tx3);margin:0 0 7px 6px;}
.sec{font-size:12px;color:var(--tx3);margin:20px 6px 9px;}
.sec:first-child{margin-top:8px;}
.card{background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.muted{color:var(--tx2);font-size:13px;}
.hint{font-size:12px;color:var(--tx3);line-height:1.7;}
.note{background:var(--warnBg);color:var(--warn);border-radius:var(--r);padding:11px 14px;
  font-size:13px;line-height:1.7;margin-bottom:10px;}
.note.bad{background:var(--errBg);color:var(--err);}
/* 2026-10-07z：載入中改成玻璃水珠（使用者選 C）：底下一灘水，三顆水珠輪流跳起、落下融回。用內嵌 SVG（濾鏡 #ldgoo），高解析度螢幕也清楚 */
.spin{width:48px;height:32px;flex-shrink:0;margin-top:-17px;overflow:visible;display:block}
.spin .ldj{animation:ldj 1.5s cubic-bezier(.4,0,.3,1) infinite;transform-box:fill-box;transform-origin:center bottom}
.spin .ldj2{animation-delay:.18s}.spin .ldj3{animation-delay:.36s}
@keyframes ldj{0%,60%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(-26px) scale(.9,1.1)}40%{transform:translateY(0) scale(1.15,.85)}}
/* 整頁載入時放在畫面正中間 */
#page>.load,#page>[id]>.load:only-child{min-height:calc(100vh - 300px);min-height:calc(100dvh - 300px)}
@keyframes sp{to{transform:rotate(360deg)}}
.load{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--tx3);font-size:13px;}
.empty{text-align:center;color:var(--tx3);font-size:14px;padding:36px 20px;}
.sw{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.18s;}
.sw.on{background:var(--acc);}
.sw::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:.18s;}
.sw.on::after{transform:translateX(19px);}

/* ── 登入：淺灰底 + 白卡 + 橘色點綴 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:26px 22px;
  padding-top:calc(26px + env(safe-area-inset-top));
  padding-bottom:calc(26px + env(safe-area-inset-bottom));}
.lwrap{width:100%;max-width:366px;position:relative;}
.lth{position:absolute;top:-8px;right:-4px;width:38px;height:38px;border-radius:999px;
  color:var(--tx3);display:flex;align-items:center;justify-content:center;}
.lth:active{background:var(--card2);}
.lhead{text-align:center;margin-bottom:22px;}

/* 玻璃標記：灰白半透明玻璃，內含橘色日曆 */
.glass{position:relative;width:88px;height:88px;margin:0 auto 18px;
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;isolation:isolate;
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.34));
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 12px 30px rgba(28,28,30,.13),
             0 2px 6px rgba(28,28,30,.07),
             inset 0 1px 0 rgba(255,255,255,.95),
             inset 0 -10px 18px rgba(255,255,255,.35);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);}
/* 背後的色團，讓玻璃有東西可折射 */
.blob{position:absolute;border-radius:50%;filter:blur(16px);z-index:-1;}
.b1{width:64px;height:64px;background:rgba(243,111,33,.5);top:-14px;left:-10px;}
.b2{width:54px;height:54px;background:rgba(119,120,123,.42);bottom:-16px;right:-8px;}
/* 上緣高光 */
.glass::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 42%);}
.logo{position:relative;z-index:1;color:var(--brand);display:flex;
  filter:drop-shadow(0 2px 4px rgba(243,111,33,.3));}
.logo svg{width:48px;height:48px;}
html[data-theme="dark"] .glass{
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border-color:rgba(255,255,255,.18);
  box-shadow:0 12px 30px rgba(0,0,0,.45),
             inset 0 1px 0 rgba(255,255,255,.28),
             inset 0 -10px 18px rgba(255,255,255,.05);}
html[data-theme="dark"] .glass::after{
  background:linear-gradient(160deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 44%);}

.lhead h1{font-size:25px;font-weight:700;letter-spacing:-.01em;}
.lform{background:var(--card);border-radius:20px;padding:19px 17px;
  box-shadow:0 2px 12px rgba(28,28,30,.06);}
.lf{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:0 6px 0 15px;margin-bottom:10px;transition:border-color .15s;}
.lf:focus-within{border-color:var(--brand);}
.lfi{color:var(--tx3);display:flex;flex-shrink:0;}
.lf:focus-within .lfi{color:var(--accT);}
.lf input{flex:1;min-width:0;background:none;border:none;outline:none;
  padding:14px 0;font-size:16px;color:var(--tx);}
.lf input::placeholder{color:var(--tx3);}
.lfe{width:36px;height:36px;border-radius:999px;color:var(--tx3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lfe.on{color:var(--accT);}
.lerr{color:var(--err);font-size:13px;min-height:20px;padding:2px 0 4px 8px;line-height:1.5;}
.lfoot{text-align:center;font-size:12px;color:var(--tx3);margin-top:18px;line-height:1.8;}

/* ── 外框 ── */
#app{display:none;flex-direction:column;min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom));}
.bar{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);
  background:var(--gl);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glLine);}
.who{display:flex;align-items:center;gap:9px;padding:11px 16px 0;}
.avt{width:26px;height:26px;border-radius:999px;background:var(--brand);color:var(--accTx);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.who-n{font-size:12px;color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 13px 10px;}
.ttl{font-size:20px;font-weight:600;padding:3px 5px;border-radius:999px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.ttl.tap::after{content:" ▾";font-size:12px;color:var(--tx3);font-weight:400;}
/* 手機用滑的換月，箭頭只在桌機出現 */
.ib.navm{display:none;}          /* 比 .ib 多一層，才蓋得過它的 display */
.rb{display:flex;gap:5px;align-items:center;}
.ib{background:var(--card2);width:36px;height:36px;border-radius:999px;font-size:15px;
  color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ib:active{transform:scale(.94);}
.ib svg,.who svg{display:block;}
.ib.w{width:auto;padding:0 14px;font-size:13px;gap:5px;}
.ib.act{background:var(--tint);color:var(--accT);}
.bdg{background:var(--acc);color:var(--accTx);font-size:10px;min-width:17px;height:17px;
  border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600;}
.pwrap{flex:1;position:relative;overflow-x:hidden;}
#page{padding:0 12px;}
/* 換月時的舊畫面，疊在上面一起滑走 */
.pghost{position:absolute;left:0;right:0;top:0;padding:0 12px;pointer-events:none;
  will-change:transform;}

/* ── 篩選標籤 ── */
.fchips{display:flex;gap:6px;padding:0 13px 9px;flex-wrap:wrap;}
.fchips:empty{display:none;}
.fc{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:5px 6px 5px 12px;
  border-radius:999px;background:var(--tint);color:var(--accT);}
.fc button{font-size:12px;padding:2px 4px;color:inherit;line-height:1;}

/* ── 月曆 ── */
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--tx3);
  text-align:center;padding:2px 0 5px;}
.dow .sun{color:var(--err);}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cell{height:74px;padding:3px 2px;border-radius:10px;cursor:pointer;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scrollbar-width:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.cell::-webkit-scrollbar{display:none;}
.cell{touch-action:manipulation;}   /* 點兩下不要放大畫面 */
.cell:active{background:var(--card);}
.cell.lp{background:var(--tint);}
/* 行程詳情的日期導覽 */
.lrow.mine{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
/* 行事曆底部：各地區檔案更新時間 */
.rupd{display:flex;flex-wrap:wrap;gap:6px 14px;padding:14px 4px 2px;
  border-top:1px solid var(--line);margin-top:16px;}
.rupd .ru{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx3);}
.rupd .ru b{font-weight:600;color:var(--tx2);}
.rupd .rud{width:6px;height:6px;border-radius:999px;background:var(--tx3);flex-shrink:0;}
.beta{font-size:9.5px;font-weight:700;letter-spacing:.06em;margin-left:7px;
  padding:2px 6px;border-radius:5px;background:var(--tint);color:var(--accT);
  vertical-align:2px;flex-shrink:0;}
.dnav{display:flex;align-items:center;gap:8px;margin:-2px 0 14px;}
.dnav .ib{width:34px;height:34px;font-size:17px;}
.dnt{flex:1;text-align:center;line-height:1.25;}
.dnt b{display:block;font-size:21px;font-weight:600;letter-spacing:-.01em;}
.dnt span{font-size:12px;color:var(--tx3);}



/* ── PM：行事曆／待辦 液態玻璃開關（A 款，篩選下方） ── */
.lgbar{display:flex;justify-content:flex-end;margin:8px 2px 6px}
.lgs{position:relative;display:inline-flex;align-items:center;width:96px;height:38px;border-radius:999px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;
  background:rgba(255,255,255,.28);backdrop-filter:blur(16px) saturate(190%);-webkit-backdrop-filter:blur(16px) saturate(190%);
  box-shadow:inset 0 1px 1.5px rgba(255,255,255,.9),inset 0 -1.5px 2px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(255,255,255,.5),0 3px 12px rgba(0,0,0,.08)}
.lgs .lgo{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;color:var(--tx3);transition:color .25s}
.lgs .lgo svg{width:18px;height:18px}
.lgs .lgo.on{color:#1c1c1e}
.lgs .lgt{position:absolute;z-index:1;top:3px;bottom:3px;left:3px;width:45px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.66));
  box-shadow:inset 0 1px 1px #fff,inset 0 -2px 3px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);
  transition:transform .45s cubic-bezier(.34,1.45,.55,1),scale .2s;will-change:transform}
.lgs .lgt::after{content:"";position:absolute;left:12%;right:12%;top:2px;height:40%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.lgs.isOn .lgt{transform:translateX(45px)}
.lgs.drag .lgt{transition:scale .2s}
.lgs.press .lgt{scale:1.12 1.08}
/* ── 通知列表 ── */
.ntrow{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.ntrow:first-child{border-top:0}
.ntrow i{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:7px;background:transparent}
.ntrow.un i{background:var(--err)}
.ntrow b{font-size:14.5px;font-weight:500;display:block}.ntrow.un b{font-weight:700}
.ntrow p{margin:2px 0 0;font-size:13px;color:var(--tx2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

/* ── 頁籤水滴（液態玻璃，黏稠版）：選中底色是一顆用彈簧物理移動的水滴，後面拖一團會融合的水（SVG goo 濾鏡） ── */
.nb{position:relative;z-index:2;background:transparent!important;transition:color .25s;-webkit-tap-highlight-color:transparent}
.nav{-webkit-tap-highlight-color:transparent}
/* 快速拖曳時甩出的小水珠：實心在 goo 層（跟主水滴黏著、拉遠才分開），外面再疊一顆玻璃高光，看起來是水珠不是影子 */
.ndds{position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 18%,rgba(255,255,255,0) 40%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 2px rgba(150,70,20,.18),0 2px 5px rgba(150,70,20,.18)}
html[data-theme="dark"] .ndds{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45) 0 18%,rgba(255,255,255,0) 40%);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -1px 2px rgba(0,0,0,.3),0 2px 5px rgba(0,0,0,.3)}
.navgoo{position:absolute;inset:0;z-index:0;pointer-events:none;filter:url(#navgoo);opacity:0;transition:opacity .2s}
.navshine.show{opacity:1}
.navgoo.show{opacity:.13}html[data-theme="dark"] .navgoo.show{opacity:.22}   /* 水滴用實心色＋整層透明，重疊處才不會變深 */
.navgoo i{position:absolute;left:0;top:0;border-radius:999px;background:rgb(243,111,33);will-change:transform,left,width}
.navshine{position:absolute;left:0;top:0;border-radius:999px;z-index:1;pointer-events:none;opacity:0;will-change:transform,left,width;
  box-shadow:inset 0 1px 1.5px rgba(255,255,255,.65),inset 0 -1.5px 2px rgba(0,0,0,.07),inset 0 0 0 .6px rgba(255,255,255,.45),0 4px 14px rgba(150,70,20,.16)}
.navshine::after{content:"";position:absolute;left:12%;right:12%;top:2px;height:42%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
html[data-theme="dark"] .navshine{box-shadow:inset 0 1px 1.5px rgba(255,255,255,.25),inset 0 -1.5px 2px rgba(0,0,0,.3),inset 0 0 0 .6px rgba(255,255,255,.12),0 4px 14px rgba(0,0,0,.35)}
html[data-theme="dark"] .navshine::after{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}

/* ── 底部面板 ── */
/* 遮罩調淡（原 .55），面板的毛玻璃才透得出後面的畫面；
   高度用 100lvh：iOS 主畫面 App 的 inset:0 會少掉狀態列高度，底部露出一條白邊 */
.ov{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;
  background:rgba(0,0,0,.4);z-index:70;display:none;align-items:flex-end;}

.ov.open{display:flex;}
.sheet{width:100%;max-width:520px;margin:0 auto;
  background:var(--gl);

  backdrop-filter:saturate(170%) blur(10px);-webkit-backdrop-filter:saturate(170%) blur(10px);
  border-top:1px solid var(--glLine);
  border-radius:22px 22px 0 0;padding:16px 16px calc(26px + env(safe-area-inset-bottom));

  border:1px solid var(--glLine);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}

  width:28px;height:28px;border-radius:50%;margin:-4px 0 -4px 6px;color:var(--accT);cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.3) 55%,rgba(255,255,255,.45));
  backdrop-filter:blur(14px) saturate(190%);-webkit-backdrop-filter:blur(14px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(255,255,255,.6),0 4px 10px rgba(60,40,20,.13);
  transition:transform .15s;}
.pcast:active{transform:scale(.88);}
.pcast::after{content:"";position:absolute;left:14%;right:14%;top:7%;height:40%;border-radius:999px;
  background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none;}

.pcast .cw2{animation:castWave 1.6s ease-in-out .25s infinite}
@keyframes castWave{0%,100%{opacity:.25}35%,60%{opacity:1}}

@keyframes castPulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.75);opacity:0}}

.pbar{width:3.5px;border-radius:999px;align-self:stretch;flex-shrink:0;min-height:30px;}
.pnm{display:block;font-size:15px;font-weight:600;line-height:1.3;}
.pno{font-size:12px;font-weight:400;color:var(--tx3);margin-left:6px;}
.pty{display:block;font-size:12.5px;font-weight:500;margin-top:3px;}

/* 共用資訊 */

  padding:11px 14px;border-radius:var(--r);text-align:left;

/* 類別分組：標題上方加明顯的分隔線 */
:root{--sep:rgba(0,0,0,.16);}
html[data-theme="dark"]{--sep:rgba(255,255,255,.2);}

.et{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--card2);
  color:var(--tx2);white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;}

.et.on{background:var(--acc);color:var(--accTx);font-weight:600;}
.opts{display:flex;flex-wrap:wrap;gap:7px;}
.ob svg{margin-right:-1px;}
.ob{font-size:13px;padding:9px 15px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;color:var(--tx2);}
.ob.on{background:var(--acc);color:var(--accTx);border-color:var(--acc);font-weight:500;}





/* ── 清單 ── */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 15px;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);margin-bottom:7px;}
.pavw{position:relative;flex-shrink:0;width:38px;padding-top:17px;}
/* 職安帽用 emoji；因無法改色，效期狀態以右上角小圓點表示 */
.hat{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:3px;
  font-size:1em;line-height:1;margin-left:5px;vertical-align:-2px;flex-shrink:0;padding:0;}
.hat .hdot{top:-2px;right:-5px;width:7px;height:7px;border-width:1.2px;}
/* 內文用的小圖案：跟著文字大小走 */
.mki{width:1.25em;height:1.25em;display:block;flex-shrink:0;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
.mke{font-size:1.15em;line-height:1;display:block;flex-shrink:0;}
.mkw{width:1.35em;height:1.35em;display:block;flex-shrink:0;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
.hat svg:not(.mki){width:1.05em;height:1.05em;color:var(--accT);}
.hat:active{transform:scale(.88);}
.hdot{position:absolute;top:0;right:-4px;width:9px;height:9px;border-radius:999px;
  border:1.5px solid var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.14);}
.hdot.good{background:#2eaa5e;}   /* 效期內 */
.hdot.warn{background:#f5a623;}   /* 不滿 3 個月 */
.hdot.bad{background:#e53935;}    /* 已逾期 */
.pav{width:38px;height:38px;border-radius:999px;background:var(--card2);color:var(--tx2);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.pavhat{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:2;
  font-size:38px;line-height:1;padding:0;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.32));}
.pavhat:active{transform:translateX(-50%) scale(.9);}
.pavhat .hdot{top:15px;right:2px;width:10px;height:10px;}
/* 有防毒面罩時帽子往上讓一點，露出面罩 */
.pavhat.up{top:-6px;}
.pavhat.up .hdot{top:7px;}
/* 防毒面罩：罩住整個圓圈 */
.pavmask{position:absolute;top:18px;left:-1px;width:40px;height:40px;z-index:2;
  pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
/* 沒戴帽子時的效期燈號 */
.pavdot{position:absolute;top:17px;right:-1px;width:10px;height:10px;border-radius:999px;
  border:1.5px solid var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.14);z-index:7;}
.pavdot.good{background:#2eaa5e;}
.pavdot.warn{background:#f5a623;}
.pavdot.bad{background:#e53935;}
/* 儲槽：圓圈左側 */
.pavtank{position:absolute;left:-9px;bottom:-1px;font-size:21px;line-height:1;padding:0;z-index:5;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
.pavtank:active{transform:scale(.9);}
/* 船員證：小帆船，圓圈左下（稍微往中間靠） */
.pavship{position:absolute;bottom:-3px;left:-5px;width:27px;height:27px;z-index:5;pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
/* 出海資格（研究作業人員安全實務訓練）：游泳圈，圓圈正下方 */
.pavw.rg .pav{position:relative;z-index:1}
/* 頭像坐在游泳圈上（斜看的扁圈）：同一張圖畫兩次，上半在頭像後面、下半在前面 */
.pavr3{position:absolute;left:-9px;bottom:-10px;width:56px;height:26px;pointer-events:none;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.25))}
.pavr3.bk{z-index:0;clip-path:inset(0 0 52% 0)}.pavr3.ft{z-index:3;clip-path:inset(48% 0 0 0)}
.pavring{position:absolute;left:50%;bottom:-10px;width:21px;height:21px;margin-left:-10.5px;z-index:5;pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
/* 初級救護技術員（EMT-1）：生命之星，右下角；同時有急救箱時急救箱往左讓、星星壓在急救箱右下 */
.pavemt{position:absolute;right:-6px;bottom:-4px;width:21px;height:21px;z-index:6;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.pavemt.up{bottom:-6px;right:-11px;width:18px;height:18px;z-index:7}
.pavkit.l{right:5px}
/* 急救箱：右下角，壓在最上層 */
.pavkit{position:absolute;right:-5px;bottom:-3px;width:21px;height:21px;z-index:6;
  pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.32));}
.tag{font-size:11px;padding:4px 11px;border-radius:999px;background:var(--card2);color:var(--tx2);white-space:nowrap;}
.tag.g{background:var(--tint);color:var(--accT);}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--glStrong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glLine);border-radius:var(--r);padding:14px 15px;margin-bottom:7px;
  width:100%;font-size:15px;text-align:left;}
.link svg{color:var(--tx3);flex-shrink:0;}
.link:active{opacity:.7;}

/* ── 上傳 ── */
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;cursor:pointer;}
.drop:active,.drop.over{border-color:var(--acc);background:var(--tint);}
.drop svg{color:var(--tx3);margin:0 auto;}
#fi{display:none;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{background:var(--card2);padding:9px 11px;text-align:left;font-weight:500;
  color:var(--tx2);white-space:nowrap;font-size:11.5px;}
.tbl td{padding:9px 11px;border-top:1px solid var(--line);white-space:nowrap;}
.scroll{overflow-x:auto;border-radius:var(--r);background:var(--card);}

/* ── 提示 ── */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.ts{background:var(--tx);color:var(--bg);padding:13px 18px;border-radius:14px;font-size:13.5px;
  box-shadow:var(--sh);animation:up .2s ease;line-height:1.6;text-align:center;}
.ts.ok{background:var(--acc);color:var(--accTx);}
.ts.no{background:var(--err);color:#fff;}












































/* ── 新帳號憑證卡 ── */
.nacard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 16px;text-align:center;}
.naglass{width:72px;height:72px;margin:0 auto 12px;}
.naglass .glass{width:72px;height:72px;margin:0 auto;border-radius:18px;}
.naglass .glass::after{border-radius:18px;}

.naqr{margin:14px 0 4px;text-align:center;}

  border:1px solid var(--line);line-height:0;}
.naqrbox img,.naqrbox canvas,.naqrbox table{width:148px;height:148px;}
.naqrt{font-size:11.5px;color:var(--tx3);margin-top:7px;}
.nah{font-size:17px;font-weight:700;}
.nas{font-size:13px;color:var(--tx3);margin-top:3px;}
.narow{display:flex;align-items:center;gap:10px;padding:10px 2px;
  border-top:1px solid var(--line);text-align:left;}
.narow:first-of-type{border-top:none;}
.nak{width:44px;flex:0 0 auto;font-size:13px;color:var(--tx3);}
.nav2{flex:1;min-width:0;font-size:15.5px;font-weight:600;letter-spacing:.5px;
  word-break:break-all;}
.nav2.url{font-size:12.5px;font-weight:500;color:var(--accT);letter-spacing:0;}
.nacp{flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  color:var(--tx3);font-size:13px;background:var(--card2);}
.nabox{background:var(--card2);border-radius:14px;padding:4px 12px;margin:12px 0 14px;}
.nafoot{font-size:11.5px;color:var(--tx3);margin-top:10px;line-height:1.7;}





/* ── 字體大小（小／中／大）──
   用 zoom 整體放大，版面比例不會跑掉 */
html[data-fs="m"] body{zoom:1.12;}
html[data-fs="l"] body{zoom:1.25;}
.segw{display:flex;gap:6px;}
.segb{padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx2);font-size:13.5px;}
.segb.on{background:var(--tint);color:var(--accT);border-color:transparent;font-weight:600;}

/* ── 下載行程（桌機限定）── */
.nb.dlm{display:none;}
.dlw{display:block;}

@media print{

}

/* ══════════ 桌機版（≥ 900px）══════════
   導覽列移到最上方，內容置中限寬，行事曆格子加高 */
.glist{display:block;}
@media(min-width:900px){
  /* 左右留白：內容最寬 1180px，兩側自動撐開 */
  :root{--gut:max(24px,calc((100vw - 1180px) / 2));}
  #app{padding-bottom:36px;}

  /* 導覽列：靠 order 搬到最上方 */
  .nav{order:-1;position:sticky;top:0;bottom:auto;height:62px;
    justify-content:flex-start;gap:4px;padding:0 var(--gut);
    border-top:none;border-bottom:1px solid var(--glLine);}
  .nb{flex-direction:row;flex:0 0 auto;font-size:14.5px;padding:9px 15px;gap:8px;line-height:normal;transition:background .15s;}
  .nb em{display:inline;font-weight:500;}
  .nb:hover{background:var(--card2);color:var(--tx2);}
  .nb.on{padding:9px 18px;font-weight:600;}
  .nb.on em{font-weight:600;}
  .nb.on:hover{background:var(--tint);color:var(--accT);}

  /* 標題列：單行排版，使用者資訊靠右 */
  .bar{top:62px;display:flex;flex-wrap:wrap;align-items:center;
    gap:16px;padding:0 var(--gut);}
  .hd{order:1;flex:1;min-width:0;justify-content:flex-start;gap:14px;padding:15px 0;}
  .who{order:2;flex:0 0 auto;padding:0;gap:10px;}
  .who-n{flex:0 0 auto;font-size:13px;}
  .fchips{order:3;flex-basis:100%;padding:0 0 11px;}
  /* 使用者（名字、工號、登出）搬到導覽列最右邊；篩選條件搬到篩選按鈕旁邊（JS deskPlace） */
  .nav .who{margin-left:auto;display:flex;align-items:center}
  .nav .nb{white-space:nowrap;flex:0 0 auto}
  .nav{overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
  .nav .who{flex:0 0 auto;padding-left:10px}
}
@media(min-width:900px) and (max-width:1360px){
  .nav .who-n{display:none}                 /* 頁籤多時只留頭像、通知、登出 */
  .nb{padding:9px 11px}.nb.on{padding:9px 13px}
}
@media(min-width:900px) and (max-width:1180px){.nb:not(.on) em{display:none}}
/* 手機：使用者自選下方頁籤（順序用 --o；沒選的藏起來，從「更多」進去） */
/* 證照詳情：每張卡片左上角外側掛對應圖示 */
.cbox.cbx{position:relative;overflow:visible}
.cbic{position:absolute;left:-9px;top:-13px;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--glLine);
  box-shadow:0 2px 8px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;color:var(--tx3);z-index:2}
.cbic .cbiw{width:21px;height:21px;display:block}.cbic .cbie{font-size:17px;line-height:1}
@media(max-width:899px){.nav .nb{order:var(--o,50)}.nav .nb[data-t="more"]{order:99}.nav .nb.nbx{display:none!important}}
@media(min-width:900px){.mobonly{display:none!important}}
.ncrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.ncrow:first-child{border-top:0}
.ncrow .nci{width:34px;height:34px;border-radius:10px;background:var(--tint);color:var(--accT);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ncrow.off .nci{background:var(--card2);color:var(--tx3)}
.ncrow b{flex:1;font-size:15px;font-weight:600}.ncrow.off b{font-weight:500;color:var(--tx2)}
.ncrow .ib{width:32px;height:32px;font-size:15px}
.ncrow .ib:disabled{opacity:.3}   /* 更窄：其他頁籤只留圖示 */
@media(min-width:900px){
  .hd .fchips{order:0;flex-basis:auto;padding:0;flex-wrap:wrap;align-items:center}
  /* 待辦開關移到標題列最右邊，月曆往上 */
  .lgbar{position:fixed;top:81px;right:var(--gut);margin:0;z-index:60}
  .ttl{font-size:27px;}
  #page{padding:20px var(--gut) 0;}
  .pghost{padding:20px var(--gut) 0;}

  /* 桌機沒有滑動手勢，把換月箭頭放回來 */
  .ib.navm{display:inline-flex;}
  .nb.dlm{display:flex;}
  .dlw{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start;}
  .dlside{position:sticky;top:132px;margin-bottom:0;}
  /* 按鈕加上滑鼠效果 */
  .ib{transition:background .15s,transform .1s;}
  .ib:hover{background:var(--line);}
  .ev,.lrow,.link,.cell{transition:background .15s,box-shadow .15s;}
  .ev:hover,.lrow:hover,.link:hover{box-shadow:0 2px 10px rgba(0,0,0,.07);}
  .cell:hover{background:var(--card);}
  .evc{cursor:pointer;}

  /* 月曆：格子加高，一格塞得下 6 筆 */
  .dow{font-size:13px;padding:4px 0 8px;}
  .cgrid{gap:4px;}
  .cell{height:138px;padding:6px 5px;border-radius:12px;}
  .dn{font-size:13px;text-align:left;padding-left:3px;}
  .evc{font-size:12px;line-height:1.75;padding:0 7px;margin-top:3px;}


  /* 年月選擇器對齊標題 */
  .pk{top:132px;left:var(--gut);right:auto;margin:0;width:400px;}

  /* 今日與通訊錄分兩欄 */
  .glist{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:0 10px;align-items:start;}
  .lrow{margin-bottom:8px;}

  /* 上傳：拖放區加大 */
  .drop{padding:58px 24px;border-radius:22px;}
  .drop:hover{border-color:var(--acc);background:var(--tint);}
  .scroll{max-height:none;}


  /* 底部面板改成置中對話框 */
  .ov{align-items:center;}
  .sheet{border-radius:22px;height:auto;max-height:84vh;max-width:540px;
    padding:20px 20px 24px;border:1px solid var(--glLine);}
  #toast{bottom:28px;}
}
</style>
</head>

var NOTES=[],SW_VER='';
/* 問 Service Worker 版本；順便叫它檢查有沒有新版 sw.js */
function swVer(){
  try{
    if(!navigator.serviceWorker)return;
    navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update().catch(function(){});}).catch(function(){});
    navigator.serviceWorker.ready.then(function(r){if(r.active)r.active.postMessage({type:'ver'});});
  }catch(e){}
}
/* 更多頁「測試圖示紅點」：看這支手機能不能顯示 */
function badgeTest(){
  if(!navigator.setAppBadge){toast('這個瀏覽器不支援圖示紅點（iPhone 要從主畫面打開 App）','no',3500);return;}
  navigator.setAppBadge(Math.max(1,notesUnread())).then(function(){
    toast('已設定紅點，回主畫面看 App 圖示；沒出現請到「設定 › 通知 › ESPC 行程」打開「標記」','ok',5000);
  }).catch(function(e){toast('設定失敗：'+((e&&e.message)||e),'no',4000);});
}
function notesEdit(fn){
  if(!window.caches)return Promise.resolve();
  return caches.open('espc-badge').then(function(c){
    return c.match('./__notes').then(function(r){return r?r.json():[];}).catch(function(){return [];}).then(function(list){
      list=list||[];if(fn)list=fn(list)||list;NOTES=list;
      notesInbox();
      var n=list.filter(function(x){return !x.r;}).length;
      msgPaint();
      return fn?c.put('./__notes',new Response(JSON.stringify(list.slice(0,60)))):null;
    });
  }).catch(function(){});
}
/* 點廣播通知進來時，伺服器的收件匣還沒讀回來：先用通知內容把那則廣播放上去，讀回來後自動換成正式的 */
function notesInbox(){
  if(!TOKEN)return;
  var have={},add=0;(INBOX.inbox||[]).forEach(function(x){have[String(x.id)]=1;});
  NOTES.forEach(function(n){
    if(!n.c||have[n.c]||n.r||!INBOX.at||INBOX.at>n.at||Date.now()-n.at>7*864e5)return;   // 伺服器（或上次存的）資料比通知新就以伺服器為準；還沒任何資料就等伺服器
    var m=String(n.t||'').match(/📣\s*(.+?)\s*的廣播/),d=new Date(n.at);
    var at=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());
    INBOX.inbox=[{id:n.c,from:m?m[1]:'廣播',at:at,text:n.b||'',toMe:true,pend:true}].concat(INBOX.inbox||[]);
    have[n.c]=1;add++;
  });
  if(add&&tab==='today'&&!sub&&!$('ov').classList.contains('open'))render();
}
function notesUnread(){return msgUnread();}
function bellPaint(){
  var b=$('bell');if(!b)return;var n=notesUnread();
  b.innerHTML=ic('bell',17)+(n?'<span class="bdg">'+(n>99?'99+':n)+'</span>':'');
  b.classList.toggle('act',!!n);b.classList.toggle('w',!!n);
}
function notesAgo(ms){var m=Math.round((Date.now()-ms)/60000);if(m<1)return '剛剛';if(m<60)return m+' 分鐘前';var h=Math.round(m/60);if(h<24)return h+' 小時前';
  var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
function notesOpen(){
  notesEdit(null).then(function(){
    var l=NOTES,n=notesUnread();
    var h='<div class="shh" style="align-items:center"><h3>通知</h3>'+(n?'<button class="lnk" style="margin-left:auto;margin-right:6px" onclick="notesAllRead()">全部標為已讀</button>':'')

    openSheet(h);

}
function notesGo(id){
  var x=NOTES.filter(function(n){return n.id===id;})[0];
  notesEdit(function(list){list.forEach(function(n){if(n.id===id)n.r=1;});return list;}).then(function(){

  });
}

var GAS_TIMEOUT={saveData:240000,clearAllData:180000,groupCast:120000,annPost:240000,annPdf:120000};
var GAS_LOG=[];   // 最近 30 次後端呼叫花的時間（隱藏工具裡看得到，查慢的原因用）
function gasLog(fn,t0,ok,j){
  GAS_LOG.unshift({fn:fn,ms:Date.now()-t0,ok:ok,
    note:j?(j.unchanged?'未變更':(j.rows?j.rows.length+' 筆':(j.error||''))):'',at:new Date().toTimeString().slice(0,8)});
  if(GAS_LOG.length>30)GAS_LOG.length=30;
}
function gas(fn){
  var t0=Date.now();
  var args=Array.prototype.slice.call(arguments,1);
  var payload=JSON.stringify({fn:fn,args:args});
  var ms=GAS_TIMEOUT[fn]||45000;
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort();},ms);
  var opt=ctl?{signal:ctl.signal}:{};
  var req;
  if(payload.length<1800){
    req=fetch(GAS_URL+'?payload='+encodeURIComponent(payload),opt);
  }else{
    opt.method='POST';opt.body=payload;
    req=fetch(GAS_URL,opt);
  }
  return req.then(function(r){return r.json();})

      if((fn==='getMe'||fn==='login')&&j&&j.ok&&'team' in j){lsS('espc_team',j.team||'');allowNav();}

      if((fn==='getMe'||fn==='login')&&j&&j.ok&&j.hideRg)hideRgSet(j.hideRg);   // 管理員隱藏的地區   // 功能權限   // 採樣津貼入口要看組別
      clearTimeout(timer);
      gasLog(fn,t0,!!(j&&j.ok),j);
      if(j&&j.viewBlock)toast('檢視模式（唯讀），不能修改','no',2500);
      // 後端說還沒授權（profile_ok 被清掉等）→ 立刻擋下，叫出確認畫面

    });
}

/* ── 鍵盤：點輸入框時不被鍵盤擋住 ──
   iOS 第一次點輸入框時頁面沒有可捲的空間（登入頁剛好一個螢幕高），iOS 想捲也捲不動，
   所以被鍵盤擋住。做法：一點下去先在頁面下方補一段留白，讓 iOS 自己的捲動就能把輸入框帶上來。
   程式自己只在「鍵盤停好後仍然被擋住」時補捲，而且只捲到剛好露出，不置中，避免跳兩次、跳太高。
   iOS Safari 的 window.innerHeight 會跟著鍵盤變矮，鍵盤高度的基準改用 clientHeight。 */
(function(){
  var vv=window.visualViewport,full=0,lastKb=0,out=0,chk=0;
  var touch=false;
  try{touch=window.matchMedia('(pointer:coarse)').matches;}catch(e){}
  function baseH(){return Math.max(document.documentElement.clientHeight||0,full);}
  function kbH(){return vv?Math.max(0,Math.round(baseH()-vv.height)):0;}
  function isField(el){
    if(!el||!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))return false;
    return !/^(checkbox|radio|button|submit|reset|file|range|color)$/i.test(el.type||'');
  }
  function setPad(px){
    document.documentElement.style.setProperty('--kb',px+'px');
    document.body.classList.toggle('kb',px>0);
  }
  function scroller(el){
    for(var p=el.parentElement;p&&p!==document.body;p=p.parentElement){
      var oy=getComputedStyle(p).overflowY;
      if((oy==='auto'||oy==='scroll')&&p.scrollHeight>p.clientHeight+1)return p;
    }
    return null;
  }
  /** 鍵盤停好後檢查一次：還被擋住才捲，捲到輸入框剛好在鍵盤上方 16px */
  function check(){
    var el=document.activeElement;
    if(!isField(el))return;
    var k=kbH();if(k>80)lastKb=k;
    var r=el.getBoundingClientRect();
    var top=vv?vv.offsetTop:0,bot=top+(vv?vv.height:window.innerHeight);
    var d=0;
    if(r.bottom>bot-16)d=r.bottom-(bot-16);
    else if(r.top<top+16)d=r.top-(top+16);
    if(Math.abs(d)<4)return;
    var sc=scroller(el);
    if(sc)sc.scrollTop+=d;else window.scrollBy(0,d);
  }
  function later(ms){clearTimeout(chk);chk=setTimeout(check,ms);}
  if(vv){
    full=vv.height;
    vv.addEventListener('resize',function(){
      if(!isField(document.activeElement)){full=Math.max(full,vv.height);return;}
      later(160);                                        // 等鍵盤動畫停下來只檢查一次
    });
  }
  document.addEventListener('focusin',function(e){
    if(!touch||!isField(e.target))return;
    clearTimeout(out);
    if(e.target.closest&&e.target.closest('#login')){       // 登入頁：改排版，不捲動
      document.body.classList.add('kbl');
      return;
    }
    if(!document.body.classList.contains('kb'))
      setPad(lastKb||Math.round(baseH()*0.42));          // 先留空間，iOS 第一次就捲得動
    later(450);                                          // 換下一格時鍵盤不會 resize，也檢查一次
  });
  document.addEventListener('focusout',function(){
    clearTimeout(out);
    out=setTimeout(function(){
      if(!isField(document.activeElement)){                 // 換到下一格不收，真的離開才收
        setPad(0);document.body.classList.remove('kbl');
      }
    },250);
  });
})();

/* ══ 訊息頁：廣播＋行程提醒＋待辦提醒放一起 ══

var MSG_SEG='in',MSGR=null,MSG_DAY=864e5;
function msgReadSet(){if(!MSGR){try{MSGR=JSON.parse(ls('espc_msgr')||'[]');}catch(e){MSGR=[];}}return MSGR;}

function msgReadAdd(ids){
  var r=msgReadSet(),rt=msgReadDay(),ch=false,td=twStr();
  (ids||[]).forEach(function(i){i=String(i);if(r.indexOf(i)<0){r.push(i);ch=true;}if(!rt[i]){rt[i]=td;ch=true;}});
  if(ch){

    var ks=Object.keys(rt);if(ks.length>400)ks.slice(0,ks.length-400).forEach(function(k){delete rt[k];});

function msgAt(s){var t=new Date(String(s).replace(' ','T')+'+08:00').getTime();return isNaN(t)?0:t;}
function msgItems(){
  var out=[],have={},rs=msgReadSet();
  (INBOX.inbox||[]).forEach(function(x){
    var id=String(x.id||'');have[id]=1;
    var un=!x.acked&&!x.recalled&&rs.indexOf(id)<0;      // 紅點＝還沒按「收到」（rs＝這支手機剛按過、伺服器還沒回來的）
    if(x.pend)un=NOTES.some(function(n){return n.c===id&&!n.r;});
    out.push({k:'c',key:'c'+id,at:msgAt(x.at),un:un,x:x,rd:msgReadDay()[id]||''});
  });
  NOTES.forEach(function(n){
    if(!n.c||have[n.c])return;                     // 只放廣播（行程／待辦提醒只跳手機通知）；以伺服器那份為準
    if(!INBOX.at||(n.at||0)<=INBOX.at)return;      // 伺服器資料比這則推播新（或還沒讀到）→ 不用推播那份，免得閃出舊的未讀
    var mm=String(n.t||'').match(/📣\s*(.+?)\s*的廣播/),d=new Date(n.at||0);
    var x={id:n.c,from:mm?mm[1]:'通知',text:n.b||'',at:d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()),toMe:true,pend:true};
    out.push({k:'c',key:'n'+n.id,at:n.at||0,un:!n.r,n:n,x:x,rd:n.rd||msgReadDay()[n.c]||''});

function msgUnread(k){return msgItems().filter(function(m){return m.un&&(!k||(k==='r'?m.k!=='c':m.k===k));}).length;}

var MSG_HIST=false,GC_EMBED=false;

/* 我發出的廣播（群組＋個案），含回條、收回；伺服器保留 7 天 */

function msgFind(key){var a=msgItems();for(var i=0;i<a.length;i++)if(a[i].key===key)return a[i];return null;}

/* ── 訊息頁籤的紅色水珠（彈簧物理）：
   dot   = 圖示右上的小紅點
   in    = 主水滴靠過來時被吸進去（縮小、往水滴中心拉長）
   count = 從主水滴右上角擠出來、有數字
   out   = 離開訊息頁：數字水珠縮回主水滴，等主水滴走了再在圖示上冒出小紅點
   hide  = 沒有未讀 */
var BG={x:0,y:0,vx:0,vy:0,s:0,vs:0,mode:'',raf:0,n:0,w:0,free:false,wt:0};
/* 2026-10-07v：水珠和頁籤水滴是同一團水（A2）——SVG goo 濾鏡把「主水滴的影子＋水珠」融在一起，
   頸部顏色是兩邊混出來的；主水滴的影子只在水珠附近（遮罩）露出。
   沒選到訊息時水珠在圖示右上（帶數字）；主水滴碰到才被吸進去；在訊息放手→咕嚕→從右上擠出來（細頸）；
   在訊息上一開始拖→馬上縮回；點別的頁籤→當下分離、留在圖示上。吸入／擠出快，分離慢。 */
var BG_R=11,BG_MERGE=1.15,BG_SPLIT=.45;
function bgDesk(){try{return matchMedia('(min-width:900px)').matches;}catch(e){return false;}}
function bgPos(mode){
  var b=$('nb-msg'),nav=$('nav');if(!b||!b.offsetWidth||!nav)return null;
  if(mode==='dot'){
    var sv=b.querySelector('svg'),nr=nav.getBoundingClientRect(),r=(sv||b).getBoundingClientRect();
    return {x:r.right-nr.left+nav.scrollLeft+5,y:r.top-nr.top-4,s:.84};
  }
  if(mode==='count'){
    var cx=NV.x+NV.w-NV.h/2,cy=NV.y+NV.h/2,d=NV.h/2+BG_R+2.4,a=52*Math.PI/180,minTop=bgDesk()?2:-16;
    if(cy-d*Math.sin(a)-BG_R<minTop)a=Math.asin(Math.max(0,Math.min(1,(cy-BG_R-minTop)/d)));   // 上面空間不夠就壓低角度
    return {x:cx+d*Math.cos(a),y:cy-d*Math.sin(a),s:1};
  }

}
function bgSS(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);}
/* 主水滴離圖示上的水珠多近：0＝還沒碰到，1＝整個蓋住 */
function bgPull(dp){var g=Math.abs(NV.x+NV.w/2-dp.x)-NV.w/2,c=BG_R*dp.s+2;return {f:Math.max(0,Math.min(1,(c-g)/(c+NV.w*.38))),g:g};}
function bgSync(anim){
  if(!$('bgsvg')||!NV.init)return;
  var n=msgUnread(),on=(tab==='msg'),m=BG.mode;
  BG.n=n;
  var want=!n?'hide':(on?'count':'dot');
  if(!anim||NV_RM){var p=bgPos(want==='hide'?'dot':want)||{x:0,y:0,s:0};BG.mode=want;BG.free=false;BG.x=p.x;BG.y=p.y;BG.vx=BG.vy=BG.vs=0;BG.s=want==='hide'?0:p.s;bgRender();return;}
  if(want==='hide'){if(m!=='hide')BG.mode='hide';}
  else if(want==='count'){
    if(m==='dot'||m==='out')BG.mode='in';
    else if(m==='hide'||m===''){var c=bgPos('in');if(c){BG.x=c.x;BG.y=c.y;}BG.s=0;BG.vs=.05;BG.mode='count';}
  }else{
    if(m==='count'||m==='in'||m==='wait'){BG.mode='dot';BG.free=true;}       // 點別的頁籤：當下分離，留在圖示上
    else if(m==='hide'||m===''){var d=bgPos('dot');if(d){BG.x=d.x;BG.y=d.y;}BG.s=0;BG.mode='dot';BG.free=false;}
  }
  bgKick();
}
function bgKick(){if(!BG.raf)BG.raf=requestAnimationFrame(bgLoop);}
function bgLoop(){
  BG.raf=0;if(!NV.init)return;
  var mb=$('nb-msg');if(!mb||!mb.offsetWidth){$('bgsvg').style.display='none';return;}   // 訊息沒放在下方：不畫水珠（未讀數在「更多」裡）
  var m=BG.mode,t=null,drag=!!(NV.drag&&NV.drag.moved);
  if(m==='dot'&&tab==='msg'&&!drag&&BG.n)BG.mode=m='in';       // 拖回訊息放手（頁籤沒換）也要擠出來
  if(m==='hide')t={x:BG.x,y:BG.y,s:0};
  if(m==='dot'){
    var dp=bgPos('dot');if(!dp)return;
    var ip=bgPos('in'),pl=bgPull(dp),f=pl.f,dir=NV.x+NV.w/2>dp.x?1:-1;
    if(BG.free&&f<=0)BG.free=false;                                // 分離出來的：主水滴完全離開後才恢復「靠近就吸」
    if(BG.free)t={x:dp.x,y:dp.y,s:dp.s};
    else if(f<=0){var lean=Math.max(0,Math.min(1,(BG_R*dp.s+12-pl.g)/11))*3;t={x:dp.x+dir*lean,y:dp.y,s:dp.s};}   // 快碰到：微微被吸過去
    else{var g2=bgSS(0,1,f);t={x:dp.x+(ip.x-dp.x)*g2,y:dp.y+(ip.y-dp.y)*g2,s:dp.s*(1-bgSS(.3,.78,f))};}             // 碰到：黏上、被拉進中心
  }
  if(m==='in'){t=bgPos('in');
    if(t&&Math.hypot(t.x-BG.x,t.y-BG.y)<3&&BG.s<.06){BG.mode='wait';BG.wt=performance.now();BG.s=0;BG.vs=0;NV.popv+=.045;navKick();}}
  if(m==='wait'){t=bgPos('in');if(performance.now()-BG.wt>80){BG.mode='count';if(t){BG.x=t.x;BG.y=t.y;}BG.vs=.05;}}
  if(m==='count'){t=bgPos('count');if(drag)BG.mode='out';}         // 一按住拖動就縮回主水滴
  if(m==='out'){t=bgPos('in');if(t&&BG.s<.05&&Math.hypot(t.x-BG.x,t.y-BG.y)<4){BG.mode='dot';BG.s=0;BG.vs=0;BG.free=false;}}
  if(!t)return;

  var kk=(BG.mode==='in'||BG.mode==='out')?.2:.15;
  BG.vx=BG.vx*Math.pow(.66,kb)+(t.x-BG.x)*kk*kb;BG.vy=BG.vy*Math.pow(.66,kb)+(t.y-BG.y)*kk*kb;BG.x+=BG.vx*kb;BG.y+=BG.vy*kb;
  BG.vs=BG.vs*Math.pow(.62,kb)+(t.s-BG.s)*(BG.mode==='count'?.16:.22)*kb;BG.s+=BG.vs*kb;if(BG.s<0){BG.s=0;BG.vs=0;}
  bgRender();
  var dist=Math.hypot(t.x-BG.x,t.y-BG.y);
  var still=BG.mode!=='wait'&&BG.mode!=='in'&&BG.mode!=='out'&&Math.abs(BG.vx)<.03&&Math.abs(BG.vy)<.03&&Math.abs(BG.vs)<.002&&Math.abs(t.s-BG.s)<.003&&dist<.3&&!NV.raf;
  if(!still)BG.raf=requestAnimationFrame(bgLoop);
}
function bgRender(){
  var sv=$('bgsvg');if(!sv)return;
  var s=Math.max(0,BG.s),vis=s>.015&&BG.n>0;
  sv.style.display=vis?'':'none';if(!vis)return;
  // 主水滴的影子（跟著主水滴的伸縮）
  var sx=NV.sx||1,sy=NV.sy||1,pw=NV.w*sx,ph=NV.h*sy,pc=$('bgpc');

/** 讀出證照效期年數：未填視為預設 2 年，0 為無期限 */
function ecYears(c){
  var y=(c&&c.years!==undefined&&c.years!==null&&c.years!=='')?parseInt(c.years,10):SAFETY_YEARS;
  if(isNaN(y)||y<0)y=SAFETY_YEARS;

function addYears(d,n){
  var a=String(d||'').split('-');
  if(a.length<3)return '';
  var y=parseInt(a[0],10)+n,m=parseInt(a[1],10),dd=parseInt(a[2],10);
  var last=new Date(y,m,0).getDate();     // 處理 2/29
  if(dd>last)dd=last;
  return y+'-'+p2(m)+'-'+p2(dd);
}
function daysBetween(a,b){
  var x=String(a||'').split('-'),y=String(b||'').split('-');
  if(x.length<3||y.length<3)return null;
  return Math.round((Date.UTC(+y[0],+y[1]-1,+y[2])-Date.UTC(+x[0],+x[1]-1,+x[2]))/86400000);
}
/** 單張證照 → {type,cert,train,expire,days,state}；state: ok / warn / expired / nodate */
function certOf(c){
  var y=ecYears(c);
  var o={type:c.type||'',cert:c.cert||'',train:c.train||'',years:y,
         remind:true,                         // 到期提醒一律開啟，不能關閉
         expire:'',days:null,state:'nodate'};
  if(!y){o.state='forever';return o;}          // 無期限，不會進提醒
  if(o.train){
    o.expire=addYears(o.train,y);
    o.days=daysBetween(twStr(),o.expire);
    o.state=o.days<0?'expired':(o.days<=SAFETY_WARN_DAYS?'warn':'ok');
  }
  return o;
}

}
/** 最需要注意的那張（逾期 > 快到期 > 未填日期 > 有效），給工地帽燈號用 */
var STATE_RANK={expired:0,warn:1,nodate:2,ok:3,forever:4};
function safetyOf(name){
  var l=safetyList(name);
  if(!l.length)return null;
  var best=l[0];
  l.forEach(function(o){
    var a=STATE_RANK[o.state],b=STATE_RANK[best.state];
    if(a<b||(a===b&&(o.days==null?9e9:o.days)<(best.days==null?9e9:best.days)))best=o;
  });
  return best;
}

  if(o.state==='nodate')return '未填訓練日期';
  if(o.state==='expired')return '已於 '+o.expire+' 到期（逾期 '+Math.abs(o.days)+' 天）';
  return o.expire+' 到期（剩 '+o.days+' 天）';
}

/** 依證照種類判斷要掛哪些標記
 *  safety：職安業務主管類 → 戴工地帽
 *  mask  ：缺氧／侷限空間 → 防毒面罩
 *  kit   ：急救人員       → 急救箱
 *  tank  ：貯存系統污染監測 → 儲槽
 *  ship  ：船員證           → 小帆船
 *  ring  ：研究作業人員安全實務訓練（出海資格）→ 游泳圈
 *  emt   ：初級救護技術員（EMT-1）→ 生命之星 */
function certBadges(name){
  var b={safety:false,mask:false,kit:false,tank:false,ship:false,ring:false,emt:false};
  safetyList(name).forEach(function(o){
    var t=o.type||'';
    if(/職安|職業安全|安全衛生|營造業[甲乙丙]種/.test(t))b.safety=true;
    if(/缺氧|侷限空間|局限空間/.test(t))b.mask=true;
    if(/急救/.test(t))b.kit=true;
    if(/貯存系統|儲存系統|貯槽|儲槽/.test(t))b.tank=true;
    if(/船員|海員|船舶/.test(t))b.ship=true;
    if(/出海|研究作業人員安全/.test(t))b.ring=true;
    if(/EMT|救護技術員/i.test(t))b.emt=true;
  });
  return b;
}
/** 單張證照對應的圖示（證照詳情卡片左上角用）；對不到就用盾牌 */
function certIcon(t){
  t=String(t||'');
  if(/EMT|救護技術員/i.test(t))return EMT_SVG.replace('class="pavemt"','class="cbiw"');
  if(/急救/.test(t))return KIT_SVG.replace('class="pavkit"','class="cbiw"');
  if(/缺氧|侷限空間|局限空間/.test(t))return MASK_SVG.replace('class="pavmask"','class="cbiw"');
  if(/出海|研究作業人員安全/.test(t))return RING_SVG.replace('class="pavring"','class="cbiw"');
  if(/船員|海員|船舶/.test(t))return SHIP_SVG.replace('class="pavship"','class="cbiw"');
  if(/貯存系統|儲存系統|貯槽|儲槽/.test(t))return '<span class="cbie">🛢️</span>';
  if(/職安|職業安全|安全衛生|營造業[甲乙丙]種/.test(t))return '<span class="cbie">⛑️</span>';
  return ic('shield',17);
}

/** 燈號：效期內綠、不滿 3 個月橘、逾期紅、未填日期橘 */

/** 頭像＋工地帽：帽子壓在圓圈上緣，像戴在頭上 */
function avatarHat(name){
  var n=String(name||'').trim();
  var o=safetyOf(n);
  var b=certBadges(n);
  // 證照超過三張：頭像不掛東西（太擠），只留燈號；圖示都在名字後面的小標
  if(safetyList(n).length>3)b={safety:false,mask:false,kit:false,tank:false,ship:false,ring:false,emt:false};
  var h='<div class="pavw'+(b.ring?' rg':'')+'"><div class="pav">'+he(n.slice(0,1))+'</div>';
  if(b.mask)h+=MASK_SVG.replace('<svg','<svg'+badgeClick(n));     // 面罩罩住圓圈
  if(b.safety){
    // 只有職安類證照才戴帽子；燈號掛在帽沿，有面罩時帽子上移露出面罩
    h+='<button class="pavhat'+(b.mask?' up':'')+'" title="職安人員"'
      +' onclick="event.stopPropagation();showSafety(\''+esc(n)+'\')">⛑️'+hatDot(o)+'</button>';
  }
  if(b.tank)                                                      // 儲槽掛在圓圈左側
    h+='<button class="pavtank" title="貯存系統污染監測人員"'
      +' onclick="event.stopPropagation();showSafety(\''+esc(n)+'\')">🛢️</button>';
  if(b.ship)h+=SHIP_SVG.replace('<svg','<svg'+badgeClick(n));     // 船停在圓圈下方
  if(b.ring)h+=RING3D.replace('pavr3','pavr3 bk')+RING3D.replace('<svg','<svg'+badgeClick(n)).replace('pavr3','pavr3 ft');   // 頭像坐在游泳圈裡：後半圈在圓圈後面、前半圈在前面
  if(b.kit)h+=KIT_SVG.replace('<svg','<svg'+badgeClick(n)).replace('class="pavkit"','class="pavkit'+(b.emt?' l':'')+'"');       // 急救箱壓在最上層
  if(b.emt)h+=EMT_SVG.replace('<svg','<svg'+badgeClick(n)).replace('class="pavemt"','class="pavemt'+(b.kit?' up':'')+'"');   // 生命之星在右下（有急救箱就壓在它右下角）
  // 沒戴帽子的人，燈號單獨放在圓圈右上角（全身只會有一顆）
  if(!b.safety&&o)h+='<span class="pavdot '+dotClass(o)+'"></span>';
  return h+'</div>';
}

/** 證照標記：點圖示看種類與效期，顏色隨狀態變化 */
function hatMark(n){
  var o=safetyOf(n);
  if(!o)return '';
  var b=certBadges(n),inner='';
  if(b.safety)inner+='⛑️';                                        // 職安業務主管
  if(b.mask)inner+=MASK_SVG.replace('class="pavmask"','class="mki"');
  if(b.tank)inner+='<span class="mke">🛢️</span>';
  if(b.ship)inner+=SHIP_SVG.replace('class="pavship"','class="mkw"');
  if(b.ring)inner+=RING_SVG.replace('class="pavring"','class="mki"');
  if(b.kit)inner+=KIT_SVG.replace('class="pavkit"','class="mki"');
  if(b.emt)inner+=EMT_SVG.replace('class="pavemt"','class="mki"');
  if(!inner)inner=ic('shield',15);                                // 其他證照用通用盾牌
  return '<button class="hat" onclick="event.preventDefault();event.stopPropagation();'
    +'showSafety(\''+esc(n)+'\')" title="證照">'+inner+hatDot(o)+'</button>';
}

function showSafety(n){
  n=String(n||'').trim();

  if(!list.length){toast(n+' 未登記證照資料','',3000);return;}
  var h='<div class="shh"><div>'
    +'<div class="evt" style="color:var(--accT)">證照資料</div>'
    +'<h3 style="margin-top:3px">'+he(n)+'</h3>'
    +(list.length>1?'<p class="hint" style="margin-top:3px">共 '+list.length+' 張證照</p>':'')
    +'</div><button class="ib" onclick="closeSheet()">✕</button></div>';
  list.forEach(function(o,i){
    var st='',col='';
    if(o.state==='expired'){st='已逾期 '+Math.abs(o.days)+' 天，請盡快安排回訓';col='var(--err)';}
    else if(o.state==='warn'){st=o.days+' 天後到期，請安排回訓';col='var(--warn)';}
    else if(o.state==='ok'){st='有效，剩 '+o.days+' 天';col='var(--ok)';}
    else if(o.state==='forever'){st='無期限，不需回訓';col='var(--ok)';}
    else {st='未填訓練日期，無法計算效期';col='var(--warn)';}
    h+='<div class="cbox cbx" style="margin-top:'+(i?18:14)+'px"><span class="cbic">'+certIcon(o.type)+'</span><div class="kv">'
      +kr('shield','證照',he(o.type||'未填'))
      +(o.cert?kr('hash','證書字號',he(o.cert)):'')
      +(o.state==='forever'?(o.train?kr('clock','訓練日期',he(o.train)):'')
        :kr('clock','訓練日期',he(o.train||'未填'))
         +kr('clip','有效期限',o.expire?he(o.expire)+' <span style="color:var(--tx3)">（'+o.years+' 年）</span>'
                  :'<span style="color:var(--tx3)">—</span>'))
      +'<div class="kr">'+ic('note',16)+'<span class="kk">狀態</span>'
      +'<span class="kvv" style="color:'+col+';font-weight:600">'+he(st)+'</span></div>'
      +'</div></div>';
  });
  if(PHONE[n])
    h+='<a class="btn btn-full" style="margin-top:14px" href="tel:'+he(PHONE[n].replace(/-/g,''))+'">撥打 '+he(PHONE[n])+'</a>';
  if(canEditStaff(n))
    h+='<button class="btn btn-p btn-full" style="margin-top:8px" onclick="editStaff(\''+esc(n)+'\')">編輯證照資料</button>';
  openSheet(h);
}

/** 回訓名單 */
/**
 * @param startup true 代表是開啟 App 時的月初提醒
 * @param mine    有值代表只提醒這個人自己（非主管／排程的一般人員）

function openDue(startup,mine){
  var due=safetyDue();
  if(mine)due=due.filter(function(x){return x.name===String(mine).trim();});
  var bad=due.filter(function(x){return x.o.state==='expired';}).length;
  var title;
  if(!startup)title='需要安排回訓';
  else if(mine)title=(bad?'你的證照已逾期':'你的證照快到期了');
  else title=(bad?bad+' 張證照已逾期':due.length+' 張證照即將到期');
  var h='<div class="shh"><div>'
    +'<div class="evt" style="color:var(--warn)">'
    +(startup?'證照到期提醒':'證照到期')+'</div>'
    +'<h3 style="margin-top:3px">'+title+'</h3>'
    +'<p class="hint" style="margin-top:3px">'
    +(mine?'請與主管或排程人員聯繫安排回訓':'每張證照到期前 3 個月開始提醒')+'</p></div>'
    +'<button class="ib" onclick="closeSheet()">✕</button></div>';
  if(!due.length)h+='<div class="empty">目前沒有即將到期的證照</div>';
  due.forEach(function(x){
    var isBad=x.o.state==='expired';
    h+='<div class="ev" onclick="showSafety(\''+esc(x.name)+'\')">'
      +'<div class="evb" style="background:'+(isBad?'var(--err)':'var(--warn)')+'"></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="evn" style="font-size:14px">'+he(x.name)
      +(PHONE[x.name]?' <span style="font-size:12px;font-weight:400;color:var(--tx3)">'+he(PHONE[x.name])+'</span>':'')
      +'</div>'
      +'<div class="evm">'+he(x.o.type||'未填種類')+'</div>'

  });
  if(startup)
    h+='<button class="btn btn-p btn-full" style="margin-top:16px" onclick="closeSheet()">我知道了</button>';
  openSheet(h);
}

/* 到期提醒只送給本人與他上面的每一層主管；
   換句話說，我會看到自己的，加上我底下所有人的。 */
var DUE_T=null;
function dueTargets(cb){
  if(DUE_T){cb(DUE_T);return;}
  gas('dueTargets',TOKEN).then(function(r){
    DUE_T=(r&&r.ok)?{names:r.names||[],all:!!r.all}:{names:[],all:false};
    cb(DUE_T);
  }).catch(function(){cb({names:[String(ENGNAME||'').trim()].filter(Boolean),all:false});});
}
function checkDueNotice(){
  annCheck();
  inboxLoad(false);
  var ym=twStr().slice(0,7);
  var deep=DUE_DEEP;DUE_DEEP=false;
  if(!deep&&ls(DUE_KEY)===ym){pushAskLater();return;}   // 每月只提醒一次
  dueTargets(function(t){
    var due=safetyDue();
    if(!t.all){
      var ok={};
      t.names.forEach(function(n){ok[n]=1;});
      var me=String(ENGNAME||'').trim();
      if(me)ok[me]=1;
      due=due.filter(function(x){return ok[x.name];});
    }
    lsS(DUE_KEY,ym);

    var mine=String(ENGNAME||'').trim();
    var onlyMe=due.every(function(x){return x.name===mine;});

  });
}

/** 只輸入數字即可，自動補上 -（手機鍵盤打不出減號） */
function fmtPhone(v){
  var d=String(v||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.length===9&&d.charAt(0)==='9')d='0'+d;      // Excel 掉頭的 0 補回來
  if(d.charAt(0)!=='0')return d;                    // 分機或非市話手機，原樣保留
  if(d.slice(0,2)==='09'){                          // 手機 09xx-xxx-xxx
    if(d.length<=4)return d;
    if(d.length<=7)return d.slice(0,4)+'-'+d.slice(4);
    return d.slice(0,4)+'-'+d.slice(4,7)+'-'+d.slice(7,10);
  }
  if(d.slice(0,2)==='02'){                          // 台北市話 02-xxxx-xxxx
    if(d.length<=2)return d;
    if(d.length<=6)return d.slice(0,2)+'-'+d.slice(2);
    return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
  }
  if(d.length<=2)return d;                          // 其他區碼 0x-xxx-xxxx
  if(d.length<=5)return d.slice(0,2)+'-'+d.slice(2);
  return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5,9);
}

/** 專案編號若已被試算表轉成科學記號（舊資料），就不顯示免得亂碼 */
function okNo(v){
  v=String(v||'').trim();
  if(!v)return '';
  if(/^-?\d(\.\d+)?e[+-]\d+$/i.test(v))return '';
  if(v==='0')return '';
  return v;
}

/** 有篩選空品車時，空品車的行程要顯示車號 */
function carTag(g){
  if(F.ty.indexOf('空品車')<0)return '';
  if(g.types.indexOf('空品車')<0)return '';
  var cars=g.eqs.filter(function(x){return /號車/.test(x);});
  if(!cars.length)cars=g.eqs.slice(0,2);
  return cars.length?'（'+cars.join('、')+'）':'';
}

var PAL=['#2563eb','#dc2626','#16a34a','#ea580c','#9333ea','#0891b2','#ca8a04','#db2777',
         '#4f46e5','#059669','#b45309','#7c3aed','#0d9488','#e11d48','#65a30d','#6366f1'];
/* 顏色由案名算出（同一個案子在任何裝置、任何月份都是同一色），
   後端推播通知的彩色圓點用同一套算法。改這裡要一起改 Code.gs 的 projEmoji_ */
var pmap={},pidx=0;   // pmap：月曆畫面用來判斷「本月有沒有案子」，每次畫月曆前清空
function pcolor(n){
  if(!n)return '#71717a';
  if(pmap[n])return pmap[n];
  var x=0,t=String(n);
  for(var i=0;i<t.length;i++)x=((x<<5)-x+t.charCodeAt(i))|0;
  return (pmap[n]=PAL[Math.abs(x)%PAL.length]);
}

/* ══ 啟動 ══ */

  $('i-p').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

          saveSession(TOKEN,r.role,r.username,r.engineerName||'',r.profileOk);
          location.reload();          // 身分有變就重來一次
        }else if(!!r.profileOk!==PROFILE_OK){

  }else if(TOKEN){

function doLogin(){
  var u=$('i-u').value.trim(),p=$('i-p').value,btn=$('l-btn');
  if(!u||!p){$('l-err').textContent='請輸入帳號與密碼';return;}
  btn.disabled=true;btn.textContent='登入中…';$('l-err').textContent='';
  gas('login',u,p).then(function(r){
    if(r&&r.ok){LAST_PW=p;            // 只留在記憶體，供首次登入改密碼用
      saveSession(r.token,r.role,r.username,r.engineerName||'',r.profileOk);
      FRESH_LOGIN=true;                 // 登入回應已經帶了 profileOk，不用再問後端
      boot(r.username,r.role,r.engineerName||'');}
    else{$('l-err').textContent=(r&&r.error)||'登入失敗';btn.disabled=false;btn.textContent='登入';}
  }).catch(function(){$('l-err').textContent='連線失敗，請稍後再試';btn.disabled=false;btn.textContent='登入';});
}
function doLogout(){

  if(!confirm('確定要登出？'))return;
  var pt=ls('espc_push');                   // 登出就不再讓這支手機收這個人的推播

  gas('logout',TOKEN).catch(function(){});
  clearSession();location.reload();
}

function boot(u,r,eng){
  setTimeout(viewBar,0);
  r=normRole(r);
  ROLE=r;UNAME=u;ENGNAME=eng;lsS('espc_eng',eng||'');
  $('login').style.display='none';
  $('app').style.display='flex';
  $('u-av').textContent=((eng&&eng!==u?eng:u)||'?').slice(0,1);
  $('u-nm').innerHTML=he((eng&&eng!==u?eng+'　':'')+u+'（'+roleLabel(r)+'）')
    +(r==='sampler'?'<span class="beta">BETA</span>':'');   // 現場角色的自動篩選還在試用
  navPerm();   // 上傳、帳號、廣播、下載、統計、津貼：依功能權限（管理員可在「更多 › 功能權限」調整）

  setTimeout(swVer,1500);
  var n=twDate();curY=n.getFullYear();curM=n.getMonth();

  var t=twStr(),last=ls('espc_sync'),fresh=(last!==t);
  lsS('espc_sync',t);
  if(fresh)cPrune(false);

  appInit();
  var back=restoreTab();          // 重新整理後回到原本那一頁
  if(takeDeep()){back={t:'cal',s:''};}   // 從行事曆提醒點進來 → 直接開那一天
  // 等通訊錄載好才決定要篩哪一欄（需要組別資料），再開始抓行程
  // 一律先用快取畫面，版本比對在背景做，開啟就有東西看
  loadStaff(function(){
    autoFilterSelf();
    gateProfile(function(){        // 只有後端也說沒同意過才會擋在確認畫面
      if(back)go(back.t,back.s);
      else loadToday(false);
      checkDueNotice();
      if(TODO_DEEP)todoDeep();
    });
  },false);
}

/* 同意「資料公開說明」是綁在帳號上（後端 Users.profile_ok），不是綁裝置。
   換手機、換瀏覽器、清掉資料都不會再問一次。
   啟動時本機旗標可能是空的，所以在跳出確認畫面前一定先問後端。 */
var ME_P=null;
/** 同一次啟動只問一次 getMe，兩邊共用同一個請求 */
function getMeOnce(){
  if(!ME_P)ME_P=gas('getMe',TOKEN);
  return ME_P;
}
/** 這個帳號需要確認並同意嗎？
 *  管理員是系統帳號、不在通訊錄裡，沒有資料要公開，所以不問。 */
/* 授權規則：除了系統管理員帳號，所有人第一次登入都要確認資料並同意。
   依據是後端 Users.profile_ok；沒有記錄就不能進入下一步。 */
function needProfile(){
  if(PROFILE_OK)return false;
  if(ROLE==='admin')return false;        // 系統管理員帳號，不對應任何人員
  return true;
}
/** 帳號有沒有綁定人員姓名（沒有就無法建立通訊錄資料） */
function hasOwnName(){
  var n=String(ENGNAME||'').trim();
  return !!n&&n!==String(UNAME||'').trim();
}
/** 在通訊錄找自己：忽略空白，也比對別名 */
function findSelfStaff(name){
  var k=String(name||'').replace(/\s+/g,''),f=null;
  if(!k)return null;
  var formal=normName(name);
  STAFF.forEach(function(x){
    if(f)return;
    if(String(x.name||'').replace(/\s+/g,'')===k||x.name===formal)f=x;
  });
  return f;
}
/** 擋在畫面前的訊息卡（授權前的各種狀況），只能重試或登出 */
function gateBlock(title,msg,retry){
  var el=$('onb');if(!el)return;
  el.innerHTML='<div class="onbw" style="padding-top:12vh;text-align:center">'
    +'<div class="onbh">'+he(title)+'</div>'
    +'<p class="onbs" style="margin:10px 0 22px">'+msg+'</p>'
    +(retry?'<button class="btn btn-p btn-full" onclick="gateRetry()">重新確認</button>':'')
    +'<button class="btn btn-full" style="margin-top:9px" onclick="gateLogout()">登出</button></div>';
  el.classList.add('open');
}
function gateLogout(){
  try{gas('logout',TOKEN).catch(function(){});}catch(e){}
  clearSession();location.reload();
}
function gateRetry(){
  ME_P=null;
  $('onb').innerHTML='<div class="onbw" style="padding-top:20vh">'+loader('確認授權狀態…')+'</div>';
  gateProfile(GATE_AFTER||function(){closeOnboarding();});
}
var FRESH_LOGIN=false,GATE_AFTER=null;
function gateProfile(after){
  GATE_AFTER=after;
  if(!needProfile()){after();return;}
  // 剛輸入帳密登入：登入回應就是後端 profile_ok 的最新狀態，直接請他確認
  if(FRESH_LOGIN){FRESH_LOGIN=false;openOnboarding();return;}
  // 手機裡沒有授權記錄（清過資料、重新安裝）：先蓋上「確認中」畫面，
  // 背後同時開始載入行程，不用等確認完才下載；確認通過才掀開，沒授權就進確認畫面
  var cover=$('onb');
  if(cover){
    cover.innerHTML='<div class="onbw" style="padding-top:20vh">'+loader('確認授權狀態…')+'</div>';
    cover.classList.add('open');
  }
  after();
  getMeOnce().then(function(r){
    if(r&&r.ok&&r.profileOk){
      PROFILE_OK=true;lsS('espc_prof','1');   // 後端說同意過了 → 掀開，資料多半已經載好
      if(cover){cover.classList.remove('open');cover.innerHTML='';}
    }else if(r&&r.ok){
      openOnboarding();                        // 還沒授權 → 一定要先確認
    }else{
      gateBlock('無法確認授權狀態','連不到伺服器，確認授權前無法使用。<br>請檢查網路後按「重新確認」。',true);
    }
  }).catch(function(){
    gateBlock('無法確認授權狀態','連不到伺服器，確認授權前無法使用。<br>請檢查網路後按「重新確認」。',true);
  });
}

/* 登入後預設只下載並顯示自己的行程（快很多），但隨時可以改篩別人 */
/** 這個帳號綁定的人（通訊錄查得到才算） */
function selfName(){
  var n=String(ENGNAME||'').trim();
  if(!n)return '';
  if(ROLE==='admin'||ROLE==='office')return '';      // 管理員是系統帳號、行政不跑現場：都直接看全部行程
  if(n===String(UNAME||'').trim())return '';         // 姓名就是工號 → 不是真人姓名
  var ok=false;
  STAFF.forEach(function(s){if(s.name===n)ok=true;});
  return ok?n:'';                                    // 通訊錄查無此人 → 顯示全部行程
}
/** 自己應該被篩在哪一欄 */
function selfField(){
  var n=selfName();
  return (ROLE==='pm'||isPMTeam(n))?'en':'st';
}
/**
 * 登入後先顯示自己的行程。
 * PM 或組別是 PM 的人 → 篩 PM 欄；其他人 → 篩現場欄（含申報人員）。
 * 通訊錄裡查無此人（例如 admin 這種系統帳號）就不篩，直接看全部。
 */
/** 這個帳號要不要「開啟就先篩自己」（預設要，可在更多頁關掉） */
function selfAutoKey(){return 'espc_selfauto_'+String(UNAME||'');}
function selfAuto(){return ls(selfAutoKey())!=='0';}
/** inFilter=1 代表是在篩選面板裡切換：只改設定與面板，不要動已經開著的篩選條件 */
function toggleSelfAuto(inFilter){
  var on=!selfAuto();
  lsS(selfAutoKey(),on?'1':'0');
  var n=selfName();
  if(inFilter){
    if(on&&n&&!FT.en&&!FT.st)FT[selfField()]=n;   // 順手把自己帶進去，還是可以再改
    else if(!on&&n){
      if(FT.en===n)FT.en='';
      if(FT.st===n)FT.st='';
    }
    paintFilter();
  }else{
    if(on)autoFilterSelf();
    else if(n){
      if(F.en===n)F.en='';
      if(F.st===n)F.st='';
    }
    refetch();
  }
  toast(on?'下次開啟會先顯示自己的行程':'下次開啟顯示全部行程','ok');
}
/* 姓名在排程資料裡對不對得到人（工程師／申報人員／現場任一欄）。
   對不到就不自動篩選，直接顯示全部行程。結果記在本機，只問一次。 */
function hasRowsKey(n){return 'espc_hasrows_'+n;}
function hasRowsCached(n){
  var v=ls(hasRowsKey(n));
  return (v==='1')?true:(v==='0')?false:null;
}
/** 背景確認；對不到人就把自動加上的條件清掉並重抓 */
function verifySelfName(n){
  if(!n||hasRowsCached(n)!==null)return;
  gas('nameHasRows',TOKEN,n).then(function(r){
    if(!r||!r.ok)return;                       // 問不到就維持現狀
    lsS(hasRowsKey(n),r.has?'1':'0');
    if(r.has)return;
    var changed=false;
    if(F.en===n){F.en='';changed=true;}
    if(F.st===n){F.st='';changed=true;}
    if(changed)refetch();                      // 對不到人 → 顯示全部行程
  }).catch(function(){});
}
function autoFilterSelf(){
  if(!selfAuto())return;              // 使用者選擇每次都看全部
  var n=selfName();
  if(!n||F.en||F.st)return;           // 已有條件就不動
  if(hasRowsCached(n)===false)return; // 排程表裡沒有這個人 → 看全部
  F[selfField()]=n;
  verifySelfName(n);
}

/** 讀出上次所在的頁籤，順便擋掉沒權限或已失效的目的地 */
function restoreTab(){
  var v;
  try{v=JSON.parse(ls(TAB_KEY)||'null');}catch(e){v=null;}
  if(!v||!v.t)return null;
  if(!v.at||Date.now()-v.at>TAB_KEEP_MS)return null;   // 超過 3 小時（或舊資料沒記時間）→ 開今日
  var okTab=['today','cal','msg','book','upload','dl','admin','more','stat'];
  if(v.t==='stat'&&!can('stat'))return null;
  if(v.t==='dl'&&(!isDesk()||!can('dl')))return null;
  if(okTab.indexOf(v.t)<0)return null;
  if(v.t==='upload'&&(!can('upload')||!isDesk()))return null;   // 上傳排程只在桌機
  if(v.t==='admin'&&!can('acct'))return null;
  if(v.s==='upload'&&(!can('upload')||!isDesk()))v.s='';
  if(v.s==='admin'&&!can('acct'))v.s='';
  if(v.t==='today')return null;                 // 今日是預設頁，照原流程走
  if(v.t==='cal'&&typeof v.y==='number'&&typeof v.m==='number'){
    curY=v.y;curM=v.m;                          // 連月份一起還原
  }
  return {t:v.t,s:v.s||''};
}

/* ══ 從推播通知點進來：網址帶 ?d=日期（&p=案子），開月曆並展開那一天 ══ */
var DEEP=null,DUE_DEEP=false,TODO_DEEP='';
/* 點通知時 App 已經開著：不重新載入，直接跳到對應畫面 */
function deepGo(url){
  try{
    var q=new URL(url||'./',location.href).searchParams;
    if($('ov').classList.contains('open'))closeSheet();
    var d=q.get('d')||'';
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)){
      DEEP={d:d,p:q.get('p')||''};
      curY=parseInt(d.slice(0,4),10);curM=parseInt(d.slice(5,7),10)-1;
      go('cal');
      var ck=curY+'-'+p2(curM+1)+(scopeKey()?'_'+scopeKey():'');
      if(MONTH_DONE[ck])setTimeout(function(){openDeep(curY,curM);},80);   // 這個月已經有資料：馬上開
      return;
    }
    if(q.get('todo')){TODO_DEEP=q.get('todo');todoDeep();return;}
    if(q.get('inbox')){MSG_SEG='in';go('msg');return;}
    if(q.get('due')){DUE_DEEP=true;checkDueNotice();return;}
  }catch(e){}
}
/* 從待辦通知進來：待辦載好就打開那一筆 */
function todoDeep(){
  if(!TODO_DEEP||!todoCan())return;
  if(!TODOS){todoLoad();return;}
  var id=TODO_DEEP;TODO_DEEP='';
  var t=TODOS.filter(function(x){return x.id===id;})[0];if(!t)return;
  var today=twStr(),ds=t.rep?(todoOn(t,today)?today:(todoOn(t,addDays(today,1))?addDays(today,1):t.date)):t.date;
  if(tab!=='today'&&tab!=='cal')go('today');
  setTimeout(function(){tdView(id,ds);},120);
}   // DUE_DEEP：從證照到期推播點進來
function takeDeep(){
  try{
    var q=new URLSearchParams(location.search||'');
    if(q.get('inbox')){INBOX_DEEP=true;q.delete('inbox');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash);}
    if(q.get('due')){DUE_DEEP=true;q.delete('due');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash);}
    if(q.get('todo')){TODO_DEEP=q.get('todo');q.delete('todo');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash);}
    var d=q.get('d')||'';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;
    DEEP={d:d,p:q.get('p')||''};
    q.delete('d');q.delete('p');
    var rest=q.toString();
    history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash);   // 網址清乾淨，重新整理不會再跳
    curY=parseInt(d.slice(0,4),10);curM=parseInt(d.slice(5,7),10)-1;
    return true;
  }catch(e){return false;}
}
function openDeep(y,m){
  if(!DEEP||tab!=='cal'||sub)return;
  if(DEEP.d.slice(0,7)!==y+'-'+p2(m+1))return;
  var dd=DEEP;DEEP=null;
  setTimeout(function(){openDay(dd.d,dd.p||'');},60);
}

/* ══ 導覽 ══ */
var TAB_KEY='espc_tab';
/* 回到上次的頁籤只保留 3 小時：3 小時內再開啟回到原本那頁，超過就直接開今日。
   計時從「最後一次使用」（切頁籤、App 切到背景）開始算。 */
var TAB_KEEP_MS=3*3600*1000;
/** 記住目前位置，重新整理瀏覽器後回到同一頁 */
function saveTab(){
  try{lsS(TAB_KEY,JSON.stringify({t:tab,s:sub,y:curY,m:curM,at:Date.now()}));}catch(e){}
}
/** 只更新「最後使用時間」，位置不變 */
function touchTab(){
  try{
    var v=JSON.parse(ls(TAB_KEY)||'null');
    if(v&&v.t){v.at=Date.now();lsS(TAB_KEY,JSON.stringify(v));}
  }catch(e){}
}
/* App 沒被關掉、只是放在背景：切回來時如果離開超過 3 小時，也跳回今日 */
(function(){
  var hiddenAt=0;
  function away(){touchTab();hiddenAt=Date.now();}
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){away();return;}
    var gone=hiddenAt?Date.now()-hiddenAt:0;
    hiddenAt=0;
    if(TOKEN&&gone>60000)todoLoad(true);          // 回到 App 超過 1 分鐘：待辦也重新抓

   每年抓一次存在手機，30 天更新；抓不到就只標週六日 */
var HOL={},HOL_Y={};
function holLoad(y){
  if(HOL_Y[y])return;HOL_Y[y]=1;
  var k='espc_hol_'+y,c=null;try{c=JSON.parse(ls(k)||'null');}catch(e){c=null;}
  if(c&&c.d)holSet(c.d);
  if(c&&c.t&&Date.now()-c.t<30*864e5)return;
  fetch('https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/'+y+'.json').then(function(r){return r.ok?r.json():null;}).then(function(a){
    if(!Array.isArray(a))return;
    var d={};
    a.forEach(function(x){
      var s=String(x.date||''),ds=s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8),we=(x.week==='六'||x.week==='日');
      if(x.isHoliday&&(x.description||!we))d[ds]=x.description||'假日';   // 平日放假、或有名稱的假日
      else if(!x.isHoliday&&we)d[ds]=0;                                   // 補班的週六
    });
    lsS(k,JSON.stringify({t:Date.now(),d:d}));holSet(d);
    if((tab==='cal'||tab==='today')&&!sub)render();
  }).catch(function(){});
}
function holSet(d){Object.keys(d).forEach(function(k){HOL[k]=d[k];});}
function holOf(ds){   // 回傳假日名稱（週末回 '週末'）；不是假日回 ''
  if(ds in HOL)return HOL[ds]||'';
  var w=new Date(ds+'T00:00:00').getDay();return (w===0||w===6)?'週末':'';
}

/* 重複規則：{f:'d'|'w'|'m'|'y', n:間隔, wd:[0-6 星期], md:'d'|'fw'（每月第幾天／第一個上班日）, dd:幾號,
   end:{t:'never'|'date'|'count', d:'yyyy-mm-dd', c:次數}}；
   舊資料的 'd'、'wd'、'w'、'm' 也看得懂 */
function todoRepNorm(r, start) {
  if (!r) return null;
  if (typeof r === 'string') {
    if (r.charAt(0) === '{') { try { r = JSON.parse(r); } catch (e) { return null; } }
    else if (r === 'd') r = { f: 'd' };
    else if (r === 'wd') r = { f: 'w', wd: [1, 2, 3, 4, 5] };
    else if (r === 'w') r = { f: 'w' };
    else if (r === 'm') r = { f: 'm' };
    else return null;
  }
  if (!r || ['d', 'w', 'm', 'y'].indexOf(r.f) < 0) return null;
  var n = Math.max(1, Math.min(99, Math.round(Number(r.n) || 1)));
  var o = { f: r.f, n: n };
  if (r.f === 'w') {
    var wd = [];
    (Array.isArray(r.wd) ? r.wd : []).forEach(function (x) { x = Number(x); if (x >= 0 && x <= 6 && wd.indexOf(x) < 0) wd.push(x); });
    if (!wd.length && start) wd.push(new Date(start + 'T00:00:00Z').getUTCDay());
    o.wd = wd.sort();
  }
  if (r.f === 'm') {
    o.md = r.md === 'fw' ? 'fw' : 'd';
    if (o.md === 'd') o.dd = Math.max(1, Math.min(31, Math.round(Number(r.dd) || (start ? Number(start.slice(8, 10)) : 1))));
  }
  var e = r.end || {};
  if (e.t === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(String(e.d || ''))) o.end = { t: 'date', d: String(e.d) };
  else if (e.t === 'count') o.end = { t: 'count', c: Math.max(1, Math.min(999, Math.round(Number(e.c) || 1))) };
  else o.end = { t: 'never' };
  return o;
}
function todoHit(t, r, ds) {
  var a = new Date(t.date + 'T00:00:00Z'), b = new Date(ds + 'T00:00:00Z'), n = r.n || 1;
  var days = Math.round((b - a) / 864e5);
  if (r.f === 'd') return days % n === 0;
  if (r.f === 'w') {
    if ((r.wd || []).indexOf(b.getUTCDay()) < 0) return false;
    var wa = Math.round((a - a.getUTCDay() * 864e5) / 864e5), wb = Math.round((b - b.getUTCDay() * 864e5) / 864e5);
    return Math.round((wb - wa) / 7) % n === 0;
  }
  var md = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + b.getUTCMonth() - a.getUTCMonth();
  if (r.f === 'm') {
    if (md % n !== 0) return false;
    if (r.md === 'fw') {                                   // 每月第一個上班日（跳過週末、國定假日，補班日算上班）
      if (!todoWork(ds)) return false;
      for (var k = 1; k < b.getUTCDate(); k++) {
        var p = ds.slice(0, 8) + (k < 10 ? '0' + k : '' + k);
        if (todoWork(p)) return false;
      }
      return true;
    }
    var dim = new Date(Date.UTC(b.getUTCFullYear(), b.getUTCMonth() + 1, 0)).getUTCDate();
    return b.getUTCDate() === Math.min(r.dd || a.getUTCDate(), dim);   // 31 號遇到小月就排在月底
  }
  if (r.f === 'y') return b.getUTCDate() === a.getUTCDate() && b.getUTCMonth() === a.getUTCMonth() && (md / 12) % n === 0;
  return false;
}
/** 這個待辦在 ds 這天有沒有（t.rep 已整理過） */
function todoOn(t, ds) {
  var r = t.rep;
  if (!r) return ds === t.date;
  var ex = t.ex || {};                         // 重複待辦的例外：{原本日期: 移到的日期，'' ＝這次刪掉}
  for (var k in ex) if (ex[k] === ds && k !== ds) return true;
  if (Object.prototype.hasOwnProperty.call(ex, ds)) return ex[ds] === ds;
  if (ds < t.date) return false;

/** 同日期同專案合併成一筆，但保留每個「類別」各自的欄位 */
function groupBy(list){
  var m={},order=[];
  function add(arr,v){if(v&&arr.indexOf(v)<0)arr.push(v);}
  list.forEach(function(r){
    var k=r.project||'（未分類）';
    if(!m[k]){m[k]={project:k,rows:[],types:[],locs:[],engs:[],cars:[],staff:[],
      notes:[],reps:[],eqs:[],nums:[],qtys:[],no:'',samp:'',tmap:{},tlist:[],qseen:{}};order.push(k);}
    var g=m[k];g.rows.push(r);

    add(g.types,r.type);add(g.locs,r.location);add(g.engs,normName(r.engineer));
    add(g.notes,r.notes);add(g.reps,normName(r.applicant));add(g.eqs,r.equipment);add(g.nums,r.reportNum);
    if(!g.no&&okNo(r.projectNo))g.no=okNo(r.projectNo);
    if(!g.samp&&r.sampTime)g.samp=r.sampTime;
    // 同一組報告編號被拆成兩組人跑時，數量只算一次
    var qk=String(r.reportNum||'')+'｜'+String(r.type||'')+'｜'+String(r.qty==null?'':r.qty).trim();
    var qdup=(r.reportNum&&g.qseen[qk]);
    g.qseen[qk]=1;
    if(!qdup)g.qtys.push(String(r.qty==null?'':r.qty).trim());
    if(r.car)String(r.car).split(/[、，,]/).forEach(function(c){add(g.cars,c.trim());});
    var ss=Array.isArray(r.staff)?r.staff:String(r.staff||'').split('、');
    ss.forEach(function(x){add(g.staff,normName(x.trim()));});

    // 依類別再分一層，數量／點位／儀器／報告編號各自歸屬
    var t=r.type||'（未分類）';
    if(!g.tmap[t]){g.tmap[t]={type:t,locs:[],eqs:[],nums:[],reps:[],qtys:[],samp:'',qseen:{}};g.tlist.push(t);}
    var tg=g.tmap[t];
    add(tg.locs,r.location);add(tg.eqs,r.equipment);add(tg.nums,r.reportNum);
    add(tg.reps,normName(r.applicant));
    if(!tg.samp&&r.sampTime)tg.samp=r.sampTime;
    var tqk=String(r.reportNum||'')+'｜'+String(r.qty==null?'':r.qty).trim();
    if(!(r.reportNum&&tg.qseen[tqk]))tg.qtys.push(String(r.qty==null?'':r.qty).trim());
    // 2026-10-07z：同類別再依報告編號分開（例：放流水質三組報告各自一張小卡）；沒有報告編號就依點位
    var sk=String(r.reportNum||'').trim()||('@'+String(r.location||'').trim());
    tg.smap=tg.smap||{};tg.slist=tg.slist||[];
    if(!tg.smap[sk]){tg.smap[sk]={locs:[],eqs:[],nums:[],reps:[],qtys:[],samp:''};tg.slist.push(sk);}
    var sg=tg.smap[sk];
    add(sg.locs,r.location);add(sg.eqs,r.equipment);add(sg.nums,r.reportNum);add(sg.reps,normName(r.applicant));
    if(!sg.samp&&r.sampTime)sg.samp=r.sampTime;
    if(!(r.reportNum&&tg.qseen[tqk]))sg.qtys.push(String(r.qty==null?'':r.qty).trim());
    tg.qseen[tqk]=1;
  });
  return order.map(function(k){return m[k];});
}

/** 數量彙整：全是純數字就加總，含「-1+1」這類寫法則原樣列出 */
function qtyText(list){
  var vals=[];
  list.forEach(function(v){
    v=String(v==null?'':v).trim();
    if(v)vals.push(v);
  });
  if(!vals.length)return '';
  // 全是純數字 → 逐筆加總（不可去重，兩筆各 1 要等於 2）
  if(vals.every(function(v){return /^-?\d+(\.\d+)?$/.test(v);})){
    var sum=Math.round(vals.reduce(function(a,b){return a+parseFloat(b);},0)*1000)/1000;
    // 正數補上 +；0 和負數原樣（負號本身就帶符號）
    return (sum>0?'+':'')+sum;
  }
  // 含「-1+1」這類寫法 → 去重後原樣列出
  var uniq=[];
  vals.forEach(function(v){if(uniq.indexOf(v)<0)uniq.push(v);});
  return uniq.join('、');
}

/** 類別標籤：帶上各自的數量，例如「空品車（-1+1）、PM2.5（2）」 */
function typeLabel(g){
  return g.tlist.map(function(t){
    var q=qtyText(g.tmap[t].qtys);
    return t+(q?'（'+q+'）':'');
  }).join('、');
}

var TEAM_BIG=['EIA','SP','FE','QC','MT'];
function teamBig(t){var m=String(t||'').trim().toUpperCase().match(/^[A-Z]+/);return m&&TEAM_BIG.indexOf(m[0])>=0?m[0]:'其他';}
function teamPass(tm,sel){
  tm=String(tm||'').trim();
  if(!sel)return true;
  if(sel==='_n')return !tm;
  if(sel.indexOf('G:')===0)return !!tm&&teamBig(tm)===sel.slice(2);
  return tm===sel;

/** 組別下拉的選項：大組（全部 EIA）＋縮排的子組；只有一個子組且同名（QC、MT）就只列一行 */

    var l=groups[g];if(!l)return;

      h+='<option value="'+he(l[0])+'"'+(cur===l[0]?' selected':'')+'>'+he(l[0])+'（'+n+'）</option>';return;

    l.forEach(function(t){h+='<option value="'+he(t)+'"'+(cur===t?' selected':'')+'>　　'+he(t)+'（'+count[t]+'）</option>';});
  });
  if(blank)h+='<option value="_n"'+(cur==='_n'?' selected':'')+'>未填組別（'+blank+'）</option>';
  return h;
}

/* ══ 隱藏工具：產生 App 圖示（連點「版本」5 下開啟）══
   用 canvas 重畫登入頁的玻璃日曆標記，輸出 PNG 供上傳 GitHub。
   canvas 沒有 backdrop-filter，玻璃層用漸層模擬；圖示滿版不留圓角，圓角交給系統裁切。 */
var VT={n:0,t:0};
function verTap(){
  var now=Date.now();
  VT.n=(now-VT.t<1500)?VT.n+1:1;VT.t=now;
  if(VT.n>=5){VT.n=0;openIconTool();}

var ICON_OUT=[
  {f:'icon-v4.png',s:180,d:'iPhone 主畫面（apple-touch-icon）'},
  {f:'icon-192-v4.png',s:192,d:'Android／瀏覽器分頁'},
  {f:'icon-512-v4.png',s:512,d:'安裝畫面、maskable 共用'},
  {f:'icon.png',s:192,d:'通知圖示（sw.js 用）'}
