<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ESPC 監測行程行事曆</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ESPC 行程">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --c-primary:#1a73e8;--c-primary-dark:#1558b0;
  --c-surface:#fff;--c-bg:#f1f3f4;
  --c-border:#dadce0;--c-text:#202124;--c-text-2:#5f6368;
  --c-error:#d93025;--c-success:#188038;--c-warn:#f29900;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.12);--shadow-md:0 4px 12px rgba(0,0,0,.15);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{height:100%;font-family:'Google Sans','Noto Sans TC',Arial,sans-serif;font-size:15px;color:var(--c-text);background:var(--c-bg);}
input,select,textarea{font-size:16px;}
.cal-grid{touch-action:pan-y;}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.login-card{background:var(--c-surface);border-radius:16px;padding:40px 32px;box-shadow:var(--shadow-md);width:100%;max-width:380px;}
.login-card h1{font-size:22px;font-weight:600;text-align:center;margin-bottom:8px;color:var(--c-primary);}
.login-card p{font-size:13px;color:var(--c-text-2);text-align:center;margin-bottom:28px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;}
.form-group input{width:100%;padding:12px 14px;border:1px solid var(--c-border);border-radius:var(--radius);font-size:16px;outline:none;transition:border .2s;}
.form-group input:focus{border-color:var(--c-primary);box-shadow:0 0 0 2px rgba(26,115,232,.18);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;min-height:44px;white-space:nowrap;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-outline{background:transparent;color:var(--c-primary);border:1px solid var(--c-border);}
.btn-outline:hover{background:var(--c-bg);}
.btn-danger{background:var(--c-error);color:#fff;}
.btn-danger:hover{background:#b31412;}
.btn-sm{padding:7px 14px;font-size:13px;min-height:36px;}
.btn-full{width:100%;}
.err-msg{color:var(--c-error);font-size:13px;margin-top:8px;min-height:18px;}

#app-screen{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--c-primary);color:#fff;padding:0 16px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-md);}
.topbar-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.25;}
.topbar h1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-user{font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.topbar-logout{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:36px;}
.topbar-logout:hover{background:rgba(255,255,255,.25);}

.tabs{background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;overflow-x:auto;position:sticky;top:56px;z-index:99;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;padding:14px 18px;font-size:14px;font-weight:500;color:var(--c-text-2);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;min-height:48px;}
.tab-btn.active{color:var(--c-primary);border-bottom-color:var(--c-primary);}
.tab-btn:hover:not(.active){background:var(--c-bg);}

.tab-panel{display:none;padding:12px;max-width:1400px;margin:0 auto;width:100%;}
.tab-panel.active{display:block;}

.cal-toolbar{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.cal-toolbar-nav{display:flex;align-items:center;gap:6px;}
.cal-toolbar-nav .btn{padding:8px 11px;min-height:38px;}
.month-label{font-size:18px;font-weight:600;flex:1;text-align:center;white-space:nowrap;}
.cal-filters{display:none;gap:6px;flex-wrap:wrap;padding:8px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);}
.cal-filters.open{display:flex;}
.cal-filters select{flex:1 1 130px;min-width:0;padding:8px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;background:var(--c-surface);outline:none;min-height:38px;}
.cal-filters select:focus{border-color:var(--c-primary);}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
.filter-chips:empty{display:none;}
.filter-chip{display:inline-flex;align-items:center;gap:5px;background:#e8f0fe;color:var(--c-primary);font-size:12px;padding:4px 6px 4px 10px;border-radius:14px;}
.filter-chip button{border:none;background:transparent;color:inherit;cursor:pointer;font-size:12px;line-height:1;padding:2px 3px;}
.filter-count{display:inline-block;background:var(--c-primary);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:5px;}
@media(max-width:480px){.cal-filters select{flex:1 1 100%;}}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--c-border);border-top:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;background:var(--c-surface);box-shadow:var(--shadow);}
.cal-header-cell{background:var(--c-bg);padding:8px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--c-text-2);border-right:1px solid var(--c-border);border-bottom:1px solid var(--c-border);}
.cal-cell{height:115px;overflow:hidden;padding:4px;border-right:1px solid var(--c-border);border-bottom:1px solid var(--c-border);background:var(--c-surface);cursor:pointer;transition:background .1s;}
.cal-cell:hover{background:#f8f9ff;}
.cal-cell:active{background:#e8f0fe;}
.cal-cell.other-month{background:var(--c-bg);opacity:.5;}
.cal-cell.today .cal-day-num{background:var(--c-primary);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;}
.cal-day-num{font-size:13px;font-weight:500;display:inline-block;padding:2px 4px;margin-bottom:2px;}
.cal-sunday .cal-day-num{color:#d32f2f;}
.cal-saturday .cal-day-num{color:#1565c0;}
.event-chip{display:block;font-size:11px;padding:2px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;line-height:1.4;}
.more-chip{font-size:11px;color:var(--c-text-2);padding:1px 4px;}
.dot-row,.dot-count{display:none;}

/* ── 今日焦點 ── */
.today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;}
.today-date{font-size:13px;color:var(--c-text-2);}
.today-big{font-size:24px;font-weight:600;margin-top:2px;}
.today-sub{font-size:13px;color:var(--c-text-2);margin:22px 0 8px;}
.now-card{border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid;background:var(--c-surface);box-shadow:var(--shadow);}
.now-tag{font-size:12px;font-weight:600;margin-bottom:4px;}
.now-title{font-size:17px;font-weight:600;line-height:1.35;}
.now-meta{font-size:13px;color:var(--c-text-2);margin-top:6px;line-height:1.75;}
.now-meta b{color:var(--c-text);font-weight:500;}
.call-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.call-btn{display:inline-flex;align-items:center;gap:6px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:20px;padding:8px 14px;font-size:13px;color:var(--c-text);text-decoration:none;min-height:38px;}
.call-btn:active{background:#e8f0fe;}
.notice{background:#fef7e0;color:#7a5c00;border-radius:var(--radius);padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:10px;}
.today-empty{background:var(--c-surface);border-radius:12px;box-shadow:var(--shadow);padding:36px 20px;text-align:center;color:var(--c-text-2);font-size:14px;}
.upcoming-card{background:var(--c-surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
.up-row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--c-border);cursor:pointer;align-items:flex-start;}
.up-row:last-child{border-bottom:none;}
.up-row:active{background:var(--c-bg);}
.up-date{min-width:36px;text-align:center;flex-shrink:0;}
.up-d{font-size:17px;font-weight:600;line-height:1.1;}
.up-w{font-size:11px;color:var(--c-text-2);}
.up-bar{width:4px;border-radius:2px;align-self:stretch;flex-shrink:0;}
.up-body{min-width:0;flex:1;}
.up-title{font-size:14px;font-weight:500;line-height:1.4;}
.up-meta{font-size:12px;color:var(--c-text-2);margin-top:2px;}

.legend-wrap{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px 4px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;}
.overlay.open{display:flex;}
@media(min-width:640px){.overlay{align-items:center;justify-content:center;}}
.detail-sheet{background:var(--c-surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px 40px;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease;position:relative;}
@media(min-width:640px){.detail-sheet{border-radius:16px;max-height:78vh;}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
.detail-sheet h3{font-size:16px;font-weight:600;margin-bottom:14px;padding-right:36px;}
.detail-close{position:absolute;top:18px;right:14px;background:var(--c-bg);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.proj-card{border-radius:10px;border-left:5px solid;padding:12px 14px;margin-bottom:10px;background:var(--c-bg);}
.proj-card-title{font-weight:700;font-size:14px;margin-bottom:8px;}
.type-section{margin-bottom:8px;}
.type-section-header{font-weight:600;font-size:13px;margin-bottom:4px;border-bottom:1px solid var(--c-border);padding-bottom:3px;}
.detail-row{font-size:13px;color:var(--c-text-2);margin-bottom:3px;line-height:1.7;}
.detail-row span{color:var(--c-text);}
.proj-footer{font-size:13px;color:var(--c-text-2);margin-top:6px;padding-top:6px;border-top:1px solid var(--c-border);line-height:1.9;}
.proj-footer span{color:var(--c-text);}
.empty-day{color:var(--c-text-2);font-size:14px;text-align:center;padding:28px;}

.upload-box{border:2px dashed var(--c-border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--c-surface);}
.upload-box:hover,.upload-box.drag-over{border-color:var(--c-primary);background:#e8f0fe;}
#file-input{display:none;}
.parse-result{margin-top:16px;background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.parse-result-header{padding:12px 16px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.parse-result-header h3{font-size:14px;font-weight:600;word-break:break-all;}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-success{background:#e6f4ea;color:var(--c-success);}
.badge-warn{background:#fef7e0;color:var(--c-warn);}
.data-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{background:var(--c-bg);padding:8px 10px;text-align:left;font-weight:600;border-bottom:1px solid var(--c-border);white-space:nowrap;}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--c-border);white-space:nowrap;}
.data-table tr:last-child td{border-bottom:none;}
.upload-actions{padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap;}

.history-card{background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.history-row{padding:12px 16px;border-bottom:1px solid var(--c-border);display:flex;align-items:flex-start;gap:10px;}
.history-row:last-child{border-bottom:none;}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.hist-name{font-size:14px;font-weight:500;}
.hist-name.superseded{text-decoration:line-through;color:var(--c-text-2);}
.hist-meta{font-size:12px;color:var(--c-text-2);margin-top:3px;}
.status-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:6px;}
.status-active-b{background:#e6f4ea;color:var(--c-success);}
.status-super-b{background:#f1f3f4;color:var(--c-text-2);}

.section-card{background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;}
.section-card h3{font-size:15px;font-weight:600;margin-bottom:12px;border-bottom:1px solid var(--c-border);padding-bottom:8px;}
.admin-form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;}
.admin-form .form-group{flex:1 1 130px;margin-bottom:0;}
.admin-form .form-group label{font-size:12px;}
.admin-form .form-group input,.admin-form .form-group select{width:100%;height:44px;padding:0 10px;border:1px solid var(--c-border);border-radius:var(--radius);font-size:14px;line-height:normal;outline:none;background:var(--c-surface);color:var(--c-text);-webkit-appearance:none;appearance:none;}
.admin-form .form-group select{padding-right:28px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%235f6368' d='M4 6l4 4 4-4'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 9px center;background-size:14px;}
.admin-form .form-group input:focus,.admin-form .form-group select:focus{border-color:var(--c-primary);}
.admin-form .btn{height:44px;min-height:44px;}
.seg{display:flex;gap:4px;background:var(--c-bg);border-radius:20px;padding:3px;margin-bottom:12px;overflow-x:auto;}
.seg::-webkit-scrollbar{display:none;}
.seg-btn{flex:1 0 auto;border:none;background:transparent;border-radius:18px;padding:7px 14px;font-size:13px;color:var(--c-text-2);cursor:pointer;white-space:nowrap;min-height:34px;}
.seg-btn.active{background:var(--c-surface);color:var(--c-primary);font-weight:600;box-shadow:var(--shadow);}
.region-pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:12px;background:#e8f0fe;color:#1558b0;white-space:nowrap;}
.region-pill.none{background:var(--c-bg);color:var(--c-text-2);}
.users-table{width:100%;border-collapse:collapse;font-size:13px;}
.users-table th{background:var(--c-bg);padding:8px 10px;text-align:left;font-weight:600;border-bottom:1px solid var(--c-border);}
.users-table td{padding:10px 10px;border-bottom:1px solid var(--c-border);vertical-align:middle;}
.users-table tr:last-child td{border-bottom:none;}
.role-badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;}
.role-sel{height:34px;padding:0 6px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;background:var(--c-surface);color:var(--c-text);outline:none;max-width:110px;}
.role-sel:focus{border-color:var(--c-primary);}
.role-admin{background:#fce8e6;color:#c5221f;}
.role-supervisor{background:#e8f0fe;color:#1a73e8;}
.role-scheduler{background:#e0f7fa;color:#00695c;}
.role-pm{background:#f3e8fd;color:#7b1fa2;}
.role-viewer{background:#e6f4ea;color:#188038;}
.status-active{color:var(--c-success);font-weight:600;}
.status-inactive{color:var(--c-error);}
.pw-card{max-width:460px;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--c-border);}
.set-label{font-size:14px;flex:1;min-width:0;}
.set-hint{display:block;font-size:12px;color:var(--c-text-2);margin-top:3px;line-height:1.5;}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#c4c7c5;border-radius:28px;transition:.2s;cursor:pointer;}
.slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked+.slider{background:var(--c-primary);}
.switch input:checked+.slider::before{transform:translateX(20px);}
.nt-status{font-size:12px;color:var(--c-text-2);line-height:1.7;margin:12px 0;}
.nt-status.warn{color:#9a6700;background:#fef7e0;border-radius:var(--radius);padding:9px 11px;}
.nt-status.bad{color:var(--c-error);background:#fce8e6;border-radius:var(--radius);padding:9px 11px;}
.actions-cell{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}

.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:#323232;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:var(--shadow-md);animation:fadeIn .2s ease;max-width:90vw;text-align:center;}
.toast.success{background:var(--c-success);}
.toast.error{background:var(--c-error);}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--c-text-2);}
.spinner{width:24px;height:24px;border:3px solid var(--c-border);border-top-color:var(--c-primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:600px){
  .cal-cell{height:96px;padding:2px;}
  .cal-day-num{font-size:11px;padding:1px 2px;margin-bottom:1px;}
  .cal-cell.today .cal-day-num{width:20px;height:20px;}
  .event-chip{font-size:9px;padding:1px 3px;border-radius:2px;margin-bottom:1px;line-height:1.35;}
  .cal-header-cell{font-size:11px;padding:6px 2px;}
  .login-card{padding:28px 16px;}
  .tab-panel{padding:8px;}
  .legend-item{font-size:11px;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>ESPC 監測行程</h1>
    <p>行事曆系統 — 請登入</p>
    <div class="form-group"><label>帳號</label><input id="inp-user" type="text" autocomplete="username" placeholder="請輸入帳號"></div>
    <div class="form-group"><label>密碼</label><input id="inp-pw" type="password" autocomplete="current-password" placeholder="請輸入密碼"></div>
    <div class="err-msg" id="login-err"></div>
    <button class="btn btn-primary btn-full" id="login-btn" style="margin-top:8px" onclick="doLogin()">登入</button>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="topbar-titles">
      <h1>ESPC 監測行程</h1>
      <span class="topbar-user" id="topbar-user"></span>
    </div>
    <button class="topbar-logout" onclick="doLogout()">登出</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today',this)">今日</button>
    <button class="tab-btn" onclick="switchTab('calendar',this)">行事曆</button>
    <button class="tab-btn" id="tab-upload-btn" onclick="switchTab('upload',this)">上傳排程</button>
    <button class="tab-btn" id="tab-staff-btn" onclick="switchTab('staff',this)">人員通訊錄</button>
    <button class="tab-btn" id="tab-admin-btn" onclick="switchTab('admin',this)">帳號管理</button>
    <button class="tab-btn" onclick="switchTab('password',this)">設定</button>
  </div>

  <div id="panel-today" class="tab-panel active">
    <div class="today-head">
      <div>
        <div class="today-date" id="today-date"></div>
        <div class="today-big">今天</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="loadToday(true)">&#8635;</button>
    </div>
    <div id="today-now"><div class="loading"><div class="spinner"></div></div></div>
    <div id="today-next-wrap" style="display:none;">
      <div class="today-sub">接下來</div>

<script>
// ════════════════════════════════════════════════════════════
// 請將下方的部署 ID 換成您自己的 Google Apps Script 部署 ID
// ════════════════════════════════════════════════════════════
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxq0Lj59wXYKQkVnbaG607FOBmEmH64VkbxqfIOBbNnbufWlqQ82x5RAKmlbFhpOssHng/exec';

// ─── GAS API（fetch 版）───────────────────────────────────────────────────────
function gas(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var payload = JSON.stringify({ fn: fn, args: args });
  // 小請求用 GET（避免 CORS 問題），大資料上傳用 POST
  if (payload.length < 1800) {
    return fetch(GAS_URL + '?payload=' + encodeURIComponent(payload))
      .then(function(r) { return r.json(); });
  }
  return fetch(GAS_URL, { method: 'POST', body: payload })
    .then(function(r) { return r.json(); });
}

// ─── 人員電話對照（由資料庫載入，非寫死）───────────────────────────────────────
var PHONE_MAP={};
var STAFF_LIST=[];
function withPhone(name){if(!name)return '';var ph=PHONE_MAP[name.trim()];return ph?name+'（'+ph+'）':name;}
var STAFF_VER='';
function applyStaff(list){
  STAFF_LIST=list||[];
  PHONE_MAP={};
  STAFF_LIST.forEach(function(s){if(s.name)PHONE_MAP[s.name]=s.phone||'';});
}

function loadStaff(cb,force){
  var c=force?null:cacheGet('staff');
  if(c&&c.staff){applyStaff(c.staff);STAFF_VER=c.version||'';if(cb){cb();cb=null;}}

  gas('getStaff',TOKEN,c?c.version:'').then(function(r){
    if(r&&r.ok&&!r.unchanged){
      applyStaff(r.staff||[]);
      STAFF_VER=r.version||'';
      cacheSet('staff',{version:STAFF_VER,staff:STAFF_LIST,t:Date.now()});
      if(document.getElementById('panel-staff').classList.contains('active'))renderStaffTable();
    }
    if(cb)cb();
  }).catch(function(){if(cb)cb();});
}

// ─── Session ──────────────────────────────────────────────────────────────────
/* 登入狀態存在 localStorage：關掉瀏覽器、重開手機都會記得，
   直到使用者自己按「登出」或後端 session 過期（90 天，持續使用會自動續期） */
function ss(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function ssSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ssDel(k){try{localStorage.removeItem(k);}catch(e){}}

var TOKEN=ss('espc_token');
var ROLE=ss('espc_role');
var UNAME=ss('espc_user');
var currentFileName='';
var parsedRows=[];

function saveSession(t,r,u){TOKEN=t;ROLE=r;UNAME=u;ssSet('espc_token',t);ssSet('espc_role',r);ssSet('espc_user',u);}
function clearSession(){
  TOKEN='';ROLE='';UNAME='';
  ['espc_token','espc_role','espc_user','espc_eng','espc_eng_p',SYNC_KEY].forEach(ssDel);
  try{
    var del=[],i;
    for(i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(CK)===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
  }catch(e){}
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function toast(msg,type,dur){
  var w=document.getElementById('toast-wrap');
  var el=document.createElement('div');el.className='toast'+(type?' '+type:'');el.textContent=msg;
  w.appendChild(el);setTimeout(function(){el.remove();},dur||3000);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function he(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function p2(n){return String(n).padStart(2,'0');}
function sv(v){return v!=null?String(v).trim():'';}

// ─── Boot ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('inp-pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  document.getElementById('inp-user').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('inp-pw').focus();});
  if(TOKEN){
    // 已登入過 → 先蓋掉登入畫面，避免閃爍
    document.getElementById('login-screen').innerHTML=
      '<div class="loading"><div class="spinner"></div> 載入中…</div>';
    gas('getMe',TOKEN).then(function(r){
      if(r&&r.ok) showApp(r.username,r.role,r.engineerName||'');
      else{clearSession();location.reload();}
    }).catch(function(){
      // 純網路錯誤不要清掉登入狀態，讓使用者重試即可
      document.getElementById('login-screen').innerHTML=
        '<div style="text-align:center;padding:24px;">'
        +'<p style="color:var(--c-text-2);font-size:14px;margin-bottom:16px;">連線失敗，請確認網路後重試</p>'
        +'<button class="btn btn-primary" onclick="location.reload()">重新載入</button></div>';
    });
  }else showLogin();
});

// ─── Auth ─────────────────────────────────────────────────────────────────────
function showLogin(){document.getElementById('login-screen').style.display='flex';document.getElementById('app-screen').style.display='none';clearSession();}

function showApp(uname,role,engineerName){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='flex';
  document.getElementById('topbar-user').textContent=engineerName||uname;
  document.getElementById('tab-upload-btn').style.display=canWrite(role)?'':'none';
  document.getElementById('tab-admin-btn').style.display=role==='admin'?'':'none';
  document.getElementById('staff-add-card').style.display=canWrite(role)?'':'none';
  document.getElementById('danger-zone').style.display=role==='admin'?'block':'none';
  if(engineerName){ssSet('espc_eng',engineerName);ssSet('espc_eng_p',engineerName);}else{ssDel('espc_eng');}
  ntRenderUI();
  startNotifyLoop();
  var n=new Date();curYear=n.getFullYear();curMonth=n.getMonth();
  // 跨日後第一次開啟 → 強制重抓；同一天內開啟 → 先吃快取再背景比對
  var t=todayStr_(),last='';
  try{last=localStorage.getItem(SYNC_KEY)||'';}catch(e){}
  var newDay=(last!==t);
  try{localStorage.setItem(SYNC_KEY,t);}catch(e){}
  if(newDay)cachePrune(false);
  loadStaff(function(){ loadToday(newDay); },newDay);
}

var ROLE_LABEL={admin:'管理員',supervisor:'主管',scheduler:'排程',pm:'PM',viewer:'現場'};
var ROLE_ORDER=['admin','supervisor','scheduler','pm','viewer'];
var ROLE_CLASS={admin:'role-admin',supervisor:'role-supervisor',scheduler:'role-scheduler',pm:'role-pm',viewer:'role-viewer'};
var ROLE_WRITE=['admin','supervisor','scheduler'];
function roleLabel(r){return ROLE_LABEL[r]||r;}
function canWrite(r){return ROLE_WRITE.indexOf(r)>=0;}

function doLogin(){
  var u=document.getElementById('inp-user').value.trim();
  var p=document.getElementById('inp-pw').value;
  var errEl=document.getElementById('login-err');
  var btn=document.getElementById('login-btn');
  if(!u||!p){errEl.textContent='請填寫帳號與密碼';return;}
  btn.disabled=true;btn.textContent='登入中…';errEl.textContent='';
  gas('login',u,p).then(function(r){
    if(r.ok){saveSession(r.token,r.role,r.username);showApp(r.username,r.role,r.engineerName||'');}
    else errEl.textContent=r.error||'登入失敗';
    btn.disabled=false;btn.textContent='登入';
  }).catch(function(){errEl.textContent='連線失敗，請稍後再試';btn.disabled=false;btn.textContent='登入';});
}

function doLogout(){gas('logout',TOKEN).catch(function(){});clearSession();showLogin();}

// ─── 顏色 ─────────────────────────────────────────────────────────────────────
var PROJ_COLORS=['#1a73e8','#e53935','#43a047','#fb8c00','#8e24aa','#00897b',
  '#d81b60','#3949ab','#6d4c41','#00acc1','#7cb342','#f4511e',
  '#039be5','#c0ca33','#8d6e63','#546e7a','#ef6c00','#5c6bc0','#00695c','#558b2f'];
var projColorMap={},projColorIdx=0;
function projColor(name){
  if(!name)return '#9e9e9e';
  if(!projColorMap[name]){projColorMap[name]=PROJ_COLORS[projColorIdx%PROJ_COLORS.length];projColorIdx++;}
  return projColorMap[name];
}

// ─── 本機快取 ─────────────────────────────────────────────────────────────────
// 策略：先用快取立即上畫面，同時在背景跟伺服器比對版本；
// 版本一樣伺服器只回「未變更」（幾乎沒流量），不一樣才換新資料重畫。
var CK='espc_c_';

function cacheGet(key){
  try{var v=localStorage.getItem(CK+key);return v?JSON.parse(v):null;}catch(e){return null;}
}
function cacheSet(key,obj){
  try{localStorage.setItem(CK+key,JSON.stringify(obj));}
  catch(e){cachePrune(true);try{localStorage.setItem(CK+key,JSON.stringify(obj));}catch(e2){}}
}
/** 清掉最舊的月份快取（空間不足或定期整理時呼叫）*/
function cachePrune(aggressive){
  try{
    var keys=[],i;
    for(i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(CK+'m_')===0)keys.push(k);
    }
    keys.sort();
    var keep=aggressive?2:8;
    while(keys.length>keep)localStorage.removeItem(keys.shift());
  }catch(e){}
}
/** 資料版本變了 → 所有月份快取一次失效 */
function cacheCheckVersion(v){
  if(!v)return;
  var cur='';try{cur=localStorage.getItem(CK+'ver')||'';}catch(e){}
  if(cur&&cur!==v){
    try{
      var del=[],i;
      for(i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf(CK+'m_')===0)del.push(k);
      }
      del.forEach(function(k){localStorage.removeItem(k);});
    }catch(e){}
  }
  try{localStorage.setItem(CK+'ver',v);}catch(e){}
}

// ─── 每日提醒通知 ─────────────────────────────────────────────────────────────
var NT_KEY='espc_notify',NT_CACHE='espc_today_cache',SW_REG=null;

function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function ntCfg(){
  var c=lsGet(NT_KEY,null);
  if(!c)c={};
  if(c.on===undefined)c.on=false;
  if(!c.time)c.time='08:30';
  if(c.skipWeekend===undefined)c.skipWeekend=true;
  if(c.notifyEmpty===undefined)c.notifyEmpty=false;
  if(!c.last)c.last='';
  return c;
}

function registerSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(function(reg){SW_REG=reg;})
    .catch(function(){});
}

function ntSupported(){return ('Notification' in window);}

function ntRenderUI(){
  var c=ntCfg();
  document.getElementById('nt-on').checked=!!c.on;
  document.getElementById('nt-time').value=c.time;
  document.getElementById('nt-weekend').checked=!!c.skipWeekend;
  document.getElementById('nt-empty').checked=!!c.notifyEmpty;
  var el=document.getElementById('nt-status');
  el.className='nt-status';
  if(!ntSupported()){
    el.className='nt-status bad';
    el.textContent='這個瀏覽器不支援系統通知。iPhone 請用 Safari 開啟，並先「加入主畫面」。';
    return;
  }
  var isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(Notification.permission==='denied'){
    el.className='nt-status bad';
    el.textContent='通知權限已被封鎖。請到瀏覽器或系統設定中，允許本網站傳送通知。';
    return;
  }
  if(isIOS&&!isStandalone){
    el.className='nt-status warn';
    el.textContent='iPhone 需先「加入主畫面」才能收到通知：Safari 下方「分享」→「加入主畫面」，之後從主畫面圖示開啟本站再開啟提醒。';
    return;
  }
  if(!c.on){el.textContent='目前未開啟。開啟後，每天到設定時間就會跳出當日行程通知。';return;}
  el.textContent='已開啟，每天 '+c.time+' 提醒'+(c.skipWeekend?'（六、日不提醒）':'')
    +'。提醒需要本頁保持開啟或在背景執行；若 App 已完全關閉，下次開啟時會補提醒當天行程。';
}

function notifSaveUI(){
  var c=ntCfg();
  c.time=document.getElementById('nt-time').value||'08:30';
  c.skipWeekend=document.getElementById('nt-weekend').checked;
  c.notifyEmpty=document.getElementById('nt-empty').checked;
  lsSet(NT_KEY,c);
  ntRenderUI();
}

function notifToggle(el){
  var c=ntCfg();
  if(!el.checked){c.on=false;lsSet(NT_KEY,c);ntRenderUI();return;}
  if(!ntSupported()){el.checked=false;ntRenderUI();return;}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){
      c.on=true;c.last='';lsSet(NT_KEY,c);
      toast('已開啟每日提醒','success');
      registerSW();
    }else{
      c.on=false;lsSet(NT_KEY,c);
      el.checked=false;
      toast('未取得通知權限','error');
    }
    ntRenderUI();
  }).catch(function(){el.checked=false;ntRenderUI();});
}

function showNotification(title,body){
  var opts={body:body,tag:'espc-daily',icon:'icon.png',badge:'icon.png'};
  if(SW_REG&&SW_REG.showNotification){
    try{SW_REG.showNotification(title,opts);return true;}catch(e){}
  }
  if(navigator.serviceWorker&&navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type:'notify',title:title,body:body});
    return true;
  }
  try{new Notification(title,opts);return true;}catch(e){return false;}
}

function buildNotifyText(t,rows){
  var parts=t.split('-');
  var head=parseInt(parts[1])+'/'+parseInt(parts[2])+'（'+DAYS_ZH[new Date(t).getDay()]+'）';
  if(!rows.length)return{title:head+' 今日無排程',body:'今天沒有安排監測行程。'};
  var lines=[];
  groupByProject_(rows).forEach(function(g){
    var types=Object.keys(g.types).join('、');
    var loc=uniq_(g.rows,'location')[0]||'';
    var st=uniq_(g.rows,'sampTime')[0]||'';
    lines.push('• '+g.project+(types?'（'+types+'）':'')+(loc?'\n　'+loc:'')+(st?'　'+st:''));
  });
  return{title:head+' 今日 '+lines.length+' 項行程',body:lines.join('\n')};
}

function fireDailyNotify(t){
  function go(rows){
    var eng=ss('espc_eng_p').trim();
    var mine=eng?rows.filter(function(r){return String(r.engineer||'').trim()===eng;}):rows;
    var c=ntCfg();
    if(!mine.length&&!c.notifyEmpty)return;
    var msg=buildNotifyText(t,mine);
    showNotification(msg.title,msg.body);
  }
  if(TOKEN){
    gas('getData',TOKEN,{dateFrom:t,dateTo:t}).then(function(r){
      if(r&&r.ok){lsSet(NT_CACHE,{date:t,rows:r.rows||[]});go(r.rows||[]);}
      else{var cc=lsGet(NT_CACHE,null);go(cc&&cc.date===t?cc.rows:[]);}
    }).catch(function(){var cc=lsGet(NT_CACHE,null);go(cc&&cc.date===t?cc.rows:[]);});
  }else{
    var cc=lsGet(NT_CACHE,null);
    if(cc&&cc.date===t)go(cc.rows);
    else showNotification('ESPC 監測行程','請開啟 App 查看今日行程。');
  }
}

function ntTick(){
  var c=ntCfg();
  if(!c.on||!ntSupported()||Notification.permission!=='granted')return;
  var now=new Date();
  var t=todayStr_();
  if(c.last===t)return;
  var dow=now.getDay();
  if(c.skipWeekend&&(dow===0||dow===6))return;
  var hm=(c.time||'08:30').split(':');
  var target=new Date(now);
  target.setHours(parseInt(hm[0],10)||0,parseInt(hm[1],10)||0,0,0);
  if(now<target)return;
  c.last=t;lsSet(NT_KEY,c);
  fireDailyNotify(t);
}

function notifTest(){
  if(!ntSupported()){toast('此瀏覽器不支援通知','error');return;}
  if(Notification.permission!=='granted'){
    Notification.requestPermission().then(function(p){
      if(p==='granted')notifTest();else toast('未取得通知權限','error');
    });
    return;
  }
  var t=todayStr_();
  var rows=todayRows.filter(function(r){return r.date===t;});
  var msg=buildNotifyText(t,rows);
  if(showNotification(msg.title,msg.body))toast('已發送測試通知','success');
  else toast('無法發送通知','error');
}

function startNotifyLoop(){
  registerSW();
  ntTick();
  setInterval(ntTick,30000);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)return;
    ntTick();
    dailySync();
  });
}

/** 每日背景更新：每天第一次開啟（或跨日後回到前景）時，靜默重抓一次最新資料 */
var SYNC_KEY='espc_last_sync';
function dailySync(){
  if(!TOKEN)return;
  var t=todayStr_();
  var last='';try{last=localStorage.getItem(SYNC_KEY)||'';}catch(e){}
  if(last===t)return;
  try{localStorage.setItem(SYNC_KEY,t);}catch(e){}
  cachePrune(false);
  // 跨日了，今日頁一定要重算
  todayLoadedFor='';
  loadStaff(null,true);
  loadToday(true);
  if(document.getElementById('panel-calendar').classList.contains('active'))loadMonth(true);
  else{allRows=[];}
}

// ─── 今日焦點 ─────────────────────────────────────────────────────────────────
var todayRows=[],todayUnmatched='';

function todayStr_(){var n=new Date();return n.getFullYear()+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate());}
function addDays_(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}

var todayLoadedFor='';

/** 今日頁範圍：本月剩餘天數，但至少涵蓋到 15 天後 */
function todayRange_(t){
  var d=new Date(t+'T00:00:00');
  var monthEnd=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
  var min15=addDays_(t,15);
  return monthEnd>min15?monthEnd:min15;
}

function paintToday(t,all){
  var eng=autoEngName();
  var mine=eng?all.filter(function(x){return String(x.engineer||'').trim()===eng;}):all;
  // 對不到工程師姓名時，改顯示全部行程
  var matched=!eng||mine.length>0;
  todayRows=matched?mine:all;
  todayUnmatched=matched?'':eng;
  todayLoadedFor=t;
  lsSet(NT_CACHE,{date:t,rows:all.filter(function(x){return x.date===t;})});
  renderToday(t,todayUnmatched);
}

function loadToday(force){
  var t=todayStr_();
  var parts=t.split('-');
  document.getElementById('today-date').textContent=parseInt(parts[1])+'月'+parseInt(parts[2])+'日 週'+DAYS_ZH[new Date(t).getDay()];

  if(!force&&todayLoadedFor===t){renderToday(t,todayUnmatched);return;}

  var key='today';
  var c=force?null:cacheGet(key);
  if(c&&c.date===t&&c.rows){
    paintToday(t,c.rows);                     // 立即上畫面
  }else{
    document.getElementById('today-now').innerHTML='<div class="loading"><div class="spinner"></div></div>';
    c=null;
  }

  var opts={dateFrom:t,dateTo:todayRange_(t)};
  if(c&&c.version)opts.version=c.version;

  gas('getData',TOKEN,opts).then(function(r){
    if(!r||!r.ok){
      if(!c)document.getElementById('today-now').innerHTML='<div class="today-empty">'+he(r&&r.error||'載入失敗')+'</div>';
      return;
    }
    cacheCheckVersion(r.version);
    if(r.unchanged)return;
    cacheSet(key,{date:t,version:r.version||'',rows:r.rows||[],t:Date.now()});
    paintToday(t,r.rows||[]);
  }).catch(function(){
    if(!c)document.getElementById('today-now').innerHTML='<div class="today-empty">載入失敗，請重試</div>';
  });
}

function groupByProject_(rows){
  var m={},order=[];
  rows.forEach(function(r){
    var k=r.project||'（未分類）';
    if(!m[k]){m[k]={project:k,rows:[],types:{}};order.push(k);}
    m[k].rows.push(r);
    if(r.type)m[k].types[r.type]=true;
  });
  return order.map(function(k){return m[k];});
}

function uniq_(rows,field){
  var seen={},out=[];
  rows.forEach(function(r){var v=r[field];if(v&&!seen[v]){seen[v]=true;out.push(v);}});
  return out;
}

function renderToday(t,unmatchedEng){
  projColor('');
  var mine=todayRows.filter(function(r){return r.date===t;});
  var el=document.getElementById('today-now');
  var banner=unmatchedEng
    ? '<div class="notice">找不到「'+he(unmatchedEng)+'」的排程，以下顯示全部行程</div>' : '';
  if(!mine.length){
    el.innerHTML=banner+'<div class="today-empty">今日沒有排程</div>';
  }else{
    var html=banner;
    groupByProject_(mine).forEach(function(g){
      var c=projColor(g.project);
      var types=Object.keys(g.types).join('、');
      var locs=uniq_(g.rows,'location');
      var st=uniq_(g.rows,'sampTime')[0]||'';
      var engs=uniq_(g.rows,'engineer');
      var cars=[],carSeen={};
      g.rows.forEach(function(r){if(r.car)String(r.car).split(/[、，,]/).forEach(function(x){x=x.trim();if(x&&!carSeen[x]){carSeen[x]=true;cars.push(x);}});});
      var staff=[],stSeen={};
      g.rows.forEach(function(r){
        var ss=Array.isArray(r.staff)?r.staff:String(r.staff||'').split('、');
        ss.forEach(function(p){p=(p||'').trim();if(p&&!stSeen[p]){stSeen[p]=true;staff.push(p);}});
      });
      var notes=uniq_(g.rows,'notes');
      html+='<div class="now-card" style="border-color:'+c+'">'
        +'<div class="now-tag" style="color:'+c+'">'+he(types||'排程')+'</div>'
        +'<div class="now-title">'+he(g.project)+'</div>'
        +'<div class="now-meta">';
      if(locs.length)html+='點位：<b>'+he(locs.join(' / '))+'</b><br>';
      if(st)html+='申報採樣時間：<b>'+he(st)+'</b><br>';
      if(engs.length)html+='工程師：<b>'+he(engs.join('、'))+'</b><br>';
      if(cars.length)html+='公務車：<b>'+he(cars.join('、'))+'</b><br>';
      if(notes.length)html+='備註：<b>'+he(notes.join('；'))+'</b>';
      html+='</div>';
      var calls=staff.concat(engs.filter(function(e){return staff.indexOf(e)<0;}));
      if(calls.length){
        html+='<div class="call-row">';
        calls.forEach(function(p){
          var ph=PHONE_MAP[p];
          if(ph)html+='<a class="call-btn" href="tel:'+he(ph.replace(/-/g,''))+'">&#128222; '+he(p)+'</a>';
          else html+='<span class="call-btn" style="color:var(--c-text-2)">'+he(p)+'</span>';
        });
        html+='</div>';
      }
      html+='</div>';
    });
    el.innerHTML=html;
  }

  var future=todayRows.filter(function(r){return r.date>t;});
  var wrap=document.getElementById('today-next-wrap');
  if(!future.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  var byDate={},dates=[];
  future.forEach(function(r){if(!byDate[r.date]){byDate[r.date]=[];dates.push(r.date);}byDate[r.date].push(r);});
  dates.sort();
  var out='';
  dates.slice(0,20).forEach(function(d){
    groupByProject_(byDate[d]).forEach(function(g){
      var c=projColor(g.project);
      var dd=d.split('-');
      out+='<div class="up-row" onclick="openDay(\''+d+'\')">'
        +'<div class="up-date"><div class="up-d">'+parseInt(dd[2])+'</div><div class="up-w">'+DAYS_ZH[new Date(d).getDay()]+'</div></div>'
        +'<div class="up-bar" style="background:'+c+'"></div>'
        +'<div class="up-body"><div class="up-title">'+he(g.project)+'</div>'
        +'<div class="up-meta">'+he(Object.keys(g.types).join('、'))
        +(uniq_(g.rows,'location')[0]?' · '+he(uniq_(g.rows,'location')[0]):'')+'</div></div></div>';
    });
  });
  document.getElementById('today-next').innerHTML=out;
}

function openDay(dateStr){
  var rows=todayRows.filter(function(r){return r.date===dateStr;});
  var saved=filteredRows;
  filteredRows=rows;
  showDetail(dateStr);
  filteredRows=saved;
}

// ─── Calendar ─────────────────────────────────────────────────────────────────
var DAYS_ZH=['日','一','二','三','四','五','六'];
var MONTHS_ZH=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var curYear,curMonth,allRows=[],filteredRows=[];

function initCalendar(){var n=new Date();curYear=n.getFullYear();curMonth=n.getMonth();loadMonth();}
function moveMonth(d){curMonth+=d;if(curMonth>11){curMonth=0;curYear++;}if(curMonth<0){curMonth=11;curYear--;}loadMonth();}
function goToday(){var n=new Date();curYear=n.getFullYear();curMonth=n.getMonth();loadMonth();}

function paintMonth(rows){
  allRows=rows||[];
  populateEngDropdown(allRows);
  populateTypeDropdown(allRows);
  autoFilterEngineer();
  applyFilter();
}

function loadMonth(force){
  document.getElementById('month-label').textContent=curYear+'年 '+MONTHS_ZH[curMonth];
  var mkey='m_'+curYear+'-'+p2(curMonth+1);
  var first=curYear+'-'+p2(curMonth+1)+'-01';
  var lastDay=new Date(curYear,curMonth+1,0).getDate();
  var last=curYear+'-'+p2(curMonth+1)+'-'+p2(lastDay);

  var c=force?null:cacheGet(mkey);
  if(c&&c.rows){
    paintMonth(c.rows);                       // 立即上畫面，不轉圈
  }else{
    document.getElementById('cal-container').innerHTML='<div class="loading"><div class="spinner"></div> 載入中…</div>';
  }

  var opts={dateFrom:first,dateTo:last};
  if(c&&c.version)opts.version=c.version;     // 帶著手上的版本去問

  gas('getData',TOKEN,opts).then(function(r){
    if(!r||!r.ok){if(!c)toast(r&&r.error||'載入失敗','error');return;}
    cacheCheckVersion(r.version);
    if(r.unchanged)return;                    // 資料沒變，畫面維持快取內容
    cacheSet(mkey,{version:r.version||'',rows:r.rows||[],t:Date.now()});
    paintMonth(r.rows||[]);
  }).catch(function(){
    if(!c){
      document.getElementById('cal-container').innerHTML='<div class="loading">載入失敗，請重試</div>';
      toast('載入資料失敗','error');
    }
  });
}

/** 只有 PM 角色會自動帶出自己的行程；對不到姓名時顯示全部 */
function autoEngName(){
  return ROLE==='pm' ? ss('espc_eng').trim() : '';
}

function autoFilterEngineer(){
  var stored=autoEngName();
  var sel=document.getElementById('cal-filter-eng');
  if(!stored){sel.removeAttribute('data-auto');return;}
  var exists=false;
  for(var i=0;i<allRows.length;i++){
    if(String(allRows[i].engineer||'').trim()===stored){exists=true;break;}
  }
  if(!exists){
    // 這個月沒有他的行程 → 清掉自動篩選，顯示全部
    if(sel.getAttribute('data-auto')==='1'){sel.value='';sel.removeAttribute('data-auto');}
    return;
  }
  if(sel.value===''){sel.value=stored;sel.setAttribute('data-auto','1');}
}

function populateEngDropdown(rows){
  var seen={},engs=[];
  rows.forEach(function(r){if(r.engineer&&!seen[r.engineer]){seen[r.engineer]=true;engs.push(r.engineer);}});
  engs.sort();
  var sel=document.getElementById('cal-filter-eng'),cur=sel.value;
  sel.innerHTML='<option value="">全部工程師</option>'+engs.map(function(e){return '<option value="'+he(e)+'"'+(e===cur?' selected':'')+'>'+he(e)+'</option>';}).join('');
}

function populateTypeDropdown(rows){
  var seen={},types=[];
  rows.forEach(function(r){if(r.type&&!seen[r.type]){seen[r.type]=true;types.push(r.type);}});
  types.sort();
  var sel=document.getElementById('cal-filter-type'),cur=sel.value;
  sel.innerHTML='<option value="">全部類別</option>'+types.map(function(t){return '<option value="'+he(t)+'"'+(t===cur?' selected':'')+'>'+he(t)+'</option>';}).join('');
}

var FILTER_IDS=['cal-filter-region','cal-filter-eng','cal-filter-type'];
function toggleFilters(){document.getElementById('cal-filters').classList.toggle('open');}
function clearFilters(){
  FILTER_IDS.forEach(function(id){document.getElementById(id).value='';});
  applyFilter();
}
function removeFilter(id){document.getElementById(id).value='';applyFilter();}
function renderFilterChips(){
  var defs=FILTER_IDS.map(function(id){return [id];});
  var html='',n=0;
  defs.forEach(function(d){
    var v=document.getElementById(d[0]).value;
    if(v){n++;html+='<span class="filter-chip">'+he(v)+'<button title="移除" onclick="removeFilter(\''+d[0]+'\')">&#10005;</button></span>';}
  });
  document.getElementById('filter-chips').innerHTML=html;
  document.getElementById('filter-toggle').innerHTML='篩選'+(n?'<span class="filter-count">'+n+'</span>':'');
}

function applyFilter(){
  var region=document.getElementById('cal-filter-region').value;
  var eng=document.getElementById('cal-filter-eng').value;
  var type=document.getElementById('cal-filter-type').value;
  renderFilterChips();
  filteredRows=allRows.filter(function(r){
    if(region&&(r.region||'')!==region)return false;
    if(eng&&r.engineer!==eng)return false;
    if(type&&r.type!==type)return false;
    return true;
  });
  renderCalendar(curYear,curMonth,filteredRows);
}

function buildDateEvents(rows){
  var byDate={};
  rows.forEach(function(r){
    if(!r.date)return;
    var d=r.date.slice(0,10);
    if(!byDate[d])byDate[d]={};
    var pk=r.project||'（未分類）';
    if(!byDate[d][pk])byDate[d][pk]={project:pk,rows:[],typeSet:{}};
    byDate[d][pk].rows.push(r);
    if(r.type)byDate[d][pk].typeSet[r.type]=true;
    projColor(pk);
  });
  var result={};
  Object.keys(byDate).forEach(function(d){
    result[d]=Object.keys(byDate[d]).map(function(pk){
      var g=byDate[d][pk];
      var types=Object.keys(g.typeSet);
      return{project:pk,color:projColor(pk),title:'【'+pk+'】'+types.join('/'),rows:g.rows};
    });
  });
  return result;
}

function renderCalendar(year,month,rows){
  projColorMap={};projColorIdx=0;
  var dateEvents=buildDateEvents(rows);
  var startDow=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var prevDays=new Date(year,month,0).getDate();
  var today=new Date();
  var todayStr=today.getFullYear()+'-'+p2(today.getMonth()+1)+'-'+p2(today.getDate());
  var html='<div class="cal-grid">';
  DAYS_ZH.forEach(function(d,i){
    var s=i===0?' style="color:#d32f2f"':i===6?' style="color:#1565c0"':'';
    html+='<div class="cal-header-cell"'+s+'>'+d+'</div>';
  });
  var total=Math.ceil((startDow+daysInMonth)/7)*7;
  for(var i=0;i<total;i++){
    var day,dateStr,isOther=false;
    if(i<startDow){
      day=prevDays-startDow+i+1;
      var pm=month===0?12:month,py=month===0?year-1:year;
      dateStr=py+'-'+p2(pm)+'-'+p2(day);isOther=true;
    }else if(i>=startDow+daysInMonth){
      day=i-startDow-daysInMonth+1;
      var nm=month===11?1:month+2,ny=month===11?year+1:year;
      dateStr=ny+'-'+p2(nm)+'-'+p2(day);isOther=true;
    }else{
      day=i-startDow+1;dateStr=year+'-'+p2(month+1)+'-'+p2(day);
    }
    var dow=i%7,isToday=dateStr===todayStr;
    var events=dateEvents[dateStr]||[];
    var cls='cal-cell'+(isOther?' other-month':'')+(isToday?' today':'')+(dow===0?' cal-sunday':dow===6?' cal-saturday':'');
    html+='<div class="'+cls+'" onclick="showDetail(\''+dateStr+'\')">';
    html+='<div class="cal-day-num">'+day+'</div>';
    events.forEach(function(ev){
      html+='<div class="event-chip" style="background:'+ev.color+'" title="'+he(ev.title)+'">'+he(ev.title)+'</div>';
    });
    html+='</div>';
  }
  html+='</div>';
  var projs=Object.keys(projColorMap);
  if(projs.length){
    html+='<div class="legend-wrap">';
    projs.forEach(function(p){html+='<div class="legend-item"><div class="legend-dot" style="background:'+projColorMap[p]+'"></div><span>'+he(p)+'</span></div>';});
    html+='</div>';
  }
  document.getElementById('cal-container').innerHTML=html;
}

var resizeTimer;
window.addEventListener('resize',function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){renderCalendar(curYear,curMonth,filteredRows);},200);});

// ─── Detail ───────────────────────────────────────────────────────────────────
function showDetail(dateStr){
  var dateEvents=buildDateEvents(filteredRows);
  var events=dateEvents[dateStr]||[];
  var parts=dateStr.split('-');
  var dow=new Date(dateStr).getDay();
  document.getElementById('detail-title').textContent=parts[0]+'年'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日（'+DAYS_ZH[dow]+'）';
  var html='';
  if(!events.length){html='<div class="empty-day">此日無排程</div>';}
  else events.forEach(function(ev){
    html+='<div class="proj-card" style="border-color:'+ev.color+'">';
    html+='<div class="proj-card-title" style="color:'+ev.color+'">'+he(ev.project)+'</div>';
    var typeMap={};
    ev.rows.forEach(function(r){var t=r.type||'（未知類型）';if(!typeMap[t])typeMap[t]=[];typeMap[t].push(r);});
    Object.keys(typeMap).forEach(function(type){

function handleDrop(e){e.preventDefault();document.getElementById('drop-zone').classList.remove('drag-over');var f=e.dataTransfer.files[0];if(f)processFile(f);}
function handleFileSelect(e){var f=e.target.files[0];if(f)processFile(f);e.target.value='';}

function processFile(file){
  currentFileName=file.name;
  document.getElementById('parse-area').innerHTML='<div class="loading"><div class="spinner"></div> 解析中…</div>';
  readExcel(file).then(function(rows){parsedRows=rows;renderParseResult(rows,file.name);}).catch(function(err){
    document.getElementById('parse-area').innerHTML='';toast('解析失敗：'+(err.message||err),'error');
  });
}

function readExcel(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',raw:true});
        var sheetName=null;
        for(var i=0;i<wb.SheetNames.length;i++){if(wb.SheetNames[i]==='採樣行程'){sheetName=wb.SheetNames[i];break;}}
        if(!sheetName)for(var i=0;i<wb.SheetNames.length;i++){if(wb.SheetNames[i]==='工作表1'){sheetName=wb.SheetNames[i];break;}}
        if(!sheetName)sheetName=wb.SheetNames[0];
        if(!sheetName){resolve([]);return;}
        var ws=wb.Sheets[sheetName];
        var raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,range:{s:{r:0,c:0},e:{r:9999,c:21}}});
        resolve(parseESPCSheet(raw,sheetName,file.name));
      }catch(ex){reject(ex);}
    };
    reader.onerror=function(){reject(new Error('檔案讀取失敗'));};
    reader.readAsArrayBuffer(file);
  });
}

function detectRegion(fname,sheetName){
  var s=(fname||'')+' '+(sheetName||'');
  if(/台中|臺中|中部|中區|taichung|\bTC\b/i.test(s))return '台中';
  if(/高雄|南部|南區|kaohsiung|\bKH\b/i.test(s))return '高雄';
  if(/台北|臺北|北部|北區|taipei|\bTP\b/i.test(s))return '台北';
  if(sheetName==='採樣行程')return '高雄';
  return '';
}

function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){if(isNaN(v))return null;return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());}
  if(typeof v==='number'&&v>40000&&v<80000){
    try{var d=XLSX.SSF.parse_date_code(v);if(d&&d.y>2000)return d.y+'-'+p2(d.m)+'-'+p2(d.d);}catch(e){}
  }
  var str=String(v).trim();
  var m1=str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m1)return m1[1]+'-'+p2(m1[2])+'-'+p2(m1[3]);
  var m2=str.match(/^(\d{2,3})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m2)return(parseInt(m2[1])+1911)+'-'+p2(m2[2])+'-'+p2(m2[3]);
  return null;
}

function parseESPCSheet(raw,sheetName,fname){
  if(!raw||raw.length<2)return[];
  var region=detectRegion(fname||'',sheetName);
  var isKH=(sheetName==='採樣行程');
  var results=[];
  if(isKH){
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      var dateStr=parseDate(row[2]);if(!dateStr)continue;
      if(parseInt(dateStr.slice(0,4))<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      var staff=[16,17,18,19,20].map(function(c){return sv(row[c]);}).filter(Boolean);
      var notes=[sv(row[13]),sv(row[14])].filter(Boolean).join('；');
      results.push({date:dateStr,engineer:eng,project:proj,type:type,
        location:sv(row[8]),qty:parseFloat(String(row[9]!=null?row[9]:''))||0,
        sampTime:sv(row[10]),equipment:sv(row[11]),
        applicant:sv(row[12]),reportNum:sv(row[7]),notes:notes,
        car:sv(row[15]),staff:staff,region:region});
    }
  }else{
    var lastDate=null;
    for(var i=1;i<raw.length;i++){
      var row=raw[i];if(!row)continue;
      if(row[2]!=null){var ds=parseDate(row[2]);if(ds)lastDate=ds;}
      if(!lastDate)continue;
      if(parseInt(lastDate.slice(0,4))<2020)continue;
      var eng=sv(row[3]);if(!eng||/工程師|engineer/i.test(eng))continue;
      var proj=sv(row[5]),type=sv(row[6]);if(!proj&&!type)continue;
      var staff=[15,16,17,18,19].map(function(c){return sv(row[c]);}).filter(Boolean);
      results.push({date:lastDate,engineer:eng,project:proj,type:type,
        location:sv(row[7]),qty:parseFloat(String(row[8]!=null?row[8]:''))||0,
        sampTime:sv(row[9]),equipment:sv(row[10]),
        applicant:sv(row[11]),reportNum:sv(row[12]),notes:sv(row[13]),
        car:sv(row[14]),staff:staff,region:region});
    }
  }
  return results;
}

      +'<th>採樣時間</th><th>儀器</th><th>報告編號</th><th>地區</th>'

function doUpload(){

  gas('saveData',TOKEN,parsedRows,currentFileName).then(function(r){
    if(r.ok){
      toast('成功上傳 '+r.saved+' 筆，同日期舊資料已更新','success');

}

      +'<div class="hist-meta">'+he(dateRange)+' | '+he(rec.uploaded_by)+' | '+he(uploadTime)+'</div>'

  });
  if(!list.length){el.innerHTML='<p style="color:var(--c-text-2);padding:20px;text-align:center;">'+(q||staffRegion?'查無符合的人員':'尚無人員資料')+'</p>';return;}
  var canEdit=(ROLE==='admin'||ROLE==='scheduler');
  var html='<p style="font-size:12px;color:var(--c-text-2);margin-bottom:8px">共 '+list.length+' 位</p>'
    +'<table class="users-table"><thead><tr><th>姓名</th><th>電話</th><th>地區</th><th>備註</th>'+(canEdit?'<th>操作</th>':'')+'</tr></thead><tbody>';
  list.forEach(function(s){
    var ph=s.phone||'',rg=(s.region||'').trim();
    html+='<tr><td>'+he(s.name)+'</td>'
      +'<td>'+(ph?'<a href="tel:'+he(ph.replace(/-/g,''))+'" style="color:var(--c-primary);text-decoration:none">'+he(ph)+'</a>':'—')+'</td>'
      +'<td>'+(rg?'<span class="region-pill">'+he(rg)+'</span>':'<span class="region-pill none">未指定</span>')+'</td>'
      +'<td>'+he(s.note||'—')+'</td>';
    if(canEdit){
      html+='<td><div class="actions-cell">'
        +'<button class="btn btn-outline btn-sm" onclick="staffEdit(\''+he(s.name)+'\')">編輯</button>'
        +'<button class="btn btn-outline btn-sm" style="color:var(--c-error)" onclick="staffDelete(\''+he(s.name)+'\')">刪除</button>'
        +'</div></td>';
    }
    html+='</tr>';
  });
  el.innerHTML=html+'</tbody></table>';
}

function staffEdit(name){
  var s=null;
  for(var i=0;i<STAFF_LIST.length;i++){if(STAFF_LIST[i].name===name){s=STAFF_LIST[i];break;}}
  if(!s)return;
  document.getElementById('staff-name').value=s.name;
  document.getElementById('staff-phone').value=s.phone||'';
  document.getElementById('staff-region').value=s.region||'';
  document.getElementById('staff-note').value=s.note||'';
  document.getElementById('staff-add-card').scrollIntoView({behavior:'smooth',block:'start'});
}

function staffSave(){
  var name=document.getElementById('staff-name').value.trim();
  var phone=document.getElementById('staff-phone').value.trim();
  var region=document.getElementById('staff-region').value;
  var note=document.getElementById('staff-note').value.trim();
  if(!name){toast('請輸入姓名','error');return;}
  gas('saveStaff',TOKEN,name,phone,region,note).then(function(r){
    if(r.ok){
      toast('已儲存','success');
      ['staff-name','staff-phone','staff-note'].forEach(function(id){document.getElementById(id).value='';});
      document.getElementById('staff-region').value='';
      loadStaff(function(){renderStaffTable();applyFilter();},true);
    }else toast(r.error||'儲存失敗','error');
  }).catch(function(){toast('操作失敗','error');});
}

function staffDelete(name){
  if(!confirm('確定要刪除「'+name+'」？'))return;
  gas('deleteStaff',TOKEN,name).then(function(r){
    if(r.ok){toast('已刪除','success');loadStaff(function(){renderStaffTable();applyFilter();},true);}
    else toast(r.error||'刪除失敗','error');
  }).catch(function(){toast('操作失敗','error');});
}
</script>
</body>
</html>
